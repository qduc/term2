name: Set up test dependencies
description: Reuse the locked installation, including native addons, without caching test or build output.
inputs:
  ripgrep:
    description: Install the search binary needed by integration cases.
    default: 'false'
  web-client:
    description: Also install the web-client workspace, for gateway cases that import its server modules.
    default: 'false'
  lane:
    description: CI lane whose Vitest file timings to reuse for scheduling; empty skips them.
    default: ''
runs:
  using: composite
  steps:
    # Runner images do not ship this exact patch, so setup-node downloaded it in
    # every job: 4-5s each, and 63s on 2026-11-08 when its GitHub release host
    # returned 504 three times before the nodejs.org fallback. A toolcache hit
    # (version dir plus its .complete marker) makes setup-node skip the download.
    # Keep the version here equal to node-version below.
    - name: Restore Node toolcache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/node/24.21.0
        key: test-node-toolcache-v1-${{ runner.os }}-${{ runner.arch }}-24.21.0
    - uses: actions/setup-node@v7
      id: node
      with:
        # Match the measured baseline patch; include it in the native-cache key.
        node-version: 24.21.0
    # Installing pnpm from npm took 1–36s per job; a cached copy keeps a
    # dependency-cache hit off the registry entirely.
    - name: Restore pnpm
      id: pnpm
      uses: actions/cache@v6
      with:
        path: ~/.term2-ci/pnpm
        key: test-pnpm-cli-v1-${{ runner.os }}-${{ runner.arch }}-11.7.0
    - name: Install pnpm
      shell: bash
      env:
        CACHE_HIT: ${{ steps.pnpm.outputs.cache-hit }}
      run: |
        prefix="$HOME/.term2-ci/pnpm"
        if [[ "$CACHE_HIT" != 'true' ]]; then npm install -g --prefix "$prefix" pnpm@11.7.0; fi
        "$prefix/bin/pnpm" --version
        echo "$prefix/bin" >> "$GITHUB_PATH"
        # This action owns dependency state. Otherwise a later `pnpm run` or
        # `pnpm exec` reinstalls whenever the checkout is newer than the
        # restored installation, repeating the setup action's dependency work.
        echo "pnpm_config_verify_deps_before_run=false" >> "$GITHUB_ENV"
    - name: Identify runner image
      id: image
      shell: bash
      run: |
        echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"
        echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"
    # Key the installation on what can change it. Hashing whole package.json files
    # made every release (version bump) and script edit a cold install in every
    # job. --frozen-lockfile still rejects dependency fields the lockfile lacks.
    - name: Hash install-relevant manifest fields
      id: manifests
      shell: bash
      run: |
        node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
        import { createHash } from 'node:crypto';
        import { existsSync, readFileSync } from 'node:fs';
        const fields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies',
          'peerDependenciesMeta', 'bundledDependencies', 'pnpm', 'overrides', 'resolutions',
          'engines', 'devEngines', 'engineStrict'];
        const hooks = ['preinstall', 'install', 'postinstall', 'prepare'];
        const pick = (file) => {
          if (!existsSync(file)) return null;
          const json = JSON.parse(readFileSync(file, 'utf8'));
          const picked = Object.fromEntries(fields.filter((key) => key in json).map((key) => [key, json[key]]));
          picked.scripts = Object.fromEntries(hooks.filter((key) => json.scripts?.[key]).map((key) => [key, json.scripts[key]]));
          return picked;
        };
        // Key order carries no install meaning; a release once only moved one entry.
        const canonical = (value) =>
          Array.isArray(value) ? value.map(canonical)
          : value && typeof value === 'object'
            ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]))
            : value;
        const manifests = ['package.json', 'web-client/package.json', 'packages/agent-harness-core/package.json'];
        const hash = createHash('sha256').update(JSON.stringify(canonical(manifests.map(pick)))).digest('hex');
        console.log(`hash=${hash}`);
        NODE
    # Only the gateway cases (integration lane) import web-client server modules.
    # Its Next.js, SWC and icon packages doubled the cached installation (76 MB to
    # 162 MB compressed, 28k to 44k files) that every other job restored unused.
    - name: Restore locked dependency installation
      id: deps
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          ${{ inputs.web-client == 'true' && 'web-client/node_modules' || '!web-client/node_modules' }}
          !node_modules/.cache
          !node_modules/.vite
          !node_modules/.vite-temp
        key: test-deps-v4-${{ inputs.web-client == 'true' && 'web' || 'cli' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.image }}-node${{ steps.node.outputs.node-version }}-pnpm11.7.0-${{ steps.manifests.outputs.hash }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'web-client/.npmrc', 'vendor/*.tgz') }}
    # The installation key is exact, so any lockfile change misses it. A
    # prefix-restored package store limits that miss to the changed packages.
    - name: Locate package store
      id: store
      if: steps.deps.outputs.cache-hit != 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Restore package store
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: test-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: test-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-
    # An exact hit restores an installation of these same manifests, which
    # passed pnpm's supply-chain check before it was saved; any lockfile change
    # misses and is checked here. Re-checking a hit cost 3–18s of registry calls.
    - name: Verify and install locked dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      shell: bash
      env:
        # Defaults wait 10s then 60s per failed tarball; retry more, wait less.
        pnpm_config_fetch_retries: '4'
        pnpm_config_fetch_retry_mintimeout: '2000'
        pnpm_config_fetch_retry_maxtimeout: '10000'
        WEB_CLIENT: ${{ inputs.web-client }}
      # No `pnpm store prune`: run directly after this install it still evicted
      # 5 in-use packages (808 files, 101 MB) in CI, so the saved store missed
      # them. Bump the store key to reset accumulated packages instead.
      # The filter keeps the CLI and its workspace dependencies (agent-harness-core).
      run: |
        if [[ "$WEB_CLIENT" == 'true' ]]; then pnpm install --frozen-lockfile
        else pnpm install --frozen-lockfile --filter '@qduc/term2...'; fi
    - name: Verify native addons and clean build inputs
      shell: bash
      run: |
        test ! -e node_modules/.cache/term2-integration-cli
        test ! -e dist
        node --input-type=module <<'NODE'
        import { createRequire } from 'node:module';
        const require = createRequire(import.meta.url);
        const Database = require('better-sqlite3');
        const db = new Database(':memory:');
        if (db.prepare('SELECT 1 AS value').get().value !== 1) throw new Error('SQLite native addon failed');
        db.close();
        const ssh2 = require('ssh2');
        new ssh2.Client();
        createRequire(require.resolve('ssh2'))('cpu-features')();
        NODE
    # Vitest schedules files longest-first only from its results cache; without
    # one it runs larger files first. The integration lane's 30s stalled-download
    # case then started ~38s into the run and its sleep became the lane's last
    # 15s (2026-11-09). Durations only order files; they never skip or pass one.
    # Restored after the install so a cold install cannot discard it.
    - name: Restore test file timings
      if: inputs.lane != ''
      uses: actions/cache@v6
      with:
        path: node_modules/.vite/vitest/da39a3ee5e6b4b0d3255bfef95601890afd80709/results.json
        key: test-vitest-timings-v1-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: test-vitest-timings-v1-${{ inputs.lane }}-
    # Cache package archives, then extract them only under RUNNER_TEMP.
    # Do not install host configuration or execute package maintainer scripts.
    - name: Restore shell sandbox packages
      id: sandbox-debs
      if: inputs.ripgrep == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.term2-ci/sandbox-debs
        key: test-sandbox-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.image }}-${{ steps.image.outputs.version }}
    - name: Prepare shell sandbox prerequisites without host configuration changes
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        debs="$HOME/.term2-ci/sandbox-debs"
        root="$RUNNER_TEMP/term2-sandbox-tools"
        if ! compgen -G "$debs/*.deb" >/dev/null; then
          sudo apt-get update
          mkdir -p "$debs"
          (cd "$debs" && apt-get download ripgrep bubblewrap socat)
        fi
        mkdir -p "$root"
        for deb in "$debs"/*.deb; do dpkg-deb -x "$deb" "$root"; done
        export PATH="$root/usr/bin:$PATH"
        "$root/usr/bin/rg" --version
        "$root/usr/bin/bwrap" --version
        socat_version="$("$root/usr/bin/socat" -V)"
        grep -m1 'socat version' <<<"$socat_version"
        echo "$root/usr/bin" >> "$GITHUB_PATH"
        # Missing packages/libraries or unavailable namespaces must fail CI.
        # Never apply sysctl settings, install with apt, or disable sandbox tests.
