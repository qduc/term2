name: CI

# Quality runs independently of behavioral tests, including on docs-only PRs.
# Keep all existing check names: port is a compatibility gate over the lanes
# that now own its checks. Behavioral tiers may skip only inert PR changes.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for the catalog updater
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

# A newer push to main supersedes an in-flight run of an older commit;
# cancel the stale run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Each tier keeps its configuration and module isolation. The lane runner
# assigns every discovered file once; only behavioral lanes and bench build dist/.
jobs:
  # Docs-only pull requests used to pay for the whole matrix. Inert means prose
  # and known evidence/image formats the tests never read. Unknown docs formats
  # run CI; a code-extension blacklist misses shell, Python and future languages.
  # Not inert, although markdown: root
  # AGENTS.md and the .agents/, .claude/ and .term2/ skill directories, because
  # the CLI puts them in its prompt and provider cases run it from the
  # checkout. Doc file names still reach that
  # prompt's depth-2 project tree; no case asserts on the tree, and main runs
  # everything after merge. Fail open: if this job fails, its empty output runs
  # every job below.
  changes:
    if: github.event_name == 'pull_request' && !inputs.ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # Both sides of a rename count. The files API lists at most 3,000 files,
          # so a larger pull request always runs.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          relevant=()
          while IFS= read -r file; do
            case "$file" in
              '') ;;
              AGENTS.md | .agents/* | .claude/* | .term2/* | src/*) relevant+=("$file") ;;
              *.md | *.mdx) ;;
              docs/*.json | docs/*.jsonl | docs/*.txt | docs/*.log | docs/*.stdout | docs/*.stderr | docs/*.exit | docs/*.diff | docs/*.patch | docs/*.deltas) ;;
              docs/*.png | docs/*.jpg | docs/*.jpeg | docs/*.gif | docs/*.webp | docs/*.svg | docs/*.pdf) ;;
              *) relevant+=("$file") ;;
            esac
          done <<< "$files"
          if [[ -z "$files" || "$CHANGED_FILES" -gt 3000 || ${#relevant[@]} -gt 0 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Running CI for:\n'
            printf '  %s\n' "${relevant[@]:0:20}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Every changed file is inert for tests; running repository policy checks only."
          fi

  # Keep repository policy in an existing required check, even when all costly
  # test work is skipped. A docs-only root report must not bypass check-root.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check repository policy
        run: |
          node scripts/check-root.mjs
          node scripts/check-no-unit-tests.mjs
      - uses: ./.github/actions/setup-tests
        if: needs.changes.outputs.run != 'false'
        with:
          ripgrep: 'true'
          lane: test
      - name: Run CLI integration, safety and responses provider cases
        if: needs.changes.outputs.run != 'false'
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs test
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Check repository policy
        run: |
          node scripts/check-root.mjs
          node scripts/check-no-unit-tests.mjs
      - name: Reject unapproved golden changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(git diff --name-only "$PR_BASE...$PR_HEAD" -- parity/goldens/)"
          if [[ -n "$changed" ]]; then
            # Query live PR state so reruns and label removals cannot reuse a stale event payload.
            golden_change_allowed="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'any(.labels[]; .name == "golden-change")')"
          else
            golden_change_allowed='true'
          fi
          if [[ -n "$changed" && "$golden_change_allowed" != 'true' ]]; then
            echo "Golden changes require the golden-change label:"
            echo "$changed"
            exit 1
          fi
      - uses: ./.github/actions/setup-tests
      - name: Typecheck production and check layer boundaries
        run: |
          pnpm exec tsc -p tsconfig.build.json --noEmit
          node scripts/check-layers.mjs
          node scripts/check-reachability.mjs
          node scripts/check-complexity.mjs
          node scripts/check-rules.mjs
          node scripts/check-engine-callbacks.mjs
          node scripts/check-baselines.mjs
      - name: Run static repository guards
        run: pnpm exec node scripts/run-ci-lane.mjs quality

  # Preserve the existing check name without serializing quality behind tests.
  # Explicit status handling also covers push/workflow_call's skipped changes job.
  # An unexpected skipped, failed or cancelled lane must never make this pass.
  port:
    needs: [changes, quality, test, integration, bench, e2e, provider-black-box]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the expected lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const inert = needs.changes.result === 'success' && needs.changes.outputs.run === 'false';
          const expected = { quality: 'success', test: 'success',
            integration: inert ? 'skipped' : 'success',
            bench: inert ? 'skipped' : 'success',
            e2e: inert ? 'skipped' : 'success',
            'provider-black-box': inert ? 'skipped' : 'success' };
          for (const [lane, result] of Object.entries(expected)) {
            if (needs[lane].result !== result) {
              console.error(`${lane}: expected ${result}, got ${needs[lane].result}`);
              process.exitCode = 1;
            }
          }
          NODE

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        with:
          ripgrep: 'true'
          web-client: 'true'
          lane: integration
      - name: Run remaining integration and stateless provider cases
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs integration

  # The benches ran after the integration cases on that runner, adding ~19s to
  # the slowest job (2026-11-09). They read only a fresh build, not test output,
  # so they run on their own runner with the integration job's tools.
  bench:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        id: setup
        with:
          ripgrep: 'true'
      - name: Build the CLI
        run: node scripts/build.mjs
      - name: Check the headless path
        run: node bench/headless.mjs
      - name: Check the production message path budget
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --unhandled-rejections=strict --import tsx bench/hops.mts

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        id: setup
        with:
          lane: e2e
      - name: Run E2E process cases
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs e2e
      - name: Check golden parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node parity/run.mjs check --cli dist/cli.js

  provider-black-box:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        with:
          lane: provider-black-box
      - name: Run resilience and remaining provider cases
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs provider-black-box
