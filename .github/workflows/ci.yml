name: CI

# Quality runs independently of behavioral tests, including on docs-only PRs.
# Each behavioral job owns exactly one test tier and shards heavy tiers in parallel;
# port is the aggregate gate over quality and all behavioral lanes. Behavioral tiers
# may skip only inert PR changes.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for the catalog updater
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  actions: read
  contents: read
  pull-requests: read

# A newer push to main supersedes an in-flight run of an older commit;
# cancel the stale run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Each tier keeps its configuration and module isolation. The lane runner
# assigns every discovered file once; only behavioral lanes and bench build dist/.
jobs:
  # Docs-only pull requests used to pay for the whole matrix. Inert means prose
  # and known evidence/image formats the tests never read. Unknown docs formats
  # run CI; a code-extension blacklist misses shell, Python and future languages.
  # Not inert, although markdown: root
  # AGENTS.md and the .agents/, .claude/ and .term2/ skill directories, because
  # the CLI puts them in its prompt and provider cases run it from the
  # checkout. Doc file names still reach that
  # prompt's depth-2 project tree; no case asserts on the tree, and main runs
  # everything after merge. Fail open: if this job fails, its empty output runs
  # every job below.
  changes:
    if: github.event_name == 'pull_request' && !inputs.ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # Both sides of a rename count. The files API lists at most 3,000 files,
          # so a larger pull request always runs.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          relevant=()
          while IFS= read -r file; do
            case "$file" in
              '') ;;
              AGENTS.md | .agents/* | .claude/* | .term2/* | src/*) relevant+=("$file") ;;
              *.md | *.mdx) ;;
              docs/*.json | docs/*.jsonl | docs/*.txt | docs/*.log | docs/*.stdout | docs/*.stderr | docs/*.exit | docs/*.diff | docs/*.patch | docs/*.deltas) ;;
              docs/*.png | docs/*.jpg | docs/*.jpeg | docs/*.gif | docs/*.webp | docs/*.svg | docs/*.pdf) ;;
              *) relevant+=("$file") ;;
            esac
          done <<< "$files"
          if [[ -z "$files" || "$CHANGED_FILES" -gt 3000 || ${#relevant[@]} -gt 0 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Running CI for:\n'
            printf '  %s\n' "${relevant[@]:0:20}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Every changed file is inert for tests; running repository policy checks only."
          fi

  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Check repository policy
        run: |
          node scripts/check-root.mjs
          node scripts/check-no-unit-tests.mjs
      - name: Reject unapproved golden changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(git diff --name-only "$PR_BASE...$PR_HEAD" -- parity/goldens/)"
          if [[ -n "$changed" ]]; then
            # Query live PR state so reruns and label removals cannot reuse a stale event payload.
            golden_change_allowed="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'any(.labels[]; .name == "golden-change")')"
          else
            golden_change_allowed='true'
          fi
          if [[ -n "$changed" && "$golden_change_allowed" != 'true' ]]; then
            echo "Golden changes require the golden-change label:"
            echo "$changed"
            exit 1
          fi
      - name: Reject unapproved CI budget raises
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-ci-budget.mjs
      # A reminder, not a lock: changing the shared fold's interface report, deleting a transcript check, or changing
      # the architecture rules asks for the owner's architecture-change label (web-transcript spec, section 8).
      - name: Ask the owner about architecture changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-architecture-change.mjs
      - uses: ./.github/actions/setup-tests
      - name: Typecheck production and check layer boundaries
        run: |
          pnpm exec tsc -p tsconfig.build.json --noEmit
          node scripts/check-layers.mjs
          node scripts/check-reachability.mjs
          node scripts/check-complexity.mjs
          node scripts/check-rules.mjs
          node scripts/check-engine-callbacks.mjs
          node scripts/check-baselines.mjs
      - name: Run static repository guards
        run: pnpm exec node scripts/run-ci-lane.mjs quality
      # Bounded generated properties over approvals, history, opaque lanes, the native log and the wire
      # (docs/experiments/generated-verification/README.md). They import src/ through tsx and need
      # no build. The seed is fixed so a red run is a change in this pull request, not a new sample;
      # a failure prints the replay command.
      - name: Run generated verification
        # The wire target folds frames with the browser's copy of the fold, which this builds (no full build).
        run: |
          node scripts/build-web-fold.mjs
          pnpm verify:generated --seed 424242

  # Preserve the existing check name without serializing quality behind tests.
  # Explicit status handling also covers push/workflow_call's skipped changes job.
  # An unexpected skipped, failed or cancelled lane must never make this pass.
  port:
    needs: [changes, quality, integration, bench, e2e, provider-black-box, web-browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the expected lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const inert = needs.changes.result === 'success' && needs.changes.outputs.run === 'false';
          const expected = { quality: 'success',
            integration: inert ? 'skipped' : 'success',
            bench: inert ? 'skipped' : 'success',
            e2e: inert ? 'skipped' : 'success',
            'provider-black-box': inert ? 'skipped' : 'success',
            'web-browser': inert ? 'skipped' : 'success' };
          for (const [lane, result] of Object.entries(expected)) {
            if (needs[lane].result !== result) {
              console.error(`${lane}: expected ${result}, got ${needs[lane].result}`);
              process.exitCode = 1;
            }
          }
          NODE
      - name: Check out CI budget scripts
        if: github.event_name == 'pull_request' && !inputs.ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - name: Enforce CI code-time budget
        if: github.event_name == 'pull_request' && !inputs.ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-ci-runtime.mjs

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        with:
          ripgrep: 'true'
          web-client: 'true'
          lane: integration-${{ matrix.shard }}
      # Nothing else compiles web-client on its own: root tsc and eslint exclude it, and the bench
      # lane only compiles it as a side effect of packing. This lane already installs its workspace.
      - name: Typecheck web client
        if: matrix.shard == 1
        run: |
          node scripts/build-web-fold.mjs
          pnpm --dir web-client exec tsc --noEmit
      - name: Run integration shard ${{ matrix.shard }}/2
        # This job installs bubblewrap and socat, so the ACP shell cases must run their command in the
        # sandbox instead of accepting a sandbox refusal (see tests/clients/acp/v1.integration.test.ts).
        env:
          TERM2_ACP_REQUIRE_SHELL_SUCCESS: '1'
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs integration --shard=${{ matrix.shard }}/2

  # The benches and packed-tarball smoke check read only a fresh build, not test output.
  # Running the tarball smoke check here reuses this runner's build and keeps e2e under 2m.
  bench:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        id: setup
        with:
          ripgrep: 'true'
          web-client: 'true'
      - name: Build the CLI
        run: node scripts/build.mjs
      - name: Check the headless path
        run: node bench/headless.mjs
      - name: Check the production message path budget
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --unhandled-rejections=strict --import tsx bench/hops.mts
      # What users install is the tarball, not the checkout: pack the build this job just created,
      # install it outside the repository, launch the web UI and replay a recorded provider turn.
      # publish.yml runs the same two commands before it publishes.
      - name: Restore Next.js build cache for packed web UI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: web-client/.next/cache
          key: test-web-next-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'web-client/**') }}
          restore-keys: |
            test-web-next-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
            test-web-next-cache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore npm cache for packed tarball smoke install
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: test-npm-smoke-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: test-npm-smoke-cache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Smoke-test the packed tarball
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          npm_config_prefer_offline: 'true'
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/term2-pack"
          pnpm release:smoke --tgz "$RUNNER_TEMP"/term2-pack/*.tgz

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Ubuntu 24.04 hosted runners reject bubblewrap loopback setup with RTM_NEWADDR EPERM;
    # sandbox-network.e2e.test.ts needs bubblewrap and socat on ubuntu-22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        id: setup
        with:
          ripgrep: 'true'
          lane: e2e-${{ matrix.shard }}
      - name: Run E2E shard ${{ matrix.shard }}/2
        env:
          RUN_SHELL_SANDBOX_INTEGRATION: '1'
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs e2e --shard=${{ matrix.shard }}/2
      - name: Check golden parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.shard == 1 }}
        run: node parity/run.mjs check --cli dist/cli.js

  provider-black-box:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        with:
          lane: provider-black-box-${{ matrix.shard }}
      - name: Run provider black-box shard ${{ matrix.shard }}/2
        run: /usr/bin/time -v pnpm exec node scripts/run-ci-lane.mjs provider-black-box --shard=${{ matrix.shard }}/2

  # The only lane that opens a browser: Chromium drives the built `term2-web` (gateway plus web UI)
  # against a loopback model double and requires the same transcript before and after a page reload
  # (tests/web-client/browser). It builds what `pnpm pack` ships, so a stale `.next` cannot pass.
  web-browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-tests
        with:
          web-client: 'true'
      - name: Build the CLI
        run: node scripts/build.mjs
      # Same key as the bench lane's packed build: both run `next build` on the same sources.
      - name: Restore Next.js build cache for web UI
        uses: actions/cache@v6
        with:
          path: web-client/.next/cache
          key: test-web-next-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'web-client/**') }}
          restore-keys: |
            test-web-next-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
            test-web-next-cache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the web UI
        run: node scripts/build-web.mjs
      # The browser build is tied to the Playwright version, not to the whole lockfile.
      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium for Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: test-playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # A restored browser skips the download; the system libraries still come from apt.
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser flows
        env:
          TERM2_WEB_FLOW_OUTPUT: ${{ runner.temp }}/term2-web-flows
        run: /usr/bin/time -v pnpm test:web-browser
      - name: Upload failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-failure-evidence
          path: ${{ runner.temp }}/term2-web-flows
          if-no-files-found: ignore
          retention-days: 7
