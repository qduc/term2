name: Update model catalog

# Weekly refresh of the vendored model catalog. Checks out the latest pi-ai
# source from the upstream main branch, generates provider data into a
# throwaway directory, points PI_AI_DATA_DIR at it, and regenerates
# source/providers/model-catalog/catalog.generated.ts via
# `pnpm catalog:update`, runs typechecking and repository guards, and opens or
# force-updates one predictable automation PR. Reuses the full CI matrix at the
# pushed commit, then merges that exact head on success. The workflow exits
# cleanly (green no-op) when a run produces no catalog changes.
on:
  schedule:
    # 06:00 UTC every Friday.
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs: a weekly tick and a manual dispatch must never race on the
# same PR branch. A queued run waits rather than cancels, so an in-flight
# update finishes and pushes before the next one starts.
concurrency:
  group: model-catalog-update
  cancel-in-progress: false

jobs:
  update:
    # Manual runs from other branches must never update or merge the shared PR.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      head: ${{ steps.pull-request.outputs.head }}
      number: ${{ steps.pull-request.outputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # npm -g rather than corepack: corepack is bundled only with Node < 25,
      # and npm ships with every Node release the runner may provision.
      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate only pi-ai's provider JSON: no dependency install or lockfile
      # changes are needed. Node 24 can run the upstream TypeScript generator.
      - name: Generate provider data from pi-ai main
        id: pi-ai
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/pi-ai.XXXXXX")"
          git clone --depth 1 --branch main https://github.com/earendil-works/pi.git "$TMP_DIR/repo"
          PI_AI_SHA="$(git -C "$TMP_DIR/repo" rev-parse HEAD)"
          cd "$TMP_DIR/repo/packages/ai"
          node scripts/generate-models.ts --strict --data-only
          echo "PI_AI_DATA_DIR=$TMP_DIR/repo/packages/ai/src/providers/data" >> "$GITHUB_ENV"
          echo "pi-ai-ref=$PI_AI_SHA" >> "$GITHUB_OUTPUT"

      - name: Regenerate the model catalog
        run: pnpm catalog:update

      - name: Check for generated catalog changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- source/providers/model-catalog/catalog.generated.ts; then
            echo "No catalog drift; nothing to PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated catalog and repository guards
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm typecheck
          pnpm test

      - name: Open or update the automation pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BRANCH="chore/model-catalog-update"
          BASE="${GITHUB_REF_NAME}"
          PI_AI_REF="${{ steps.pi-ai.outputs.pi-ai-ref }}"
          PR_TITLE="chore: update model catalog (pi-ai ${PI_AI_REF:0:7})"
          PR_BODY="Automated weekly model-catalog refresh.

          Regenerates \`source/providers/model-catalog/catalog.generated.ts\` from the
          pi-ai \`main\` at commit \`${PI_AI_REF}\` via its strict data-only
          model generator and \`pnpm catalog:update\`. Typechecking and repository guards ran in the
          \`Update model catalog\` workflow."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add source/providers/model-catalog/catalog.generated.ts
          git commit -m "$PR_TITLE"
          git push -u origin "$BRANCH" --force

          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            echo "Updating existing PR #${PR_NUMBER}."
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --head "$BRANCH" --base "$BASE"
            PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number')"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Call the
  # same four CI jobs explicitly instead of bypassing CI or requiring a PAT.
  ci:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update.outputs.head }}

  merge:
    needs: [update, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the validated catalog update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.update.outputs.number }}
          HEAD_SHA: ${{ needs.update.outputs.head }}
        # No --admin or --auto: honor branch rules, fail if the PR changed, and
        # do not depend on the repository's optional auto-merge setting. A merge
        # by GITHUB_TOKEN does not emit a new push CI run; CI already ran above.
        run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
