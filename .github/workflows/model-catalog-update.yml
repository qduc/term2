name: Update model catalog

# Weekly refresh of the OpenRouter catalog from its public models endpoint.
# Native-provider entries retain their existing snapshots. Regenerates the
# catalog via `pnpm catalog:update`, validates it, and opens or updates one
# automation PR. Reuses the full CI matrix before merging the exact head.
on:
  schedule:
    # 06:00 UTC every Friday.
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs: a weekly tick and a manual dispatch must never race on the
# same PR branch. A queued run waits rather than cancels, so an in-flight
# update finishes and pushes before the next one starts.
concurrency:
  group: model-catalog-update
  cancel-in-progress: false

jobs:
  update:
    # Manual runs from other branches must never update or merge the shared PR.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      head: ${{ steps.pull-request.outputs.head }}
      number: ${{ steps.pull-request.outputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # npm -g rather than corepack: corepack is bundled only with Node < 25,
      # and npm ships with every Node release the runner may provision.
      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Adapt OpenRouter's response to the existing generator's provider-data
      # format. Preserve native-provider snapshots: router prices and limits
      # must not be presented as authoritative native-provider metadata.
      - name: Fetch OpenRouter model data
        run: |
          set -euo pipefail
          DATA_DIR="$(mktemp -d "$RUNNER_TEMP/openrouter.XXXXXX")"
          curl --fail --silent --show-error https://openrouter.ai/api/v1/models -o "$DATA_DIR/models.json"
          OPENROUTER_DATA_DIR="$DATA_DIR" pnpm exec tsx --eval '
            import { readFileSync, writeFileSync } from "node:fs";
            import { MODEL_CATALOG } from "./src/model/providers/model-catalog/catalog.generated.ts";
            const dir = process.env.OPENROUTER_DATA_DIR;
            const payload = JSON.parse(readFileSync(`${dir}/models.json`, "utf8"));
            if (!Array.isArray(payload.data) || payload.data.length === 0) {
              throw new Error("OpenRouter returned no model data");
            }
            const models = {};
            const rate = (value) => value == null || value === "" ? undefined : Number(value) * 1_000_000;
            for (const model of payload.data) {
              if (typeof model.id !== "string" || !Number.isFinite(model.context_length) || model.context_length <= 0) {
                throw new Error("Invalid OpenRouter model metadata");
              }
              models[model.id] = {
                contextWindow: model.context_length,
                ...(model.top_provider?.max_completion_tokens > 0
                  ? { maxTokens: model.top_provider.max_completion_tokens } : {}),
                cost: {
                  input: rate(model.pricing?.prompt),
                  output: rate(model.pricing?.completion),
                  cacheRead: rate(model.pricing?.input_cache_read),
                  cacheWrite: rate(model.pricing?.input_cache_write),
                },
              };
            }
            for (const [provider, entries] of Object.entries(MODEL_CATALOG)) {
              if (provider === "openrouter") continue;
              const preserved = Object.fromEntries(Object.entries(entries).map(([id, entry]) => [id, {
                contextWindow: entry.contextWindow,
                maxTokens: entry.maxTokens,
                cost: {
                  input: entry.inputPricePerMTok,
                  output: entry.outputPricePerMTok,
                  cacheRead: entry.cacheReadPricePerMTok,
                  cacheWrite: entry.cacheWritePricePerMTok,
                },
              }]));
              const file = provider === "codex" ? "openai-codex" : provider;
              writeFileSync(`${dir}/${file}.json`, JSON.stringify({ chat: preserved }));
            }
            writeFileSync(`${dir}/openrouter.json`, JSON.stringify({ chat: models }));
          '
          echo "PI_AI_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Regenerate the model catalog
        run: |
          pnpm catalog:update
          # The generator accepts pi-ai-shaped data, but this refresh uses
          # OpenRouter directly and retains the other providers from the snapshot.
          sed -i \
            -e 's/from @earendil-works\/pi-ai data/from OpenRouter data and preserved native-provider snapshots/' \
            -e "s/source: 'pi-ai@unknown'/source: 'https:\/\/openrouter.ai\/api\/v1\/models (native providers preserved)'/" \
            src/model/providers/model-catalog/catalog.generated.ts

      - name: Check for generated catalog changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- src/model/providers/model-catalog/catalog.generated.ts; then
            echo "No catalog drift; nothing to PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated catalog and repository guards
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm typecheck
          pnpm test

      - name: Open or update the automation pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BRANCH="chore/model-catalog-update"
          BASE="${GITHUB_REF_NAME}"
          PR_TITLE="chore: update model catalog (OpenRouter)"
          PR_BODY="Automated weekly model-catalog refresh.

          Regenerates \`src/model/providers/model-catalog/catalog.generated.ts\` from the
          OpenRouter models endpoint (https://openrouter.ai/api/v1/models) via
          \`pnpm catalog:update\`, preserving existing native-provider snapshots.
          Typechecking and repository guards ran in the
          \`Update model catalog\` workflow."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/model/providers/model-catalog/catalog.generated.ts
          git commit -m "$PR_TITLE"
          git push -u origin "$BRANCH" --force

          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            echo "Updating existing PR #${PR_NUMBER}."
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --head "$BRANCH" --base "$BASE"
            PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number')"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Call the
  # same four CI jobs explicitly instead of bypassing CI or requiring a PAT.
  ci:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update.outputs.head }}

  merge:
    needs: [update, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the validated catalog update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.update.outputs.number }}
          HEAD_SHA: ${{ needs.update.outputs.head }}
        # No --admin or --auto: honor branch rules, fail if the PR changed, and
        # do not depend on the repository's optional auto-merge setting. A merge
        # by GITHUB_TOKEN does not emit a new push CI run; CI already ran above.
        run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
