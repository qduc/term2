name: Publish package

on:
  push:
    tags:
      - 'v*'
  # Allow a failed tag-triggered release to be retried after its blocker is
  # fixed. The selected ref must still be the clean, exact-tag release source;
  # untagged corrective main builds are rejected by prepublishOnly.
  workflow_dispatch:

# npm Trusted Publishing exchanges a short-lived OIDC token for publish
# authentication. No npm token secret is needed.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Ubuntu 24.04 hosted runners reject bubblewrap loopback setup with
    # RTM_NEWADDR EPERM. Keep the real sandbox checks on a compatible image.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # npm Trusted Publishing requires npm 11.5.1+; Node 24 ships a
          # compatible npm CLI.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Search needs rg; Bare shell integration checks also execute the real
      # Linux sandbox, which requires bubblewrap and socat. Keep these installed
      # rather than disabling the sandbox or weakening the boundary assertions.
      - name: Install shell sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap socat

      - name: Build package
        run: pnpm run build

      # The default tier holds only the static repository guards during the
      # evidence-driven development experiment.
      - name: Run tests
        run: pnpm test

      # vitest.config.ts excludes the integration tier, so the release gate
      # needs this second command to keep covering the nine *.integration.*
      # files. The provider black-box tier is deliberately not run here: it
      # needs a built dist/ and PTY-driven scenarios, and CI owns it.
      - name: Run integration tests
        run: pnpm test:integration

      - name: Publish package
        # Tag checkouts are detached; pnpm's git checks would reject them.
        # prepublishOnly checks the built identity before any registry write,
        # for both tag pushes and manual dispatch (do not use --ignore-scripts).
        # npm generates provenance automatically for GitHub OIDC publishing.
        run: pnpm publish --access public --no-git-checks
