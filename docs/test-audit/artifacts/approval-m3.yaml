decisions:
  - id: approval-approval-decision-executor-approval-m3
    testId: approval-approval-decision-executor
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: This file protects the high-risk settlement and scoped-grant behavior across parent and delegated calls, including rejection cleanup and exceptional continuation settlement.
    evidence:
      - The exact continuation callback, per-call decision map, and ownership release are asserted in source/services/approval/approval-decision-executor.test.ts:76-160.
      - Denied-read, folder/edit, and Docker one-shot/session/project scope are asserted against injected state in source/services/approval/approval-decision-executor.test.ts:162-332.
      - The production seam is ApprovalDecisionExecutor.resolve in source/services/approval/approval-decision-executor.ts:60-307; no assigned sibling provides equivalent end-to-end grant cleanup coverage.
    replacementTestIds: []
    status: proposed
  - id: approval-approval-state-approval-m3
    testId: approval-approval-state
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: This compact state-machine test protects the single-use aborted continuation invariant and preservation of batch context at a high-risk lifecycle boundary.
    evidence:
      - Pending identity, abort transition, one-time consume, and batch metadata preservation are asserted in source/services/approval/approval-state.test.ts:4-84.
      - The production seam is ApprovalState.setPending, abortPending, and consumeAborted in source/services/approval/approval-state.ts:42-89; flow tests consume this state but do not replace its direct transition coverage.
    replacementTestIds: []
    status: proposed
  - id: approval-background-subagent-approval-controller-approval-m3
    testId: approval-background-subagent-approval-controller
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: The controller is the ownership-sensitive adapter from a background lease to queue resolution; both successful exact application and close cleanup are meaningful.
    evidence:
      - Exact retained continuation application, queue removal, and ownership release are asserted in source/services/approval/background-subagent-approval-controller.test.ts:15-74.
      - The production seam is BackgroundSubagentApprovalController.publish, resolve, and close in source/services/approval/background-subagent-approval-controller.ts:21-157; no assigned sibling covers this adapter's close path.
    replacementTestIds: []
    status: proposed
  - id: approval-background-subagent-approval-queue-approval-m3
    testId: approval-background-subagent-approval-queue
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: This queue has a substantial stateful API and the tests cover stale-operation protection, failure atomicity, callback cleanup, immutability, and listener reentrancy without a stronger assigned replacement.
    evidence:
      - FIFO/revision identity, update/remove, close, listener notification, application failure, release errors, deep freezing, and resubscription behavior are asserted throughout source/services/approval/background-subagent-approval-queue.test.ts:26-286.
      - The production seam is BackgroundSubagentApprovalQueue in source/services/approval/background-subagent-approval-queue.ts:100-326; controller coverage exercises only its adapter-facing subset.
    replacementTestIds: []
    status: proposed
  - id: approval-c11-d5-batch-denial-boundary-approval-m3
    testId: approval-c11-d5-batch-denial-boundary
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: Although intentionally marked it.fails, this is explicit regression provenance for a security-relevant batch-accounting defect and should remain visible until the production fix makes the assertion pass.
    evidence:
      - The test names C11-D5 record_rejected and asserts rejected rather than approved at source/services/approval/c11-d5-batch-denial-boundary.test.ts:18-77.
      - The production seam is ToolApprovalBatchCoordinator.stageBatch in source/services/approval/tool-approval-batch-coordinator.ts; the broader assigned batch file does not assert this denied-ledger boundary with isToolApproved false.
    replacementTestIds: []
    status: proposed
  - id: approval-non-interactive-approval-policy-approval-m3
    testId: approval-non-interactive-approval-policy
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: Non-interactive execution is a separate safety mode and this file verifies its fail-closed behavior across disabled mode, RED commands, missing model, negative advisory, and evaluator errors.
    evidence:
      - Exact decision payloads and no-chat behavior for disabled, non-shell, RED, missing-model, negative, and evaluator-error inputs are asserted in source/services/approval/non-interactive-approval-policy.test.ts:61-153.
      - The production seam is NonInteractiveApprovalPolicy.decide in source/services/approval/non-interactive-approval-policy.ts:43-148; no assigned sibling tests the non-interactive decision envelope.
    replacementTestIds: []
    status: proposed
  - id: approval-shell-auto-approval-evaluator-approval-m3
    testId: approval-shell-auto-approval-evaluator
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: >-
      This large file is justified by the evaluator's security-sensitive contract: it verifies bounded untrusted context,
      structured-output fallback, explicit uncertainty handling, and hard RED/sensitive-path rejection.
    evidence:
      - Mode gating, RED preservation, risk metadata, provider/model settings, unsandboxed annotations, and structured support behavior are asserted in source/services/approval/shell-auto-approval-evaluator.test.ts:50-397.
      - Context bounds, tool-result adjacency, injection-resistant instructions, truncation/reasoning limits, normalized history, manual-decision precedent, repair, malformed fallback, and mixed shell/file evaluation are asserted in source/services/approval/shell-auto-approval-evaluator.test.ts:399-934.
      - The production seam is evaluateShellAutoApprovalAdvisories in source/services/approval/shell-auto-approval-evaluator.ts; no assigned sibling covers the evaluator prompt and parsing contract at this breadth.
    replacementTestIds: []
    status: proposed
  - id: approval-shell-auto-approval-resolver-approval-m3
    testId: approval-shell-auto-approval-resolver
    role: second_opinion
    reviewer: approval-m3
    sourceArtifact: docs/test-audit/artifacts/approval-m3.yaml
    recommendation: keep
    confidence: high
    reason: Resolver settings and cache semantics determine whether advisory evidence becomes execution authority, so the fail-closed matrix and unsandboxed sibling handling are proportionate.
    evidence:
      - Tool eligibility, advisory forwarding, mode and sandbox eligibility, fail-closed risk/auth/source checks, always-mode behavior, cache clearing, no-call-id evaluation, and unsandboxed prompt annotations are asserted in source/services/approval/shell-auto-approval-resolver.test.ts:58-315.
      - The production seam is ShellAutoApprovalResolver.resolveAdvisoryForInterruption, isUnsandboxedApprovalEligible, shouldAutoApprove, and clearCache in source/services/approval/shell-auto-approval-resolver.ts; evaluator tests do not replace these resolver decisions.
