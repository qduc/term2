# Approval domain exploration: independent second opinion (Milestone 3).
schemaVersion: 2
domains:
  - id: approval
    label: Approval decisions, safety policy, and delegated-call ownership
suites:
  - id: unit
    label: Deterministic unit and seam tests
seams:
  - id: approval-decision-execution
    label: Boundary applying an approval answer to a retained continuation and scoped access state
  - id: approval-decision-policy
    label: Boundary deciding whether a tool interruption is approved, prompted, or rejected
  - id: approval-flow-coordination
    label: Boundary coordinating pending approval lifecycle, continuation, abort, and owner routing
  - id: approval-presentation
    label: Boundary mapping pending and approved tool calls to visible command messages
  - id: approval-replay-ledger
    label: Boundary replaying persisted approval records into the runtime approval ledger
  - id: approval-state-store
    label: Boundary storing pending and aborted approval contexts
  - id: approval-background-queue
    label: Boundary exposing background approval pauses as an ordered revisioned queue
  - id: approval-batch-coordination
    label: Boundary resolving multiple tool interruptions while preserving per-call decisions
  - id: approval-noninteractive-policy
    label: Boundary applying fail-closed approval policy without an interactive user
  - id: approval-auto-evaluation
    label: Boundary asking an evaluator model for structured shell/file approval advisories
  - id: approval-auto-resolution
    label: Boundary resolving cached advisories and settings into auto-approval outcomes
  - id: approval-shell-safety
    label: Boundary identifying unsandboxed shell and Docker host-control approval requirements
  - id: approval-ownership
    label: Boundary attributing tool call ids to parent or delegated owners
risks:
  - id: approval-unauthorized-execution
    label: A denied or unsafe tool call executes because approval policy or settlement grants access incorrectly.
    severity: critical
  - id: approval-wrong-continuation
    label: An approval answer resumes, rejects, or annotates a different tool call than the one requested.
    severity: critical
  - id: approval-stale-state
    label: Aborted, consumed, or cross-session approval state remains usable and affects a later call.
    severity: critical
  - id: approval-scope-escape
    label: A one-shot, session, project, or delegated approval grants more access than intended.
    severity: critical
  - id: approval-misleading-presentation
    label: The terminal hides or labels the wrong pending or approved tool call.
    severity: high
  - id: approval-replay-grant
    label: Persisted approval records are keyed or replayed incorrectly and grant the wrong tool authority.
    severity: critical
  - id: approval-queue-loss
    label: Background approval entries reorder, disappear, or expose the wrong retained continuation.
    severity: high
  - id: approval-policy-fail-open
    label: Missing, malformed, or low-confidence policy evidence silently auto-approves a tool call.
    severity: critical
  - id: approval-batch-accounting
    label: A multi-call approval batch records an incorrect per-call outcome or bypasses a required prompt.
    severity: critical
  - id: approval-owner-confusion
    label: A tool result or approval is attributed to the wrong parent or delegated run.
    severity: critical
contracts:
  - id: approval-decision-settlement
    statement: An approval answer applies only to the retained interruption, records approved or rejected outcome, releases ownership after settlement, and invokes the matching continuation or rejection callback.
    seamIds:
      - approval-decision-execution
    riskIds:
      - approval-unauthorized-execution
      - approval-wrong-continuation
  - id: approval-scoped-grants
    statement: Denied-read, folder, edit, and Docker approval answers create only the requested one-shot, session, or project grant in the injected access state, while generic or mismatched answers create no grant.
    seamIds:
      - approval-decision-execution
    riskIds:
      - approval-scope-escape
      - approval-unauthorized-execution
  - id: approval-policy-outcomes
    statement: Manual policy prompts, auto policy approves only eligible tools with acceptable advisory evidence, always mode excludes ask_user, and non-eligible or missing evidence remains a prompt.
    seamIds:
      - approval-decision-policy
    riskIds:
      - approval-policy-fail-open
  - id: approval-flow-resolution
    statement: Pending approval flow uses the pending generation and owner, emits the appropriate tool-start event on approval, rejects with the requested reason, and aborts or retargets without resuming stale work.
    seamIds:
      - approval-flow-coordination
    riskIds:
      - approval-wrong-continuation
      - approval-stale-state
      - approval-owner-confusion
  - id: approval-presentation-matching
    statement: Approval presentation selects the pending command by call id when available, falls back to tool name only without a call id, and annotates approved messages from capability metadata.
    seamIds:
      - approval-presentation
    riskIds:
      - approval-misleading-presentation
  - id: approval-replay-contract
    statement: Persisted approval records replay into the approval ledger using the record's tool identity and preserve the intended blanket or call-specific authority without cross-tool grants.
    seamIds:
      - approval-replay-ledger
    riskIds:
      - approval-replay-grant
  - id: approval-state-lifecycle
    statement: Pending approval context can be read, transitions atomically to aborted state while clearing pending state, preserves batch metadata, and an aborted context is consumed at most once.
    seamIds:
      - approval-state-store
    riskIds:
      - approval-stale-state
      - approval-wrong-continuation
  - id: approval-background-ordering
    statement: Background approvals expose an immutable revisioned FIFO head, reject stale identity or revision operations, retain the head when application fails, and release each queued entry exactly once on removal or close.
    seamIds:
      - approval-background-queue
    riskIds:
      - approval-queue-loss
      - approval-wrong-continuation
  - id: approval-noninteractive-safety
    statement: Non-interactive mode rejects by default, permits non-shell tools only when explicitly enabled, hard-rejects RED shell commands without evaluator access, and fails closed for missing, negative, or errored YELLOW evaluation.
    seamIds:
      - approval-noninteractive-policy
      - approval-auto-evaluation
    riskIds:
      - approval-policy-fail-open
      - approval-unauthorized-execution
  - id: approval-batch-accounting
    statement: Multi-call approval staging evaluates each interruption with the applicable registry, shell, Docker, and policy rules and records the resulting approved or rejected state for the exact call.
    seamIds:
      - approval-batch-coordination
    riskIds:
      - approval-batch-accounting
      - approval-unauthorized-execution
  - id: approval-auto-evaluator-safety
    statement: Shell/file auto-approval evaluation bounds and contextualizes untrusted history, parses or repairs structured advisories, preserves system rejection for RED and sensitive inputs, and fails closed on malformed or uncertain evidence.
    seamIds:
      - approval-auto-evaluation
    riskIds:
      - approval-policy-fail-open
      - approval-unauthorized-execution
  - id: approval-auto-resolver
    statement: Auto-approval resolver applies mode, sandbox eligibility, advisory cache, manual-decision context, and per-tool rules consistently, including unsandboxed sibling annotations.
    seamIds:
      - approval-auto-resolution
    riskIds:
      - approval-policy-fail-open
      - approval-scope-escape
  - id: approval-unsandboxed-boundary
    statement: Unsandboxed shell and Docker host-control requests require human approval by default, may defer only when explicitly eligible, and ordinary sandboxed non-Docker commands do not acquire that requirement.
    seamIds:
      - approval-shell-safety
    riskIds:
      - approval-unauthorized-execution
      - approval-policy-fail-open
  - id: approval-ownership-routing
    statement: Tool-call ownership defaults to the parent, claims are keyed by non-empty call id, later claims replace earlier ownership, and release or clear returns calls to the parent without evicting live claims.
    seamIds:
      - approval-ownership
    riskIds:
      - approval-owner-confusion
      - approval-stale-state
fixtures:
  - id: approval-continuation-handles
    label: Injected approval continuation callbacks retaining the exact interruption
  - id: approval-access-state
    label: Injected session and nested compatibility state for scoped approval grants
  - id: approval-advisories
    label: Structured low-risk, high-risk, and missing evaluator advisories
  - id: approval-command-messages
    label: Pending and approved command-message records with call and capability metadata
  - id: approval-ledger-records
    label: Approval records and ledger instances used to verify replay authority
  - id: approval-pending-context
    label: Pending approval context with batch decisions, prompted call, and owner metadata
  - id: approval-background-entries
    label: Revisioned FIFO background approval entries and callback leases
  - id: approval-policy-registry
    label: Tool approval registry and injected batch-policy callbacks
  - id: approval-command-corpus
    label: Representative RED, YELLOW, safe, and evaluator-error command inputs
  - id: approval-evaluator-transcript
    label: Bounded conversation history and structured evaluator chat responses
  - id: approval-settings
    label: Injected approval mode, sandbox, provider, and model settings
  - id: approval-owner-records
    label: Tool-call ownership claims for parent and delegated runs
