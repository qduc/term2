decisions:
  - id: conversation-c11-d8-grant-kind-boundary-test-conversation-a-m3
    testId: conversation-c11-d8-grant-kind-boundary-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: medium
    reason: The intentional failure is a durable proof for an additive approval event field and documents the currently observed missing grant-kind behavior rather than duplicating a passing assertion.
    evidence:
      - The test captures the approval_resolved event emitted by source/services/conversation/conversation-adapter.ts and asserts answer plus the proposed interactive grantKind field.
      - No other assigned test asserts grantKind on approval_resolved; removing this proof would leave the C11-D8 event-shape contract unguarded.
    replacementTestIds: []
    status: proposed
  - id: conversation-state-projector-test-conversation-a-m3
    testId: conversation-state-projector-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: >-
      State projection is a high-scrutiny sibling cluster: it reconciles history and ledger for model requests while preserving additive snapshots, warning about incomplete work, and respecting compaction boundaries.
    evidence:
      - source/services/conversation/conversation-state-projector.ts projectProviderHistory, projectModelRequestHistory, projectSnapshot, and projectImportedState are all exercised with completed, aborted, unknown, compacted, orphaned, and replacement-checkpoint histories.
      - The tests assert purity/idempotence and distinguish additive history from model-request history; conversation-replay.test.ts tests replay construction but does not replace these projection-specific invariants.
    replacementTestIds: []
    status: proposed
  - id: conversation-state-schema-test-conversation-a-m3
    testId: conversation-state-schema-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Runtime schema validation is the import guard before projection, and its compatibility migration for unknown historical statuses is a distinct contract from projection behavior.
    evidence:
      - source/services/conversation/conversation-state-schema.ts ImportedConversationStateSchema is tested for supported state, malformed rejection, unknown/dispatchedAt acceptance, legacy-status migration, and existing aborted status.
      - No assigned sibling directly invokes ImportedConversationStateSchema; replay and persistence tests exercise downstream loading but do not establish pre-projection validation semantics.
    replacementTestIds: []
    status: proposed
  - id: conversation-store-test-conversation-a-m3
    testId: conversation-store-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: ConversationStore is the authoritative in-memory history boundary; its defensive snapshots, synthetic-item filtering, opaque rewind targets, multimodal preservation, and tool-output/file preview behavior underpin recovery and user-visible rewind.
    evidence:
      - source/services/conversation/conversation-store.ts is tested for atomic revision replacement, deep clone/freeze including cycles, append/replace/clear, all provider tool-result variants, malformed arguments, and direct/wrapped/canonical tool calls.
      - The rewind matrix checks stale-target nonmutation, reply/turn/file discard counts, shell/mode-notice exclusion, and image counts; conversation-state-projector.test.ts handles a different ledger-to-provider projection seam.
    replacementTestIds: []
    status: proposed
  - id: conversation-replay-test-conversation-a-m3
    testId: conversation-replay-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Replay is a high-scrutiny compatibility boundary with golden legacy/current fixtures and extensive crash, tool-order, background activity, and forward-compatibility cases.
    evidence:
      - source/services/conversation/conversation-replay.ts and conversation-decoder.ts are exercised from raw envelopes and checked for metadata, ordered history/ledger, visible messages, interrupted state, journal fragments, opaque items, and malformed known events.
      - The compact-history regression asserts one ordered call/result pair after replay, while the golden fixtures verify v2 and v3 resumability; no other assigned test covers this replay/decoder matrix.
    replacementTestIds: []
    status: proposed
  - id: conversation-result-builder-test-conversation-a-m3
    testId: conversation-result-builder-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Result construction is the boundary where provider stream state becomes a terminal outcome, so the approval, auto-approval, retry, output-correction, usage, reasoning, ownership, and no-fabricated-output cases earn focused coverage.
    evidence:
      - source/services/conversation/conversation-result-builder.ts buildConversationResult and toTerminalEvent are tested with injected access, ownership, approval policy, tool ledger, and stream dependencies.
      - The suite asserts whitespace-only output stays empty, run-budget pauses remain resumable, ask_user is not auto-approved, and native reasoning metadata is persisted; these distinctions are not replaced by service-level terminal assertions.
    replacementTestIds: []
    status: proposed
  - id: conversation-service-facade-test-conversation-a-m3
    testId: conversation-service-facade-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The facade is the public conversation surface and its ownership, reset, observer, shell-context, compaction, and session-rollover behavior is product behavior rather than disposable wiring coverage.
    evidence:
      - source/services/conversation/conversation-service.ts is exercised through caller-owned and factory-owned client construction, with assertions on public methods, sinks, observers, and exported state rather than private runtime fields.
      - Reset tests verify event/log/queue/retry/background observers remain attached and ownership tests reject incomplete construction; no other assigned file covers this facade lifecycle contract.
    replacementTestIds: []
    status: proposed
  - id: conversation-service-test-conversation-a-m3
    testId: conversation-service-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This broad public-service suite protects FIFO queueing, approval continuation, provider-history recovery, streamed events, retries, reset/provider changes, background-task cancellation policy, and exported state across the main conversation API.
    evidence:
      - source/services/conversation/conversation-service.ts is exercised with actual ConversationService construction and in-memory agent streams, including terminal-less abort, approval rejection, tool replay, hallucination retries, and background-task controls.
      - conversation-integration.test.ts is a compact end-to-end regression slice; this file additionally covers the public queue, reset, provider-switch, retry, and background lifecycle cases, so neither is a redundant replacement for the other.
    replacementTestIds: []
    status: proposed
  - id: conversation-message-projection-test-conversation-a-m3
    testId: conversation-message-projection-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This focused projection table protects the visible conversation contract across provider wrappers, multimodal content, synthetic notices, malformed content, and non-message items.
    evidence:
      - source/services/conversation/conversation-message-projection.ts projectConversationMessage is exercised with direct and rawItem-wrapped inputs and checks exact text, image, role, and synthetic flags.
      - conversation-store.test.ts checks related turn extraction but does not assert the projection object's role/text/images/isSynthetic result; no assigned sibling replaces this focused boundary coverage.
    replacementTestIds: []
    status: proposed
  - id: conversation-orchestrator-subagent-notifications-test-conversation-a-m3
    testId: conversation-orchestrator-subagent-notifications-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
