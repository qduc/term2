decisions:
  - id: conversation-c11-d8-grant-kind-boundary-test-conversation-a-m3
    testId: conversation-c11-d8-grant-kind-boundary-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: medium
    reason: The intentional failure is a durable proof for an additive approval event field and documents the currently observed missing grant-kind behavior rather than duplicating a passing assertion.
    evidence:
      - The test captures the approval_resolved event emitted by source/services/conversation/conversation-adapter.ts and asserts answer plus the proposed interactive grantKind field.
      - No other assigned test asserts grantKind on approval_resolved; removing this proof would leave the C11-D8 event-shape contract unguarded.
    replacementTestIds: []
    status: proposed
  - id: conversation-adapter-test-conversation-a-m3
    testId: conversation-adapter-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the focused adapter boundary suite for queue ownership, approval races, cancellation classification, steering/editing, and event delivery; those outcomes are high-risk and are not safely inferred from public-service tests.
    evidence:
      - Tests exercise the explicit TurnFlow and SessionApprovalQuery seams in source/services/conversation/conversation-adapter.ts, including stale post-execute revision/session tokens and rollback when QueueController rejects an edit.
      - The file asserts retained queued promises stay pending across abort, provider errors are preserved, and cancellation force-settles a turn that ignores abort; no other assigned file covers these adapter settlement races.
    replacementTestIds: []
    status: proposed
  - id: conversation-admission-workflow-test-conversation-a-m3
    testId: conversation-admission-workflow-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The workflow owns the order and authority boundary for input surge and large uncached input confirmations; its stale-resolution and decline paths protect policy and data integrity.
    evidence:
      - source/services/conversation/conversation-admission-workflow.ts is exercised with spies that verify history.addMessage precedes send and that approval capability is content-bound after skill expansion.
      - The file uniquely checks declined, repeated, and stale confirmations do not record or send; conversation-adapter.test.ts does not exercise this admission workflow seam.
    replacementTestIds: []
    status: proposed
  - id: conversation-clear-save-test-conversation-a-m3
    testId: conversation-clear-save-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This filesystem proof protects clear-session durability and resumability with a minimal focused fixture.
    evidence:
      - The test drives createConversationLogWriter rotation and source/services/conversation/conversation-persistence.ts loadConversation, asserting old JSONL remains resumable while the new session has no history or response id.
      - No other assigned test asserts the exact old-file-preserved/new-file-empty clear rotation outcome.
    replacementTestIds: []
    status: proposed
  - id: conversation-events-test-conversation-a-m3
    testId: conversation-events-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The classifier is a small recovery-critical seam whose negative bookkeeping cases prevent unsafe recovery decisions.
    evidence:
      - source/services/conversation/conversation-events.ts isCommittedOutputEvent is asserted for both bookkeeping and committed-output discriminants.
      - Search of assigned conversation tests found no sibling assertion of isCommittedOutputEvent; conversation-service tests consume events but do not pin this classifier table.
    replacementTestIds: []
    status: proposed
  - id: conversation-history-repair-test-conversation-a-m3
    testId: conversation-history-repair-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Replay repair is high-scrutiny persistence behavior and the tests distinguish harmful duplication from legitimate repeated prose and distinct calls.
    evidence:
      - source/services/conversation/conversation-history-repair.ts repairConversationHistory is tested through provider, rawItem-wrapped, snake/camel id, and canonical forms while retained objects preserve provider-only fields.
      - conversation-replay.test.ts separately checks replay outcomes but does not replace these focused repair invariants; no assigned sibling directly tests repairConversationHistory.
    replacementTestIds: []
    status: proposed
  - id: conversation-input-routing-test-conversation-a-m3
    testId: conversation-input-routing-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The pure route and normalization table is the narrow guard for turning terminal UI input into the correct interaction action, including special approval capabilities.
    evidence:
      - source/services/conversation/conversation-input-routing.ts is tested for ask-user, rejection, blocked approval, denied-read, session-folder, Docker, and ordinary answer branches.
      - No assigned sibling directly imports routeConversationTurnSubmission or normalizeApprovalDecision, so deletion would remove the only focused table coverage.
    replacementTestIds: []
    status: proposed
  - id: conversation-integration-test-conversation-a-m3
    testId: conversation-integration-test
    role: second_opinion
    reviewer: conversation-a-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: These compact integration scenarios validate the public service path across stream projection, approval continuation, retry, and the terminal-write gate; the last is a shipped persistence regression.
    evidence:
      - source/services/conversation/conversation-service.ts is exercised with createAgentStream and a real ProductionConversationService subclass, not only a mocked adapter method.
      - The terminal-write scenario asserts interrupted output is absent before approval and cumulative continuation output is persisted once afterward; no other assigned file asserts this exact end-to-end gate.
    replacementTestIds: []
    status: proposed
