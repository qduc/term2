schemaVersion: 2
domains:
  - id: conversation
    label: Conversation services, persistence, replay, and message projection utilities
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Conversation persistence and service-boundary integration tests
seams:
  - id: conversation-b-seam-turn-normalization
    label: Normalization and provider replay projection for persisted assistant turn items
  - id: conversation-b-seam-journal-ledger
    label: Reconstruction and deduplication of tool ledger entries from journals and turn history
  - id: conversation-b-seam-queue-persistence
    label: Atomic session queue sidecar persistence and quarantine
  - id: conversation-b-seam-session-audit
    label: Session transcript audit classification and persistence-backed recovery diagnostics
  - id: conversation-b-seam-session-browser
    label: Scoped session listing, reading, search, pagination, cursors, and safe projection
  - id: conversation-b-seam-message-application
    label: Applying terminal conversation results to streamed UI messages
  - id: conversation-b-seam-streaming-event-projection
    label: Conversation event projection for compaction, reasoning, text, retry, subagent, and tool events
  - id: conversation-b-seam-message-utilities
    label: Pure message selection, merge, undo, buffer, markdown frontier, and rewind projections
risks:
  - id: conversation-b-risk-provider-replay-invalidity
    label: Normalized or resumed provider history loses metadata, duplicates tools, or contains unsupported opaque items.
    severity: critical
  - id: conversation-b-risk-ledger-reconstruction-drift
    label: Journal recovery miscounts, duplicates, or loses tool executions and their provider history.
    severity: high
  - id: conversation-b-risk-queue-sidecar-corruption
    label: Queue work is lost, partially published, or incorrectly loaded after persistence failure.
    severity: high
  - id: conversation-b-risk-session-recovery-misclassification
    label: Session audit reports the wrong terminal state or fails to expose unpaid work and errors.
    severity: high
  - id: conversation-b-risk-browser-data-leak-or-stale-read
    label: Session browsing leaks provider/tool internals, crosses scope boundaries, or serves stale or unbounded pages.
    severity: high
  - id: conversation-b-risk-streamed-message-duplication
    label: Terminal results duplicate, lose, or incorrectly finalize streamed assistant content.
    severity: high
  - id: conversation-b-risk-event-ui-drift
    label: Conversation events disappear, render misleading notices, or corrupt live activity state.
    severity: high
  - id: conversation-b-risk-message-rewind-drift
    label: Message utilities select, merge, trim, buffer, or rewind the wrong visible turns.
    severity: high
fixtures:
  - id: conversation-b-fixture-provider-turn-items
    label: Direct, wrapped, canonical, and provider-opaque persisted turn items
  - id: conversation-b-fixture-tool-journal-items
    label: Repeated provider and canonical tool calls/results in turn and journal representations
  - id: conversation-b-fixture-queue-sidecar-directory
    label: Isolated temporary conversation directory with queue JSON sidecars
  - id: conversation-b-fixture-session-envelopes
    label: Typed and malformed transcript envelopes, tool activity, approvals, and background work
  - id: conversation-b-fixture-browser-transcripts
    label: Temporary scoped sessions with projected messages, malformed records, and pagination changes
  - id: conversation-b-fixture-streaming-state
    label: Streaming message state and mocked message/event-handler dependencies
  - id: conversation-b-fixture-message-lists
    label: Visible user, assistant, reasoning, command, and live-tail message arrays
contracts:
  - id: conversation-b-contract-turn-normalization-and-replay
    statement: Run items normalize across provider wrappers and identifier spellings, preserve meaningful metadata and opaque payloads, and project persisted assistant turns back into provider history without malformed reasoning or argument loss.
    seamIds:
      - conversation-b-seam-turn-normalization
    riskIds:
      - conversation-b-risk-provider-replay-invalidity
  - id: conversation-b-contract-journal-ledger-deduplication
    statement: Tool ledger reconstruction yields one completed execution and one ordered call/result history for duplicate journal or turn representations while preserving reasoning and provider item forms.
    seamIds:
      - conversation-b-seam-journal-ledger
    riskIds:
      - conversation-b-risk-ledger-reconstruction-drift
  - id: conversation-b-contract-queue-sidecar-durability
    statement: Session queue persistence loads absent state safely, atomically publishes complete records, removes temporary files, and quarantines invalid live sidecars.
    seamIds:
      - conversation-b-seam-queue-persistence
    riskIds:
      - conversation-b-risk-queue-sidecar-corruption
  - id: conversation-b-contract-session-audit-verdicts
    statement: Session audit distinguishes empty, settled, interrupted-turn, interrupted-tool, and awaiting-approval outcomes while exposing unfinished tools, background work, subagents, errors, and truncation.
    seamIds:
      - conversation-b-seam-session-audit
    riskIds:
      - conversation-b-risk-session-recovery-misclassification
  - id: conversation-b-contract-session-audit-persistence
    statement: Auditing real conversation logs agrees with persisted replay state and identifies missing sessions, unfinished tools, approval stalls, and clean settlement without mutating the log.
    seamIds:
      - conversation-b-seam-session-audit
    riskIds:
      - conversation-b-risk-session-recovery-misclassification
  - id: conversation-b-contract-session-browser-boundary
    statement: Session browsing enforces local/SSH project scope, resolves safe references, projects only public message data, reports unavailable records, and provides bounded coherent list/search/read pagination with invalidation-aware cursors.
    seamIds:
      - conversation-b-seam-session-browser
    riskIds:
      - conversation-b-risk-browser-data-leak-or-stale-read
  - id: conversation-b-contract-terminal-result-application
    statement: Applying a terminal response finalizes or appends exactly the unrepresented assistant text, merges command messages, skips empty output, and clears streaming bookkeeping consistently.
    seamIds:
      - conversation-b-seam-message-application
    riskIds:
      - conversation-b-risk-streamed-message-duplication
  - id: conversation-b-contract-compaction-event-presentation
    statement: Context compaction lifecycle events produce one truthful, duration-aware system notice and replace superseded start notices while failures remain visible.
    seamIds:
      - conversation-b-seam-streaming-event-projection
    riskIds:
      - conversation-b-risk-event-ui-drift
  - id: conversation-b-contract-reasoning-and-markdown-streaming
    statement: Reasoning and text deltas preserve accumulated content, finalize only stable markdown boundaries, protect code fences and whitespace, and flush live tails at tool/final boundaries.
    seamIds:
      - conversation-b-seam-streaming-event-projection
    riskIds:
      - conversation-b-risk-event-ui-drift
      - conversation-b-risk-streamed-message-duplication
  - id: conversation-b-contract-retry-event-presentation
    statement: Retry events render accurate provider-state, connection, authentication, exhaustion, and retryability messages without fake controls or misleading failure categories.
    seamIds:
      - conversation-b-seam-streaming-event-projection
    riskIds:
      - conversation-b-risk-event-ui-drift
  - id: conversation-b-contract-subagent-activity-projection
    statement: Subagent lifecycle and command events maintain one correctly linked live card, bounded tool history, terminal status, transfer/background semantics, and safe fallback reconciliation.
    seamIds:
      - conversation-b-seam-streaming-event-projection
    riskIds:
      - conversation-b-risk-event-ui-drift
  - id: conversation-b-contract-tool-event-lifecycle
    statement: Tool lifecycle events flush preceding output, render and transition command activity, reconcile completions by call identity, recover dropped work, and preserve authoritative final output.
    seamIds:
      - conversation-b-seam-streaming-event-projection
    riskIds:
      - conversation-b-risk-event-ui-drift
      - conversation-b-risk-streamed-message-duplication
  - id: conversation-b-contract-message-selection-and-rewind
    statement: Message helpers identify genuine undoable turns, retrieve the requested assistant response, merge commands without unsafe duplication, and align rewind UI items with opaque store targets and discard statistics.
    seamIds:
      - conversation-b-seam-message-utilities
    riskIds:
      - conversation-b-risk-message-rewind-drift
  - id: conversation-b-contract-message-buffer-and-frontier
    statement: Message buffering inserts notices before all live tails within its cap, and markdown frontier calculation returns absolute safe commit offsets without splitting code or reference structures.
    seamIds:
      - conversation-b-seam-message-utilities
    riskIds:
      - conversation-b-risk-message-rewind-drift
  - id: conversation-b-contract-conversation-formatting
    statement: Conversation utility helpers parse tool arguments, format supported tool commands, initialize independent streaming state, classify key errors, and render shell output with correct return-code semantics.
    seamIds:
      - conversation-b-seam-message-utilities
    riskIds:
      - conversation-b-risk-event-ui-drift
