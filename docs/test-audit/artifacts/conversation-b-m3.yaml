decisions:
  - id: conversation-b-conversation-turn-items-test-m3
    testId: conversation-b-conversation-turn-items-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Persisted assistant items and provider-opaque replay are a compatibility boundary with concrete regressions around reasoning, arguments, metadata, and compaction markers.
    evidence:
      - Lines 13-27 assert rawContent reasoning is captured rather than dropped during persistence.
      - Lines 80-127 assert standalone reasoning avoids duplicate reasoning_content, while lines 129-241 preserve encrypted reasoning, object arguments, and provider-native call/result metadata.
      - Lines 248-312 assert provider_opaque items retain their payload and marker and do not fall through to malformed reasoning.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-journal-to-ledger-test-m3
    testId: conversation-b-journal-to-ledger-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: The test protects recovery-specific deduplication across both turn items and journal events and deliberately checks three provider representations.
    evidence:
      - Lines 8-34 define wrapped, direct, and canonical call/result representations with the same logical call.
      - Lines 63-79 assert one completed ledger entry and exactly three retained history items after duplicate result input.
      - Lines 81-103 repeat the same invariant through assistant_journal_item envelopes, so journal and turn recovery cannot drift.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-queue-persistence-test-m3
    testId: conversation-b-queue-persistence-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: This focused filesystem test protects the queue sidecar durability contract with an isolated directory and checks both normal publish and invalid-state quarantine.
    evidence:
      - Lines 16-25 isolate the conversations directory and clean it after each operation.
      - Lines 36-46 assert a complete record can be loaded and its temporary publish file is removed.
      - Lines 49-59 assert quarantine removes the sidecar from the load path and leaves an invalid diagnostic file.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-run-item-normalizer-test-m3
    testId: conversation-b-run-item-normalizer-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Run-item normalization is a direct provider adapter boundary; its table spans wrappers, reasoning metadata, call-id variants, result spellings, opaque payloads, and unknown input.
    evidence:
      - Lines 4-48 assert direct and wrapped reasoning plus separation of assistant reasoning metadata.
      - Lines 50-140 cover function/apply-patch call variants, eleven result spellings, canonical items, wrapper precedence, and output preservation.
      - Lines 142-205 assert opaque cloning/idempotence, malformed opaque rejection, unknown-value rejection, and ordering of mixed normalized items.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-session-audit-persistence-test-m3
    testId: conversation-b-session-audit-persistence-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: These tests exercise the real log writer and persistence loader, complementing pure audit classification with a crash/recovery-facing filesystem proof.
    evidence:
      - Lines 20-30 establish an isolated temporary directory and restore the global test directory after cleanup.
      - Lines 37-52 write a complete user/tool/assistant transcript and assert a settled audit with a completed tool count.
      - Lines 54-75 write a transcript ending after dispatch and assert interrupted_mid_tool, the unfinished call, and matching aborted replay state; lines 78-91 cover approval waiting.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-session-audit-test-m3
    testId: conversation-b-session-audit-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: The pure audit suite owns the outcome precedence and bookkeeping matrix, including approval, interruption, unknown status, background tasks, and undo semantics.
    evidence:
      - Lines 25-111 assert empty, settled, interrupted-turn/tool, awaiting-approval precedence, and distinct unknown tool counting.
      - Lines 113-157 expose unfinished subagents/shells, errors, truncation, and agreement with replay's unpaid-call set.
      - Lines 159-208 cover formatted diagnostics, undo cleanup, transfer/interruption retirement, and failed/aborted tool counts.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-session-browser-test-m3
    testId: conversation-b-session-browser-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: SessionBrowser is a high-risk public retrieval boundary; the large matrix is cohesive and covers authorization, privacy, pagination, cursor invalidation, totals, and no-write behavior.
    evidence:
      - Lines 42-114 assert short-reference resolution, ambiguity, local/SSH scope, and scoped not-found diagnostics.
      - Lines 116-188 and 232-317 assert bounded public projections, hidden provider/tool fields, opaque cursor binding, malformed-record handling, and unavailable counts.
      - Lines 319-400 and 443-510 assert exact-once chunk recovery, snapshot reuse, scope/current-session rechecks, totals, tail reads, and invalid anchor combinations.
      - Lines 512-539 assert tiny-budget coherence and that browsing does not create persistence directories.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-apply-conversation-result-test-m3
    testId: conversation-b-apply-conversation-result-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: This focused suite guards the streamed-to-terminal result seam against duplicated assistant text, lost tails, empty output, and stale streaming state.
    evidence:
      - Lines 48-99 assert synchronous append and promotion of an existing live bot message without duplicate text.
      - Lines 101-162 cover flushed-prefix/tail finalization and the no-streaming-message no-append case.
      - Lines 164-202 assert command merge and whitespace-only suppression; lines 204-225 cover live-id lookup and complete state reset.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-conversation-event-handler-compaction-test-m3
    testId: conversation-b-conversation-event-handler-compaction-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Compaction notices are product-visible lifecycle output and the suite checks truthful formatting, replacement rather than stacking, and failure visibility.
    evidence:
      - Lines 15-91 assert start, token-count, measured-duration, zero-duration, no-count, and failure presentations.
      - Lines 93-117 assert repeated starts supersede one another and completion updates the existing notice.
      - Lines 119-159 assert in-place completion and that every supported compaction event reaches the transcript.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-conversation-event-handler-reasoning-test-m3
    testId: conversation-b-conversation-event-handler-reasoning-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Reasoning streaming has distinct mutable-tail and tool-boundary semantics; these tests verify state offsets and visible finalization rather than merely checking a callback.
    evidence:
      - Lines 7-51 assert accumulation after flushed positions and suppression of empty reasoning.
      - Lines 53-93 assert paragraph-boundary finalization versus an unfinished single paragraph.
      - Lines 95-183 cover text-boundary flushing, in-place replacement, trailing whitespace mutability, and state/cancellation effects.
      - Lines 185-211 assert a reasoning restart after a tool does not retain the prior prefix.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-conversation-event-handler-retry-test-m3
    testId: conversation-b-conversation-event-handler-retry-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Retry messaging is a user-facing error contract; the cases distinguish actionable exhaustion from authentication and provider-state versus connection failures.
    evidence:
      - Lines 15-36 assert exhausted retry output names the real /retry-turn mechanism and removes fake controls.
      - Lines 38-81 assert conversation-state rejection and connection interruption use distinct truthful language.
      - Lines 83-96 assert non-retryable authentication errors do not suggest retrying.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-conversation-event-handler-subagent-test-m3
    testId: conversation-b-conversation-event-handler-subagent-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: The file protects a valuable subagent-card contract, but at least one case title promises formatting behavior that the assertion explicitly says must not occur, reducing signal and obscuring the intended boundary.
    evidence:
      - Lines 571-597 title the case “formats shell command with args” but invoke only subagent_tool_started and assert tools remains []; no formatted command is asserted.
      - Lines 7-84 and 216-418 cover the actual lifecycle/linkage/transfer contract with concrete card state and tool-history assertions, so the candidate is a narrow case rewrite rather than deletion of the file.
      - Lines 860-966 separately assert repeated tool results and start-event suppression with observable outcomes, leaving the misleading case as redundant weak signal within this file.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-conversation-event-handler-text-delta-test-m3
    testId: conversation-b-conversation-event-handler-text-delta-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Text streaming is a distinct high-value presentation seam from reasoning streaming; the cases protect code fences, paragraph commits, live replacement, and whitespace boundaries.
    evidence:
      - Lines 7-48 assert code-fence-safe splitting and preservation of the language-line newline.
      - Lines 50-138 assert stable paragraph/heading commits and atomic finalized-prefix/live-suffix replacement.
      - Lines 140-229 assert no premature finalization, existing-live finalization, trailing-whitespace mutability, and leading-whitespace preservation through final output.
    replacementTestIds: []
    status: proposed
  - id: conversation-b-conversation-event-handler-tools-test-m3
    testId: conversation-b-conversation-event-handler-tools-test
    role: second_opinion
    reviewer: conversation-b-m3
    sourceArtifact: docs/test-audit/artifacts/conversation-b-m3.yaml
    recommendation: architecture_signal
    confidence: high
    reason: This broad handler suite covers the critical tool lifecycle, but three explicit regression cases document unresolved production behavior rather than waste; they should drive a handler fix or a deliberate contract rewrite before cleanup.
    evidence:
      - Lines 7-329 assert text/reasoning flush, pending/running transitions, argument formatting, subagent distinctions, duplicate-start suppression, and completion reconciliation.
