decisions:
  - id: entrypoints-build-output-e2e-test-entrypoints-a-m3
    testId: entrypoints-build-output-e2e-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: retier_candidate
    confidence: high
    reason: The assertion protects real build-command wiring, but the e2e-class file is included by the default Vitest glob rather than only the explicit e2e command.
    evidence:
      - scripts/build-output.e2e.test.ts:4-8 reads package scripts and asserts build and build:restore use rollback/restore implementations.
      - vitest.config.ts:5-11 includes scripts/**/*.test.ts in the default configuration, so this .e2e file is eligible for the unit invocation.
      - package.json:54-58 defines both the broad test command and a separate test:e2e suffix filter.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-dynamic-workspace-rpc-test-entrypoints-a-m3
    testId: entrypoints-dynamic-workspace-rpc-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The live Unix-socket RPC test complements registry unit coverage by pinning v1 route/DTO compatibility and HTTP error mapping across the gateway boundary.
    evidence:
      - source/gateway/dynamic-workspace-rpc.test.ts:28-55 constructs signed HTTP requests to the three workspace-candidate routes.
      - source/gateway/dynamic-workspace-rpc.test.ts:89-128 asserts validate/browse/select status and public DTO redaction while preserving the binding on selection.
      - source/gateway/dynamic-workspace-rpc.test.ts:130-160 asserts ownership, expiry, and malformed input map to safe 403/404/400 errors.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-gateway-test-entrypoints-a-m3
    testId: entrypoints-gateway-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: rewrite_candidate
    confidence: high
    reason: The contracts are high-risk and well asserted, but one 2031-line file combines startup/auth, RPC/projection, workspace admission, persistence/recovery, worker isolation, logging, and lifecycle; splitting by boundary would improve failure localization without discarding evidence.
    evidence:
      - source/gateway/gateway.test.ts:300-1597 combines startup, transport/RPC, public projection, interaction resolution, recovery, and replay-ledger scenarios.
      - source/gateway/gateway.test.ts:1600-1768 contains a separate workspace-admission block with ownership, path, policy, and dynamic-grant behavior.
      - source/gateway/gateway.test.ts:1771-1887 contains a separate compaction/cursor restart scenario.
      - source/gateway/gateway.test.ts:1890-2029 contains worker-boundary, safe-logging, and lifecycle scenarios.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-interaction-protocol-test-entrypoints-a-m3
    testId: entrypoints-interaction-protocol-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This pure protocol test is a strong focused complement to the gateway route tests, covering redaction, choice authority, revision semantics, multi-select validation, and fail-closed DTO shape.
    evidence:
      - source/gateway/interaction-protocol.test.ts:29-93 asserts safe ordinary projection, variant choice sets, and sensitive denied-read redaction.
      - source/gateway/interaction-protocol.test.ts:95-137 asserts stable ask_user revisions, terminal mappings, check-in outcomes, and option validation.
      - source/gateway/interaction-protocol.test.ts:139-174 asserts nested text redaction and rejection of malformed/private DTO data.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-compatibility-retirement-guard-test-entrypoints-a-m3
    testId: entrypoints-compatibility-retirement-guard-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This repository-wide static guard enforces absence of explicitly retired runner infrastructure, a negative contract that ordinary runtime tests cannot establish.
    evidence:
      - source/compatibility-retirement.guard.test.ts:5-13 defines the forbidden retired runner names.
      - source/compatibility-retirement.guard.test.ts:15-29 recursively selects production TypeScript while excluding test files.
      - source/compatibility-retirement.guard.test.ts:32-40 scans every selected production file and requires zero violations.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-core-boundary-test-entrypoints-a-m3
    testId: entrypoints-core-boundary-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The test protects a high-impact architectural boundary through both static dependency traversal and a side-effect probe; no assigned sibling covers core imports.
    evidence:
      - source/core/core-boundary.test.ts:138-177 traverses value imports from the core entry and rejects CLI/presentation modules.
      - source/core/core-boundary.test.ts:180-241 imports core while asserting no writes, exits, listeners, or filesystem state changes.
      - source/core/core-boundary.test.ts:243-252 pins the runtime factory's core import and excludes the CLI log writer.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-awaitable-runtime-events-test-entrypoints-a-m3
    testId: entrypoints-awaitable-runtime-events-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This focused ServerSession boundary test proves critical event publication waits for persistence, preserves order, latches failures, and reaches a real journal durability boundary.
    evidence:
      - source/gateway/awaitable-runtime-events.test.ts:87-108 asserts publication remains blocked until the persistence promise resolves.
      - source/gateway/awaitable-runtime-events.test.ts:110-138 asserts ordered approval/final delivery and interrupted status after persistence rejection.
      - source/gateway/awaitable-runtime-events.test.ts:140-190 uses createGatewayEventJournal and critical appends, then asserts subscribers observe persisted events in order.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-dynamic-workspace-registry-test-entrypoints-a-m3
    testId: entrypoints-dynamic-workspace-registry-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Registry-focused filesystem scenarios cover canonical validation, symlink escape, opaque browse tokens, owner isolation, quotas, expiration, selection, and restart-sensitive bindings without relying on RPC setup.
    evidence:
      - source/gateway/dynamic-workspace-registry.test.ts:29-92 asserts valid opaque validation and fail-closed missing/file/outside/permission cases.
      - source/gateway/dynamic-workspace-registry.test.ts:94-141 asserts opaque child tokens, owner checks, symlink rejection, and token cleanup after replacement.
      - source/gateway/dynamic-workspace-registry.test.ts:143-184 asserts candidate/token quotas and TTL expiry.
      - source/gateway/dynamic-workspace-registry.test.ts:186-212 asserts canonical selection and candidate expiration.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-app-startup-banner-test-entrypoints-a-m3
    testId: entrypoints-app-startup-banner-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: consolidation_candidate
    confidence: high
    reason: The file repeats the exact stable-ID assertions already provided by entrypoints-app-helpers-test, which is the broader helper boundary test.
    evidence:
      - source/app.startup-banner.test.ts:4-10 asserts the two stable-ID sequences for appendStartupBannerId.
      - source/app-helpers.test.ts:27-35 asserts the same two sequences for the same exported function.
      - Both assigned files import appendStartupBannerId from source/app-helpers.js, so the named sibling can carry this contract.
    replacementTestIds: [entrypoints-app-helpers-test]
    status: proposed
  - id: entrypoints-app-test-entrypoints-a-m3
    testId: entrypoints-app-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The App-level React scenarios exercise cross-hook routing and state transitions that are not duplicated by the focused navigation file, including rollover, approvals, admission, debouncing, mode confirmation, and StrictMode cleanup.
    evidence:
      - source/app.test.tsx:390-596 asserts rollover settlement, conversation remounting, approval-wait submission, StrictMode network approval, and rejection routing.
      - source/app.test.tsx:598-827 asserts slash-command routing, skill attachment, admission intents, stale/declined confirmations, composer clearing, and error propagation.
      - source/app.test.tsx:848-977 asserts debounced large-input advisory behavior and processing-state suppression.
      - source/app.test.tsx:980-1063 asserts mode confirmation/decline effects and background-task terminal title rendering.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-cli-e2e-test-entrypoints-a-m3
    testId: entrypoints-cli-e2e-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: retier_candidate
    confidence: high
    reason: The process-level terminal smoke test is correctly classified as e2e but default Vitest discovery includes it; the repository also exposes an explicit e2e script.
    evidence:
      - source/cli.e2e.test.ts:8-15 documents cold-start cost and assigns a 600000ms e2e test budget.
      - source/cli.e2e.test.ts:36-61 spawns node/tsx, waits for first paint and harness idle, sends Ctrl+C, and asserts clean exit/output.
      - vitest.config.ts:5-11 includes source/**/*.{test,spec}.{ts,tsx} in the default invocation.
      - package.json:54-58 defines broad test and suffix-filtered test:e2e commands.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-cli-integration-test-entrypoints-a-m3
    testId: entrypoints-cli-integration-test
    role: second_opinion
    reviewer: entrypoints-a-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-a-m3.yaml
    recommendation: retier_candidate
    confidence: high
    reason: The compiled-CLI subprocess and filesystem scenarios are integration evidence, yet the default Vitest glob runs them alongside unit tests; they should have an explicit integration tier or filter.
    evidence:
      - source/cli.integration.test.ts:13-49 compiles the CLI into a cache and launches the compiled process, rather than testing a pure function.
      - source/cli.integration.test.ts:64-219 asserts real child-process help, conversation listing, project scoping, and missing-resume behavior.
      - source/cli.integration.test.ts:221-335 asserts home/root safety prompts and configured custom-provider admission through the process boundary.
      - vitest.config.ts:5-11 includes all source test files by default, while package.json:54-62 shows no dedicated integration command for this path.
    replacementTestIds: []
    status: proposed
