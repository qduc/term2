schemaVersion: 2
domains:
  - id: entrypoints
    label: App/CLI/gateway entrypoints and build-script surfaces
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Vitest integration suite
  - id: e2e
    label: Vitest end-to-end suite
seams:
  - id: entrypoints-a-build-artifact-transaction
    label: Build output replacement, backup, rollback, and restore boundary.
  - id: entrypoints-a-candidate-gate-boundary
    label: Candidate CLI argument, scope, bounded-output, gate, and exit-report boundary.
  - id: entrypoints-a-release-cli-boundary
    label: Release shell command argument validation and non-interactive policy boundary.
  - id: entrypoints-a-audit-graph-schema
    label: Test-audit graph parsing, merging, querying, and report boundary.
  - id: entrypoints-a-agent-definition-composition
    label: Agent prompt, environment, and conditional tool-surface composition boundary.
  - id: entrypoints-a-app-interaction-routing
    label: React App submission, approval, rollover, mode, and terminal-effect routing boundary.
  - id: entrypoints-a-cli-process-entrypoint
    label: CLI process startup, options, resume, safety prompts, and provider selection boundary.
  - id: entrypoints-a-core-module-boundary
    label: Core entry import graph and side-effect-free runtime-factory boundary.
  - id: entrypoints-a-gateway-trust-boundary
    label: Gateway startup, assertion authentication, RPC validation, and public projection boundary.
  - id: entrypoints-a-workspace-admission
    label: Workspace candidate validation, ownership, path, quota, and grant admission boundary.
  - id: entrypoints-a-gateway-interaction-persistence
    label: Gateway interaction resolution, durable event ordering, projection, and cursor boundary.
  - id: entrypoints-a-gateway-runtime-lifecycle
    label: Gateway worker isolation, provider readiness, logging, and shutdown lifecycle boundary.
  - id: entrypoints-a-test-suite-placement
    label: Vitest configuration and package-script separation of unit, integration, and e2e execution.
risks:
  - id: entrypoints-a-stale-build-or-lost-rollback
    label: Obsolete output survives a build or a failed build destroys the last recoverable artifact.
    severity: high
  - id: entrypoints-a-unsafe-candidate-execution
    label: Candidate validation accepts an unsafe path/command or emits an unbounded report.
    severity: high
  - id: entrypoints-a-unsafe-release-invocation
    label: Release mode ambiguity permits an unintended push or an unsafe repository operation.
    severity: high
  - id: entrypoints-a-audit-reference-corruption
    label: Invalid graph references or conflicting merged evidence silently enter audit decisions.
    severity: medium
  - id: entrypoints-a-agent-capability-drift
    label: A mode, model, execution context, or prompt input exposes the wrong agent capability.
    severity: high
  - id: entrypoints-a-app-turn-routing-loss
    label: User input, approval, admission, rollover, or terminal state is routed to the wrong owner.
    severity: high
  - id: entrypoints-a-cli-startup-regression
    label: CLI options, resume behavior, safety confirmation, or configured provider startup regresses.
    severity: high
  - id: entrypoints-a-core-import-side-effect
    label: Importing core unexpectedly reaches presentation/CLI code or mutates process/filesystem state.
    severity: critical
  - id: entrypoints-a-gateway-boundary-leak
    label: Gateway trust, workspace, credential, or private implementation data crosses a public boundary.
    severity: critical
  - id: entrypoints-a-workspace-admission-bypass
    label: An unowned, escaped, stale, or unauthorized workspace becomes selectable or executable.
    severity: critical
  - id: entrypoints-a-interaction-durability-loss
    label: An interaction/event is published out of order, resolved incorrectly, or lost across recovery.
    severity: critical
  - id: entrypoints-a-gateway-resource-leak
    label: Gateway workers, child processes, journals, or lifecycle handles survive shutdown incorrectly.
    severity: high
  - id: entrypoints-a-wrong-test-tier
    label: Slow process-spawning integration/e2e evidence runs in the default unit invocation.
    severity: medium
fixtures: []
contracts:
  - id: entrypoints-a-build-rollback
    statement: A successful build removes obsolete compiled modules, publishes fresh output, and retains the previous output for recovery unless backup is disabled; a failed build restores the previous output or reports that none existed.
    seamIds: [entrypoints-a-build-artifact-transaction]
    riskIds: [entrypoints-a-stale-build-or-lost-rollback]
  - id: entrypoints-a-candidate-gates-safe-report
    statement: Candidate-gate input accepts only supported gates and safe repository-relative arguments, executes allowed gates in order after scope checks, and returns stable classifications without invoking gates on scope or contract failure.
    seamIds: [entrypoints-a-candidate-gate-boundary]
    riskIds: [entrypoints-a-unsafe-candidate-execution]
  - id: entrypoints-a-candidate-gates-bounded-output
    statement: Candidate-gate text, files, evidence, JSON, and streamed child output remain within configured byte bounds while preserving valid UTF-8 and required classification fields.
    seamIds: [entrypoints-a-candidate-gate-boundary]
    riskIds: [entrypoints-a-unsafe-candidate-execution]
  - id: entrypoints-a-release-argument-policy
    statement: The release CLI documents its non-interactive and local-publish paths and rejects ambiguous push/version combinations before repository work begins.
    seamIds: [entrypoints-a-release-cli-boundary]
    riskIds: [entrypoints-a-unsafe-release-invocation]
  - id: entrypoints-a-audit-graph-integrity
    statement: Audit graph parsing accepts resolving typed references and rejects duplicate records, invalid granularity, unnamespaced test IDs, unsafe deletion proposals, and conflicting merged vocabulary definitions.
    seamIds: [entrypoints-a-audit-graph-schema]
    riskIds: [entrypoints-a-audit-reference-corruption]
  - id: entrypoints-a-agent-definition-surface
    statement: Agent definition exposes only the tools, prompt guidance, memory/session context, and editing/search capabilities permitted by model, mode, dependency, and execution context.
    seamIds: [entrypoints-a-agent-definition-composition]
    riskIds: [entrypoints-a-agent-capability-drift]
  - id: entrypoints-a-app-submit-and-effects
    statement: App routes submissions, approvals, command outcomes, admission confirmations, rollover, mode confirmation, and background-task title effects to the correct collaborators while preserving composer and terminal state.
    seamIds: [entrypoints-a-app-interaction-routing]
    riskIds: [entrypoints-a-app-turn-routing-loss]
  - id: entrypoints-a-cli-startup-and-resume
    statement: The CLI starts in the requested mode, documents supported options, lists or rejects conversation resume targets safely, prompts before risky home/root startup, and accepts configured providers before upstream execution.
    seamIds: [entrypoints-a-cli-process-entrypoint]
    riskIds: [entrypoints-a-cli-startup-regression]
  - id: entrypoints-a-core-import-purity
    statement: Importing the core entry exposes the runtime factory without importing CLI/presentation modules, writing output, exiting, changing listeners, or creating filesystem state.
    seamIds: [entrypoints-a-core-module-boundary]
    riskIds: [entrypoints-a-core-import-side-effect]
  - id: entrypoints-a-suite-tier-separation
    statement: Package scripts and Vitest configuration identify all test files, pin test environment setup, and provide an explicit e2e path while the default invocation currently includes e2e and integration-class files.
    seamIds: [entrypoints-a-test-suite-placement]
    riskIds: [entrypoints-a-wrong-test-tier]
  - id: entrypoints-a-gateway-auth-and-public-contract
    statement: Gateway startup fails closed without trust prerequisites; authenticated RPCs enforce route, claim, method, field, size, and transport rules and expose only safe public projections and errors.
    seamIds: [entrypoints-a-gateway-trust-boundary]
    riskIds: [entrypoints-a-gateway-boundary-leak]
  - id: entrypoints-a-workspace-candidate-safety
    statement: Workspace candidates and grants remain canonical, owner-bound, opaque, bounded, expiry-aware, path-safe, and fail closed when permissions, mounts, versions, or write policy are invalid.
    seamIds: [entrypoints-a-workspace-admission]
    riskIds: [entrypoints-a-workspace-admission-bypass]
  - id: entrypoints-a-interaction-protocol-safety
    statement: Pending interactions expose stable opaque identities and revisions, authoritative choices and answers, redacted descriptors, and fail-closed validation and resolution semantics.
    seamIds: [entrypoints-a-gateway-interaction-persistence]
    riskIds: [entrypoints-a-gateway-boundary-leak, entrypoints-a-interaction-durability-loss]
  - id: entrypoints-a-durable-event-and-recovery
    statement: Critical gateway events publish only after durable append in order, interaction outcomes and queued aborts settle exactly once, and projections/cursors report restart and compaction state accurately.
    seamIds: [entrypoints-a-gateway-interaction-persistence]
    riskIds: [entrypoints-a-interaction-durability-loss]
  - id: entrypoints-a-worker-and-shutdown-safety
    statement: Gateway worker environments exclude ambient secrets, sessions remain isolated and require provider/sandbox readiness, safe logging rejects private data, and shutdown drains resources and rejects new work.
    seamIds: [entrypoints-a-gateway-runtime-lifecycle]
    riskIds: [entrypoints-a-gateway-resource-leak, entrypoints-a-gateway-boundary-leak]
  - id: entrypoints-a-cli-input-parsing
    statement: Raw CLI input is classified as a message or slash command with the expected command name and normalized argument text, including empty and spaced arguments.
    seamIds: [entrypoints-a-cli-process-entrypoint]
    riskIds: [entrypoints-a-cli-startup-regression]
  - id: entrypoints-a-retired-infrastructure-absence
    statement: Production source contains none of the explicitly retired runner infrastructure names.
    seamIds: [entrypoints-a-core-module-boundary]
    riskIds: [entrypoints-a-core-import-side-effect]
