schemaVersion: 2
domains:
  - id: entrypoints
    label: App/CLI/gateway entrypoints and support surfaces
suites:
  - id: unit
    label: Focused Vitest unit suite
  - id: integration
    label: Vitest integration suite with filesystem or gateway transport boundaries
seams:
  - id: entrypoints-b1-launcher-snapshot
    label: Launcher settings authority to immutable session settings snapshot
  - id: entrypoints-b1-model-list-route
    label: Authenticated gateway model-list route to provider catalog DTOs
  - id: entrypoints-b1-pairing-store
    label: OTP pairing bootstrap to durable trusted-client public keys
  - id: entrypoints-b1-persistence-journal
    label: Gateway durable journal, checkpoints, projections, and recovery
  - id: entrypoints-b1-runtime-factory
    label: Session binding to isolated gateway runtime object graph
  - id: entrypoints-b1-server-transport
    label: Unix-socket or TLS HTTP transport to authenticated RPC handlers
  - id: entrypoints-b1-settings-rpc
    label: Settings authority to secret-free browser RPC projection and writes
  - id: entrypoints-b1-workspace-probe
    label: Canonical workspace path and OS access checks to boundary evidence
risks:
  - id: entrypoints-b1-risk-secret-crossing
    label: Gateway DTOs or worker settings disclose credentials or sensitive host metadata
    severity: critical
  - id: entrypoints-b1-risk-unauthorized-control
    label: An unauthenticated, unpaired, or wrong-owner client reaches gateway control operations
    severity: critical
  - id: entrypoints-b1-risk-pairing-replay
    label: OTP or trusted-client state can be replayed, forged, or persisted unsafely
    severity: high
  - id: entrypoints-b1-risk-recovery-corruption
    label: Restart or torn persistence loses events, reuses sequences, or republishes actionable work
    severity: critical
  - id: entrypoints-b1-risk-session-isolation
    label: Sessions share mutable state or escape their admitted workspace and resource limits
    severity: critical
  - id: entrypoints-b1-risk-transport-protocol
    label: Transport parsing, method/media gates, streaming, or TLS client authentication diverges from protocol
    severity: high
  - id: entrypoints-b1-risk-settings-mutation
    label: Settings writes bypass allowlists, revision conflicts, atomic persistence, or environment ownership
    severity: high
  - id: entrypoints-b1-risk-boundary-overclaim
    label: A symlink swap, non-directory, or OS write denial is treated as a safe writable workspace
    severity: critical
fixtures:
  - id: entrypoints-b1-fixture-settings-authority
    label: In-memory settings authority with source and persistence methods
  - id: entrypoints-b1-fixture-assertion-keypair
    label: RSA assertion key pair and signed gateway claims
  - id: entrypoints-b1-fixture-temp-gateway-root
    label: Temporary filesystem root for gateway state and Unix socket
  - id: entrypoints-b1-fixture-provider-catalog
    label: Registered provider returning a safe model catalog
  - id: entrypoints-b1-fixture-tls-material
    label: Temporary CA, server, and client certificates for mutual TLS
  - id: entrypoints-b1-fixture-persistence-journal
    label: Temporary durable journal, index, checkpoint, and transcript files
  - id: entrypoints-b1-fixture-runtime-client
    label: Fake conversation client and controllable agent streams
  - id: entrypoints-b1-fixture-boundary-filesystem
    label: Injectable filesystem methods for canonical and access checks
contracts:
  - id: entrypoints-b1-contract-session-snapshot
    statement: A session settings snapshot contains selected non-secret settings, freezes policy data, and does not copy credentials.
    seamIds:
      - entrypoints-b1-launcher-snapshot
    riskIds:
      - entrypoints-b1-risk-secret-crossing
      - entrypoints-b1-risk-session-isolation
  - id: entrypoints-b1-contract-model-list-redaction
    statement: An authenticated model-list request returns provider model metadata while omitting credential material and provider failures do not disclose secrets.
    seamIds:
      - entrypoints-b1-model-list-route
    riskIds:
      - entrypoints-b1-risk-secret-crossing
      - entrypoints-b1-risk-unauthorized-control
  - id: entrypoints-b1-contract-pairing-bootstrap
    statement: Pairing accepts one valid six-digit OTP with an RSA public key, persists only normalized public-key trust, and rejects OTP reuse or invalid keys.
    seamIds:
      - entrypoints-b1-pairing-store
    riskIds:
      - entrypoints-b1-risk-pairing-replay
      - entrypoints-b1-risk-secret-crossing
  - id: entrypoints-b1-contract-pairing-attempt-policy
    statement: Pairing expires OTPs, regenerates them after the configured failed-attempt limit, and fails closed on corrupt trust state.
    seamIds:
      - entrypoints-b1-pairing-store
    riskIds:
      - entrypoints-b1-risk-pairing-replay
      - entrypoints-b1-risk-unauthorized-control
  - id: entrypoints-b1-contract-admission-idempotency
    statement: Gateway message admission does not persist an accepted record when runtime preparation rejects, and persisted request identities distinguish replay from body conflict.
    seamIds:
      - entrypoints-b1-persistence-journal
    riskIds:
      - entrypoints-b1-risk-recovery-corruption
  - id: entrypoints-b1-contract-journal-durability
    statement: Durable journal appends are persisted before publication, preserve high-water sequence across reopen, reject unsafe or foreign events, and require reload for compacted cursors.
    seamIds:
      - entrypoints-b1-persistence-journal
    riskIds:
      - entrypoints-b1-risk-recovery-corruption
      - entrypoints-b1-risk-secret-crossing
  - id: entrypoints-b1-contract-recovery-settlement
    statement: Restart recovery sanitizes pending interactions, emits one non-actionable recovery fact, repairs or rejects malformed persistence, and reconciles accepted work without rerunning providers.
    seamIds:
      - entrypoints-b1-persistence-journal
    riskIds:
      - entrypoints-b1-risk-recovery-corruption
      - entrypoints-b1-risk-secret-crossing
  - id: entrypoints-b1-contract-projection-retention
    statement: Session projections reconstruct bounded command statuses and interaction state while retention evicts only eligible closed sessions under its lock.
    seamIds:
      - entrypoints-b1-persistence-journal
    riskIds:
      - entrypoints-b1-risk-recovery-corruption
  - id: entrypoints-b1-contract-runtime-isolation
    statement: RuntimeFactory creates distinct session resources rooted at each admitted canonical workspace and passes secret-free, gateway-scoped client settings.
    seamIds:
      - entrypoints-b1-runtime-factory
    riskIds:
      - entrypoints-b1-risk-session-isolation
      - entrypoints-b1-risk-secret-crossing
  - id: entrypoints-b1-contract-runtime-admission-limits
    statement: RuntimeFactory validates bindings and resource limits, separates prepare from commit, rejects duplicate or wrong-session commits, and closes admission after disposal.
    seamIds:
      - entrypoints-b1-runtime-factory
    riskIds:
      - entrypoints-b1-risk-session-isolation
      - entrypoints-b1-risk-recovery-corruption
  - id: entrypoints-b1-contract-runtime-lifecycle
    statement: Cancellation that cannot be proven settles a session as interrupted, queued work advances correctly, and background task state maps to running or awaiting interaction.
    seamIds:
      - entrypoints-b1-runtime-factory
    riskIds:
      - entrypoints-b1-risk-session-isolation
      - entrypoints-b1-risk-recovery-corruption
  - id: entrypoints-b1-contract-transport-gates
    statement: Gateway transport authenticates before handler routing, parses JSON, propagates methods URLs and correlation IDs, and rejects invalid methods, media, correlation IDs, and oversized requests.
    seamIds:
      - entrypoints-b1-server-transport
    riskIds:
      - entrypoints-b1-risk-unauthorized-control
      - entrypoints-b1-risk-transport-protocol
  - id: entrypoints-b1-contract-transport-tls-stream
    statement: TLS transport requires configured client certificates when enabled, still verifies assertions, and streams event responses without an out-of-band DONE sentinel.
    seamIds:
      - entrypoints-b1-server-transport
    riskIds:
      - entrypoints-b1-risk-unauthorized-control
      - entrypoints-b1-risk-transport-protocol
  - id: entrypoints-b1-contract-settings-projection
    statement: Settings RPC exposes safe values and metadata without credential material, reports credential status without values, and identifies session versus global scope.
    seamIds:
      - entrypoints-b1-settings-rpc
    riskIds:
      - entrypoints-b1-risk-secret-crossing
      - entrypoints-b1-risk-settings-mutation
  - id: entrypoints-b1-contract-settings-mutation
    statement: Settings RPC accepts only persistable keys at the expected revision and requires one saved atomic batch result, otherwise it reports a typed failure without advancing the projection.
    seamIds:
      - entrypoints-b1-settings-rpc
    riskIds:
      - entrypoints-b1-risk-settings-mutation
  - id: entrypoints-b1-contract-credential-ownership
    statement: Credential set and delete are write-only, reject inherited environment credentials as non-writable, and return only secret-free status.
    seamIds:
      - entrypoints-b1-settings-rpc
    riskIds:
      - entrypoints-b1-risk-secret-crossing
      - entrypoints-b1-risk-settings-mutation
  - id: entrypoints-b1-contract-workspace-boundary
    statement: Workspace probing requires the requested path to be its canonical readable directory and reports physical write capability separately from launcher write policy.
    seamIds:
      - entrypoints-b1-workspace-probe
    riskIds:
      - entrypoints-b1-risk-boundary-overclaim
