decisions:
  - id: entrypoints-launcher-seam-test-entrypoints-b1-m3
    testId: entrypoints-launcher-seam-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The two cases directly protect the launcher boundary's secret-free snapshot and mutable-policy isolation; no assigned sibling carries this contract.
    evidence:
      - source/gateway/launcher-seam.test.ts:11-38 asserts selected settings, default policy fields, freezing, and credential omission.
      - source/gateway/launcher-seam.test.ts:41-50 mutates the caller policy after capture and verifies the snapshot remains isolated.
      - source/gateway/launcher-seam.ts:8-10 documents that credentials remain launcher-owned and are not copied across the worker/browser boundary.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-model-list-test-entrypoints-b1-m3
    testId: entrypoints-model-list-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the only assigned end-to-end model-list route check, combining authenticated gateway wiring, the real settings authority, provider catalog loading, and DTO redaction.
    evidence:
      - source/gateway/model-list.test.ts:39-91 registers a provider, builds a manifest and real Term2Gateway, starts its Unix socket, and sends a signed model_list request.
      - source/gateway/model-list.test.ts:101-108 asserts the returned provider/model metadata and absence of apiKey material.
      - source/gateway/gateway.ts:490-528 constructs the redacted model DTO and omits provider failures from the response.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-pairing-test-entrypoints-b1-m3
    testId: entrypoints-pairing-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file covers durable trusted-client storage, OTP lifecycle and key validation, plus assertion verification; the assigned server sibling checks only the HTTP bootstrap route.
    evidence:
      - source/gateway/pairing.test.ts:28-53 verifies six-digit OTP generation, public-key-only persistence, restrictive file mode, and single-use registration.
      - source/gateway/pairing.test.ts:55-79 verifies failed-attempt regeneration and expiry with injected time.
      - source/gateway/pairing.test.ts:81-129 verifies malformed/private/non-RSA rejection and that paired keys enter assertion verification while unpaired keys fail.
      - source/gateway/pairing.test.ts:131-136 verifies corrupt trust state fails closed; the route-level sibling is source/gateway/server.test.ts:360-407.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-persistence-recovery-matrix-test-entrypoints-b1-m3
    testId: entrypoints-persistence-recovery-matrix-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: >-
      The restart boundary and sanitization assertions are valuable, but the named no-work-rerun claim is not exercised against a provider or tool: the test increments a synthetic counter by zero. Rewrite should inject an observable runtime spy while retaining the sequence and recovery checks.
    evidence:
      - source/gateway/persistence-recovery-matrix.test.ts:41-89 verifies one recovered interaction fact, checkpoint clearing, and no duplicate recovery publication.
      - source/gateway/persistence-recovery-matrix.test.ts:91-127 verifies recovery publication re-sanitizes checkpoint DTO text.
      - source/gateway/persistence-recovery-matrix.test.ts:129-217 enumerates eight restart boundaries and checks sequence continuity, but lines 201-215 only use providerRuns.count += 0 rather than invoking a provider/tool.
      - source/gateway/persistence.test.ts:218-244 is the named assigned sibling for pending-interaction recovery; it does not replace this matrix's boundary coverage.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-persistence-test-entrypoints-b1-m3
    testId: entrypoints-persistence-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: This broad persistence integration suite protects admission atomicity, journal durability and sanitization, projection/replay behavior, retention, and startup reconciliation; its overlap with the matrix is complementary rather than a demonstrated duplicate.
    evidence:
      - source/gateway/persistence.test.ts:26-133 verifies rejected admission is not persisted, replay/body-conflict distinction, owner scoping, bounded pages, and hashed paths.
      - source/gateway/persistence.test.ts:136-194 verifies append-before-publish, durable high-water reopen, compacted-cursor reload, and unsafe/foreign event rejection.
      - source/gateway/persistence.test.ts:196-244 and 322-455 verify checkpoint recovery and malformed/torn/duplicate persistence handling.
      - source/gateway/persistence.test.ts:457-645 verifies projection cursor/replay, command statuses, live interaction generation, and closed-session retention.
      - source/gateway/persistence.test.ts:647-830 verifies binding fingerprint privacy, foreign-key conflicts, and idempotent startup admission reconciliation.
      - source/gateway/persistence-recovery-matrix.test.ts:129-217 is the assigned sibling's boundary matrix; it does not cover this file's admission, projection, retention, and repair breadth.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-runtime-factory-test-entrypoints-b1-m3
    testId: entrypoints-runtime-factory-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The suite exercises the runtime factory's security and lifecycle seam through distinct sessions, injected clients, queue leases, cancellation, and background status rather than merely testing a helper.
    evidence:
      - source/gateway/runtime-factory.test.ts:87-115 verifies distinct resource graphs, canonical roots, immutable binding, invalid-root rejection, and policy validation.
      - source/gateway/runtime-factory.test.ts:117-217 verifies prepare/commit/cancel separation, lease expiry, duplicate sessions, wrong-session commits, provider/shell limits, and secret-free client inputs.
      - source/gateway/runtime-factory.test.ts:219-322 verifies unproven cancellation becomes interrupted/closed and queued turns advance while preserving session state.
      - source/gateway/runtime-factory.test.ts:324-383 verifies background task statuses map to running, awaiting_interaction, and idle.
      - source/gateway/runtime-factory.ts:185-189 and 220-258 define the per-session ownership and binding/composition boundary exercised by these cases.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-server-test-entrypoints-b1-m3
    testId: entrypoints-server-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: These real transport tests protect protocol behavior at the HTTP server boundary, including Unix sockets, mutual TLS, assertion ordering, JSON/media gates, and event streaming; pairing coverage here is route-specific.
    evidence:
      - source/gateway/server.test.ts:198-250 verifies GET/POST/DELETE routing, URL/body/correlation propagation, unsupported method rejection, and handler invocation.
      - source/gateway/server.test.ts:252-314 verifies malformed correlation rejection, SSE content type and no DONE sentinel, and unsupported media rejection.
      - source/gateway/server.test.ts:317-357 generates certificates and verifies client-certificate enforcement independently from gateway assertion verification.
      - source/gateway/server.test.ts:360-407 verifies OTP-only pairing bootstrap bypasses assertion verification and rejects OTP reuse.
      - source/gateway/server.ts:154-227 implements authentication-before-routing, protocol gates, bounded JSON parsing, and streaming dispatch.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-settings-gateway-rpc-test-entrypoints-b1-m3
    testId: entrypoints-settings-gateway-rpc-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the only assigned route-level settings integration test and verifies owner authorization, projection redaction, revision conflict mapping, credential mutation, and OAuth status through Term2Gateway.
    evidence:
      - source/gateway/settings-gateway-rpc.test.ts:59-120 wires a real settings authority, manifest, signed assertions, and Unix-socket Term2Gateway.
      - source/gateway/settings-gateway-rpc.test.ts:122-157 verifies wrong-owner denial, secret-free read, write conflict/allowlist outcomes, write-only credentials, and OAuth login/select responses.
      - source/gateway/settings-gateway-rpc.test.ts:160-185 verifies missing local owner fails closed with settings_forbidden.
      - source/gateway/gateway.ts:407-408 applies local-owner authorization before settings operations, while lines 610-640 map projection and mutation RPCs.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-settings-rpc-test-entrypoints-b1-m3
    testId: entrypoints-settings-rpc-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The focused unit suite exhaustively checks projection secrecy, scope metadata, revision and persistence policy, environment ownership, and atomic batch delegation; the gateway sibling provides distinct route wiring evidence.
    evidence:
      - source/gateway/settings-rpc.test.ts:38-58 verifies safe-key projection, credential metadata without values, and session/global scope.
      - source/gateway/settings-rpc.test.ts:60-78 verifies stale revision rejection, persistent-key allowlisting, and secret-free credential set/delete.
      - source/gateway/settings-rpc.test.ts:80-125 verifies environment credentials are non-writable and unsaved transactions fail closed.
      - source/gateway/settings-rpc.test.ts:127-144 verifies one complete batch reaches one atomic settlement and an unsaved result does not advance revision.
      - source/gateway/settings-gateway-rpc.test.ts:122-157 is the assigned route sibling; it does not replace these direct policy branches.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-workspace-boundary-probe-test-entrypoints-b1-m3
    testId: entrypoints-workspace-boundary-probe-test
    role: second_opinion
    reviewer: entrypoints-b1-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The injectable filesystem tests directly protect canonical-path, directory, readable, physical-write, and launcher-policy decisions without requiring a host-dependent workspace.
    evidence:
      - source/gateway/workspace-boundary-probe.test.ts:12-20 verifies readable canonical roots and reports W_OK evidence for a read-write grant.
      - source/gateway/workspace-boundary-probe.test.ts:22-34 verifies symlink/swapped-root rejection and read-only launcher policy despite a writable filesystem.
      - source/gateway/workspace-boundary-probe.test.ts:36-47 verifies OS write denial reports a non-writable boundary.
      - source/gateway/workspace-boundary-probe.ts:13-35 requires canonical directories, R_OK/X_OK, and separates physical writability from allowWrite policy.
    replacementTestIds: []
    status: proposed

