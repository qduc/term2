decisions:
  - id: entrypoints-no-manual-stdout-sync-guard-test-entrypoints-b2-m3
    testId: entrypoints-no-manual-stdout-sync-guard-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: The guard uniquely scans production TypeScript and rejects actual DEC Mode 2026 bytes, protecting renderer-owned frame atomicity rather than duplicating an ordinary output assertion.
    evidence:
      - source/no-manual-stdout-sync.guard.test.ts:5-17 documents why a second stdout wrapper causes blank or partial frames.
      - source/no-manual-stdout-sync.guard.test.ts:23-39 recursively enumerates non-test TypeScript sources, and lines 42-53 asserts both synchronization markers are absent.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-dataset-test-entrypoints-b2-m3
    testId: entrypoints-dataset-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: The fixture-backed tests cover both schema rejection and the filtering/policy labels that determine which auto-approval cases enter evaluation.
    evidence:
      - source/scripts/eval-auto-approval/dataset.test.ts:17-51 writes a valid case and rejects a case missing history with the case identifier in the error.
      - source/scripts/eval-auto-approval/dataset.test.ts:53-64 verifies category, severity, id, and combined filtering.
      - source/scripts/eval-auto-approval/dataset.test.ts:66-100 checks destructive and v2 gray-zone default cases retain reject expectations.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-metrics-test-entrypoints-b2-m3
    testId: entrypoints-metrics-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: A compact synthetic confusion matrix checks classification, critical false approvals, precision/recall, and uncached latency, while a separate errored record checks parse-error accounting and exclusion.
    evidence:
      - source/scripts/eval-auto-approval/metrics.test.ts:4-53 exercises four outcomes and asserts total, accuracy, critical failure, precision, recall, and p50/p95 values.
      - source/scripts/eval-auto-approval/metrics.test.ts:55-83 checks parseErrorRate and confirms an errored result does not lower valid-result accuracy.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-report-test-entrypoints-b2-m3
    testId: entrypoints-report-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: Prompt provenance is a meaningful report contract, but the only test asserts one substring and does not observe the overall/category/failure sections generated from the supplied metrics and records.
    evidence:
      - source/scripts/eval-auto-approval/report.test.ts:5-25 supplies a prompt version and checks only its Markdown substring.
      - source/scripts/eval-auto-approval/report.ts:17-63 renders overall metrics, category rows, ordinary failures, and critical false-approval sections not exercised by this test.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-runner-utils-test-entrypoints-b2-m3
    testId: entrypoints-runner-utils-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: The utility tests use temporary files and injected clocks/sleeps to cover path derivation, input validation, cache invalidation, YAML expansion, and all retry branches without network dependence.
    evidence:
      - source/scripts/eval-auto-approval/runner-utils.test.ts:14-51 verifies report extension handling, positive option validation, evaluator-version inclusion, and prompt-version cache separation.
      - source/scripts/eval-auto-approval/runner-utils.test.ts:53-95 verifies ordered provider/model expansion and malformed provider rejection from YAML.
      - source/scripts/eval-auto-approval/runner-utils.test.ts:97-177 verifies reset-aware retry success, exhaustion, and immediate non-rate-limit failure.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-ink-testing-test-entrypoints-b2-m3
    testId: entrypoints-ink-testing-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: >-
      This directly tests the harness seam rather than product UI: visible-text normalization,
      act-wrapped initial render/rerender, and effect cleanup are all observed through the helper API.
    evidence:
      - source/test-helpers/ink-testing.test.tsx:8-28 verifies terminal-style stripping plus render and rerender output through lastFrame.
      - source/test-helpers/ink-testing.test.tsx:30-48 verifies cleanup is deferred until runTeardowns and then occurs exactly once.
      - source/test-helpers/ink-testing.tsx:25-55 registers module-level afterEach draining and act-wrapped unmount, the production harness behavior these assertions guard.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-vitest-network-guard-test-entrypoints-b2-m3
    testId: entrypoints-vitest-network-guard-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: >-
      The test is the harness guard's direct safety sentinel: it verifies an external URL is rejected
      with the exact setup diagnostic instead of reaching the provider.
    evidence:
      - source/test-helpers/vitest-network-guard.test.ts:3-7 awaits rejection of an external OpenRouter fetch and checks the network-disabled error.
      - source/test-helpers/vitest-network-guard.ts:16-24 performs the rejection before delegating to originalFetch, so the test exercises the relevant admission boundary.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-user-turn-test-entrypoints-b2-m3
    testId: entrypoints-user-turn-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: The tests cover the privacy-sensitive user-turn boundary across image-only content, sentinel normalization, skill preservation, and display placeholders without duplicating another assigned file.
    evidence:
      - source/types/user-turn.test.ts:4-42 verifies image count display, image-byte and sentinel-ID exclusion, sentinel removal, and image-only content acceptance.
      - source/types/user-turn.test.ts:44-89 verifies skill-name placeholders, omission of skill bodies, and combined skill/image display.
      - source/types/user-turn.test.ts:91-105 verifies normalizeUserTurn preserves the skill attachment and submitted text.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-leaderboard-test-entrypoints-b2-m3
    testId: entrypoints-leaderboard-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: rewrite_candidate
    confidence: high
    reason: The file protects important versioning, persistence, ranking, facet, and hard-case contracts, but its explicitly named wrong-approval-versus-wrong-reject test asserts two clamped zero scores and therefore cannot detect the relative penalty it claims to test.
    evidence:
      - source/scripts/eval-auto-approval/leaderboard.test.ts:72-221 verifies legacy/current prompt scoping and duplicate replacement, including separate prompt-version records.
      - source/scripts/eval-auto-approval/leaderboard.test.ts:223-334 and 336-565 cover historical backfill, facet rankings, hard-case thresholds, and report sections with concrete output assertions.
      - source/scripts/eval-auto-approval/leaderboard.test.ts:666-709 documents a penalty comparison but both one-case models are asserted only as score 0 after clamping; lines 711-749 provide a stronger adjacent ranking check.
    replacementTestIds: []
    status: proposed
  - id: entrypoints-non-interactive-test-entrypoints-b2-m3
    testId: entrypoints-non-interactive-test
    role: second_opinion
    reviewer: entrypoints-b2-m3
    sourceArtifact: docs/test-audit/artifacts/entrypoints-b2-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is broad entrypoint integration evidence with direct stream, approval, lifecycle, restriction, budget, and hard-fit observations; no other assigned file exercises this public non-interactive path.
    evidence:
      - source/non-interactive.test.ts:38-200 verifies text, final fallback, persistent sinks, reasoning, and error exit/output behavior.
      - source/non-interactive.test.ts:202-288 and 460-613 verify automatic approval, rejection reporting, repeated rounds, and GREEN/RED decisions.
      - source/non-interactive.test.ts:787-968 verifies configured lifecycle metadata, Plan Mode input, interceptor removal, and owned-client disposal.
      - source/non-interactive.test.ts:970-1154 verifies caller-owned restrictions and finite parent run-budget extensions; lines 1156-1184 verify hard-fit diagnostics.
    replacementTestIds: []
    status: proposed

