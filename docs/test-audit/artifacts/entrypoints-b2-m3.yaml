schemaVersion: 2
domains:
  - id: entrypoints
    label: App/CLI/gateway entrypoints and support surfaces
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Vitest entrypoint integration suite
seams:
  - id: entrypoints-b2-stdout-routing
    label: Non-interactive event-to-stdout and stderr projection
  - id: entrypoints-b2-noninteractive-lifecycle
    label: One-shot non-interactive session construction and disposal
  - id: entrypoints-b2-noninteractive-approval
    label: Non-interactive approval policy and tool restrictions
  - id: entrypoints-b2-noninteractive-budget
    label: Non-interactive run-budget continuation boundary
  - id: entrypoints-b2-eval-dataset
    label: Auto-approval evaluation dataset validation and filtering
  - id: entrypoints-b2-eval-metrics
    label: Auto-approval evaluation metric computation
  - id: entrypoints-b2-eval-leaderboard
    label: Persisted model leaderboard aggregation and report sections
  - id: entrypoints-b2-eval-report
    label: Auto-approval evaluation Markdown report rendering
  - id: entrypoints-b2-eval-runner-utils
    label: Evaluation runner cache, input, path, and retry utilities
  - id: entrypoints-b2-ink-test-harness
    label: Ink test rendering, act, visible text, and teardown helpers
  - id: entrypoints-b2-network-test-guard
    label: Vitest external network admission guard
  - id: entrypoints-b2-user-turn
    label: User-turn normalization and display projection
risks:
  - id: entrypoints-b2-risk-output-corruption
    label: Non-interactive consumers receive missing, duplicated, or misrouted output.
    severity: high
  - id: entrypoints-b2-risk-session-leak
    label: One-shot sessions leak clients, interceptors, hooks, or runtime resources.
    severity: high
  - id: entrypoints-b2-risk-unsafe-noninteractive-tool
    label: Non-interactive mode executes a tool that requires interactive oversight.
    severity: critical
  - id: entrypoints-b2-risk-budget-overrun
    label: Automatic continuation bypasses the configured finite run budget.
    severity: high
  - id: entrypoints-b2-risk-invalid-eval-input
    label: Invalid evaluation cases or filters silently alter benchmark inputs.
    severity: medium
  - id: entrypoints-b2-risk-misleading-eval-metrics
    label: Evaluation metrics misstate safety failures, errors, or latency.
    severity: high
  - id: entrypoints-b2-risk-stale-leaderboard
    label: Persisted or scoped model results are merged and ranked incorrectly.
    severity: high
  - id: entrypoints-b2-risk-misleading-report
    label: Evaluation report omits or mislabels findings needed to interpret results.
    severity: medium
  - id: entrypoints-b2-risk-runner-retry-or-cache
    label: Runner retries unsafe failures or reuses results across incompatible inputs.
    severity: high
  - id: entrypoints-b2-risk-harness-regression
    label: Test helpers stop observing Ink output or cleaning up rendered views.
    severity: high
  - id: entrypoints-b2-risk-network-leak
    label: Tests make external network requests instead of failing before socket access.
    severity: critical
  - id: entrypoints-b2-risk-user-turn-disclosure
    label: Internal attachment or skill payloads leak into displayed user text.
    severity: medium
fixtures:
  - id: entrypoints-b2-fixture-fake-session
    label: In-memory conversation session and writable stdout/stderr doubles
  - id: entrypoints-b2-fixture-eval-files
    label: Temporary JSON/YAML evaluation files and persisted report records
  - id: entrypoints-b2-fixture-eval-records
    label: Synthetic model result records spanning outcomes and facets
  - id: entrypoints-b2-fixture-ink-view
    label: Ink render result and effect-owning test component
  - id: entrypoints-b2-fixture-registered-provider
    label: Temporary registered streamed provider for run-budget execution
contracts:
  - id: entrypoints-b2-contract-stream-and-final-output
    statement: runWithSession writes streamed text once, supplies final text when no deltas arrived, appends the normal completion newline, and returns exit code 0 for a response.
    seamIds: [entrypoints-b2-stdout-routing]
    riskIds: [entrypoints-b2-risk-output-corruption]
  - id: entrypoints-b2-contract-no-manual-sync-wrapper
    statement: Production TypeScript sources do not emit manual DEC Mode 2026 synchronization wrappers around stdout writes, leaving frame atomicity to the terminal renderer.
    seamIds: [entrypoints-b2-stdout-routing]
    riskIds: [entrypoints-b2-risk-output-corruption]
  - id: entrypoints-b2-contract-json-event-output
    statement: JSON mode emits each conversation event as newline-delimited JSON and emits a completed or error terminal event on the corresponding outcome.
    seamIds: [entrypoints-b2-stdout-routing]
    riskIds: [entrypoints-b2-risk-output-corruption]
  - id: entrypoints-b2-contract-stderr-routing
    statement: Non-interactive diagnostics and tool summaries go to stderr, while quiet mode suppresses summaries and reasoning is emitted only when requested.
    seamIds: [entrypoints-b2-stdout-routing]
    riskIds: [entrypoints-b2-risk-output-corruption]
  - id: entrypoints-b2-contract-approval-policy
    statement: Non-interactive approval decisions auto-approve safe commands, reject dangerous commands, use the configured evaluator for ambiguous commands, and report rejected outcomes.
    seamIds: [entrypoints-b2-noninteractive-approval]
    riskIds: [entrypoints-b2-risk-unsafe-noninteractive-tool]
  - id: entrypoints-b2-contract-session-lifecycle
    statement: runNonInteractive creates the configured session identity and lifecycle, applies profile workflow input, installs temporary restrictions, and removes or disposes owned resources on completion.
    seamIds: [entrypoints-b2-noninteractive-lifecycle]
    riskIds: [entrypoints-b2-risk-session-leak]
  - id: entrypoints-b2-contract-noninteractive-boundaries
    statement: Non-interactive execution blocks background shell, asynchronous subagents, and ask_user while allowing ordinary foreground tools, and stops after the configured finite parent budget extensions.
    seamIds: [entrypoints-b2-noninteractive-approval, entrypoints-b2-noninteractive-budget]
    riskIds: [entrypoints-b2-risk-unsafe-noninteractive-tool, entrypoints-b2-risk-budget-overrun]
  - id: entrypoints-b2-contract-dataset-validation
    statement: loadDataset accepts valid typed evaluation cases and rejects malformed cases with an identifying validation error.
    seamIds: [entrypoints-b2-eval-dataset]
    riskIds: [entrypoints-b2-risk-invalid-eval-input]
  - id: entrypoints-b2-contract-dataset-filtering-and-policy
    statement: filterDataset applies category, severity, and id filters together, while the checked default dataset preserves expected rejection labels for destructive and gray-zone cases.
    seamIds: [entrypoints-b2-eval-dataset]
    riskIds: [entrypoints-b2-risk-invalid-eval-input]
  - id: entrypoints-b2-contract-evaluation-metrics
    statement: computeMetrics reports classification totals, accuracy, precision/recall, false-approval safety failures, critical failures, and uncached latency percentiles from result records.
    seamIds: [entrypoints-b2-eval-metrics]
    riskIds: [entrypoints-b2-risk-misleading-eval-metrics]
  - id: entrypoints-b2-contract-parse-error-metrics
    statement: computeMetrics counts parse errors in total and parse-error rate while excluding errored results from classification accuracy and category counts.
    seamIds: [entrypoints-b2-eval-metrics]
    riskIds: [entrypoints-b2-risk-misleading-eval-metrics]
  - id: entrypoints-b2-contract-result-version-and-dedupe
    statement: Persisted model results use the legacy prompt identity when absent, keep prompt versions separate, and replace duplicate provider/model/case/version records with the latest result.
    seamIds: [entrypoints-b2-eval-leaderboard]
    riskIds: [entrypoints-b2-risk-stale-leaderboard]
  - id: entrypoints-b2-contract-leaderboard-ranking
    statement: Model leaderboards rank deduplicated results using breadth, severity weighting, wrong-approval penalties, category/severity facets, and high wrong-ratio case thresholds.
    seamIds: [entrypoints-b2-eval-leaderboard]
    riskIds: [entrypoints-b2-risk-stale-leaderboard]
  - id: entrypoints-b2-contract-evaluation-report
    statement: generateReport renders prompt-version metadata, overall and category metrics, and bounded failure details including critical false approvals in Markdown.
    seamIds: [entrypoints-b2-eval-report]
    riskIds: [entrypoints-b2-risk-misleading-report]
  - id: entrypoints-b2-contract-runner-options-cache-and-paths
    statement: Runner utilities derive report paths, reject non-positive concurrency/repeat options, and include evaluator and prompt versions in cache identity.
    seamIds: [entrypoints-b2-eval-runner-utils]
    riskIds: [entrypoints-b2-risk-runner-retry-or-cache]
  - id: entrypoints-b2-contract-runner-input-and-retry
    statement: Runner utilities expand ordered provider/model YAML lists, reject malformed provider mappings, retry rate-limit responses up to the limit using reset timing, and immediately rethrow non-rate-limit errors.
    seamIds: [entrypoints-b2-eval-runner-utils]
    riskIds: [entrypoints-b2-risk-runner-retry-or-cache]
  - id: entrypoints-b2-contract-ink-observation
    statement: Ink test helpers render and rerender views inside React act and strip terminal control sequences without changing visible text.
    seamIds: [entrypoints-b2-ink-test-harness]
    riskIds: [entrypoints-b2-risk-harness-regression]
  - id: entrypoints-b2-contract-ink-teardown
    statement: Ink test helpers register rendered views for act-wrapped unmount teardown and execute the pending teardown exactly once when drained.
    seamIds: [entrypoints-b2-ink-test-harness]
    riskIds: [entrypoints-b2-risk-harness-regression]
  - id: entrypoints-b2-contract-network-block
    statement: The Vitest setup guard rejects external fetch requests with the network-disabled diagnostic before allowing no external socket access.
    seamIds: [entrypoints-b2-network-test-guard]
    riskIds: [entrypoints-b2-risk-network-leak]
  - id: entrypoints-b2-contract-user-turn-normalization
    statement: User-turn normalization removes complete and orphaned image sentinels while preserving image and skill attachments and recognizing image-only content.
    seamIds: [entrypoints-b2-user-turn]
    riskIds: [entrypoints-b2-risk-user-turn-disclosure]
  - id: entrypoints-b2-contract-user-turn-display
    statement: User-turn display formatting exposes text, skill names, and image counts as placeholders without exposing skill bodies, image bytes, or sentinel IDs.
    seamIds: [entrypoints-b2-user-turn]
    riskIds: [entrypoints-b2-risk-user-turn-disclosure]
tests:
  - kind: file
    id: entrypoints-no-manual-stdout-sync-guard-test
    file: source/no-manual-stdout-sync.guard.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds: [entrypoints-b2-contract-no-manual-sync-wrapper]
    fixtureIds: []
  - kind: file
    id: entrypoints-non-interactive-test
    file: source/non-interactive.test.ts
    domainId: entrypoints
    suiteId: integration
    contractIds:
      - entrypoints-b2-contract-stream-and-final-output
      - entrypoints-b2-contract-json-event-output
      - entrypoints-b2-contract-stderr-routing
      - entrypoints-b2-contract-approval-policy
      - entrypoints-b2-contract-session-lifecycle
      - entrypoints-b2-contract-noninteractive-boundaries
    fixtureIds:
      - entrypoints-b2-fixture-fake-session
      - entrypoints-b2-fixture-registered-provider
  - kind: file
    id: entrypoints-dataset-test
    file: source/scripts/eval-auto-approval/dataset.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds:
      - entrypoints-b2-contract-dataset-validation
      - entrypoints-b2-contract-dataset-filtering-and-policy
    fixtureIds: [entrypoints-b2-fixture-eval-files]
  - kind: file
    id: entrypoints-leaderboard-test
    file: source/scripts/eval-auto-approval/leaderboard.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds:
      - entrypoints-b2-contract-result-version-and-dedupe
      - entrypoints-b2-contract-leaderboard-ranking
    fixtureIds:
      - entrypoints-b2-fixture-eval-files
      - entrypoints-b2-fixture-eval-records
  - kind: file
    id: entrypoints-metrics-test
    file: source/scripts/eval-auto-approval/metrics.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds:
      - entrypoints-b2-contract-evaluation-metrics
      - entrypoints-b2-contract-parse-error-metrics
    fixtureIds: [entrypoints-b2-fixture-eval-records]
  - kind: file
    id: entrypoints-report-test
    file: source/scripts/eval-auto-approval/report.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds: [entrypoints-b2-contract-evaluation-report]
    fixtureIds: [entrypoints-b2-fixture-eval-records]
  - kind: file
    id: entrypoints-runner-utils-test
    file: source/scripts/eval-auto-approval/runner-utils.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds:
      - entrypoints-b2-contract-runner-options-cache-and-paths
      - entrypoints-b2-contract-runner-input-and-retry
    fixtureIds: [entrypoints-b2-fixture-eval-files]
  - kind: file
    id: entrypoints-ink-testing-test
    file: source/test-helpers/ink-testing.test.tsx
    domainId: entrypoints
    suiteId: unit
    contractIds:
      - entrypoints-b2-contract-ink-observation
      - entrypoints-b2-contract-ink-teardown
    fixtureIds: [entrypoints-b2-fixture-ink-view]
  - kind: file
    id: entrypoints-vitest-network-guard-test
    file: source/test-helpers/vitest-network-guard.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds: [entrypoints-b2-contract-network-block]
    fixtureIds: []
  - kind: file
    id: entrypoints-user-turn-test
    file: source/types/user-turn.test.ts
    domainId: entrypoints
    suiteId: unit
    contractIds:
      - entrypoints-b2-contract-user-turn-normalization
      - entrypoints-b2-contract-user-turn-display
