schemaVersion: 2
domains:
  - id: hooks
    label: Conversation and input hooks
suites:
  - id: unit
    label: Deterministic unit and seam tests
  - id: ui-rendering
    label: Ink hook rendering and input tests
seams:
  - id: hooks-a-seam-ui-reducer
    label: Conversation UI reducer projecting turn, approval, streaming, and queue state
  - id: hooks-a-seam-handoff-reducer
    label: Handoff flow state transition and message composition boundary
  - id: hooks-a-seam-message-id
    label: Message identifier factory boundary
  - id: hooks-a-seam-path-completion
    label: Path completion matching and ranking boundary
  - id: hooks-a-seam-settings-completion
    label: Settings completion categorization, filtering, and selection boundary
  - id: hooks-a-seam-conversation-hook
    label: useConversation orchestration-to-UI projection boundary
  - id: hooks-a-seam-command-registry
    label: App slash-command construction and busy-mode policy boundary
  - id: hooks-a-seam-command-helpers
    label: Direct slash-command helper and assistant-response utility boundary
  - id: hooks-a-seam-keyboard-input
    label: Global shortcut and prompt input ownership boundary
  - id: hooks-a-seam-message-hook
    label: Conversation message collection and presentation helper boundary
  - id: hooks-a-seam-settings-hook
    label: Conversation runtime-setting callback boundary
  - id: hooks-a-seam-approval-presentation
    label: Approval presentation filtering boundary
  - id: hooks-a-seam-background-state
    label: Background task observation, clock, and notification boundary
  - id: hooks-a-seam-first-run-gate
    label: First-run credential gate and provider/model setup boundary
  - id: hooks-a-seam-debounce
    label: Trailing-edge debounced React value boundary
  - id: hooks-a-seam-escape
    label: Input-local Escape gesture boundary
risks:
  - id: hooks-a-risk-ui-state-drift
    label: The UI displays stale or contradictory turn, approval, streaming, or queue state.
    severity: high
  - id: hooks-a-risk-approval-confusion
    label: An answer, rejection, or approval is applied to the wrong interaction or loses user input.
    severity: critical
  - id: hooks-a-risk-handoff-state-loss
    label: A handoff prompt, selected mode, or captured response is lost or sent in the wrong stage.
    severity: high
  - id: hooks-a-risk-message-collision
    label: Distinct visible messages receive colliding identifiers within a session.
    severity: high
  - id: hooks-a-risk-completion-misranking
    label: Valid path or setting completions disappear or an inferior match is selected first.
    severity: medium
  - id: hooks-a-risk-stop-resurrection
    label: A stopped turn remains busy or is resurrected by a late transport or queue notification.
    severity: high
  - id: hooks-a-risk-command-policy-bypass
    label: A slash command mutates conversation state during a turn or a display command is incorrectly blocked.
    severity: high
  - id: hooks-a-risk-command-helper-regression
    label: A command helper parses input or reports usage, copies, or displays an assistant response incorrectly.
    severity: medium
  - id: hooks-a-risk-input-fanout
    label: A shortcut handles a key owned by a prompt, causing duplicate or unintended actions.
    severity: high
  - id: hooks-a-risk-message-history-loss
    label: Conversation messages are initialized, capped, classified, or restored incorrectly.
    severity: high
  - id: hooks-a-risk-setting-forwarding
    label: A model, effort, or temperature change is dropped or sent to a stale conversation service.
    severity: medium
  - id: hooks-a-risk-approval-row-leak
    label: A pending command row for the active approval is shown or hidden incorrectly.
    severity: high
  - id: hooks-a-risk-background-stale-ui
    label: Background activity, elapsed time, or approval notifications become stale or keep redrawing unnecessarily.
    severity: high
  - id: hooks-a-risk-first-run-bypass
    label: Setup is skipped without usable credentials or remains active after setup completes.
    severity: high
  - id: hooks-a-risk-debounce-stale-update
    label: Consumers observe an intermediate, delayed, or post-unmount debounced value.
    severity: medium
  - id: hooks-a-risk-escape-gesture-conflict
    label: Escape clears input too early, fails to clear it, or conflicts with app-level interruption.
    severity: high
fixtures:
  - id: hooks-a-fixture-ui-state-actions
    label: Reducer actions and representative turn, approval, queue, and usage snapshots
  - id: hooks-a-fixture-ask-user-approval
    label: Mixed single-select and multi-select ask_user approval payload
  - id: hooks-a-fixture-handoff-state
    label: Handoff stages, captured text, and optional handoff message
  - id: hooks-a-fixture-clock
    label: Controlled timestamps and message-id clock values
  - id: hooks-a-fixture-path-entries
    label: File and directory path entries with matching and ranking queries
  - id: hooks-a-fixture-settings-catalog
    label: Setting keys, categories, descriptions, and current values
  - id: hooks-a-fixture-ink-renderer
    label: Ink renderInAct harness and rendered hook output frames
  - id: hooks-a-fixture-command-dependencies
    label: Slash command callbacks, message history, and settings transition dependencies
  - id: hooks-a-fixture-key-input
    label: Ink key events and explicit input-owner states
  - id: hooks-a-fixture-message-array
    label: User, bot, command, reasoning, and system message arrays
  - id: hooks-a-fixture-conversation-service
    label: Mock conversation service callbacks, observers, and transport promises
  - id: hooks-a-fixture-background-state
    label: Background task snapshots, details, approval subscriptions, and fake clocks
  - id: hooks-a-fixture-provider-credentials
    label: Provider settings and credential environment state for first-run setup
  - id: hooks-a-fixture-timers
    label: Controlled debounce and Escape hint timers
contracts:
  - id: hooks-a-contract-ui-initial-and-turn-state
    statement: A fresh UI state exposes idle defaults, and turn start/completion set processing and clear transient indicators without losing an approval requested during processing.
    seamIds: [hooks-a-seam-ui-reducer]
    riskIds: [hooks-a-risk-ui-state-drift]
  - id: hooks-a-contract-ui-streaming-state
    statement: Thinking timestamps retain the first start until cleared, tool information can be set or cleared, and streaming speed is cleared at turn or transient reset.
    seamIds: [hooks-a-seam-ui-reducer]
    riskIds: [hooks-a-risk-ui-state-drift]
  - id: hooks-a-contract-ui-approval-and-ask-user
    statement: Approval transitions expose the requested interaction, reject invalid waiting actions, and preserve ordered string or array answers across mixed ask_user questions.
    seamIds: [hooks-a-seam-ui-reducer]
    riskIds: [hooks-a-risk-approval-confusion]
  - id: hooks-a-contract-ui-queue-and-reset
    statement: Queue snapshots derive active, paused, processing, and length flags for each queue state, while queue messages update only the addressed row and resets clear the appropriate state.
    seamIds: [hooks-a-seam-ui-reducer]
    riskIds: [hooks-a-risk-ui-state-drift]
  - id: hooks-a-contract-ui-session-metrics
    statement: Usage, rate-limit, and cost summaries are updated and cleared through their actions, with transient and full resets preserving or clearing the durable metrics they own.
    seamIds: [hooks-a-seam-ui-reducer]
    riskIds: [hooks-a-risk-ui-state-drift]
  - id: hooks-a-contract-handoff-transitions
    statement: Handoff state starts, captures a message only from its entry stage, advances through model and standard-mode stages, and clears on send or cancellation while preserving captured text.
    seamIds: [hooks-a-seam-handoff-reducer]
    riskIds: [hooks-a-risk-handoff-state-loss]
  - id: hooks-a-contract-message-ids
    statement: Message identifier generation is unique for repeated calls at one timestamp and restarts its suffix when the clock advances.
    seamIds: [hooks-a-seam-message-id]
    riskIds: [hooks-a-risk-message-collision]
  - id: hooks-a-contract-path-completion
    statement: Path completion matches case-insensitive subsequences, excludes nonmatches, preserves the result cap, and ranks basename or leaf-directory matches ahead of weaker path matches.
    seamIds: [hooks-a-seam-path-completion]
    riskIds: [hooks-a-risk-completion-misranking]
  - id: hooks-a-contract-settings-completion
    statement: Settings completion exposes stable categories, maps known and unknown keys predictably, filters by category, and clamps selection indexes to valid bounds.
    seamIds: [hooks-a-seam-settings-completion]
    riskIds: [hooks-a-risk-completion-misranking]
  - id: hooks-a-contract-stop-settlement
    statement: Stopping an unsettled conversation turn immediately leaves the UI idle with a stopped message, and a late cancelling queue snapshot or transport settlement cannot resurrect or undo that state.
    seamIds: [hooks-a-seam-conversation-hook]
    riskIds: [hooks-a-risk-stop-resurrection]
  - id: hooks-a-contract-command-policy
    statement: App command construction exposes the intended aliases and mode commands, blocks conversation-mutating commands only while busy, and leaves display-only commands available.
    seamIds: [hooks-a-seam-command-registry]
    riskIds: [hooks-a-risk-command-policy-bypass]
  - id: hooks-a-contract-command-helpers
    statement: Assistant-response, model-provider parsing, usage, resume, and copy command helpers return the documented values, handled status, and user-facing messages for valid and invalid inputs.
    seamIds: [hooks-a-seam-command-helpers]
    riskIds: [hooks-a-risk-command-helper-regression]
  - id: hooks-a-contract-mode-and-handoff-commands
    statement: Mode commands apply exclusive profile transitions and history confirmation policy, while handoff reports missing assistant output or forwards the latest response when available.
    seamIds: [hooks-a-seam-command-registry]
    riskIds: [hooks-a-risk-command-policy-bypass, hooks-a-risk-handoff-state-loss]
  - id: hooks-a-contract-keyboard-ownership
    statement: Global shortcuts handle Ctrl+C and input-owned model/effort or mode gestures, but suppress Escape and app shortcuts while another prompt or manager owns input.
    seamIds: [hooks-a-seam-keyboard-input]
    riskIds: [hooks-a-risk-input-fanout]
  - id: hooks-a-contract-conversation-messages
    statement: The message hook initializes and appends messages, caps the retained list from the front, classifies shell outcomes, and returns user messages with their original UI indexes.
    seamIds: [hooks-a-seam-message-hook]
    riskIds: [hooks-a-risk-message-history-loss]
  - id: hooks-a-contract-conversation-settings
    statement: Conversation setting callbacks delegate model, reasoning effort, and temperature values and remain stable for one service while updating for a new service.
    seamIds: [hooks-a-seam-settings-hook]
    riskIds: [hooks-a-risk-setting-forwarding]
  - id: hooks-a-contract-approval-presentation
    statement: Approval presentation hides only matching pending or running command rows according to call-id or tool-name policy while retaining unrelated, completed, and non-command messages.
    seamIds: [hooks-a-seam-approval-presentation]
    riskIds: [hooks-a-risk-approval-row-leak]
  - id: hooks-a-contract-background-observation
    statement: useConversation observes background snapshots and unsubscribes on unmount, ticks elapsed time for live or in-flight work but not retained terminal details, and notifies when approvals become pending.
    seamIds: [hooks-a-seam-background-state]
    riskIds: [hooks-a-risk-background-stale-ui]
  - id: hooks-a-contract-clear-and-stop-effects
    statement: Conversation clearing resets messages and session identity through the callback or a fresh fallback id, while stop, error logging, thinking visibility, shell cancellation, and retry callbacks update the visible conversation correctly.
    seamIds: [hooks-a-seam-conversation-hook]
    riskIds: [hooks-a-risk-message-history-loss, hooks-a-risk-stop-resurrection]
  - id: hooks-a-contract-restored-conversation
    statement: useConversation renders restored messages and derives last usage from the latest restored assistant message.
    seamIds: [hooks-a-seam-conversation-hook]
    riskIds: [hooks-a-risk-message-history-loss]
  - id: hooks-a-contract-debounced-value
    statement: A debounced value updates only after the source is quiet, uses the latest value, flushes immediately when requested, and cancels pending updates on unmount.
    seamIds: [hooks-a-seam-debounce]
    riskIds: [hooks-a-risk-debounce-stale-update]
  - id: hooks-a-contract-escape-gesture
    statement: One Escape shows a hint, a second or combined Escape clears non-empty input, an input-local callback can consume Escape, and an empty buffer during an in-flight turn is left to the app interrupt.
    seamIds: [hooks-a-seam-escape]
    riskIds: [hooks-a-risk-escape-gesture-conflict]
  - id: hooks-a-contract-first-run-setup
    statement: First-run setup is bypassed with effective credentials, moves from provider to model after credential changes, follows provider changes, and completes or can be requested again through the setup gate.
    seamIds: [hooks-a-seam-first-run-gate]
    riskIds: [hooks-a-risk-first-run-bypass]
