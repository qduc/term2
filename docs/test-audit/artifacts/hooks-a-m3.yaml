decisions:
  - id: hooks-conversation-ui-reducer-ask-user-bugfix-hooks-a-m3
    testId: hooks-conversation-ui-reducer-ask-user-bugfix
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The regression-specific sequence protects array-valued multi-select answers across a mixed ask_user flow.
    evidence:
      - The test drives approval/requested, answer_submitted, and advance_to_next through conversationUIReducer and asserts the second answer remains an array at source/hooks/conversation-ui-reducer.ask-user-bugfix.test.ts:58-72.
      - The broader reducer test covers answer accumulation at source/hooks/conversation-ui-reducer.test.ts:244-264 but does not cover a mixed single-select then multi-select array regression.
    replacementTestIds: []
    status: proposed
  - id: hooks-conversation-ui-reducer-hooks-a-m3
    testId: hooks-conversation-ui-reducer
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the high-scrutiny reducer contract suite spanning lifecycle, approval, queue, usage, reset, immutability, and queued-row behavior.
    evidence:
      - The file exercises the production reducer and flag projection directly at source/hooks/conversation-ui-reducer.ts:183-611, including all current action families.
      - Queue state distinctions and row-preserving edits are asserted at source/hooks/conversation-ui-reducer.test.ts:400-510 and :544-740; no assigned sibling provides equivalent reducer transition coverage.
    replacementTestIds: []
    status: proposed
  - id: hooks-handoff-flow-reducer-hooks-a-m3
    testId: hooks-handoff-flow-reducer
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Pure transition tests cheaply lock stage guards, null behavior, captured-text preservation, and default message composition.
    evidence:
      - The hook path re-exports the service reducer, and this file directly verifies each action's observable stage transition at source/hooks/handoff-flow-reducer.test.ts:36-161.
      - Cross-domain source/services/handoff/handoff-session.test.ts:18-31 covers a higher-level session operation, not the complete reducer no-op matrix.
    replacementTestIds: []
    status: proposed
  - id: hooks-message-id-hooks-a-m3
    testId: hooks-message-id
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The two clock cases protect uniqueness and sequence reset, which are distinct observable identifier guarantees.
    evidence:
      - source/hooks/message-id.test.ts:4-19 injects a deterministic clock and asserts exact IDs for same-time calls and a time advance.
      - The hook re-exports createMessageIdFactory from source/utils/message-id-factory.js, so this is a direct seam test rather than a render-only characterization.
    replacementTestIds: []
    status: proposed
  - id: hooks-path-completion-filter-hooks-a-m3
    testId: hooks-path-completion-filter
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Matching, caps, and ranking are independently observable completion behavior with representative file and directory cases.
    evidence:
      - source/hooks/path-completion-filter.test.ts:8-35 covers subsequence semantics and :37-119 covers filtering, caps, directory, leaf-directory, basename, and ranking behavior.
      - The implementation delegates matching/scoring to source/utils/subsequence-filter.ts:1-49 and applies basename and leaf-directory weighting at source/hooks/path-completion-filter.ts:13-33; no sibling asserts these path-entry outcomes.
    replacementTestIds: []
    status: proposed
  - id: hooks-settings-completion-logic-hooks-a-m3
    testId: hooks-settings-completion-logic
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: medium
    reason: Direct pure-helper tests are a proportionate foundation for category and selection policy even though hook-level tests repeat selected examples.
    evidence:
      - source/hooks/settings-completion-logic.test.ts:6-79 directly checks category IDs, known/unknown mappings, category filtering, and bounds.
      - Cross-file source/hooks/use-settings-completion.test.ts:326-355 repeats category and category-filter assertions and :480-519 repeats clampIndex cases, but it exercises the hook's exported integration surface; it does not make the pure seam redundant.
    replacementTestIds: []
    status: proposed
  - id: hooks-stop-processing-probe-hooks-a-m3
    testId: hooks-stop-processing-probe
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The test protects a timing-sensitive stop fence that cannot be represented by a settled-turn unit test.
    evidence:
      - source/hooks/stop-processing-probe.test.tsx:17-87 parks sendMessage, stops before settlement, injects a late cancelling snapshot, and then releases transport while asserting the UI remains idle with Stopped.
      - The production fence is explicit at source/hooks/use-conversation.ts:279-335 and stopProcessing sets it before orchestration at :433-441; source/services/conversation/conversation-orchestrator.test.ts:381-399 tests cancellation semantics but not this UI race.
    replacementTestIds: []
    status: proposed
  - id: hooks-use-app-commands-hooks-a-m3
    testId: hooks-use-app-commands
    role: second_opinion
    reviewer: hooks-a-m3
    sourceArtifact: docs/test-audit/artifacts/hooks-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This high-scrutiny file covers command registration, busy-turn gating, mode/profile transitions, and handoff behavior through the assembled hook; its mixed direct command checks do not erase the hook-level contract.
    evidence:
      - source/hooks/use-app-commands.test.ts:21-80 covers latest assistant text, model-provider parsing, and usage helper outputs; :119-214 covers asynchronous copy success/failure, numbered response selection, and code-block menu selection.
      - source/hooks/use-app-commands.test.ts:277-403 verifies aliases, busy blocking, idle execution, and display-only command availability, while :405-720 verifies profile/mode exclusivity and history confirmation.
      - source/hooks/use-app-commands.test.ts:722-824 verifies both handoff absence and successful handoff outcomes through useAppCommands.
      - The two createResumeSlashCommand cases at source/hooks/use-app-commands.test.ts:82-117 duplicate action-case observables in source/commands/resume-command.test.ts:40-67 and :69-105; empty/ls replaceInput belongs better in the command test, and target-id plus usage/invalid-id errors likewise belong there. The file remains keep because its broader assembled useAppCommands coverage is not duplicated by that command factory test.
