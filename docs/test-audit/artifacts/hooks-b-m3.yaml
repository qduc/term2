     confidence: high
     reason: This is a high-scrutiny provider-management suite covering safe deletion, wizard validation/persistence, edit/discard races, and scrolling.
     evidence:
       - source/hooks/use-provider-selection.test.ts:65-172 asserts list population and custom-provider entry into edit_fields.
       - source/hooks/use-provider-selection.test.ts:261-365 asserts custom deletion confirmation, refusal, confirmation, and active-provider fallback.
       - source/hooks/use-provider-selection.test.ts:458-571 asserts the complete add-provider wizard and persisted provider fields.
       - source/hooks/use-provider-selection.test.ts:647-891 asserts modified/unmodified back-out and late duplicate-name rejection.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-resume-selection-test-r1
     testId: hooks-use-resume-selection-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: rewrite_candidate
