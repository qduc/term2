decisions:
   - id: hooks-use-grok-credit-usage-test-r1
     testId: hooks-use-grok-credit-usage-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The file exercises provider gating, seed/edge refresh, cached rendering, and forced refresh through the real hook.
     evidence:
       - source/hooks/use-grok-credit-usage.test.tsx:59-80 asserts one entry seed and refresh only on busy-to-idle.
       - source/hooks/use-grok-credit-usage.test.tsx:96-139 asserts non-Grok suppression, cached rendering, and force refresh only for Grok.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-terminal-focus-notifier-test-r1
     testId: hooks-use-terminal-focus-notifier-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The terminal focus hook is tested at the stdout protocol, stdin event, notification gating, and unmount lifecycle boundaries.
     evidence:
       - source/hooks/use-terminal-focus-notifier.test.tsx:81-97 asserts enable/disable focus escape sequences on mount/unmount.
       - source/hooks/use-terminal-focus-notifier.test.tsx:99-158 asserts focus-out/in state transitions and approval/complete notifications only while unfocused.
       - source/hooks/use-terminal-focus-notifier.test.tsx:160-176 asserts app.notifications=false suppresses both notification types.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-shell-mode-test-r1
     testId: hooks-use-shell-mode-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: rewrite_candidate
     confidence: high
     reason: The two history-flush tests drive the same enter-submit-exit path and differ only in the literal echo command, so they are better represented as one parameterized case while retaining both output tokens.
     evidence:
       - source/hooks/use-shell-mode.test.tsx:70-87 enters shell mode, submits echo one, exits, and asserts serialized history projection.
       - source/hooks/use-shell-mode.test.tsx:89-106 repeats the identical lifecycle and assertion with echo two; no distinct branch or failure mode is exercised.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-skill-selection-test-r1
     testId: hooks-use-skill-selection-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: rewrite_candidate
     confidence: high
     reason: The file tests a copied filter helper instead of rendering or importing useSkillSelection, leaving production hook wiring and query extraction untested.
     evidence:
       - source/hooks/use-skill-selection.test.ts:20-30 explicitly says filtering is extracted and defines a local filterSkills implementation.
       - source/hooks/use-skill-selection.test.ts:33-81 invokes only filterSkills; no useSkillSelection import or hook harness appears in the file.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-slash-commands-test-r1
     testId: hooks-use-slash-commands-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The file directly imports hook-owned helpers and covers filtering, argument extraction, autocomplete boundaries, and input/cursor effects of command dispatch.
     evidence:
       - source/hooks/use-slash-commands.test.ts:29-109 asserts empty, partial, exact, argument-bearing, no-match, and ordered command filtering.
       - source/hooks/use-slash-commands.test.ts:111-254 asserts autocomplete and argument extraction edge cases.
       - source/hooks/use-slash-commands.test.ts:297-398 asserts successful, argument-autocomplete, and undo dispatch effects on action, close, input, and cursor.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-terminal-columns-test-r1
     testId: hooks-use-terminal-columns-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: Focused fake-timer tests protect initial width, debounce semantics, burst collapse, and cleanup of the resize listener.
     evidence:
       - source/hooks/use-terminal-columns.test.tsx:36-67 asserts mount width and delayed resize update.
       - source/hooks/use-terminal-columns.test.tsx:69-104 asserts rapid-event collapse and zero resize listeners after unmount.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-runtime-settings-test-r1
     testId: hooks-use-runtime-settings-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The rendered hook applies a provider setting through the runtime callback and observes the conversation-service boundary.
     evidence:
       - source/hooks/use-runtime-settings.test.tsx:17-38 supplies a conversation service spy and constructs useRuntimeSettings.
       - source/hooks/use-runtime-settings.test.tsx:40-50 applies agent.provider and asserts the exact switchProvider call.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-selection-test-r1
     testId: hooks-use-selection-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The generic hook's navigation contract is exercised across wrapping, clamping, paging, and inactive-item skipping.
     evidence:
       - source/hooks/use-selection.test.ts:27-75 asserts up/down wrap behavior and initial selection.
       - source/hooks/use-selection.test.ts:115-175 asserts page movement and endpoint clamps.
       - source/hooks/use-selection.test.ts:177-291 asserts inactive skipping for directional, page, home, and end navigation.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-settings-completion-scroll-test-r1
     testId: hooks-use-settings-completion-scroll-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The rendered hook covers category-aware completion state and the special all-tabs search mode, complementing pure helper coverage.
     evidence:
       - source/hooks/use-settings-completion.scroll.test.ts:50-98 asserts active category filtering, category switching, and selection/scroll reset.
       - source/hooks/use-settings-completion.scroll.test.ts:100-125 asserts a query searches all task tabs and exposes shell.timeout.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-settings-completion-test-r1
     testId: hooks-use-settings-completion-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: rewrite_candidate
     confidence: high
     reason: Most helper coverage is useful, but one assertion is tautological and max-result checks only upper bounds, so the file should be tightened rather than treated as uniformly strong evidence.
     evidence:
       - source/hooks/use-settings-completion.test.ts:148-171 computes expected output but line 169 asserts every item against the constant predicate every(() => true), which verifies nothing.
       - source/hooks/use-settings-completion.test.ts:412-424 checks only result.length <= maxResults for maxResults 2, 4, and 100; an empty or under-populated result could pass without proving the limit behavior.
       - source/hooks/use-settings-completion.test.ts:522-540 repeats helper composition with weak some() checks, indicating the rewrite should retain boundary assertions while removing tautological/underconstrained checks.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-path-completion-test-r1
     testId: hooks-use-path-completion-test
     role: second_opinion
     reviewer: hooks-b-m3
     sourceArtifact: docs/test-audit/artifacts/hooks-b-m3.yaml
     recommendation: keep
     confidence: high
     reason: The test is a focused regression against unstable injected logger identity causing repeated loading/rendering.
     evidence:
       - source/hooks/use-path-completion.test.tsx:55-64 recreates the logging service on every render and invokes the production hook.
       - source/hooks/use-path-completion.test.tsx:67-83 asserts exactly one load call and bounded renders after the harness settles.
     replacementTestIds: []
     status: proposed
   - id: hooks-use-provider-selection-test-r1
