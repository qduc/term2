schemaVersion: 2
domains:
  - id: hooks
    label: Hook/UI-state behaviors
suites:
  - id: unit
    label: Default Vitest unit suite
seams:
  - id: hooks-b-seam-provider-state
    label: Provider/model selection and provider-specific status state.
  - id: hooks-b-seam-handoff-workflow
    label: Handoff state transitions and model/effort selection routing.
  - id: hooks-b-seam-selection-filtering
    label: Hook-owned filtering, indexing, and navigation state.
  - id: hooks-b-seam-settings-shell
    label: Settings completion and interactive shell state boundaries.
  - id: hooks-b-seam-terminal-lifecycle
    label: Terminal dimensions, focus events, and notification lifecycle.
fixtures:
  - id: hooks-b-fixture-react-ink-harness
    label: React/Ink rendered hook harness with captured hook state.
  - id: hooks-b-fixture-mock-settings
    label: In-memory settings service used to drive hook configuration.
  - id: hooks-b-fixture-async-provider
    label: Controllable provider model fetchers and registered test providers.
  - id: hooks-b-fixture-shell-session
    label: Shell interaction session with mocked command execution and sink.
  - id: hooks-b-fixture-terminal-stream
    label: Mock stdout/stdin event sources for terminal lifecycle events.
risks:
  - id: hooks-b-risk-stale-provider-state
    label: A provider switch or credential change leaves stale models or usage visible.
    severity: high
  - id: hooks-b-risk-handoff-misrouting
    label: Handoff text is lost, duplicated, or sent through the wrong model-selection path.
    severity: high
  - id: hooks-b-risk-input-attachment-loss
    label: Recalled or drafted image attachments disappear during input-history navigation.
    severity: medium
  - id: hooks-b-risk-navigation-boundary-error
    label: Selection, filtering, completion, or scroll boundaries choose an invalid item.
    severity: medium
  - id: hooks-b-risk-settings-policy-drift
    label: Settings visibility, category, query, or runtime routing drifts from policy.
    severity: medium
  - id: hooks-b-risk-shell-history-loss
    label: Shell results or pending history are not projected when shell mode closes.
    severity: high
  - id: hooks-b-risk-terminal-lifecycle-leak
    label: Terminal listeners, focus state, or notification gates remain wrong across lifecycle events.
    severity: medium
  - id: hooks-b-risk-completion-runaway
    label: Unstable injected dependencies cause repeated completion loads or render loops.
    severity: high
contracts:
  - id: hooks-b-contract-grok-credit-gating
    statement: Grok credit usage seeds and refreshes only for the Grok provider, with explicit refresh forcing a fetch.
    seamIds: [hooks-b-seam-provider-state]
    riskIds: [hooks-b-risk-stale-provider-state]
  - id: hooks-b-contract-handoff-settlement
    statement: Handoff input, model/effort choices, cancellation, and plan-mode confirmation settle exactly once with the intended message and state.
    seamIds: [hooks-b-seam-handoff-workflow]
    riskIds: [hooks-b-risk-handoff-misrouting]
  - id: hooks-b-contract-history-attachments
    statement: Input-history navigation restores both recalled conversation images and the user's draft images.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-input-attachment-loss]
  - id: hooks-b-contract-mentor-pool-selection
    statement: Mentor-pool lists preserve catalog metadata, expose saved/custom models, and apply model/provider picks without dropping reasoning settings.
    seamIds: [hooks-b-seam-provider-state]
    riskIds: [hooks-b-risk-stale-provider-state]
  - id: hooks-b-contract-model-fetch-coherence
    statement: Model selection honors provider credentials, ignores stale asynchronous results, invalidates changed-provider caches, and preselects configured models.
    seamIds: [hooks-b-seam-provider-state]
    riskIds: [hooks-b-risk-stale-provider-state]
  - id: hooks-b-contract-path-completion-stability
    statement: Path completion loads workspace entries without an infinite render/refetch loop when injected logger identity is unstable.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-completion-runaway]
  - id: hooks-b-contract-provider-wizard
    statement: Provider selection navigates built-in/custom flows safely, validates edits, persists valid drafts, and handles deletion/discard boundaries.
    seamIds: [hooks-b-seam-provider-state]
    riskIds: [hooks-b-risk-stale-provider-state, hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-resume-filtering
    statement: Resume filtering matches conversation id, message, model, and SSH host case-insensitively and preserves all results for an empty query.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-rewind-scroll
    statement: Rewind selection computes an initial scroll offset that keeps the selected last turn visible.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-runtime-provider-route
    statement: Applying the agent.provider runtime setting delegates provider changes to conversation-service switchProvider.
    seamIds: [hooks-b-seam-provider-state]
    riskIds: [hooks-b-risk-stale-provider-state]
  - id: hooks-b-contract-selection-navigation
    statement: Generic selection wraps, clamps, pages, and skips inactive entries in the documented directions.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-settings-completion
    statement: Settings completion exposes policy-approved entries, filters by category/query, and clamps selection indices.
    seamIds: [hooks-b-seam-settings-shell]
    riskIds: [hooks-b-risk-settings-policy-drift, hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-shell-settlement
    statement: Shell submission clears input, projects command output, and flushes pending shell history when leaving shell mode.
    seamIds: [hooks-b-seam-settings-shell]
    riskIds: [hooks-b-risk-shell-history-loss]
  - id: hooks-b-contract-skill-filtering
    statement: Skill completion filtering matches skill names or descriptions case-insensitively and handles empty/no-match inputs.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-slash-command-dispatch
    statement: Slash completion recognizes command arguments and selection dispatch updates input/cursor and closes according to action results.
    seamIds: [hooks-b-seam-selection-filtering]
    riskIds: [hooks-b-risk-navigation-boundary-error]
  - id: hooks-b-contract-terminal-columns
    statement: Terminal columns reflect mount width, debounce resize events, collapse bursts, and remove listeners on unmount.
    seamIds: [hooks-b-seam-terminal-lifecycle]
    riskIds: [hooks-b-risk-terminal-lifecycle-leak]
  - id: hooks-b-contract-terminal-focus-notifications
    statement: Focus mode escape sequences and approval/completion notifications are gated by focus and app notification settings.
    seamIds: [hooks-b-seam-terminal-lifecycle]
    riskIds: [hooks-b-risk-terminal-lifecycle-leak]
