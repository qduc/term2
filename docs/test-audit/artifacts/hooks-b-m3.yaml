     reason: Every assertion exercises a locally redefined filter rather than useResumeSelection, so production hook changes can pass without this test noticing.
     evidence:
       - source/hooks/use-resume-selection.test.ts:30-40 defines filterConversations inline with the same filtering algorithm instead of importing or rendering useResumeSelection.
       - source/hooks/use-resume-selection.test.ts:42-78 invokes only that local function for empty, id, message, model, SSH-host, and no-match cases.
     replacementTestIds: []
     status: proposed
