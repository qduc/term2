# Domain exploration artifact for observability, Milestone 3.
schemaVersion: 2
domains:
  - id: observability
    label: Cost, logging, traffic evidence, and retry recovery
suites:
  - id: unit
    label: Deterministic unit and seam tests
seams:
  - id: observability-cost-accounting
    label: Boundary converting provider usage and pricing evidence into session cost records
  - id: observability-pricing-resolution
    label: Boundary resolving provider/model/tier identifiers to catalog or overlay prices
  - id: observability-assistant-journal
    label: Boundary capturing streamed assistant output and provider-backed items before turn settlement
  - id: observability-conversation-log
    label: Boundary persisting conversation events, replay records, sidecars, and durability state
  - id: observability-conversation-dispatch
    label: Boundary routing runtime events into turn accumulation, journal capture, and conversation persistence
  - id: observability-runtime-log
    label: Boundary normalizing runtime metadata and applying logging category, payload, and sampling policy
  - id: observability-provider-traffic
    label: Boundary sanitizing, summarizing, and storing provider request/response traffic
  - id: observability-retry-classification
    label: Boundary translating provider and model failures into retry, fallback, or terminal classifications
  - id: observability-recovery-policy
    label: Boundary translating classified failures into state-safe recovery instructions
  - id: observability-recovery-execution
    label: Boundary applying recovery instructions to history, continuity, tools, and subsequent run state
  - id: observability-retry-budget
    label: Boundary containing physical attempts, automatic replays, and elapsed recovery time
  - id: observability-retry-presentation
    label: Boundary translating retry classifications into user events and structured log fields
risks:
  - id: observability-cost-overcharge
    label: Usage or provider charges are double-counted, billed in the wrong dimension, or silently reported as zero.
    severity: high
  - id: observability-cost-unpriced
    label: Unknown or incomplete pricing evidence is presented as an exact cost instead of an explicit coverage state.
    severity: medium
  - id: observability-journal-loss
    label: Streamed assistant items are lost, duplicated, misordered, or attributed to the wrong turn during recovery.
    severity: critical
  - id: observability-log-corruption
    label: Conversation persistence cannot resume safely after malformed tails, rotation, lock contention, or write failure.
    severity: critical
  - id: observability-log-redaction
    label: Opaque provider payloads or sensitive instruction data leak into an inappropriate application log.
    severity: critical
  - id: observability-log-contract-drift
    label: Runtime logs omit canonical context or filtering and sampling suppress required diagnostic events.
    severity: high
  - id: observability-traffic-fidelity
    label: Provider traffic artifacts lose meaningful frames, shape, timing, or failure evidence needed for diagnosis.
    severity: high
  - id: observability-retry-misclassification
    label: A retryable failure is abandoned or an unsafe/intentional failure is replayed.
    severity: critical
  - id: observability-replay-corruption
    label: Recovery replays a user turn or tool effect incorrectly, loses history, or carries unpaid provider state forward.
    severity: critical
  - id: observability-retry-runaway
    label: Retry attempts or recovery time exceed their containment envelope, or a recovery is bounced between layers.
    severity: high
  - id: observability-retry-status-confusion
    label: Retry status shown to the user or recorded in logs names the wrong cause, attempt, or retry type.
    severity: medium
contracts:
  - id: observability-cost-micros
    statement: Decimal and numeric USD charges are converted to whole microdollars deterministically, with malformed values rejected rather than coerced.
    seamIds: [observability-cost-accounting]
    riskIds: [observability-cost-overcharge]
  - id: observability-cost-dimensions
    statement: Prompt, cached-input, cache-write, and output usage are separated without billing reasoning twice, and missing dimensions remain ambiguous rather than invented.
    seamIds: [observability-cost-accounting]
    riskIds: [observability-cost-overcharge, observability-cost-unpriced]
  - id: observability-cost-provenance
    statement: A provider-reported charge takes precedence over a catalog estimate, while catalog, borrowed-provider, unknown-model, unknown-provider, and unknown-tier provenance remains explicit.
    seamIds: [observability-cost-accounting, observability-pricing-resolution]
    riskIds: [observability-cost-overcharge, observability-cost-unpriced]
  - id: observability-cost-summary
    statement: Cost summaries distinguish exact, estimated, partial, and unavailable evidence, deduplicate request records, group usage by provider/model, and render positive sub-cent values visibly.
    seamIds: [observability-cost-accounting]
    riskIds: [observability-cost-overcharge, observability-cost-unpriced]
  - id: observability-pricing-match
    statement: Pricing resolution matches provider/model aliases and case variants within the intended provider rules, borrows known model rates only with provenance, and fails closed for unknown tiers or models.
    seamIds: [observability-pricing-resolution]
    riskIds: [observability-cost-unpriced]
  - id: observability-pricing-version
    statement: Catalog and overlay pricing version identifiers are exposed so a recorded estimate can be traced to its pricing inputs.
    seamIds: [observability-pricing-resolution]
    riskIds: [observability-cost-unpriced]
  - id: observability-journal-order
    statement: Assistant text and reasoning deltas receive monotonic per-turn sequence numbers, ignore empty deltas, preserve approval continuations on one turn, and reset only for a new turn.
    seamIds: [observability-assistant-journal]
    riskIds: [observability-journal-loss]
  - id: observability-journal-items
    statement: Provider run items are normalized into persisted tool and assistant items, duplicate raw or canonical identities are suppressed as a group, and undo or clear removes only invalidated buffered evidence.
    seamIds: [observability-assistant-journal]
    riskIds: [observability-journal-loss, observability-replay-corruption]
  - id: observability-journal-ledger-equivalence
    statement: Journal-derived tool ledger state agrees with the live tool ledger for completed, incomplete, pending-approval, and rejected-tool turns, excluding separately recorded settlement metadata.
    seamIds: [observability-assistant-journal, observability-conversation-log]
    riskIds: [observability-journal-loss, observability-replay-corruption]
  - id: observability-log-replay
    statement: Conversation log writes keep streaming deltas in a recoverable sidecar policy, preserve sequence continuity across resume and rotation, and replay persisted tool output without losing retrieval references.
    seamIds: [observability-conversation-log]
    riskIds: [observability-log-corruption, observability-journal-loss]
  - id: observability-log-durability
    statement: Critical conversation events trigger the durability callback, while failures latch, preserve the original error, release locks and descriptors, and prevent an unsafe new session from starting.
    seamIds: [observability-conversation-log]
    riskIds: [observability-log-corruption]
  - id: observability-log-lifecycle
    statement: Stale dead-process locks are reclaimed, live locks conflict, post-close writes are inert, close is idempotent, and session clearing settles delta sidecars.
    seamIds: [observability-conversation-log]
    riskIds: [observability-log-corruption]
  - id: observability-conversation-routing
    statement: Conversation event dispatch routes operational and background events to the sink, accumulates assistant turn items, checkpoints them before errors, and forwards text/reasoning deltas to the required journal.
    seamIds: [observability-conversation-dispatch, observability-assistant-journal]
    riskIds: [observability-journal-loss, observability-replay-corruption]
  - id: observability-log-schema
    statement: Runtime log records contain schema-valid canonical fields, omit sentinel or null context, infer categories, and produce complete invalid-tool-call diagnostics.
    seamIds: [observability-runtime-log]
    riskIds: [observability-log-contract-drift]
  - id: observability-log-policy
    statement: Warning and error records survive category filtering and sampling, verbose payload policy is applied by level, and event categories are derived consistently from event prefixes.
    seamIds: [observability-runtime-log]
    riskIds: [observability-log-contract-drift, observability-log-redaction]
  - id: observability-traffic-sanitization
    statement: Provider traffic sanitization truncates instruction-like content and summarizes tool definitions while preserving user, tool, and readable content and replacing encrypted payloads with a visible marker.
    seamIds: [observability-provider-traffic]
    riskIds: [observability-log-redaction, observability-traffic-fidelity]
  - id: observability-traffic-summary
    statement: Received SSE and JSON traffic is recognized without a content-type when possible, merged into provider-shaped summaries, preserves malformed/error/unknown frame evidence, and avoids duplicating completed text.
    seamIds: [observability-provider-traffic]
    riskIds: [observability-traffic-fidelity]
  - id: observability-traffic-artifact
    statement: Provider request artifacts are stored under stable per-day and per-session paths with indexed metadata, correct evaluator naming, timing, completion, and cleanup behavior.
    seamIds: [observability-provider-traffic]
    riskIds: [observability-traffic-fidelity, observability-log-corruption]
  - id: observability-traffic-failure
    statement: Provider traffic records consumer-closed, aborted, terminated, and failed requests with bounded sanitized diagnostics while artifact-store failures do not escape logging calls or strand request paths.
    seamIds: [observability-provider-traffic]
    riskIds: [observability-traffic-fidelity, observability-log-redaction]
  - id: observability-subagent-result
    statement: Persisted subagent results retain status, text, file, tool, diff, and validation fields, strip nested run results, and accept older minimal results.
    seamIds: [observability-conversation-log]
    riskIds: [observability-log-redaction, observability-traffic-fidelity]
  - id: observability-chain-fingerprint
    statement: Chain-recovery fingerprints include provider, model, previous-response identity, item types, and call IDs while excluding request and tool output bodies, and distinguish chained from fresh requests.
    seamIds: [observability-retry-classification]
    riskIds: [observability-retry-misclassification, observability-replay-corruption]
  - id: observability-tool-continuation
    statement: Automatic committed-tool continuation is admitted only when completed tools and their history pairs are proven, and settled chain-recovery causes skip the automatic-replay claim.
    seamIds: [observability-retry-classification]
    riskIds: [observability-retry-misclassification, observability-replay-corruption]
  - id: observability-model-retry
    statement: Recognized model behavior failures produce bounded retry metadata, while unrelated errors and exhausted attempts terminate without retry.
    seamIds: [observability-retry-classification]
    riskIds: [observability-retry-misclassification, observability-retry-runaway]
  - id: observability-in-loop-retry
    statement: In-loop retry classifies transport and chain failures according to request chaining, output-containment, abort, progress, and attempt-limit evidence, and computes bounded jittered backoff with abortable sleep.
    seamIds: [observability-retry-classification, observability-retry-budget]
    riskIds: [observability-retry-misclassification, observability-retry-runaway, observability-replay-corruption]
  - id: observability-error-classification
    statement: Network, upstream, incomplete-stream, provider-state, and authentication errors are classified from direct and nested evidence with deliberate close/status precedence and no false-positive retries.
    seamIds: [observability-retry-classification]
    riskIds: [observability-retry-misclassification, observability-replay-corruption]
  - id: observability-recovery-plan
    statement: Classified failures map to state-safe fresh retries, replays, chain disabling, service-tier fallback, or termination, and retry counts advance or reset according to failure kind and fresh-start policy.
    seamIds: [observability-recovery-policy]
    riskIds: [observability-replay-corruption, observability-retry-runaway]
  - id: observability-recovery-apply
    statement: Recovery application preserves or rolls back the user message as planned, clears unsafe provider continuity, reconciles tool history, marks undispatched calls aborted and dispatched calls unknown, and emits recovery events.
    seamIds: [observability-recovery-execution]
    riskIds: [observability-replay-corruption, observability-journal-loss]
  - id: observability-retry-budget-contract
    statement: Physical attempts and automatic replays are independently capped, the recovery clock starts at the first retryable failure without resetting, deadlines refuse further claims, and exhaustion preserves its triggering cause.
    seamIds: [observability-retry-budget]
    riskIds: [observability-retry-runaway, observability-replay-corruption]
  - id: observability-retry-presentation
    statement: Retry classifications render the correct user-facing tool, attempt limit, retry type, source-specific cause, and nonblank error message while emitting matching structured log fields.
    seamIds: [observability-retry-presentation]
    riskIds: [observability-retry-status-confusion, observability-log-contract-drift]
  - id: observability-upstream-policy
    statement: Upstream status and rate-limit evidence determines retryability, long retry-after values are rejected, Retry-After overrides jittered backoff, and invalid headers do not create delay evidence.
    seamIds: [observability-retry-classification, observability-retry-budget]
    riskIds: [observability-retry-misclassification, observability-retry-runaway]
