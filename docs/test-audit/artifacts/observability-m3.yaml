decisions:
  - id: observability-model-cost-observability-m3
    testId: observability-model-cost
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file covers arithmetic, billing-dimension ambiguity, provider precedence, summary coverage states, deduplication, aggregation, and presentation in one cohesive cost seam.
    evidence:
      - model-cost.test.ts directly asserts integer-micro arithmetic and malformed-input rejection at parseUsdMicros.
      - model-cost.test.ts exercises provider charge precedence and explicit missing/ambiguous/unknown pricing states; application-run-loop.cost.test.ts only reuses parseUsdMicros for one integration assertion and is not a replacement for this accounting matrix.
    replacementTestIds: []
    status: proposed
  - id: observability-pricing-observability-m3
    testId: observability-pricing
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: Pricing lookup is a narrow, high-impact fail-closed seam with alias, gateway borrowing, tier, catalog completeness, and provenance coverage.
    evidence:
      - pricing.test.ts checks provider/model normalization, dated and vendor-qualified aliases, borrowed-provider provenance, and unknown-tier/model/provider outcomes.
      - pricing.test.ts pins catalog and overlay version identifiers and verifies every catalog model has a standard price; no assigned sibling asserts these lookup invariants.
    replacementTestIds: []
    status: proposed
  - id: observability-assistant-journal-characterization-observability-m3
    testId: observability-assistant-journal-characterization
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: >-
      This is a cross-implementation characterization, not a duplicate of the journal unit tests: it verifies that journal-derived tool state agrees with ToolExecutionLedger across settled and unsettled approval/error scenarios.
    evidence:
      - assistant-turn-journal.characterization.test.ts compares buildToolLedgerFromAssistantTurnItems output with ToolExecutionLedger.export() for completed, incomplete, pending, and rejected-tool turns.
      - assistant-turn-journal.test.ts tests journal mechanics but never compares its output with the live ledger, so removing this file loses the cross-component invariant.
    replacementTestIds: []
    status: proposed
  - id: observability-assistant-journal-observability-m3
    testId: observability-assistant-journal
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: The journal is crash/recovery evidence and the tests cover sequence, turn identity, normalization, deduplication, pruning, and full clearing through its public API.
    evidence:
      - assistant-turn-journal.test.ts asserts monotonic sequence and approval continuation identity as well as raw-to-persisted tool item normalization.
      - assistant-turn-journal.test.ts separately guards duplicate raw/canonical/group items and undo/clear retention rules; the characterization sibling does not cover these mechanics.
    replacementTestIds: []
    status: proposed
  - id: observability-conversation-log-writer-observability-m3
    testId: observability-conversation-log-writer
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: This file protects critical persistence and recovery behavior at a real filesystem boundary, including durability failures and stale locks where a weak unit substitute would miss corruption.
    evidence:
      - conversation-log-writer.test.ts verifies sidecar settlement/resume/rotation, sequence recovery through malformed tails, and replay of large tool-result references.
      - conversation-log-writer.test.ts injects fsync/write/close/read failures and checks lock release, latching, original-error preservation, and no unsafe rotation; conversation-persistence.test.ts exercises callers but is not a replacement for these writer failure contracts.
    replacementTestIds: []
    status: proposed
  - id: observability-conversation-logger-observability-m3
    testId: observability-conversation-logger
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: The routing seam is meaningful, but the file contains two materially identical final tests for forwarding text/reasoning deltas to the required journal; rewrite can retain one stronger case while preserving the unique dispatch and checkpoint cases.
    evidence:
      - conversation-logger.test.ts has both "dispatchEventToLog forwards text and reasoning deltas to the journal" and "dispatchEventToLog forwards text and reasoning deltas to the required journal", with equivalent setup and identical assertions.
      - conversation-logger.test.ts also uniquely asserts sink replacement, sink failure handling, turn stamping, background events, checkpoint-before-error, and event-specific routing, so whole-file deletion is not supported.
    replacementTestIds: []
    status: proposed
  - id: observability-logging-contract-observability-m3
    testId: observability-logging-contract
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: These deterministic assertions define the schema and policy primitives that downstream logging tests consume.
    evidence:
      - logging-contract.test.ts parses built records through RuntimeLogSchema and checks omission of sentinel/null context plus canonical diagnostics.
      - logging-contract.test.ts independently covers category parsing, error retention, verbose-payload policy, sampling, and event-prefix inference; logging-service.test.ts covers integration output but not these pure policy boundaries.
    replacementTestIds: []
    status: proposed
  - id: observability-logging-service-observability-m3
    testId: observability-logging-service
    role: second_opinion
    reviewer: observability-m3
    sourceArtifact: docs/test-audit/artifacts/observability-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file is a service-level integration layer for asynchronous app logs, environment/configuration policy, provider artifact wiring, and accepted redaction behavior; its filesystem boundary is intentional evidence.
    evidence:
      - logging-service.test.ts verifies directory/disable/console/correlation/rotation behavior and reads emitted JSON records rather than mocking the service internals.
      - logging-service.test.ts explicitly covers invalid metadata fallback, category filtering with error preservation, and the accepted verbose/evaluator payload decisions; no unit-only sibling can replace this composition coverage.
