schemaVersion: 2
domains:
  - id: platform-services
    label: Service-layer seams not owned by other domains
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Integration-style service suite
seams:
  - id: platform-services-a-stream-boundary
    label: Native application stream items crossing service consumers
  - id: platform-services-a-background-activity
    label: Background task observation state and terminal-safe labels
  - id: platform-services-a-workspace-execution
    label: Session workspace and local-versus-remote execution context
  - id: platform-services-a-durable-file-state
    label: Filesystem-backed history and workspace enumeration
  - id: platform-services-a-generation-invalidation
    label: Stale turn work prevented from mutating session state
  - id: platform-services-a-hook-runtime
    label: Discovering, loading, registering, and dispatching user hooks
  - id: platform-services-a-memory-policy-storage
    label: Memory capability policy and durable store behavior
  - id: platform-services-a-guard-thresholds
    label: Input growth and uncached-input safety decisions
  - id: platform-services-a-credit-refresh
    label: Shared Grok credit usage refresh state
  - id: platform-services-a-model-catalog
    label: Provider model discovery, normalization, and cache boundaries
  - id: platform-services-a-terminal-notification
    label: Terminal capability detection and notification emission
  - id: platform-services-a-interruption-normalization
    label: Provider interruption records normalized for approval handling
  - id: platform-services-a-mode-notices
    label: Canonical profile transition notices
risks:
  - id: platform-services-a-stream-envelope-leak
    label: Retired or nested provider stream envelopes reach application consumers.
    severity: high
  - id: platform-services-a-liveness-misreport
    label: Background work is shown as hung or terminal labels leak control characters.
    severity: medium
  - id: platform-services-a-workspace-crossing
    label: Local and remote workspace roots are confused or a lease retargets another session.
    severity: high
  - id: platform-services-a-persistence-loss
    label: Durable history or memory state is lost, corrupted, or exposed across scopes.
    severity: high
  - id: platform-services-a-stale-mutation
    label: Superseded asynchronous turn work mutates current session state.
    severity: high
  - id: platform-services-a-hook-boundary-bypass
    label: Untrusted hook code loads, registration escapes its window, or callback failure halts dispatch.
    severity: high
  - id: platform-services-a-memory-policy-leak
    label: A subject receives unintended memory tools or project memory crosses project boundaries.
    severity: high
  - id: platform-services-a-guard-decision-error
    label: Input guards block safe requests or miss replay and uncached-input risk.
    severity: high
  - id: platform-services-a-credit-refresh-storm
    label: Credit refreshes ignore cooldown, duplicate concurrent work, or retain invalid account data.
    severity: medium
  - id: platform-services-a-model-fetch-error
    label: Model discovery uses the wrong endpoint, auth shape, cache entry, or error detail.
    severity: medium
  - id: platform-services-a-terminal-output-injection
    label: Notification output emits unsafe control sequences or chooses an unusable transport.
    severity: medium
  - id: platform-services-a-interruption-shape-loss
    label: Provider-specific interruption shapes lose tool identity, arguments, or call IDs.
    severity: high
  - id: platform-services-a-notice-drift
    label: Profile notices do not map to canonical profile identity or active state.
    severity: low
fixtures: []
contracts:
  - id: platform-services-a-contract-native-stream-items
    statement: Stream selection strips bookkeeping events, falls back to history when needed, and recognizes committed output only for meaningful or conservatively unknown events.
    seamIds:
      - platform-services-a-stream-boundary
    riskIds:
      - platform-services-a-stream-envelope-leak
  - id: platform-services-a-contract-native-stream-consumers
    statement: Application stream consumers use the native event protocol and production source contains no retired or nested SDK stream envelopes.
    seamIds:
      - platform-services-a-stream-boundary
    riskIds:
      - platform-services-a-stream-envelope-leak
  - id: platform-services-a-contract-background-liveness
    statement: Background activity clamps clock skew, reports lifecycle and observation age separately, and sanitizes bounded tool labels.
    seamIds:
      - platform-services-a-background-activity
    riskIds:
      - platform-services-a-liveness-misreport
  - id: platform-services-a-contract-command-message-normalization
    statement: Tool-call arguments are cached onto canonical results without mutation, while emitted command messages deduplicate and retain rejection records.
    seamIds:
      - platform-services-a-stream-boundary
    riskIds:
      - platform-services-a-stream-envelope-leak
  - id: platform-services-a-contract-execution-workspace
    statement: Execution contexts distinguish local and remote cwd, enforce absolute workspace roots, restore the session root, and keep pinned leases isolated.
    seamIds:
      - platform-services-a-workspace-execution
    riskIds:
      - platform-services-a-workspace-crossing
  - id: platform-services-a-contract-workspace-enumeration
    statement: Workspace enumeration is breadth-first and bounded, lists symlinks without traversing them, and follows the active workspace lease.
    seamIds:
      - platform-services-a-durable-file-state
      - platform-services-a-workspace-execution
    riskIds:
      - platform-services-a-workspace-crossing
  - id: platform-services-a-contract-generation-safety
    statement: Undo, model change, import, reset, disposal, and abort-generation paths prevent stale stream mutation and reject stale approval continuation.
    seamIds:
      - platform-services-a-generation-invalidation
    riskIds:
      - platform-services-a-stale-mutation
  - id: platform-services-a-contract-grok-credit-refresh
    statement: Grok usage refreshes honor cooldown and retry backoff, collapse concurrent requests, preserve valid state on failures, and reset on account or credential changes.
    seamIds:
      - platform-services-a-credit-refresh
    riskIds:
      - platform-services-a-credit-refresh-storm
  - id: platform-services-a-contract-history-durability
    statement: History persists multimodal and legacy turns, trims and clears predictably, logs recoverable failures, quarantines corrupt input, and preserves prior data across failed saves.
    seamIds:
      - platform-services-a-durable-file-state
    riskIds:
      - platform-services-a-persistence-loss
  - id: platform-services-a-contract-hook-discovery
    statement: Hook discovery orders supported user and trusted project files, rejects symlink escapes, honors enable switches, and treats missing roots as empty.
    seamIds:
      - platform-services-a-hook-runtime
    riskIds:
      - platform-services-a-hook-boundary-bypass
  - id: platform-services-a-contract-hook-editor-shim
    statement: Hook editor setup creates the declaration and TypeScript path mapping files expected by hook authors.
    seamIds:
      - platform-services-a-hook-runtime
    riskIds:
      - platform-services-a-hook-boundary-bypass
  - id: platform-services-a-contract-hook-module-loading
    statement: Native and Jiti hook loaders accept callable registrations and wrap invalid exports and evaluation failures with source paths.
    seamIds:
      - platform-services-a-hook-runtime
    riskIds:
      - platform-services-a-hook-boundary-bypass
  - id: platform-services-a-contract-hook-registry
    statement: Hook registration preserves callback order and duplicates, permits unsubscribe, rolls back failed registration, isolates failures with timeout diagnostics, and deduplicates event IDs.
    seamIds:
      - platform-services-a-hook-runtime
    riskIds:
      - platform-services-a-hook-boundary-bypass
  - id: platform-services-a-contract-hook-service
    statement: Hook service starts once, loads valid discovered files in order, isolates failures, exposes emit and shutdown behavior, and reports discovery diagnostics.
    seamIds:
      - platform-services-a-hook-runtime
    riskIds:
      - platform-services-a-hook-boundary-bypass
  - id: platform-services-a-contract-hook-system
    statement: The hook system filters project trust, dispatches session and approval lifecycle events, distinguishes policy auto-approval, and ignores events after shutdown.
    seamIds:
      - platform-services-a-hook-runtime
    riskIds:
      - platform-services-a-hook-boundary-bypass
  - id: platform-services-a-contract-input-surge-analysis
    statement: Input surge analysis canonicalizes provider and wrapper shapes, detects duplicate calls and call-result pairs, and allows explicitly safe growth cases.
    seamIds:
      - platform-services-a-guard-thresholds
    riskIds:
      - platform-services-a-guard-decision-error
  - id: platform-services-a-contract-large-uncached-guard
    statement: Large uncached input warnings respond to provider/model/reasoning and idle or resumed-session changes, remain stable per pending input, and avoid unnecessary serialization.
    seamIds:
      - platform-services-a-guard-thresholds
    riskIds:
      - platform-services-a-guard-decision-error
  - id: platform-services-a-contract-memory-capabilities
    statement: Memory capability construction grants mode-appropriate read/write tools and guidance, injects only intended context, isolates project scopes, and honors disablement.
    seamIds:
      - platform-services-a-memory-policy-storage
    riskIds:
      - platform-services-a-memory-policy-leak
  - id: platform-services-a-contract-memory-store
    statement: File memory storage normalizes and validates records, recovers durable indexes, serializes mutations, bounds context, and handles missing content safely.
    seamIds:
      - platform-services-a-memory-policy-storage
      - platform-services-a-durable-file-state
    riskIds:
      - platform-services-a-persistence-loss
      - platform-services-a-memory-policy-leak
  - id: platform-services-a-contract-mode-notices
    statement: Mode notice helpers map canonical profile IDs to enter and exit notices and safely prime only resolvable active profiles.
    seamIds:
      - platform-services-a-mode-notices
    riskIds:
      - platform-services-a-notice-drift
  - id: platform-services-a-contract-model-discovery
    statement: Model discovery uses provider-specific endpoints and authentication, normalizes and filters results, enriches catalog context windows, caches correctly, and preserves error causes.
    seamIds:
      - platform-services-a-model-catalog
    riskIds:
      - platform-services-a-model-fetch-error
  - id: platform-services-a-contract-notification-transport
    statement: Notification transport selects supported OSC or bell paths by terminal and CI/TTY state, sanitizes payloads, and supports tmux and injected writers.
    seamIds:
      - platform-services-a-terminal-notification
    riskIds:
      - platform-services-a-terminal-output-injection
  - id: platform-services-a-contract-interruption-shapes
    statement: Interruption helpers safely inspect records, bind methods, recover canonical IDs, and normalize command arguments across provider shapes.
    seamIds:
      - platform-services-a-interruption-normalization
    riskIds:
      - platform-services-a-interruption-shape-loss
