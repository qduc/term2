    confidence: high
    reason: This is the narrow lifecycle evidence sink contract, distinct from candidate admission.
    evidence:
      - Lines 4-18 assert frozen candidate/publication records with exact stage and outcome values.
      - Lines 20-27 assert recorder failure is swallowed rather than escaping the observer.
    replacementTestIds: []
    status: proposed
