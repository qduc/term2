schemaVersion: 2
domains:
  - id: platform-services
    label: Service-layer seams not owned by other domains.
suites:
  - id: unit
    label: Default Vitest unit suite
seams:
  - id: platform-services-b-openai-candidate-lifecycle
    label: OpenAI terminal observation to provider-continuity checkpoint.
  - id: platform-services-b-openai-lifecycle-evidence
    label: Sanitized, frozen OpenAI checkpoint lifecycle diagnostics.
  - id: platform-services-b-openai-identity
    label: Retained and immutable OpenAI provider identity.
  - id: platform-services-b-openai-selector-parity
    label: OpenAI root selector parity eligibility and fail-closed diagnostics.
  - id: platform-services-b-plan-enforcement
    label: Plan-mode interceptor enforcement for tool dispatch.
  - id: platform-services-b-profile-resolution
    label: Typed Profile resolution, inheritance, availability, and legacy mapping.
  - id: platform-services-b-profile-transition
    label: Profile transition planning, persistence, rebuild, and notices.
  - id: platform-services-b-provider-continuity
    label: Chaining state, checkpoint lifecycle, debt, and successor proof.
  - id: platform-services-b-rtk-installation
    label: RTK platform assets, checksums, and installation outcomes.
  - id: platform-services-b-rtk-command-wrapping
    label: RTK command eligibility and shell wrapper boundaries.
  - id: platform-services-b-runtime-settings-routing
    label: Runtime settings transaction and conversation side-effect routing.
  - id: platform-services-b-rollover-brief
    label: Session rollover handoff brief content and reason normalization.
  - id: platform-services-b-skills-discovery
    label: Skill frontmatter discovery, precedence, filtering, and cataloging.
  - id: platform-services-b-ssh-transport
    label: SSH connection, command transport, cancellation, and path encoding.
  - id: platform-services-b-stream-processing
    label: Application stream event normalization, accounting, and lifecycle output.
  - id: platform-services-b-stream-snapshot
    label: Defensive extraction of replay and finalization stream snapshots.
  - id: platform-services-b-tool-arguments
    label: Tool argument parsing and malformed JSON diagnostics.
  - id: platform-services-b-tool-ledger-recovery
    label: Tool execution ledger pairing, settlement, and history recovery.
  - id: platform-services-b-workspace-root
    label: Published active workspace root and process-cwd fallback.
  - id: platform-services-b-worktree-parser
    label: Git worktree porcelain record parsing.
  - id: platform-services-b-worktree-transition
    label: Worktree enter, exit, and worker target transition decisions.
risks:
  - id: platform-services-b-risk-openai-candidate-corruption
    label: A non-terminal or stale OpenAI observation becomes reusable continuity state.
    severity: high
  - id: platform-services-b-risk-openai-evidence-loss
    label: Lifecycle diagnostics are mutable, unsanitized, or able to disrupt execution.
    severity: medium
  - id: platform-services-b-risk-openai-identity-drift
    label: A stale or incomplete provider identity is reused for a later request.
    severity: high
  - id: platform-services-b-risk-selector-parity-bypass
    label: Root selector parity accepts an ineligible checkpoint or fails open.
    severity: high
  - id: platform-services-b-risk-plan-bypass
    label: Mutating or unknown delegated tools execute while Plan enforcement is active.
    severity: high
  - id: platform-services-b-risk-profile-resolution-drift
    label: Profile inheritance, availability, or legacy compatibility resolves incorrectly.
    severity: high
  - id: platform-services-b-risk-profile-transition-inconsistency
    label: A profile transition commits without required rebuild, history, or notice effects.
    severity: high
  - id: platform-services-b-risk-continuity-debt
    label: Stale chaining state, unpaid tool debt, or weak successor proof causes unsafe replay.
    severity: high
  - id: platform-services-b-risk-rtk-install-integrity
    label: RTK installation accepts an unsupported, unverifiable, or failed asset.
    severity: high
  - id: platform-services-b-risk-rtk-command-boundary
    label: RTK rewrites an unsafe command or changes pipeline/subshell semantics.
    severity: high
  - id: platform-services-b-risk-settings-order
    label: Runtime effects run before settings commit or legacy mode writes diverge.
    severity: high
  - id: platform-services-b-risk-rollover-information-loss
    label: A successor session omits source, reason, retrieval discipline, or next step.
    severity: medium
  - id: platform-services-b-risk-skills-discovery-drift
    label: Skill metadata, precedence, filtering, or generated catalog drifts silently.
    severity: medium
  - id: platform-services-b-risk-ssh-remote-effect
    label: SSH transport hangs, misstates remote effect, or allows path metacharacter injection.
    severity: high
  - id: platform-services-b-risk-stream-event-loss
    label: Provider stream events, usage, tool identity, or compaction lifecycle are corrupted.
    severity: high
  - id: platform-services-b-risk-snapshot-shape-crash
    label: Malformed stream snapshot fields crash replay or finalization callers.
    severity: medium
  - id: platform-services-b-risk-tool-argument-diagnostic
    label: Malformed tool arguments are silently misrepresented or lose caller identity.
    severity: medium
  - id: platform-services-b-risk-ledger-recovery
    label: Tool history recovery drops valid work, duplicates pairs, or invites blind retry.
    severity: high
  - id: platform-services-b-risk-workspace-scope
    label: Safety and filesystem callers use the wrong active workspace root.
    severity: high
  - id: platform-services-b-risk-worktree-record
    label: Git worktree flags or branch/path fields are parsed incorrectly.
    severity: medium
  - id: platform-services-b-risk-worktree-transition
    label: A transition enters an unsafe, unavailable, busy, or unintended worktree.
    severity: high
fixtures: []
contracts:
  - id: platform-services-b-contract-openai-candidate
    statement: Only a terminal OpenAI observation with response ID and exact prefix binding may become a continuity candidate; stale observations are rejected.
    seamIds: [platform-services-b-openai-candidate-lifecycle]
    riskIds: [platform-services-b-risk-openai-candidate-corruption]
  - id: platform-services-b-contract-openai-evidence
    statement: OpenAI checkpoint lifecycle evidence is sanitized, frozen, recorded after accepted observation, and recorder failures are swallowed.
    seamIds: [platform-services-b-openai-lifecycle-evidence]
    riskIds: [platform-services-b-risk-openai-evidence-loss]
  - id: platform-services-b-contract-openai-identity
    statement: A complete observed OpenAI identity is frozen and copied; incomplete observations retain a previous complete identity or leave null.
    seamIds: [platform-services-b-openai-identity]
    riskIds: [platform-services-b-risk-openai-identity-drift]
  - id: platform-services-b-contract-selector-parity
    statement: Root selector parity is eligible only for matching accepted OpenAI checkpoint, identity, origin, revision, and history prefix; failures are explicit and fail closed.
    seamIds: [platform-services-b-openai-selector-parity]
    riskIds: [platform-services-b-risk-selector-parity-bypass]
  - id: platform-services-b-contract-plan-enforcement
    statement: Plan mode blocks mutating and unknown delegated tools while allowing read-only delegated roles and non-mutating tools; normal mode passes through.
    seamIds: [platform-services-b-plan-enforcement]
    riskIds: [platform-services-b-risk-plan-bypass]
  - id: platform-services-b-contract-profile-resolution
    statement: The Profile resolver applies typed inheritance and restrictive semantics, reports unavailable or invalid definitions, and preserves legacy adapter rules.
    seamIds: [platform-services-b-profile-resolution]
    riskIds: [platform-services-b-risk-profile-resolution-drift]
  - id: platform-services-b-contract-profile-transition
    statement: Profile transitions resolve before mutation and apply class-specific history, rebuild, persistence, and composed notice effects.
    seamIds: [platform-services-b-profile-transition]
    riskIds: [platform-services-b-risk-profile-transition-inconsistency]
  - id: platform-services-b-contract-provider-continuity
    statement: Provider continuity clears or breaks chaining and debt correctly, and accepts successor reuse only with exact binding and immutable post-commit proof.
    seamIds: [platform-services-b-provider-continuity]
    riskIds: [platform-services-b-risk-continuity-debt]
  - id: platform-services-b-contract-rtk-installation
    statement: RTK resolves supported assets and installs only after successful fetch, extraction, and SHA-256 verification, returning null on unsupported or failed setup.
    seamIds: [platform-services-b-rtk-installation]
    riskIds: [platform-services-b-risk-rtk-install-integrity]
  - id: platform-services-b-contract-rtk-command-wrapping
    statement: RTK wraps only eligible top-level commands while preserving ineligible commands and pipeline/subshell/redirection boundaries.
    seamIds: [platform-services-b-rtk-command-wrapping]
    riskIds: [platform-services-b-risk-rtk-command-boundary]
  - id: platform-services-b-contract-runtime-settings
    statement: Runtime setting changes commit through one transaction before effects, and profile/legacy mode writes route the correct notices and rebuild behavior.
    seamIds: [platform-services-b-runtime-settings-routing]
    riskIds: [platform-services-b-risk-settings-order]
  - id: platform-services-b-contract-rollover-brief
    statement: A rollover brief carries source and successor sessions, reason, handoff, retrieval constraints, and next open step without inventing an unspecified reason.
    seamIds: [platform-services-b-rollover-brief]
    riskIds: [platform-services-b-risk-rollover-information-loss]
  - id: platform-services-b-contract-skills-discovery
    statement: Skills discovery parses frontmatter and body, applies scope precedence and invocation filtering, and emits the expected catalog.
    seamIds: [platform-services-b-skills-discovery]
    riskIds: [platform-services-b-risk-skills-discovery-drift]
  - id: platform-services-b-contract-ssh-transport
    statement: SSH transport reports connection and dispatch failures, settles in-flight work with typed unknown-effect outcomes, honors opt-in timeout/abort, and quotes paths safely.
    seamIds: [platform-services-b-ssh-transport]
    riskIds: [platform-services-b-risk-ssh-remote-effect]
  - id: platform-services-b-contract-stream-processing
    statement: Stream processing enforces branded input, accumulates text/reasoning, normalizes tool and usage events, and preserves compaction lifecycle data.
    seamIds: [platform-services-b-stream-processing]
    riskIds: [platform-services-b-risk-stream-event-loss]
  - id: platform-services-b-contract-stream-snapshot
    statement: Stream snapshot extraction returns expected fields and degrades absent or non-array data to safe defaults.
    seamIds: [platform-services-b-stream-snapshot]
    riskIds: [platform-services-b-risk-snapshot-shape-crash]
  - id: platform-services-b-contract-tool-arguments
    statement: Tool argument parsing preserves valid/non-string input and emits identity-bearing diagnostics for brace-prefixed malformed JSON.
    seamIds: [platform-services-b-tool-arguments]
    riskIds: [platform-services-b-risk-tool-argument-diagnostic]
  - id: platform-services-b-contract-tool-ledger
    statement: The tool ledger pairs calls and results, preserves history, settles open calls by observed effect, and reconciles recoverable history idempotently.
    seamIds: [platform-services-b-tool-ledger-recovery]
    riskIds: [platform-services-b-risk-ledger-recovery]
  - id: platform-services-b-contract-workspace-root
    statement: Active workspace root follows a leased ExecutionContext and returns process cwd when no lease exists or entry is rejected.
    seamIds: [platform-services-b-workspace-root]
    riskIds: [platform-services-b-risk-workspace-scope]
  - id: platform-services-b-contract-worktree-parser
    statement: Git worktree list parsing preserves records, branch names, detached/bare/locked/prunable flags, and trailing records.
    seamIds: [platform-services-b-worktree-parser]
    riskIds: [platform-services-b-risk-worktree-record]
  - id: platform-services-b-contract-worktree-transition
    statement: Worktree transition resolution rejects ambiguous, unavailable, bare, home, or busy targets and reports enter/exit/worker outcomes deterministically.
    seamIds: [platform-services-b-worktree-transition]
    riskIds: [platform-services-b-risk-worktree-transition]
