decisions:
  - id: prompts-commands-auto-approve-prompts-commands-m3
    testId: prompts-commands-auto-approve
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: rewrite_candidate
    confidence: high
    reason: The setting transition contract is meaningful and unique at this command seam, but four action tests duplicate the same inline settings, apply, and message harness instead of using a compact case matrix or helper.
    evidence:
      - The file's metadata, empty-input, valid-mode, always-warning, normalization, and invalid-mode cases cover distinct observable outcomes at createAutoApproveSlashCommand.
      - The valid, always, normalized, and invalid action cases each recreate equivalent settingsService, applyRuntimeSetting, and addSystemMessage dependencies; a table-driven fixture would reduce repetition without removing boundary cases.
      - source/services/settings/settings-service.test.ts covers lower-level sandbox/always exclusivity, not this command's persistence, runtime-application, completion, or user-message contract, so it is not a replacement.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-compact-prompts-commands-m3
    testId: prompts-commands-compact
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file protects the user-visible asynchronous compaction lifecycle at the command boundary, including the blank-screen regression guard and failure conversion.
    evidence:
      - The deferred promise case proves the start announcement precedes completion; the success and rejection cases exercise both settled outcomes.
      - source/services/session/turn-workflow.outcome-contract.test.ts exercises compaction/continuation workflow behavior, but does not assert createCompactSlashCommand's immediate announcement or failure message.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-resume-prompts-commands-m3
    testId: prompts-commands-resume
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: Resume parsing and the browse-versus-target return contract matter, but the file repeats command construction and callback mocks across cases and overlaps with the same factory outcomes in the hook test.
    evidence:
      - The file uniquely checks metadata, empty/undefined/list browse routing, target dispatch, token-count rejection, and path-safe id rejection at createResumeSlashCommand.
      - source/hooks/use-app-commands.test.ts repeats the empty/ls browse and target/extra-argument/invalid-id outcomes, although through hook wiring; this is sibling evidence of overlap, not a safe replacement for the focused factory seam.
      - The repeated local command setup can be consolidated into a shared harness or table for grammar cases while retaining the async target dispatch assertion.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-retry-failed-turn-prompts-commands-m3
    testId: prompts-commands-retry-failed-turn
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the only focused command-seam evidence that retry-turn starts the failed-turn retry and translates a false result into its user-facing diagnostic while keeping success silent.
    evidence:
      - The two tests distinguish promise success from no-new-response reporting and assert the command's immediate true return.
      - source/services/subagents/subagent-manager.retry.test.ts covers nested subagent retry events, not the retry-turn slash-command adapter, so it cannot replace this evidence.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-retry-tool-prompts-commands-m3
    testId: prompts-commands-retry-tool
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: The command is a separate public action from rewind and protects both silent successful retry and the no-tool diagnostic.
    evidence:
      - The tests assert retryLastToolOutput is invoked asynchronously, success remains silent, and false reports exactly No tool call to retry.
      - source/utils/conversation/message-utils.test.ts asserts a lower-level transcript preparation rule for retry-tool, but not this command's callback and message behavior.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-rewind-prompts-commands-m3
    testId: prompts-commands-rewind
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: This broad file is a coherent focused suite for a high-risk command grammar and its edit/resend side effects; its helper harness avoids the duplication that would make a rewrite candidate.
    evidence:
      - Cases cover picker and last defaults, visible-position versus offset turn numbering, empty and invalid targets, edit/resend order and overrides, image preservation, aliases, and redraw gating.
      - source/services/session/session-manager.test.ts and source/services/conversation/conversation-service.facade.test.ts cover domain rewind cleanup and persistence, not command argument resolution, disposition, or input/menu side effects.
      - The shared makeHarness and makeCommand helpers centralize setup while keeping independently changeable target, disposition, alias, invalid-input, and side-effect contracts visible.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-sandbox-prompts-commands-m3
    testId: prompts-commands-sandbox
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: rewrite_candidate
    confidence: high
    reason: The toggle and announcement contract is valuable, but the two state-direction tests duplicate the full dependency harness and do not exercise the command's always-mode demotion note.
    evidence:
      - The true-to-false and false-to-true cases prove persistence, runtime application, and distinct status text at createSandboxSlashCommand.
      - source/services/settings/settings-service.test.ts and source/components/layout/StatusBar.test.tsx cover lower-level normalization/display of sandbox and always settings, not command callback ordering and announcement.
      - A small parameterized state table can retain both directions and add the production branch where enabling sandbox demotes always, while removing repeated setup.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-skills-prompts-commands-m3
    testId: prompts-commands-skills
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: rewrite_candidate
    confidence: high
    reason: Skill selection is a real next-request command contract, but four cases repeat the same service and callback setup and can be expressed as a compact input/outcome table alongside the metadata case.
    evidence:
      - The file protects metadata/completion, valid selection and announcement, unknown-name rejection, empty browse routing, case-insensitive matching, and whitespace normalization.
      - No sibling test found imports createSkillsSlashCommand or asserts its activation/error text; the unique seam should remain covered.
      - Each action case rebuilds equivalent selectedSkills, messages, inputs, and command dependencies, making setup-only consolidation defensible without deleting any behavior case.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-explorer-delegation-contract-prompts-commands-m3
    testId: prompts-commands-explorer-delegation-contract
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: This test protects product-authored parent/explorer ownership language across the model-specific and plan-mode prompt files, rather than a disposable rendering snapshot.
    evidence:
      - It checks bounded evidence collection, parent-owned analysis/synthesis, one-task framing, and distinct scope discipline across gpt-5.6, kimi, plan, orchestrator, explorer, worker, mentor, and librarian prompt files.
      - No assigned sibling asserts the same cross-file explorer contract; source/tools/agent/run-subagent.test.ts checks tool description wording, a different generated seam.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-orchestrator-prompt-prompts-commands-m3
    testId: prompts-commands-orchestrator-prompt
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: The orchestrator markdown is product behavior governing user contact, delegation ownership, worktree coordination, and control semantics; these assertions are targeted contract checks rather than snapshots.
    evidence:
      - Cases cover outcome ownership, no obsolete direct-work advice, overrule authority, disagreement reporting, own-voice final reporting, worktree pinning, status/result discipline, structured validation evidence, and steering/cancellation limits.
      - source/services/mode-notices.test.ts checks the mode-entry notice, while this file checks the detailed orchestrator role prompt; neither replaces the other.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-prefix-quality-prompts-commands-m3
    testId: prompts-commands-prefix-quality
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: This integration-level prompt contract verifies mode notices, prefix cache stability, agent assembly, and prompt fragment selection together; it catches wiring regressions that direct prompt-constructor tests cannot.
    evidence:
      - The cases read real prompt files, construct standard/plan/mentor agent definitions, and compare live instructions/tools plus Plan notice and stub/full workflow boundaries.
      - source/prompts/prompt-constructor.test.ts directly checks PromptSpec values, but does not replace the getAgentDefinition and profileEnterNotice integration assertions here.
      - source/agent.test.ts checks selected instruction inclusion for some features, but not the mode-prefix equality and Plan notice relationship.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-prompt-constructor-prompts-commands-m3
    testId: prompts-commands-prompt-constructor
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the focused contract matrix for the central prompt-spec constructor, spanning model routing, stable fragment composition, lite/non-lite differences, and conditional capability guidance.
    evidence:
      - Independent cases exercise gpt-5.6/codex boundaries, all non-lite profile equivalence, fragment order, approval and Plan stubs, lite minimization, sandbox/background/memory/session-browser, and foreground/background subagent guidance.
      - source/agent.test.ts and source/prompts/prefix-quality.test.ts provide integration or selected feature checks, but neither covers this constructor's full option matrix and ordering contract.
      - The cases have independently changeable feature contracts and already use small local option objects; no deletion or broad rewrite is justified by observed duplication.
    replacementTestIds: []
    status: proposed
  - id: prompts-commands-prompt-profiles-prompts-commands-m3
    testId: prompts-commands-prompt-profiles
    role: second_opinion
    reviewer: prompts-commands-m3
    sourceArtifact: docs/test-audit/artifacts/prompts-commands-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file guards the profile registry's filesystem validity and its all-model fallback guarantee, a small unique seam with direct failure impact on every prompt request.
