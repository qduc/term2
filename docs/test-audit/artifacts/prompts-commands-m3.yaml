schemaVersion: 2
domains:
  - id: prompts-commands
    label: Prompt construction and slash-command behavior
suites:
  - id: unit
    label: Deterministic unit and seam tests
seams:
  - id: prompts-commands-command-factory
    label: Boundary where a slash-command factory turns injected callbacks into a command contract
  - id: prompts-commands-settings-command
    label: Boundary where slash commands persist settings, apply runtime values, and announce state
  - id: prompts-commands-conversation-command
    label: Boundary where slash commands request compaction, resume, or retry work
  - id: prompts-commands-rewind-command
    label: Boundary where rewind command text resolves a visible turn and chooses edit or resend behavior
  - id: prompts-commands-skill-command
    label: Boundary where a named skill is selected for the next request
  - id: prompts-commands-slash-resolver
    label: Boundary where typed command names resolve by exact or unique-prefix matching
  - id: prompts-commands-profile-selection
    label: Boundary where a model and profile select prompt base content
  - id: prompts-commands-prompt-constructor
    label: Boundary where profile, mode, and feature settings become a prompt specification
  - id: prompts-commands-prompt-addendum
    label: Boundary where runtime capability checks produce model-facing prompt guidance
  - id: prompts-commands-prompt-files
    label: Boundary where checked-in role and mode prompt files define agent behavior
risks:
  - id: prompts-commands-command-routing
    label: A user command invokes the wrong action, clears input unexpectedly, or reports the wrong command state.
    severity: high
  - id: prompts-commands-setting-drift
    label: A setting command persists a value without applying it at runtime, or announces a state that is not active.
    severity: high
  - id: prompts-commands-conversation-state-loss
    label: Manual resume, compaction, or retry loses work, hides failure, or starts work without the expected user-visible state.
    severity: critical
  - id: prompts-commands-rewind-misaddress
    label: Rewind targets the wrong visible turn or silently performs a different disposition than the user requested.
    severity: critical
  - id: prompts-commands-prompt-contract-drift
    label: A model receives the wrong base prompt, mode workflow, or feature guidance after a prompt-construction change.
    severity: high
  - id: prompts-commands-authority-drift
    label: Prompt guidance grants a role authority, delegation responsibility, or execution capability outside its intended contract.
    severity: critical
  - id: prompts-commands-environment-fallback
    label: Prompt guidance assumes unavailable search binaries or fails to warn about unsafe shell invocation patterns.
    severity: medium
  - id: prompts-commands-guidance-regression
    label: Reasoning or delegation guidance disappears or encourages wasteful, looping, or unowned work.
    severity: high
fixtures:
  - id: prompts-commands-command-dependencies
    label: Injected command callbacks, settings services, and system-message sinks
  - id: prompts-commands-async-command-dependencies
    label: Deferred compaction, resume, and retry promises with message sinks
  - id: prompts-commands-rewind-harness
    label: Visible rewind items and injected rewind, input, menu, and redraw callbacks
  - id: prompts-commands-skill-catalog
    label: Deterministic available-skill records and selection callbacks
  - id: prompts-commands-prompt-file-fixtures
    label: Checked-in base, mode, and role prompt files read as model-facing text
  - id: prompts-commands-model-profile-corpus
    label: Representative model names and built-in prompt profiles
  - id: prompts-commands-prompt-option-matrix
    label: Prompt feature flags, execution context, and resolved profile options
  - id: prompts-commands-binary-capability-probe
    label: Injected availability results for rg, fd, grep, and find
contracts:
  - id: prompts-commands-command-metadata
    statement: Each command factory exposes its documented name, description, argument expectation, and completion metadata, and command actions return the handler result expected by the dispatcher.
    seamIds:
      - prompts-commands-command-factory
    riskIds:
      - prompts-commands-command-routing
  - id: prompts-commands-auto-approval-transition
    statement: Auto-approval accepts the four supported modes after normalization, persists and applies valid changes, announces the active mode, opens value selection for empty input, and leaves state unchanged for invalid input; always mode explicitly warns that the sandbox is disabled.
    seamIds:
      - prompts-commands-settings-command
    riskIds:
      - prompts-commands-setting-drift
      - prompts-commands-command-routing
  - id: prompts-commands-compaction-lifecycle
    statement: Manual compaction immediately announces that work started, later reports the successful summary, and reports asynchronous failures without submitting a chat turn.
    seamIds:
      - prompts-commands-conversation-command
    riskIds:
      - prompts-commands-conversation-state-loss
  - id: prompts-commands-resume-grammar
    statement: Resume treats empty, list, and ls input as browse requests, accepts one safe conversation id for resumption, and reports malformed or multi-token input without resuming a target.
    seamIds:
      - prompts-commands-conversation-command
      - prompts-commands-command-factory
    riskIds:
      - prompts-commands-conversation-state-loss
      - prompts-commands-command-routing
  - id: prompts-commands-retry-outcomes
    statement: Retry-turn and retry-tool start their respective asynchronous retry operation and stay silent on success while reporting the documented message when no new response or tool call can be retried.
    seamIds:
      - prompts-commands-conversation-command
    riskIds:
      - prompts-commands-conversation-state-loss
  - id: prompts-commands-rewind-resolution
    statement: Rewind resolves last and explicit visible picker positions, handles offset store turn numbers, rejects invalid or conflicting targets, and reports when there is no available turn without mutating the conversation.
    seamIds:
      - prompts-commands-rewind-command
    riskIds:
      - prompts-commands-rewind-misaddress
      - prompts-commands-conversation-state-loss
  - id: prompts-commands-rewind-disposition
    statement: A rewound turn is either restored to input for editing or resent with its text and images, explicit disposition arguments override defaults, aliases explain the canonical command, and redraw occurs only after a successful rewind.
    seamIds:
      - prompts-commands-rewind-command
    riskIds:
      - prompts-commands-rewind-misaddress
      - prompts-commands-command-routing
  - id: prompts-commands-sandbox-toggle
    statement: The sandbox command toggles sandbox.enabled, applies the same value to runtime settings, and announces whether shell access is restricted or unrestricted.
    seamIds:
      - prompts-commands-settings-command
    riskIds:
      - prompts-commands-setting-drift
  - id: prompts-commands-skill-activation
    statement: Skills command selection is case-insensitive and whitespace-tolerant, activates the matching available skill and announces the next-request flow, while empty or unknown names route to browsing or an error without selecting a skill.
    seamIds:
      - prompts-commands-skill-command
      - prompts-commands-command-factory
    riskIds:
      - prompts-commands-command-routing
  - id: prompts-commands-slash-resolution
    statement: Slash-command resolution prefers an exact case-insensitive name, accepts a unique case-insensitive prefix, and returns no command for an ambiguous prefix.
    seamIds:
      - prompts-commands-slash-resolver
    riskIds:
      - prompts-commands-command-routing
  - id: prompts-commands-model-profile-routing
    statement: Prompt profile selection maps lite mode and model-family strings to existing base prompt files, preserves the gpt-5.6 and codex boundaries, and falls back to a valid base for unknown models.
    seamIds:
      - prompts-commands-profile-selection
    riskIds:
      - prompts-commands-prompt-contract-drift
  - id: prompts-commands-prompt-spec-composition
    statement: Prompt construction composes the selected base, stable fragment order, and conditional inline or fragment guidance from profile and feature options, including sandbox, search, memory, session browser, and subagent capabilities.
    seamIds:
      - prompts-commands-prompt-constructor
      - prompts-commands-prompt-addendum
    riskIds:
      - prompts-commands-prompt-contract-drift
      - prompts-commands-authority-drift
  - id: prompts-commands-cache-stable-mode-prefix
    statement: Non-lite built-in modes receive equivalent cache-stable instruction prefixes with mode stubs, while full Plan workflow content is delivered through the Plan enter notice and lite mode remains minimal.
    seamIds:
      - prompts-commands-prompt-constructor
      - prompts-commands-prompt-files
    riskIds:
      - prompts-commands-prompt-contract-drift
  - id: prompts-commands-search-guidance
    statement: Search-via-shell guidance selects rg and fd when locally available, falls back independently to grep and find when unavailable or remote, and includes explicit-path, stdin, regex-ordering, and shell-hygiene safeguards.
    seamIds:
      - prompts-commands-prompt-addendum
    riskIds:
      - prompts-commands-environment-fallback
      - prompts-commands-guidance-regression
  - id: prompts-commands-reasoning-guidance
    statement: The reasoning-efficiency addendum is non-empty and instructs the model to match effort to difficulty, settle confirmed context, revise at most once, and end once the answer is complete.
    seamIds:
      - prompts-commands-prompt-addendum
    riskIds:
      - prompts-commands-guidance-regression
  - id: prompts-commands-delegation-guidance
    statement: Delegation guidance names the available execution mode, keeps diagnosis and outcome ownership with the parent, and frames bounded autonomous tasks without encouraging redundant direct work or librarian advertising.
    seamIds:
      - prompts-commands-prompt-addendum
    riskIds:
      - prompts-commands-authority-drift
      - prompts-commands-guidance-regression
  - id: prompts-commands-explorer-delegation-contract
    statement: Explorer-facing and plan-facing prompt files bound evidence collection to a scoped question, keep analysis and synthesis with the parent, and require bounded task framing for delegated roles.
    seamIds:
      - prompts-commands-prompt-files
    riskIds:
      - prompts-commands-authority-drift
  - id: prompts-commands-orchestrator-contract
    statement: Orchestrator prompt text keeps the orchestrator as the user-facing outcome owner, permits bounded delegation and integration judgment, and documents honest completion, validation, steering, and cancellation boundaries.
    seamIds:
      - prompts-commands-prompt-files
    riskIds:
      - prompts-commands-authority-drift
      - prompts-commands-guidance-regression
  - id: prompts-commands-role-prompt-boundaries
    statement: Worker and explorer role prompts require the available execution and escalation discipline, including validation evidence for workers and no direct user contact for execution roles.
    seamIds:
      - prompts-commands-prompt-files
    riskIds:
      - prompts-commands-authority-drift
      - prompts-commands-guidance-regression
