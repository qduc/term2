    recommendation: keep
    confidence: high
    reason: It proves the fixture-backed HTTP server both replays a sanitized recorded stream and exposes a meaningful request mutation instead of silently accepting it.
    evidence:
      - scripts/provider-black-box/fake-provider-http-server.fixture.test.ts:11-25 validates status, SSE completion marker, and replay validity.
      - scripts/provider-black-box/fake-provider-http-server.fixture.test.ts:26-36 sends a mutated model and asserts the canonical comparison failure.
      - scripts/provider-black-box/fake-provider-http-server.ts:101-145 compares the request and replays response frames; this is the production fixture seam under test.
    replacementTestIds: []
    status: proposed
