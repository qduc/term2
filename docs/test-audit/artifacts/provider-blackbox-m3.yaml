schemaVersion: 2
domains:
  - id: provider-blackbox
    label: Provider black-box fixture and scenario infrastructure.
suites:
  - id: provider-blackbox-e2e
    label: Dedicated fake-Codex end-to-end suite.
  - id: provider-blackbox-unit
    label: Provider black-box unit suite under test:provider-black-box.
fixtures:
  - id: provider-blackbox-fake-codex-scenarios
    label: Local fake Codex HTTP and WebSocket success, error, incomplete, stall, close, retry, and stale-chain scenarios.
  - id: provider-blackbox-fake-provider-scenarios
    label: Local fake provider protocol scenarios for Chat Completions, Responses, Anthropic, and Google.
  - id: provider-blackbox-fixture-chat-success
    label: Sanitized Chat Completions replay fixture used by HTTP replay tests.
  - id: provider-blackbox-fixture-websocket-replay
    label: Bidirectional WebSocket replay envelope with ordered send and receive frames.
  - id: provider-blackbox-fixture-provider-continuations
    label: Sanitized OpenAI, OpenRouter, OpenCode, Anthropic, and Google tool-continuation recordings.
  - id: provider-blackbox-committed-fixture-tree
    label: Committed provider-black-box fixture JSON corpus scanned for secrets and SDK drift.
seams:
  - id: provider-blackbox-fixture-envelope-boundary
    label: Typed validation boundary for recorded provider-traffic envelopes and frame ordering.
  - id: provider-blackbox-fixture-capture
    label: Middleware boundary that records HTTP requests and streamed response frames without consuming responses.
  - id: provider-blackbox-fixture-sanitization
    label: Fixture redaction boundary for credentials, provider identifiers, reasoning, opaque signatures, and dynamic IDs.
  - id: provider-blackbox-fixture-comparison
    label: Semantic comparison boundary between recorded and replayed provider requests.
  - id: provider-blackbox-http-replay
    label: Deterministic loopback HTTP/SSE fixture server and replay cursor.
  - id: provider-blackbox-websocket-replay
    label: Deterministic loopback WebSocket fixture server, ordered message cursor, and terminal scenarios.
  - id: provider-blackbox-codex-transport
    label: Codex HTTP Responses and WebSocket transport adapters, streaming terminal events, and retry classification.
  - id: provider-blackbox-registry-provider-contract
    label: Application provider registry route into protocol-specific streamed models and tool continuations.
  - id: provider-blackbox-capability-accounting
    label: Test-owned provider route capability matrix, required lifecycle scenarios, and execution ledger.
  - id: provider-blackbox-isolated-workspace
    label: Isolated child-process workspace lease, environment containment, cleanup, and process-tree reaping.
  - id: provider-blackbox-pty-input
    label: PTY child observation, composer-idle signaling, composer acknowledgement, deadlines, and termination.
  - id: provider-blackbox-recorder-credentials
    label: Provider recording CLI credential selection and provider-specific credential isolation.
risks:
  - id: provider-blackbox-fixture-contract-corruption
    label: Invalid, reordered, or vacuous fixture records silently enter replay and hide wire regressions.
    severity: high
  - id: provider-blackbox-secret-leak
    label: Credentials, private reasoning, provider identifiers, or opaque signatures are committed in fixtures.
    severity: critical
  - id: provider-blackbox-replay-drift
    label: SDK or transport churn causes false failures, or request mutations pass as valid replays.
    severity: high
  - id: provider-blackbox-stream-terminal-loss
    label: Missing, incomplete, error, or abnormal terminal events become fabricated successful model turns.
    severity: critical
  - id: provider-blackbox-provider-route-regression
    label: A registry route, protocol mapping, role/tool/reasoning projection, or continuation contract regresses.
    severity: high
  - id: provider-blackbox-capability-gap
    label: A provider route or required lifecycle scenario disappears from executed black-box evidence.
    severity: high
  - id: provider-blackbox-child-contamination
    label: Black-box children inherit host state or survive failures, leaking credentials, files, processes, or ports.
    severity: high
  - id: provider-blackbox-pty-readiness-flake
    label: PTY synchronization mistakes drop input, misread readiness, hang, or terminate the wrong process tree.
    severity: high
  - id: provider-blackbox-recording-credential-mixup
    label: Recording one provider with another provider's credential produces unsafe or misleading traffic evidence.
    severity: critical
contracts:
  - id: provider-blackbox-envelope-validation
    statement: Fixture envelopes accept only declared transports and frame kinds, preserve increasing unique frame sequences, and reject collisions or unmapped numeric placeholder references while allowing ordinary angle-bracketed text.
    seamIds: [provider-blackbox-fixture-envelope-boundary]
    riskIds: [provider-blackbox-fixture-contract-corruption]
  - id: provider-blackbox-recording-preserves-stream
    statement: The recording middleware captures the outbound request, response head, and logical SSE or JSON response frames while returning a readable response to its caller.
    seamIds: [provider-blackbox-fixture-capture]
    riskIds: [provider-blackbox-fixture-contract-corruption, provider-blackbox-replay-drift]
  - id: provider-blackbox-sanitized-fixtures-safe
    statement: Sanitization redacts credentials, private reasoning, provider identifiers, opaque signatures, and encrypted content while preserving protocol structure and canonicalizing dynamic identifiers; the resulting envelope scans safe.
    seamIds: [provider-blackbox-fixture-sanitization]
    riskIds: [provider-blackbox-secret-leak]
  - id: provider-blackbox-request-comparison-semantic
    statement: Recorded and replayed HTTP requests compare by semantic method, path, headers, and body, ignoring documented SDK or transport churn, honoring placeholders, and reporting canonical diffs for meaningful mutations.
    seamIds: [provider-blackbox-fixture-comparison]
    riskIds: [provider-blackbox-replay-drift]
  - id: provider-blackbox-http-replay-authoritative
    statement: A fake HTTP provider replays recorded response frames in order, validates each request against its corresponding turn, and fails validation for unexpected or missing request turns.
    seamIds: [provider-blackbox-http-replay]
    riskIds: [provider-blackbox-fixture-contract-corruption, provider-blackbox-replay-drift]
  - id: provider-blackbox-websocket-replay-authoritative
    statement: A fake WebSocket provider rejects invalid transport or mixed frames, validates ordered non-empty bidirectional exchanges, replays receives, and fails for mismatches, missing sessions, incomplete cursors, or nonterminal scenarios.
    seamIds: [provider-blackbox-websocket-replay]
    riskIds: [provider-blackbox-fixture-contract-corruption, provider-blackbox-stream-terminal-loss]
  - id: provider-blackbox-codex-stream-outcomes
    statement: Codex HTTP and WebSocket streams preserve request fields and chained history, emit completion only after authoritative terminal events, surface provider errors and stalls, and do not replay accepted ambiguous turns through retry.
    seamIds: [provider-blackbox-codex-transport]
    riskIds: [provider-blackbox-stream-terminal-loss, provider-blackbox-provider-route-regression]
  - id: provider-blackbox-registry-protocol-fidelity
    statement: Built-in and runtime providers obtained through the registry map protocol-specific roles, tools, reasoning, provider options, streamed text, tool fragments, continuations, and errors to the application-owned model contract.
    seamIds: [provider-blackbox-registry-provider-contract]
    riskIds: [provider-blackbox-provider-route-regression, provider-blackbox-stream-terminal-loss]
  - id: provider-blackbox-capability-ledger-complete
    statement: The provider capability matrix has unique routed rows with required lifecycle scenarios, and accounting rejects unknown, missing, unexecuted, or incompletely documented exclusions while accepting a complete real ledger.
    seamIds: [provider-blackbox-capability-accounting]
    riskIds: [provider-blackbox-capability-gap]
  - id: provider-blackbox-isolated-process-safety
    statement: Black-box child processes run with isolated home and state roots, do not inherit host credential or CI markers, reuse leases safely, and are reaped with bounded cleanup after normal, failed, timed-out, or interrupted runs.
    seamIds: [provider-blackbox-isolated-workspace]
    riskIds: [provider-blackbox-child-contamination]
  - id: provider-blackbox-pty-synchronization
    statement: PTY harness waits observe application-owned composer state rather than prompt glyphs, serialize text acknowledgement before Enter, diagnose exited children, and bound writes, waits, and process-tree termination.
    seamIds: [provider-blackbox-pty-input]
    riskIds: [provider-blackbox-pty-readiness-flake, provider-blackbox-child-contamination]
  - id: provider-blackbox-recording-provider-credentials
    statement: The provider recording CLI refuses to substitute a credential belonging to another provider and reports the expected missing credential without contacting the configured endpoint.
    seamIds: [provider-blackbox-recorder-credentials]
    riskIds: [provider-blackbox-recording-credential-mixup]
  - id: provider-blackbox-sdk-version-drift-detected
    statement: Committed real-traffic fixtures whose declared SDK package is installed fail loudly when the recorded and installed SDK major/minor versions differ, while fake-provider metadata is exempt from that comparison.
    seamIds: [provider-blackbox-fixture-envelope-boundary]
    riskIds: [provider-blackbox-replay-drift, provider-blackbox-fixture-contract-corruption]
