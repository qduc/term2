decisions:
  - id: provider-blackbox-fake-codex-server-e2e-test-provider-blackbox-m3
    testId: provider-blackbox-fake-codex-server-e2e-test
    role: second_opinion
    reviewer: provider-blackbox-m3
    sourceArtifact: docs/test-audit/artifacts/provider-blackbox-m3.yaml
    recommendation: keep
    confidence: high
    reason: Real local HTTP and WebSocket Codex transports exercise request projection, authoritative completion, stale-chain recovery, timeout, provider error, retry, and ambiguous-outcome behavior.
    evidence:
      - scripts/fake-codex-server.e2e.test.ts:59-134 asserts rich HTTP request mapping and rejects a missing terminal event.
      - scripts/fake-codex-server.e2e.test.ts:136-208 asserts the real WebSocket wire and omitted unsupported temperature.
      - scripts/fake-codex-server.e2e.test.ts:239-362 covers stalls, abnormal close, provider error, retry, and no replay after accepted ambiguity.
    replacementTestIds: []
    status: proposed
