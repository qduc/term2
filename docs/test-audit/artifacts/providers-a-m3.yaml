# Provider-a Milestone 3 explorer artifact.
# Built incrementally per explorer brief; all evidence is independently reviewed.
schemaVersion: 2
domains:
  - id: providers
    label: Provider implementations, adapters, auth, and wire fidelity
suites:
  - id: providers-a-unit
    label: Vitest provider unit and contract suite
seams:
  - id: providers-a-aborted-recorder
    label: Aborted stream recorder diagnostics and bounded evidence projection
  - id: providers-a-ai-sdk-anthropic
    label: AI SDK Anthropic provider construction, caching, settings, and stream adaptation
  - id: providers-a-ai-sdk-google
    label: AI SDK Google provider construction, settings, stream adaptation, and error propagation
  - id: providers-a-ai-sdk-normalizer
    label: Assistant-message normalization before AI SDK model delegation
  - id: providers-a-ai-sdk-openrouter
    label: AI SDK OpenRouter provider construction, stream adaptation, settings, and cost metadata
  - id: providers-a-provider-migration
    label: Lazy provider registry factories and application-owned streamed-model seam
  - id: providers-a-provider-settings
    label: Explicit provider-setting forwarding across unary and streaming calls
  - id: providers-a-streamed-model
    label: Shared AI SDK streamed-model translation, completion authority, and provider metadata
  - id: providers-a-anthropic-middleware
    label: Anthropic middleware session-header injection and request preservation
  - id: providers-a-chained-wire-state
    label: Chained Responses request delta state, token correlation, invalidation, and cleanup
  - id: providers-a-codex-auth
    label: Codex OAuth loopback flow, credential import, secure storage, and refresh ownership
  - id: providers-a-codex-compaction
    label: Codex compact-output conversion into provider-opaque history
  - id: providers-a-codex-turn-converter
    label: Application streamed-turn conversion to Codex Responses wire items
  - id: providers-a-codex-websocket
    label: Codex WebSocket stream cancellation and terminal-event settlement
  - id: providers-a-codex-provider
    label: Codex registry, credentials, request headers, transports, and streamed-turn adapter
  - id: providers-a-openai-message-contract
    label: OpenAI-compatible assistant message validity boundary
  - id: providers-a-openai-cache-messages
    label: OpenAI-compatible prompt-cache breakpoint placement
  - id: providers-a-custom-provider-adapter
    label: Custom provider type selection, sanitization, and application-owned model adapters
  - id: providers-a-fetch-composer
    label: Provider fetch middleware composition, rate limits, traffic logging, and failure isolation
  - id: providers-a-grok-auth
    label: Grok OAuth flow, credential storage, refresh ownership, and login fallback
  - id: providers-a-grok-credit
    label: Grok billing credit parsing, authenticated fetch, and status classification
  - id: providers-a-grok-responses-lane
    label: Grok Responses opaque-lane tagging and encrypted reasoning metadata
  - id: providers-a-grok-provider
    label: Grok registration, model discovery, authenticated fetch, cache affinity, and lane selection
  - id: providers-a-luna-wire
    label: Luna Responses Lite wire protocol fingerprint, prefix, normalization, and chaining
  - id: providers-a-model-catalog
    label: Model catalog lookup, fallback precedence, and generated-data invariants
  - id: providers-a-model-catalog-generator
    label: Model catalog source generation and pi-ai field/provider mapping
  - id: providers-a-oauth-account-store
    label: Generic OAuth multi-account persistence, migration, atomic writes, and recovery
  - id: providers-a-oauth-accounts-facade
    label: OAuth account provider facade, selection/removal, and session account pinning
risks:
  - id: providers-a-diagnostics-loss
    label: Aborted or stalled streams lose the evidence needed for diagnosis or retain unbounded sensitive payloads.
    severity: high
  - id: providers-a-anthropic-fidelity
    label: Anthropic requests or responses silently lose caching, settings, limits, reasoning, tool, usage, or error semantics.
    severity: high
  - id: providers-a-google-fidelity
    label: Google requests or responses silently lose settings, reasoning, tool, usage, or error semantics.
    severity: high
  - id: providers-a-message-history-corruption
    label: Provider-bound history changes assistant reasoning and tool-call replay semantics.
    severity: high
  - id: providers-a-openrouter-fidelity
    label: OpenRouter routing, settings, stream events, cancellation, or usage-cost metadata are not preserved.
    severity: high
  - id: providers-a-legacy-seam-regression
    label: Provider factories regress to a legacy model seam instead of the application-owned streamed model boundary.
    severity: high
  - id: providers-a-settings-loss
    label: Explicit provider settings reach one operation but not the other, or nested provider values override incorrectly.
    severity: high
  - id: providers-a-stream-translation
    label: AI SDK stream frames are translated into incorrect application events or incomplete authoritative completions.
    severity: critical
  - id: providers-a-anthropic-header-regression
    label: OpenCode Anthropic requests lose their required stable session header or mutate request payloads.
    severity: medium
  - id: providers-a-chain-continuity
    label: Chained Responses requests send the wrong delta, stale response, or cross-session state.
    severity: critical
  - id: providers-a-codex-auth-regression
    label: Codex login, token ownership, refresh, or secure persistence can log users out or leak credentials.
    severity: critical
  - id: providers-a-codex-wire-regression
    label: Codex history and tool data are malformed, foreign opaque data leaks, or cancellation hangs a turn.
    severity: critical
  - id: providers-a-message-contract-regression
    label: Invalid assistant history reaches OpenAI-compatible providers and is rejected or silently misinterpreted.
    severity: high
  - id: providers-a-cache-breakpoint-regression
    label: Provider prompt-cache breakpoints are omitted, placed on the wrong messages, or exceed provider limits.
    severity: high
  - id: providers-a-fetch-policy-regression
    label: Provider fetch middleware order, retry policy, traffic visibility, or diagnostic failure handling changes network behavior.
    severity: high
  - id: providers-a-grok-auth-regression
    label: Grok OAuth credentials are mishandled, refresh tokens are double-spent, or login state is bypassed.
    severity: critical
  - id: providers-a-credit-reporting-regression
    label: Grok credit usage is misreported or transient/auth/rate-limit failures are conflated.
    severity: high
  - id: providers-a-grok-lane-regression
    label: Grok encrypted Responses items are tagged as another provider and become unreplayable or unsafe to send.
    severity: critical
  - id: providers-a-catalog-regression
    label: Model metadata lookup or generated catalog data returns wrong limits, prices, provider fallback, or invalid entries.
    severity: high
  - id: providers-a-oauth-accounts-regression
    label: Multi-account OAuth persistence or facade selection can lose credentials, duplicate accounts, or pin the wrong session.
    severity: critical
contracts:
  - id: providers-a-aborted-diagnostics
    statement: The aborted-stream recorder retains replayable events and exposes event counts, timing gaps, response identity, failure frames, progress categories, and bounded tool-growth evidence; release and bounded views omit redundant or sensitive payloads without dropping metrics.
    seamIds:
      - providers-a-aborted-recorder
    riskIds:
      - providers-a-diagnostics-loss
  - id: providers-a-anthropic-request-response
    statement: Anthropic provider calls select the requested or default model, cap output tokens, apply eligible prompt caching, preserve explicit settings and abort signals, and translate reasoning, text, tool, completion, usage, metadata, and provider errors faithfully.
    seamIds:
      - providers-a-ai-sdk-anthropic
    riskIds:
      - providers-a-anthropic-fidelity
  - id: providers-a-google-request-response
    statement: Google provider calls select the requested or default model, preserve explicit Google settings and abort signals, map reasoning and tool choices, and translate stream completion usage, metadata, and errors faithfully.
    seamIds:
      - providers-a-ai-sdk-google
    riskIds:
      - providers-a-google-fidelity
  - id: providers-a-normalized-assistant-history
    statement: Contiguous assistant messages are merged without crossing non-assistant boundaries, preserving reasoning and tool-call content, and the wrapper delegates normalized prompt or message inputs while preserving model properties.
    seamIds:
      - providers-a-ai-sdk-normalizer
    riskIds:
      - providers-a-message-history-corruption
  - id: providers-a-openrouter-request-response
    statement: OpenRouter provider calls preserve configured routing options, requested or default model selection, fetch and abort behavior, stream event and completion fidelity, unary/stream settings, and provider-reported cost metadata.
    seamIds:
      - providers-a-ai-sdk-openrouter
    riskIds:
      - providers-a-openrouter-fidelity
  - id: providers-a-application-owned-provider-factories
    statement: Lazy provider factories for configured provider families resolve application-owned streamed models, and AI SDK provider implementations expose that streamed-model seam rather than legacy model APIs.
    seamIds:
      - providers-a-provider-migration
    riskIds:
      - providers-a-legacy-seam-regression
  - id: providers-a-explicit-settings-forwarding
    statement: Explicit provider settings are forwarded with the intended outer and nested provider values to both unary getResponse and streaming calls for supported provider families.
    seamIds:
      - providers-a-provider-settings
    riskIds:
      - providers-a-settings-loss
  - id: providers-a-streamed-model-contract
    statement: The shared AI SDK streamed model translates prompts, tools, multimodal content, settings, reasoning, cancellation, and provider frames into application events while requiring authoritative completion identity and finish semantics and preserving usage, cost, opaque-item filtering, and upstream metadata.
    seamIds:
      - providers-a-streamed-model
    riskIds:
      - providers-a-stream-translation
  - id: providers-a-anthropic-middleware-contract
    statement: Anthropic middleware adds a stable correctly formatted session header only for OpenCode requests, preserves existing headers and body bytes, and passes non-JSON bodies through.
    seamIds:
      - providers-a-anthropic-middleware
    riskIds:
      - providers-a-anthropic-header-regression
  - id: providers-a-chained-state-contract
    statement: Chained wire state uses matching response identity, request fingerprint, and reusable prefix to send the correct delta; correlates concurrent acknowledgements by token; isolates keys; and invalidates or clears stored and pending state safely.
    seamIds:
      - providers-a-chained-wire-state
    riskIds:
      - providers-a-chain-continuity
  - id: providers-a-codex-auth-contract
    statement: Codex OAuth login validates callback state and permitted loopback ports, imports only access credentials, stores term2-owned refresh credentials securely, refreshes only its own store, and exposes actionable missing-credential errors.
    seamIds:
      - providers-a-codex-auth
    riskIds:
      - providers-a-codex-auth-regression
  - id: providers-a-codex-wire-contract
    statement: Codex conversion and transport preserve supported multimodal messages, reasoning metadata, tool calls/results, provider-opaque ownership, response completion semantics, and abort settlement without malformed wire data or hangs.
    seamIds:
      - providers-a-codex-compaction
      - providers-a-codex-turn-converter
      - providers-a-codex-websocket
    riskIds:
      - providers-a-codex-wire-regression
  - id: providers-a-codex-provider-contract
    statement: The Codex registry and provider preserve credential/account routing, model/version discovery, transport selection and parity, request settings and headers, application instructions/history, continuation model identity, and completed streamed-turn events.
    seamIds:
      - providers-a-codex-provider
    riskIds:
      - providers-a-codex-wire-regression
      - providers-a-codex-auth-regression
  - id: providers-a-openai-message-contract
    statement: OpenAI-compatible message validation accepts provider-valid message payloads and rejects assistant messages lacking content or tool calls, even when reasoning metadata is present.
    seamIds:
      - providers-a-openai-message-contract
    riskIds:
      - providers-a-message-contract-regression
  - id: providers-a-openai-cache-contract
    statement: OpenAI-compatible prompt caching marks only eligible system/user/tool text breakpoints, preserves other content, and applies model eligibility and provider breakpoint limits.
    seamIds:
      - providers-a-openai-cache-messages
    riskIds:
      - providers-a-cache-breakpoint-regression
  - id: providers-a-custom-adapter-contract
    statement: Custom provider configuration selects the correct application-owned adapter, preserves replayable reasoning history, sanitizes supported Responses bodies, and applies provider traffic instrumentation without legacy model leakage.
    seamIds:
      - providers-a-custom-provider-adapter
    riskIds:
      - providers-a-legacy-seam-regression
      - providers-a-message-history-corruption
  - id: providers-a-fetch-composer-contract
    statement: Provider fetch composition preserves middleware order and mutation/error semantics, applies rate-limit retry policy, records request/response/failure traffic, and never lets diagnostic failures suppress network work or replace provider errors.
    seamIds:
      - providers-a-fetch-composer
    riskIds:
      - providers-a-fetch-policy-regression
  - id: providers-a-grok-auth-contract
    statement: Grok OAuth login and token management validate PKCE state, store credentials securely, use fresh credentials, refresh once under races while preserving refresh ownership, and refuse unauthenticated or imported-token refreshes.
    seamIds:
      - providers-a-grok-auth
    riskIds:
      - providers-a-grok-auth-regression
  - id: providers-a-grok-credit-contract
    statement: Grok credit usage parsing preserves available percentages, periods, and product splits without inventing zero, while authenticated fetch classifies unauthorized, rate-limited, and other failures distinctly.
    seamIds:
      - providers-a-grok-credit
    riskIds:
      - providers-a-credit-reporting-regression
  - id: providers-a-grok-lane-contract
    statement: Grok Responses output and encrypted reasoning metadata are tagged to the Grok opaque lane, foreign opaque items are recognized, and the existing OpenAI default lane remains unchanged.
    seamIds:
      - providers-a-grok-responses-lane
    riskIds:
      - providers-a-grok-lane-regression
  - id: providers-a-grok-provider-contract
    statement: Grok registration and model discovery expose the declared capabilities, authenticate and version requests, pin prompt-cache affinity, and select Responses or chat-completions lanes according to configuration.
    seamIds:
      - providers-a-grok-provider
    riskIds:
      - providers-a-grok-lane-regression
      - providers-a-grok-auth-regression
  - id: providers-a-luna-wire-contract
    statement: Luna Responses Lite extracts safe inputs and response IDs, fingerprints stable request configuration plus prefix, identifies reusable developer prefixes, normalizes output IDs without mutation, and integrates with chained state for delta requests.
    seamIds:
      - providers-a-luna-wire
    riskIds:
      - providers-a-chain-continuity
  - id: providers-a-model-catalog-contract
    statement: Model catalog lookup is case-insensitive and resolves exact, longest dash-bounded, vendor-qualified, provider-scoped, and cross-provider matches with correct metadata; shipped catalog entries satisfy positive limits, lowercase IDs, and valid generation metadata.
    seamIds:
      - providers-a-model-catalog
    riskIds:
      - providers-a-catalog-regression
  - id: providers-a-model-catalog-generation-contract
    statement: Catalog generation maps vendored pi-ai providers to term2 IDs, omits entries without context windows and pi-specific fields, sorts output stably, preserves metadata, and emits importable source.
    seamIds:
      - providers-a-model-catalog-generator
    riskIds:
      - providers-a-catalog-regression
  - id: providers-a-oauth-store-contract
    statement: Generic OAuth account storage supports active-account selection, replacement, refresh updates, migration, recovery, owner-only atomic persistence, and cleanup without duplicate accounts or stale temporary files.
    seamIds:
      - providers-a-oauth-account-store
    riskIds:
      - providers-a-oauth-accounts-regression
  - id: providers-a-oauth-facade-contract
    statement: The OAuth account facade recognizes supported providers, lists and selects accounts, removes accounts with survivor promotion, keeps provider stores separate, and pins in-use session credentials independently of later selection.
    seamIds:
      - providers-a-oauth-accounts-facade
    riskIds:
      - providers-a-oauth-accounts-regression
