schemaVersion: 2
domains:
  - id: providers
    label: Provider adapters, transports, authentication, and wire fidelity
suites:
  - id: providers-unit
    label: Provider unit and integration tests in the default Vitest suite
seams:
  - id: providers-b1-seam-oauth-pkce
    label: oauth-pkce openInBrowser and runPkceLoopbackLogin boundaries for browser launch and callback exchange
  - id: providers-b1-seam-chained-projection
    label: OpenAI chained-input projection boundary between stored history and the next provider request
  - id: providers-b1-seam-chat-model
    label: OpenAI-compatible Chat Completions streamed-model request conversion and event normalization
  - id: providers-b1-seam-chat-continuity
    label: Chat Completions continuity reconstruction for reasoning, tool calls, and provider opaque items
  - id: providers-b1-seam-chat-usage
    label: Chat Completions terminal usage and completion handoff into application run state
  - id: providers-b1-seam-response-normalizer
    label: OpenAI-compatible client response middleware that removes cost trailers while preserving usage
  - id: providers-b1-seam-compatible-provider
    label: OpenAI-compatible provider factory, configuration lookup, request transport, and provider metadata mapping
  - id: providers-b1-seam-opencode-routing
    label: OpenCode model transport selection and endpoint-specific request behavior
  - id: providers-b1-seam-compaction-normalizer
    label: Responses event normalization of compaction output-item lifecycle frames
  - id: providers-b1-seam-responses-model
    label: OpenAI Responses HTTP/WebSocket request conversion, event normalization, and persistent-stream lifecycle
  - id: providers-b1-seam-provider-registry
    label: Provider registry public factory and retry-aware OpenAI provider boundary
  - id: providers-b1-seam-opencode-discovery
    label: OpenCode documentation transport parser, cache, refresh, and cancellation boundary
  - id: providers-b1-seam-opencode-usage
    label: OpenCode Go usage parser and authenticated usage endpoint boundary
  - id: providers-b1-seam-openrouter-preprocessing
    label: OpenRouter request preprocessing middleware for reasoning signatures and prompt cache metadata
risks:
  - id: providers-b1-risk-oauth-failure
    label: Browser or loopback OAuth failures crash the process, accept the wrong callback, or prevent token exchange.
    severity: high
  - id: providers-b1-risk-history-divergence
    label: Chained requests replay the wrong history prefix or tool outputs, causing continuation failure or incorrect context.
    severity: high
  - id: providers-b1-risk-wire-shape
    label: Provider requests or streamed events use an incompatible wire shape, losing content, tools, or model settings.
    severity: high
  - id: providers-b1-risk-continuity-corruption
    label: Reasoning and opaque provider continuity is dropped, duplicated, or attached to the wrong assistant turn.
    severity: high
  - id: providers-b1-risk-usage-loss
    label: Terminal usage or billing metadata is lost or misreported in the completion and application status.
    severity: medium
  - id: providers-b1-risk-cost-trailer
    label: Provider billing trailers corrupt streamed usage or leak into application-visible stream chunks.
    severity: high
  - id: providers-b1-risk-provider-routing
    label: Stored provider configuration, credentials, or endpoint routing is wrong, preventing a configured provider from running.
    severity: high
  - id: providers-b1-risk-compaction-timing
    label: Compaction lifecycle events are missing or report the wrong interval, making provider context maintenance observably wrong.
    severity: medium
  - id: providers-b1-risk-response-lifecycle
    label: Responses HTTP/WebSocket streams hang, silently end, misclassify terminal states, or mishandle persistent socket ownership.
    severity: high
  - id: providers-b1-risk-opencode-discovery
    label: OpenCode model discovery, cache expiry, or transport classification selects an unsafe or unusable endpoint.
    severity: high
  - id: providers-b1-risk-auth-usage
    label: Provider usage/auth API parsing or authorization classification reports false data or hides credential failure.
    severity: medium
  - id: providers-b1-risk-openrouter-replay
    label: OpenRouter preprocessing forwards provider-incompatible reasoning or mutates requests outside its allowlist.
    severity: high
fixtures:
  - id: providers-b1-fixture-loopback-auth
    label: Local callback server, pasted redirect input, and mocked token endpoint
  - id: providers-b1-fixture-chained-history
    label: Provider history snapshots with current-turn suffixes and function-call outputs
  - id: providers-b1-fixture-chat-sse
    label: Mock Chat Completions streams containing text, reasoning, tools, finish reasons, and usage
  - id: providers-b1-fixture-provider-opaque
    label: Provider-specific reasoning and opaque continuity payloads
  - id: providers-b1-fixture-client-stream
    label: Mock OpenAI-compatible client stream and cost trailer
  - id: providers-b1-fixture-provider-config
    label: Configured provider definitions, credentials, fake fetch, and captured request bodies
  - id: providers-b1-fixture-compaction-frames
    label: Responses compaction added/done frames with fake clock and intervening message frame
  - id: providers-b1-fixture-responses-frames
    label: Mock Responses HTTP/WebSocket frames, terminal states, cancellation, and request capture
  - id: providers-b1-fixture-opencode-discovery
    label: OpenCode documentation table, cache file, and cancellable fetch
  - id: providers-b1-fixture-opencode-usage
    label: OpenCode Go usage JSON payload and mocked authenticated endpoint
  - id: providers-b1-fixture-openrouter-request
    label: OpenRouter JSON/non-JSON request bodies and preprocessing middleware chain
  - id: providers-b1-fixture-provider-registry
    label: Provider registry dependencies and application-owned model factories
contracts:
  - id: providers-b1-contract-oauth-safe-launch
    statement: Browser-launch failure, whether synchronous or asynchronous and including a missing opener binary, does not throw into or crash the calling process.
    seamIds:
      - providers-b1-seam-oauth-pkce
    riskIds:
      - providers-b1-risk-oauth-failure
  - id: providers-b1-contract-oauth-callback
    statement: A loopback login exchanges the code from a valid pasted or HTTP callback only when callback path/host and OAuth state are valid, while allowing a rejected paste to be followed by a valid callback.
    seamIds:
      - providers-b1-seam-oauth-pkce
    riskIds:
      - providers-b1-risk-oauth-failure
  - id: providers-b1-contract-chained-prefix
    statement: Chained OpenAI input projection records exact snapshot-prefix match or mismatch and projects only the current-turn suffix without changing the shared fallback projection.
    seamIds:
      - providers-b1-seam-chained-projection
    riskIds:
      - providers-b1-risk-history-divergence
  - id: providers-b1-contract-chained-tools
    statement: Chained projection retains the selected trailing tool outputs and reports missing or orphaned tool-output failures with their call ids.
    seamIds:
      - providers-b1-seam-chained-projection
    riskIds:
      - providers-b1-risk-history-divergence
  - id: providers-b1-contract-chat-input-wire
    statement: Chat Completions requests serialize application messages, multimodal tool results, instructions, structured output, generation settings, and tool choice into the provider's expected wire fields without leaking Responses-only fields.
    seamIds:
      - providers-b1-seam-chat-model
    riskIds:
      - providers-b1-risk-wire-shape
  - id: providers-b1-contract-chat-stream-events
    statement: Chat Completions streams emit text, reasoning, tool-call progress, and completion events from provider chunks, preserve finish reasons, reassemble id-less tool argument chunks, and reject in-band errors or premature EOF.
    seamIds:
      - providers-b1-seam-chat-model
    riskIds:
      - providers-b1-risk-wire-shape
  - id: providers-b1-contract-chat-continuity
    statement: Chat Completions completion history and subsequent requests preserve native or gateway reasoning and tool calls in one correct assistant turn, drop foreign opaque payloads, and avoid duplicate or cross-turn attachment.
    seamIds:
      - providers-b1-seam-chat-continuity
    riskIds:
      - providers-b1-risk-continuity-corruption
  - id: providers-b1-contract-chat-usage
    statement: Chat Completions opts into streamed usage and carries terminal token counts and provider cost into the completion and application run state.
    seamIds:
      - providers-b1-seam-chat-usage
    riskIds:
      - providers-b1-risk-usage-loss
  - id: providers-b1-contract-normalizer
    statement: OpenAI-compatible response normalization strips recognized cost trailers from streams, captures their billing value per request, and passes ordinary usage, reasoning content, non-streaming responses, and unrelated empty chunks through unchanged.
    seamIds:
      - providers-b1-seam-response-normalizer
    riskIds:
      - providers-b1-risk-cost-trailer
      - providers-b1-risk-usage-loss
  - id: providers-b1-contract-compatible-provider
    statement: An OpenAI-compatible provider resolves stored configuration and credentials, builds an application-owned streamed model, sends authenticated requests to the configured endpoint, and forwards provider-specific settings and reasoning continuity in the expected fields.
    seamIds:
      - providers-b1-seam-compatible-provider
    riskIds:
      - providers-b1-risk-provider-routing
      - providers-b1-risk-wire-shape
  - id: providers-b1-contract-compaction-events
    statement: Responses compaction added and done frames emit started and completed application events paired by output item, report the provider-frame interval, use zero for an unpaired done frame, and ignore non-compaction items.
    seamIds:
      - providers-b1-seam-compaction-normalizer
    riskIds:
      - providers-b1-risk-compaction-timing
  - id: providers-b1-contract-responses-model
    statement: OpenAI Responses HTTP and WebSocket models translate application input/settings and provider output into typed application events, preserve compatible opaque/reasoning data, gate compaction and include fields by capability, and reject failed, incomplete, errored, closed, or prematurely ended streams.
    seamIds:
      - providers-b1-seam-responses-model
    riskIds:
      - providers-b1-risk-wire-shape
      - providers-b1-risk-response-lifecycle
  - id: providers-b1-contract-responses-websocket-lifecycle
    statement: A Responses WebSocket stream settles after terminal completion or cancellation without awaiting a hanging iterator, stops consuming after terminal output, reuses sequential sockets, and does not close a socket owned by a concurrent stream.
    seamIds:
      - providers-b1-seam-responses-model
    riskIds:
      - providers-b1-risk-response-lifecycle
  - id: providers-b1-contract-openai-provider-boundary
    statement: OpenAI provider public models and registry factories build the expected Responses request/stream shape, expose the application-owned model contract, reuse a session WebSocket when configured, and notify only on SDK-started retries.
    seamIds:
      - providers-b1-seam-provider-registry
    riskIds:
      - providers-b1-risk-provider-routing
      - providers-b1-risk-response-lifecycle
  - id: providers-b1-contract-opencode-usage
    statement: OpenCode Go usage parsing accepts complete rolling/weekly/monthly limits, rejects incomplete data, sends the API key as bearer auth, and classifies HTTP 401 as an unauthorized-key error.
    seamIds:
      - providers-b1-seam-opencode-usage
    riskIds:
      - providers-b1-risk-auth-usage
  - id: providers-b1-contract-opencode-discovery
    statement: OpenCode transport discovery parses documented model endpoint families, caches successful results, refreshes expired cache data, preserves an undefined safe fallback on fetch failure, and resolves cancellation without rejecting the turn.
    seamIds:
      - providers-b1-seam-opencode-discovery
    riskIds:
      - providers-b1-risk-opencode-discovery
  - id: providers-b1-contract-opencode-routing
    statement: OpenCode provider detection, session injection/ID generation, prompt-cache eligibility, and model routing are deterministic, case/whitespace tolerant where specified, preserve request fields, and isolate parent, subagent, evaluator, and conversation sessions.
    seamIds:
      - providers-b1-seam-opencode-routing
    riskIds:
      - providers-b1-risk-provider-routing
  - id: providers-b1-contract-openrouter-factory
    statement: The OpenRouter registry exposes an application-owned streamed model factory that uses configured credentials and wraps the model in the retrying adapter without requiring a runner.
    seamIds:
      - providers-b1-seam-compatible-provider
    riskIds:
      - providers-b1-risk-provider-routing
  - id: providers-b1-contract-openrouter-preprocessing
    statement: OpenRouter preprocessing removes unsigned reasoning text only for signature-required provider formats, adds cache control only for the allowlisted routed model family, and passes non-JSON or unrelated requests through unchanged.
    seamIds:
      - providers-b1-seam-openrouter-preprocessing
    riskIds:
      - providers-b1-risk-openrouter-replay
