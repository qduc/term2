  - id: providers-openai-chat-completions-model-providers-b1-m3
    testId: providers-openai-chat-completions-model
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: Although broad, this file contains direct wire and event assertions for the Chat Completions model plus continuation-history regressions; the contracts are provider-fidelity critical and no assigned sibling provides an equivalent end-to-end replacement.
    evidence:
      - Lines 59-145 cover whitespace buffering, materiality, reasoning/tool deltas, and in-band errors; lines 467-525 cover premature EOF and id-less tool argument reassembly.
      - Lines 155-428 assert request conversion and settings; lines 548-888 and 894-1155 assert native/gateway continuity, provider filtering, turn grouping, and de-duplication.
      - Lines 1253-1408 assert text-plus-tool preservation, turn separation, streamed usage opt-in, terminal usage, and cost.
