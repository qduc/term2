decisions:
  - id: providers-oauth-pkce-providers-b1-m3
    testId: providers-oauth-pkce
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file protects both process-safe browser launch failure handling and state-validated loopback OAuth completion; neither contract has redundant sibling evidence in the assigned provider tests.
    evidence:
      - Lines 57-112 exercise asynchronous, synchronous, and real missing-opener failures at the child_process boundary and assert no throw or uncaught exception.
      - Lines 115-213 exercise pasted and HTTP callback paths, invalid host/path rejection, state mismatch rejection, and eventual token exchange at runPkceLoopbackLogin.
    replacementTestIds: []
    status: proposed
  - id: providers-openrouter-provider-create-runner-providers-b1-m3
    testId: providers-openrouter-provider-create-runner
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: These two assertions protect the public registry contract that OpenRouter can construct an application-owned streamed model with credentials and retry wrapping without a runner; no other assigned test asserts that factory boundary.
    evidence:
      - Lines 18-29 obtain the registered provider and assert createStreamedModel, stream, and wrappedModel presence with configured settings credentials.
    replacementTestIds: []
    status: proposed
  - id: providers-openrouter-provider-request-preprocessing-providers-b1-m3
    testId: providers-openrouter-provider-request-preprocessing
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: This file exercises the middleware through composeFetch with Gemini/Anthropic signature rules and a non-JSON body, complementing rather than replacing the direct middleware tests for cache-control routing.
    evidence:
      - Lines 5-41 assert unsigned reasoning.text removal only for the signature-required formats while retaining signed, other-format, and encrypted entries.
      - Lines 43-59 assert a non-JSON body reaches the base fetch unchanged.
      - 'Exact sibling comparison: source/providers/openrouter.provider.test.ts:21-67 covers direct middleware invocation plus Anthropic cache_control allowlisting; its overlapping unsigned-Anthropic case does not cover this file''s Gemini format or composeFetch boundary.'
    replacementTestIds: []
    status: proposed
  - id: providers-openrouter-provider-providers-b1-m3
    testId: providers-openrouter-provider
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The direct middleware suite protects cache-control allowlisting and Anthropic signature handling; although two behaviors overlap the neighboring preprocessing test, the cache-control contract is unique here and the remaining assertions are complementary.
    evidence:
      - Lines 21-39 assert unsigned Anthropic reasoning.text removal while preserving signed and summary details.
      - Lines 41-67 assert cache_control is added to the last user message only for anthropic-routed models and messages remain unchanged outside the allowlist.
      - 'Lines 69-80 independently assert direct middleware pass-through for a non-JSON request; source/providers/openrouter.provider.request-preprocessing.test.ts:43-59 verifies the same observable through composed fetch, so neither file wholly replaces the other''s distinct cache or composition coverage.'
    replacementTestIds: []
    status: proposed
  - id: providers-openai-responses-model-providers-b1-m3
    testId: providers-openai-responses-model
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file directly exercises both Responses request/event fidelity and WebSocket lifecycle recovery, including hanging iterators and concurrent ownership; these are high-risk seams with no cheaper assigned replacement.
    evidence:
      - Lines 112-280 assert tool-progress/reasoning normalization and terminal-state success/error distinctions; lines 282-639 assert HTTP/WebSocket settings, input conversion, compaction capability gates, and opaque/reasoning replay.
      - Lines 882-952 assert HTTP premature EOF and WebSocket error/close failures; lines 954-1028 assert terminal stop, sequential reuse, cancellation settlement, and concurrent stream ownership.
      - 'Exact out-of-assignment sibling comparison: source/providers/grok.provider.test.ts:178-216 checks Grok''s choice of this model class and capabilities, not the Responses model''s wire/event/lifecycle behavior.'
    replacementTestIds: []
    status: proposed
  - id: providers-openai-provider-providers-b1-m3
    testId: providers-openai-provider
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file protects the public OpenAI provider boundary and registry wiring separately from the detailed Responses implementation tests, including retry notification semantics and session model reuse.
    evidence:
      - Lines 8-25 assert retry-start notification counts against SDK retry headers; lines 27-70 assert public Responses request and streamed application event conversion.
      - Lines 72-103 assert WebSocket class identity and per-session reuse; lines 105-154 assert registry factory availability and executable application-owned stream behavior.
    replacementTestIds: []
    status: proposed
  - id: providers-opencode-go-usage-providers-b1-m3
    testId: providers-opencode-go-usage
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: This four-case test is the only assigned evidence for the OpenCode Go usage endpoint and keeps complete-data, malformed-data, credential, and unauthorized outcomes distinct.
    evidence:
      - Lines 10-15 assert all three subscription limits are required before usage is reported.
      - Lines 16-33 capture the exact endpoint and bearer header and distinguish HTTP 401 as OpenCodeGoUsageUnauthorizedError.
    replacementTestIds: []
    status: proposed
  - id: providers-opencode-transport-discovery-providers-b1-m3
    testId: providers-opencode-transport-discovery
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: Parser, cache, expiry refresh, failed-fetch fallback, and cancellation are independently observable discovery behaviors; removing this file would leave model-to-transport selection unguarded.
    evidence:
      - Lines 24-30 assert exact endpoint-family parsing; lines 32-60 assert successful cache reuse and undefined fallback on HTTP failure.
      - Lines 62-83 assert cancellation resolves safely; lines 85-111 assert stale cache refreshes before using a discovered transport.
    replacementTestIds: []
    status: proposed
  - id: providers-opencode-provider-providers-b1-m3
    testId: providers-opencode-provider
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
