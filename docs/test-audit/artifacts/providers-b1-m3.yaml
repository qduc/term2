    evidence:
      - Lines 21-233 cover provider detection, session header injection, stable/overridden IDs, parent/subagent/evaluator isolation, and preservation of existing init fields.
      - Lines 239-328 cover ID format/determinism, provider detection, transport routing, whitespace normalization, and Anthropic cache eligibility.
      - 'Exact sibling comparison: source/providers/openai-compatible.provider.test.ts:705-1135 observes resulting network requests, whereas this file asserts the injector and routing functions directly.'
    replacementTestIds: []
    status: proposed
  - id: providers-openai-chained-input-compatibility-providers-b1-m3
    testId: providers-openai-chained-input-compatibility
    role: second_opinion
    reviewer: providers-b1-m3
    sourceArtifact: docs/test-audit/artifacts/providers-b1-m3.yaml
    recommendation: keep
    confidence: high
    reason: This focused four-case contract test compares the OpenAI projection with the shared filter while asserting exact prefix diagnostics and tool-output failures; no assigned sibling tests this projection seam.
    evidence:
      - Lines 15-40 assert matched and mismatched history prefixes and the current-turn fallback projection.
      - Lines 42-64 assert selected parallel outputs plus MissingChainedToolOutputError and OrphanedChainedToolOutputError call ids.
    replacementTestIds: []
