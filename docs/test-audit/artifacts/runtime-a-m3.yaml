schemaVersion: 2
domains:
  - id: runtime
    label: Agent runtime, application client, and runtime support libraries
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Vitest integration coverage
seams:
  - id: runtime-a-seam-agent-chat-service
    label: AgentChatService model construction, chat result extraction, and cancellation boundary
  - id: runtime-a-seam-agent-client-continuity
    label: AgentClient provider capability boundary for application conversation chaining
  - id: runtime-a-seam-application-run-loop
    label: AgentClient and ApplicationRunLoop turn, rollover, stream, tool, compaction, and steer coordination
  - id: runtime-a-seam-agent-client-lifecycle
    label: AgentClient ownership and lifecycle boundary for bridges, streamed models, and background work
  - id: runtime-a-seam-agent-configuration
    label: AgentConfiguration resolution, settings subscription, and application-agent projection boundary
  - id: runtime-a-seam-agent-factory
    label: Agent factory tool construction, provider model settings, and root tool invocation boundary
  - id: runtime-a-seam-ask-answer-store
    label: In-memory ask-user answer set, peek, and consume boundary
  - id: runtime-a-seam-chained-input-filter
    label: Provider chained-input correlation and safe delta filtering boundary
  - id: runtime-a-seam-editor-impl
    label: Editor filesystem operation and remote command execution boundary
  - id: runtime-a-seam-harness-input-idle
    label: Harness file protocol for composer state, revisions, and idle generations
  - id: runtime-a-seam-input-owner
    label: Pure precedence policy selecting the exclusive terminal input owner
  - id: runtime-a-seam-openai-chat-client
    label: AgentClient chat and direct application request boundary
  - id: runtime-a-seam-flex-setting
    label: SettingsService persistence and metadata boundary for OpenAI Flex tier
  - id: runtime-a-seam-provider-error-retry
    label: Provider error metadata and retry-policy input boundary
  - id: runtime-a-seam-strict-tool-schema
    label: Zod schema conversion boundary for OpenAI strict tool arguments
  - id: runtime-a-seam-sdk-approval-resume
    label: ApplicationRunLoop approval interruption and resumed tool execution boundary
  - id: runtime-a-seam-subagent-bridge
    label: SubagentBridge delegation, abort, lifecycle, context scoping, and async controls boundary
  - id: runtime-a-seam-subagent-event-sinks
    label: SubagentBridge routing and ordered delivery boundary for foreground/background event sinks
  - id: runtime-a-seam-subagent-provider-session
    label: SubagentBridge/async registry to OpenCode session-header integration boundary
  - id: runtime-a-seam-tool-interceptor-registry
    label: ToolInterceptorRegistry registration, rejection, short-circuit, and error boundary
  - id: runtime-a-seam-tool-invoke
    label: Model tool argument normalization, validation, execution, and error-result boundary
  - id: runtime-a-seam-tool-selection-policy
    label: Provider/model capability predicates selecting patch and strict-schema tools
  - id: runtime-a-seam-agent-resolver
    label: Agent config model, permission, limit, skill, scope, and tool resolution boundary
risks:
  - id: runtime-a-risk-chat-result-or-cancellation
    label: Chat returns the wrong result or fails to stop an active provider stream
    severity: high
  - id: runtime-a-risk-chaining-capability-loss
    label: An application-owned provider loses chaining support and breaks continuation semantics
    severity: high
  - id: runtime-a-risk-turn-state-corruption
    label: Rollover, compaction, tool dispatch, retry, or steer state is lost or dispatched incorrectly
    severity: critical
  - id: runtime-a-risk-resource-lifecycle
    label: Disposing or aborting a client leaks, prematurely closes, or reuses owned runtime resources
    severity: critical
  - id: runtime-a-risk-configuration-drift
    label: Settings, overrides, or provider-specific options do not reach the effective agent consistently
    severity: high
  - id: runtime-a-risk-tool-construction-safety
    label: Root tools are exposed with unsafe settings or execute malformed arguments
    severity: critical
  - id: runtime-a-risk-answer-leak
    label: Ask-user answers are returned to the wrong call or remain readable after consumption
    severity: medium
  - id: runtime-a-risk-chained-history-corruption
    label: Chained provider history loses required tool outputs or correlates outputs to the wrong call
    severity: critical
  - id: runtime-a-risk-editor-unsafe-write
    label: Approved filesystem operations produce wrong content or unsafe remote shell commands
    severity: critical
  - id: runtime-a-risk-harness-state-protocol
    label: External harness observes stale composer state or advances idle at the wrong ownership boundary
    severity: high
  - id: runtime-a-risk-input-double-dispatch
    label: Keyboard input is delivered to the wrong or multiple terminal surfaces
    severity: high
  - id: runtime-a-risk-chat-request-shape
    label: Chat loses structured output, fallback content, or provider-specific request shape
    severity: high
  - id: runtime-a-risk-flex-setting-drift
    label: Flex setting defaults, mutability, or serialized metadata drift from the user-facing contract
    severity: medium
  - id: runtime-a-risk-retry-error-contract
    label: Provider error metadata or retry classification misleads retry behavior
    severity: high
  - id: runtime-a-risk-strict-schema-mismatch
    label: Optional tool fields cannot satisfy OpenAI strict-schema request validation
    severity: high
  - id: runtime-a-risk-approval-resume-correlation
    label: Resumed approved calls lose call identity or completed results disappear from history
    severity: critical
  - id: runtime-a-risk-subagent-control
    label: Subagent calls lose parameters, cancellation, context isolation, or async control semantics
    severity: critical
  - id: runtime-a-risk-event-delivery
    label: Subagent events are duplicated, stranded, reordered, or delivered to the wrong sink
    severity: high
  - id: runtime-a-risk-provider-session-reuse
    label: Nested runs reuse the parent OpenCode session or fail to preserve their own across continuation
    severity: critical
  - id: runtime-a-risk-interceptor-bypass
    label: Interceptor rejection, ordering, removal, or error handling fails to control tool execution
    severity: high
  - id: runtime-a-risk-tool-input-execution
    label: Malformed model arguments execute unsafely, leak sensitive diagnostics, or abort incorrectly
    severity: critical
  - id: runtime-a-risk-capability-routing
    label: Unsupported providers receive native patch or strict-schema tool behavior, or supported ones do not
    severity: high
  - id: runtime-a-risk-agent-authority
    label: Resolved child agents gain unauthorized tools, permissions, scopes, or resource limits
    severity: critical
fixtures:
  - id: runtime-a-fixture-mock-streamed-provider
    label: Registered provider with a scripted streamed model and captured requests
  - id: runtime-a-fixture-agent-client-dependencies
    label: Minimal logger, settings, ownership, and optional bridge dependencies for AgentClient
  - id: runtime-a-fixture-scripted-run-loop
    label: Scripted streamed responses, tools, and deferred subagent results for turn coordination
  - id: runtime-a-fixture-agent-configuration-deps
    label: Mock settings, provider registry, logger, editor, and bridge dependencies
  - id: runtime-a-fixture-answer-store
    label: Call-id keyed in-memory answer entries
  - id: runtime-a-fixture-provider-history-items
    label: User, function-call, and tool-result items with alternate provider correlation fields
  - id: runtime-a-fixture-temp-files-and-remote-ssh
    label: Temporary workspace files and captured remote SSH commands for editor operations
  - id: runtime-a-fixture-harness-idle-file
    label: Temporary harness idle protocol file and environment variable
  - id: runtime-a-fixture-input-owner-state
    label: Input-owner state combinations representing prompts, menus, queues, and processing
  - id: runtime-a-fixture-openai-chat-provider
    label: Scripted application provider capturing chat requests and streamed fallback content
  - id: runtime-a-fixture-settings-service
    label: Isolated SettingsService instances with persistence disabled
  - id: runtime-a-fixture-provider-error
    label: OpenRouterError instances carrying HTTP status, headers, and response body
  - id: runtime-a-fixture-zod-tool-schema
    label: Zod object schemas with required and optional tool fields
  - id: runtime-a-fixture-approval-loop
    label: Scripted ApplicationRunLoop tool calls that interrupt and resume after approval
  - id: runtime-a-fixture-subagent-manager
    label: SubagentManager-shaped mocks tracking foreground and async calls
  - id: runtime-a-fixture-conversation-event-sinks
    label: Capturing foreground and background ConversationEvent sinks
  - id: runtime-a-fixture-opencode-injector
    label: OpenCode session injector plus parent and nested SessionContextService contexts
  - id: runtime-a-fixture-interceptors
    label: Registered async tool interceptors and captured logger errors
  - id: runtime-a-fixture-malformed-tool-input
    label: Broken JSON, sentinel values, schema-invalid arguments, and tool outputs
  - id: runtime-a-fixture-provider-capabilities
    label: Provider/model identifiers with native patch and strict-schema capability declarations
  - id: runtime-a-fixture-agent-resolution-config
    label: AgentConfig values, parent authorities, settings, and SkillsService fixtures
contracts:
  - id: runtime-a-contract-chat-cache-and-results
    statement: AgentChatService reuses a model for repeated provider/model chats until its explicit cache clear, and extracts text and accounting data from streamed completions.
    seamIds:
      - runtime-a-seam-agent-chat-service
    riskIds:
      - runtime-a-risk-chat-result-or-cancellation
  - id: runtime-a-contract-chat-abort
    statement: Aborting an active AgentChatService chat aborts the provider request and rejects the pending chat with an AbortError.
    seamIds:
      - runtime-a-seam-agent-chat-service
    riskIds:
      - runtime-a-risk-chat-result-or-cancellation
  - id: runtime-a-contract-chat-overrides
    statement: Temporary provider and structured-output options are passed to the temporary chat agent and its streamed request.
    seamIds:
      - runtime-a-seam-agent-chat-service
    riskIds:
      - runtime-a-risk-configuration-drift
  - id: runtime-a-contract-application-chaining-capability
    statement: An application-owned HTTP Responses provider reports conversation chaining as supported when its provider path can preserve continuation state.
    seamIds:
      - runtime-a-seam-agent-client-continuity
    riskIds:
      - runtime-a-risk-chaining-capability-loss
  - id: runtime-a-contract-rollover-background-guard
    statement: Session rollover is rejected or blocked when background work is live, including a recheck at rollover consumption.
    seamIds:
      - runtime-a-seam-application-run-loop
    riskIds:
      - runtime-a-risk-turn-state-corruption
  - id: runtime-a-contract-rollover-history-and-compaction
    statement: Accepted rollover and local compaction preserve the provider usage/reminder metadata and protect the required hot tail without dispatching an impossible request.
    seamIds:
      - runtime-a-seam-application-run-loop
    riskIds:
      - runtime-a-risk-turn-state-corruption
  - id: runtime-a-contract-model-cache-failure-recovery
    statement: AgentClient retains a usable streamed model across completed turns, retries after a rejected factory, and does not let an obsolete rejection evict a replacement.
    seamIds:
      - runtime-a-seam-application-run-loop
    riskIds:
      - runtime-a-risk-resource-lifecycle
  - id: runtime-a-contract-parallel-tool-dispatch-order
    statement: Eligible foreground explorer calls are dispatched within the configured parallelism and their tool results return to the provider in original response order.
    seamIds:
      - runtime-a-seam-application-run-loop
    riskIds:
      - runtime-a-risk-turn-state-corruption
  - id: runtime-a-contract-agent-client-steer-settlement
    statement: Accepted steering survives approval/retry/pre-request boundaries, enters the next request, and is released when the turn closes without another request.
    seamIds:
      - runtime-a-seam-application-run-loop
    riskIds:
      - runtime-a-risk-turn-state-corruption
  - id: runtime-a-contract-agent-configuration-resolution
    statement: AgentConfiguration resolves settings and overrides into the effective agent and provider-specific application options, while subscriptions rebuild only for relevant keys and clean up safely.
    seamIds:
      - runtime-a-seam-agent-configuration
    riskIds:
      - runtime-a-risk-configuration-drift
  - id: runtime-a-contract-agent-factory-tools
    statement: Agent factory construction exposes the intended root tools, applies provider/model capabilities and safety settings, and rejects malformed tool arguments before execution.
    seamIds:
      - runtime-a-seam-agent-factory
    riskIds:
      - runtime-a-risk-tool-construction-safety
  - id: runtime-a-contract-answer-store
    statement: AskUserAnswerStore isolates answers by call id, supports non-destructive peek, and removes an answer when it is consumed.
    seamIds:
      - runtime-a-seam-ask-answer-store
    riskIds:
      - runtime-a-risk-answer-leak
  - id: runtime-a-contract-chained-history-filter
    statement: Chained input filtering identifies user and tool items across provider encodings, correlates call and result ids with explicit precedence, and rejects missing or orphaned required outputs while preserving valid deltas.
    seamIds:
      - runtime-a-seam-chained-input-filter
    riskIds:
      - runtime-a-risk-chained-history-corruption
  - id: runtime-a-contract-editor-operations
    statement: Editor create, update, and delete operations apply valid diffs, report invalid or missing targets as failures, honor approved out-of-workspace operations, and safely quote remote deletion targets.
    seamIds:
      - runtime-a-seam-editor-impl
    riskIds:
      - runtime-a-risk-editor-unsafe-write
  - id: runtime-a-contract-harness-idle-protocol
    statement: Harness input publishing creates and updates the state file only when configured, increments idle generations only on valid return-to-idle transitions, and acknowledges exact composer revisions with bounded timeout errors.
    seamIds:
      - runtime-a-seam-harness-input-idle
    riskIds:
      - runtime-a-risk-harness-state-protocol
  - id: runtime-a-contract-input-owner-precedence
    statement: deriveInputOwner selects exactly one input owner according to urgent prompt, menu, queue, background-task, and editor precedence, including processing and first-run exceptions.
    seamIds:
      - runtime-a-seam-input-owner
    riskIds:
      - runtime-a-risk-input-double-dispatch
  - id: runtime-a-contract-openai-chat-forwarding
    statement: AgentClient chat and chatJson preserve structured output options, fallback message extraction, and usable direct request input for both tracing and non-tracing application providers.
    seamIds:
      - runtime-a-seam-openai-chat-client
    riskIds:
      - runtime-a-risk-chat-request-shape
  - id: runtime-a-contract-flex-setting
    statement: SettingsService exposes the OpenAI Flex service-tier setting with a false default, supports runtime enable/disable changes, and includes its value and source in getAll metadata.
    seamIds:
      - runtime-a-seam-flex-setting
    riskIds:
      - runtime-a-risk-flex-setting-drift
  - id: runtime-a-contract-provider-error-metadata
    statement: OpenRouterError remains throwable while preserving message, status, headers, and response body metadata needed by provider retry handling.
    seamIds:
      - runtime-a-seam-provider-error-retry
    riskIds:
      - runtime-a-risk-retry-error-contract
  - id: runtime-a-contract-strict-tool-schema
    statement: Optional Zod tool fields are transformed to nullable defaults for OpenAI strict schemas, while schemas with no optional fields retain identity and behavior.
    seamIds:
      - runtime-a-seam-strict-tool-schema
    riskIds:
      - runtime-a-risk-strict-schema-mismatch
  - id: runtime-a-contract-approval-resume
    statement: ApplicationRunLoop approval interruption resumes execution with the original tool-call id and records completed tool results in application-owned history.
    seamIds:
      - runtime-a-seam-sdk-approval-resume
    riskIds:
      - runtime-a-risk-approval-resume-correlation
  - id: runtime-a-contract-subagent-bridge-controls
    statement: SubagentBridge delegates mentor, foreground, and background requests with parameters and context, isolates nested provider-history keys, tracks active runs, and exposes safe abort, disposal, cache, and async controls.
    seamIds:
      - runtime-a-seam-subagent-bridge
    riskIds:
      - runtime-a-risk-subagent-control
  - id: runtime-a-contract-subagent-event-routing
    statement: SubagentBridge routes foreground, transferred, and background lifecycle events to the correct sinks, flushes buffered events once, keeps asynchronous delivery alive, and awaits sink completion where required.
    seamIds:
      - runtime-a-seam-subagent-event-sinks
    riskIds:
      - runtime-a-risk-event-delivery
  - id: runtime-a-contract-subagent-provider-session
    statement: Each foreground subagent receives a session distinct from its parent, repeated requests in one run reuse that session, and background launch/continuation requests reuse one run-owned session.
    seamIds:
      - runtime-a-seam-subagent-provider-session
    riskIds:
      - runtime-a-risk-provider-session-reuse
  - id: runtime-a-contract-interceptor-registry
    statement: ToolInterceptorRegistry invokes interceptors in registration order, returns the first rejection, stops after rejection, supports removal and call-id forwarding, and converts/logs thrown errors.
    seamIds:
      - runtime-a-seam-tool-interceptor-registry
    riskIds:
      - runtime-a-risk-interceptor-bypass
  - id: runtime-a-contract-tool-input-normalization
    statement: Tool invocation normalizes recoverable model JSON and schema coercions without applying defaults unexpectedly, returns bounded diagnostics for invalid input, preserves valid tool output, and rethrows abort/schema errors appropriately.
    seamIds:
      - runtime-a-seam-tool-invoke
    riskIds:
      - runtime-a-risk-tool-input-execution
  - id: runtime-a-contract-tool-selection-capabilities
    statement: Tool-selection predicates choose native patch and strict-schema behavior from provider/model capabilities, with semantic model-prefix matching and safe unsupported-provider defaults.
    seamIds:
      - runtime-a-seam-tool-selection-policy
    riskIds:
      - runtime-a-risk-capability-routing
  - id: runtime-a-contract-agent-resolution
    statement: resolveAgent resolves model policies, skills, tools, permissions, limits, and filesystem scopes while reporting invalid configuration and attenuating child authority by parent policy.
    seamIds:
      - runtime-a-seam-agent-resolver
    riskIds:
      - runtime-a-risk-agent-authority
  - id: runtime-a-contract-agent-client-public-methods
    statement: AgentClient public mutators and helpers update provider/model state, forward retry and sink controls, clear or abort conversations safely, and enforce check-in input minimums.
    seamIds:
      - runtime-a-seam-openai-chat-client
      - runtime-a-seam-agent-client-lifecycle
    riskIds:
      - runtime-a-risk-configuration-drift
      - runtime-a-risk-resource-lifecycle
  - id: runtime-a-contract-application-chaining
    statement: AgentClient forwards previous response identifiers and canonical accumulated history only for providers that support chaining, while clearing conversation state resets continuation behavior.
    seamIds:
      - runtime-a-seam-agent-client-continuity
      - runtime-a-seam-openai-chat-client
    riskIds:
      - runtime-a-risk-chaining-capability-loss
