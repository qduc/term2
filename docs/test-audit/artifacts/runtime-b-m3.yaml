schemaVersion: 2
domains:
  - id: runtime
    label: Agent runtime and execution boundary tests
suites:
  - id: runtime-unit
    label: Agent runtime unit and integration tests
seams:
  - id: runtime-b-agent-resolution
    label: Agent configuration and authority resolution boundary.
  - id: runtime-b-agent-handle
    label: Public AgentHandle run and result boundary.
  - id: runtime-b-run-loop-cost
    label: Run-loop request cost settlement boundary.
  - id: runtime-b-run-loop-lifecycle
    label: Run-loop tool lifecycle callback boundary.
  - id: runtime-b-run-loop-parallel
    label: Run-loop parallel dispatch and transcript ordering boundary.
  - id: runtime-b-run-loop-budget
    label: Run-loop budget escalation and continuation boundary.
  - id: runtime-b-runtime-composition
    label: Production runtime composition boundary.
  - id: runtime-b-context-compaction
    label: Context compaction policy and transformation boundary.
  - id: runtime-b-execution-budget
    label: Nested execution resource budget boundary.
  - id: runtime-b-executor
    label: Subagent executor routing and result mapping boundary.
  - id: runtime-b-generation-guard
    label: Generated output and tool-argument runaway guard boundary.
  - id: runtime-b-model-resolution
    label: Model policy and relative tier resolution boundary.
  - id: runtime-b-permission-resolution
    label: Permission and limit attenuation boundary.
  - id: runtime-b-scope-resolution
    label: Filesystem and network scope containment boundary.
  - id: runtime-b-skill-resolution
    label: Skill instruction resolution boundary.
  - id: runtime-b-structured-output
    label: Structured output schema and parsing boundary.
  - id: runtime-b-attachments
    label: Text attachment validation and serialization boundary.
  - id: runtime-b-tool-invocation
    label: Approval ledger and invocation context boundary.
  - id: runtime-b-tool-resolution
    label: Permissioned tool selection boundary.
  - id: runtime-b-workflow
    label: Sandboxed workflow evaluation boundary.
  - id: runtime-b-legacy-adapter
    label: Legacy role and definition adaptation boundary.
risks:
  - id: runtime-b-authority-escalation
    label: Child or legacy agent receives authority beyond its parent or role.
    severity: critical
  - id: runtime-b-invalid-execution
    label: Invalid configuration reaches execution or corrupts public results.
    severity: high
  - id: runtime-b-cost-loss
    label: Requests are missing, duplicated, or mispriced in cost accounting.
    severity: high
  - id: runtime-b-lifecycle-loss
    label: Tool lifecycle observers see wrong order or missing failure state.
    severity: high
  - id: runtime-b-parallel-reorder
    label: Parallel tools cross barriers or reorder transcript results.
    severity: high
  - id: runtime-b-budget-runaway
    label: Work continues beyond budget or an unsafe continuation is dispatched.
    severity: critical
  - id: runtime-b-composition-break
    label: Runtime composition omits required public or ownership wiring.
    severity: high
  - id: runtime-b-context-overflow
    label: Compaction overflows context or drops required provider-valid structure.
    severity: high
  - id: runtime-b-resource-exhaustion
    label: Nested work exceeds shared child, depth, concurrency, token, or time limits.
    severity: high
  - id: runtime-b-generation-runaway
    label: Generated output or incomplete tool arguments consume unbounded resources.
    severity: critical
  - id: runtime-b-scope-escape
    label: Path or host matching permits access outside configured scope.
    severity: critical
  - id: runtime-b-output-invalid
    label: Structured output or attachments violate their public contract.
    severity: medium
  - id: runtime-b-tool-selection
    label: Unknown or denied tools are exposed to execution.
    severity: high
  - id: runtime-b-workflow-escape
    label: Workflow escapes its sandbox or reports incorrect controlled failures.
    severity: critical
contracts:
  - id: runtime-b-legacy-authority-contract
    statement: Legacy explorer, worker, and mentor roles resolve to documented authority, and resolved definitions round-trip without losing execution fields.
    seamIds: [runtime-b-agent-resolution, runtime-b-legacy-adapter]
    riskIds: [runtime-b-authority-escalation, runtime-b-invalid-execution]
  - id: runtime-b-agent-config-contract
    statement: Configured agents expose only known tools allowed by own and parent permissions, with typed errors for denied or unknown tools.
    seamIds: [runtime-b-agent-resolution, runtime-b-tool-resolution]
    riskIds: [runtime-b-authority-escalation, runtime-b-tool-selection]
  - id: runtime-b-agent-run-contract
    statement: AgentHandle.run delegates resolved instructions and returns public completed, failed, or cancelled results without executor internals.
    seamIds: [runtime-b-agent-handle]
    riskIds: [runtime-b-invalid-execution]
  - id: runtime-b-input-validation-contract
    statement: AgentHandle context serialization is deterministic and rejects circular, function, symbol, and bigint values before execution.
    seamIds: [runtime-b-agent-handle]
    riskIds: [runtime-b-invalid-execution]
  - id: runtime-b-cost-contract
    statement: Every dispatched request settles one cost record, preferring provider charges, preserving unique identity across continuations and runs, and emitting failure markers and updates.
    seamIds: [runtime-b-run-loop-cost]
    riskIds: [runtime-b-cost-loss]
  - id: runtime-b-lifecycle-contract
    statement: Physical tool calls notify dispatch and lifecycle callbacks in order, while converted failures notify error without false completion.
    seamIds: [runtime-b-run-loop-lifecycle]
    riskIds: [runtime-b-lifecycle-loss]
  - id: runtime-b-parallel-contract
    statement: Contiguous parallel-safe tools run concurrently without crossing serial or approval barriers, preserve provider order, and settle started work on cancellation.
    seamIds: [runtime-b-run-loop-parallel]
    riskIds: [runtime-b-parallel-reorder]
  - id: runtime-b-run-budget-contract
    statement: Run-budget stages report, escalation controls pausing, finite extensions preserve one logical run, and stopped or capped interactions do not dispatch extra work.
    seamIds: [runtime-b-run-loop-budget]
    riskIds: [runtime-b-budget-runaway]
  - id: runtime-b-composition-contract
    statement: Production composition returns stable runtime, execution runner, mentor runner, and role resolver while keeping internal policies private.
    seamIds: [runtime-b-runtime-composition]
    riskIds: [runtime-b-composition-break]
  - id: runtime-b-compaction-contract
    statement: Compaction estimates and bounds context, cuts only at safe turn boundaries, preserves provider-valid hot structures, and serializes summaries without mutating source history.
    seamIds: [runtime-b-context-compaction]
    riskIds: [runtime-b-context-overflow]
  - id: runtime-b-budget-contract
    statement: ExecutionBudget enforces shared child, depth, concurrency, token, and abort limits and releases active capacity when work settles.
    seamIds: [runtime-b-execution-budget]
    riskIds: [runtime-b-resource-exhaustion]
  - id: runtime-b-executor-contract
    statement: Executor selects mentor versus regular runner, composes cancellation and timeout signals, and maps subagent status into public results.
    seamIds: [runtime-b-executor]
    riskIds: [runtime-b-invalid-execution]
  - id: runtime-b-generation-contract
    statement: Generation guards truncate reasoning at its cap, preserve later text budget, and abort only incomplete tool calls matching the runaway signature.
    seamIds: [runtime-b-generation-guard]
    riskIds: [runtime-b-generation-runaway]
  - id: runtime-b-model-contract
    statement: Model policies use configured provider/model defaults and resolve relative tiers against parent policy with documented fallbacks.
    seamIds: [runtime-b-model-resolution]
    riskIds: [runtime-b-invalid-execution]
  - id: runtime-b-permission-contract
    statement: Permission and limit resolution applies defaults and intersects child authority with parent permissions and limits.
    seamIds: [runtime-b-permission-resolution]
    riskIds: [runtime-b-authority-escalation, runtime-b-resource-exhaustion]
  - id: runtime-b-scope-contract
    statement: Filesystem and network patterns normalize consistently and match only paths or hosts inside the resolved scope.
    seamIds: [runtime-b-scope-resolution]
    riskIds: [runtime-b-scope-escape]
  - id: runtime-b-scope-security-contract
    statement: Realpath-aware checks reject existing and nonexistent symlink paths escaping the workspace while allowing in-workspace links.
    seamIds: [runtime-b-scope-resolution]
    riskIds: [runtime-b-scope-escape]
  - id: runtime-b-skill-contract
    statement: Skill resolution returns matching instruction bodies and reports missing skills while retaining available instructions.
    seamIds: [runtime-b-skill-resolution]
    riskIds: [runtime-b-invalid-execution]
  - id: runtime-b-structured-contract
    statement: Supported schemas format into instructions and model text is parsed and validated, with typed errors for malformed output or unsupported keywords.
    seamIds: [runtime-b-structured-output]
    riskIds: [runtime-b-output-invalid]
  - id: runtime-b-attachment-contract
    statement: Text attachments validate names, content, and MIME types, serialize with clear boundaries, and reject binary or path-bearing input.
    seamIds: [runtime-b-attachments]
    riskIds: [runtime-b-output-invalid]
  - id: runtime-b-invocation-contract
    statement: Approval decisions are scoped by tool and call, replay into nested runs, and preserve run context across approval continuation.
    seamIds: [runtime-b-tool-invocation]
    riskIds: [runtime-b-authority-escalation, runtime-b-lifecycle-loss]
  - id: runtime-b-tools-contract
    statement: Tool resolution returns exactly requested known tools admitted by authorization and coarse permissions, with ordered typed failures otherwise.
    seamIds: [runtime-b-tool-resolution]
    riskIds: [runtime-b-tool-selection]
  - id: runtime-b-workflow-contract
    statement: Workflow code runs in a constrained sandbox with bounded runs/output/concurrency and deterministic controlled errors, while agent requests are marshalled faithfully.
    seamIds: [runtime-b-workflow]
    riskIds: [runtime-b-workflow-escape]
