schemaVersion: 2
domains:
  - id: session
    label: Session lifecycle, recovery, and conversation-session seams.
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Session integration suite
seams:
  - id: session-a-scheduler
    label: Background check-in scheduling and task observation boundary.
  - id: session-a-background-control
    label: Session control boundary for background task inspection and transfer.
  - id: session-a-conversation-runtime
    label: Conversation session runtime and event projection boundary.
  - id: session-a-continuation
    label: Continuation planning, state, call identity, and recovery boundary.
  - id: session-a-auto-approval
    label: Shell auto-approval evaluation and approval admission boundary.
  - id: session-a-input-surge
    label: Input planning and surge admission boundary.
  - id: session-a-provider-projection
    label: Provider-specific input and response-chain projection boundary.
  - id: session-a-tool-ledger
    label: Tool lifecycle event and recovery ledger boundary.
  - id: session-a-turn-state
    label: Session turn, undo, and generation ownership boundary.
  - id: session-a-usage
    label: Stream usage extraction and conversation usage projection boundary.
  - id: session-a-access
    label: Session-scoped access grants and created-file capability boundary.
  - id: session-a-client-factory
    label: Owned session client, capability, and disposal boundary.
  - id: session-a-hook-status
    label: Public hook status projection for foreground and background work.
  - id: session-a-pending-interaction
    label: Pending user interaction identity and answer state boundary.
  - id: session-a-post-execute
    label: Post-execute pause, decision, and gate settlement boundary.
  - id: session-a-repetition
    label: Streaming repetition detection boundary.
risks:
  - id: session-a-risk-scheduler-drift
    label: A running background task is checked in too early, late, repeatedly, or not at all.
    severity: medium
  - id: session-a-risk-background-state
    label: Background task state, controls, or transfer results are stale or misreported.
    severity: high
  - id: session-a-risk-foreground-contamination
    label: Background lifecycle is incorrectly inserted into or omitted from foreground conversation state.
    severity: high
  - id: session-a-risk-call-identity
    label: Continuation emits duplicate, missing, or stale tool-call identities.
    severity: critical
  - id: session-a-risk-recovery-replay
    label: A failed request is replayed unsafely, recovery is skipped, or retry limits are bypassed.
    severity: critical
  - id: session-a-risk-approval-bypass
    label: A command bypasses required approval or a safe command is incorrectly blocked.
    severity: critical
  - id: session-a-risk-input-growth
    label: Context growth causes runaway requests or a legitimate follow-up is blocked.
    severity: high
  - id: session-a-risk-provider-input
    label: Provider receives the wrong input projection or response-chain linkage.
    severity: high
  - id: session-a-risk-tool-observability
    label: Tool starts, malformed calls, or recovery ledger state are duplicated or hidden.
    severity: high
  - id: session-a-risk-turn-ownership
    label: Undo, stale asynchronous work, or turn settlement mutates the wrong generation.
    severity: critical
  - id: session-a-risk-usage-loss
    label: Reported usage is missing, double-counted, or detached from streamed usage evidence.
    severity: medium
  - id: session-a-risk-access-leak
    label: Session-only access survives disposal or persistent project access is lost.
    severity: high
  - id: session-a-risk-resource-leak
    label: Owned clients, registries, or suspended work survive disposal or affect replacements.
    severity: high
  - id: session-a-risk-status-lie
    label: Public status reports idle while background work remains or misses approval waiting.
    severity: high
  - id: session-a-risk-stale-interaction
    label: A late answer resolves a replaced interaction or a multi-question answer is corrupted.
    severity: high
  - id: session-a-risk-post-execute
    label: A denied execution reruns without approval, runs after closure, or resolves the wrong call.
    severity: critical
  - id: session-a-risk-runaway-output
    label: Repeated streamed output is not detected or normal prose is falsely stopped.
    severity: high
fixtures: []
contracts:
  - id: session-a-contract-scheduler-intervals
    statement: A running background task emits a check-in only when its configured interval or one-off due time has elapsed, then resumes on the regular interval.
    seamIds: [session-a-scheduler]
    riskIds: [session-a-risk-scheduler-drift]
  - id: session-a-contract-scheduler-task-policy
    statement: Per-task enablement, interval, aliases, and canonical identifiers control whether and when that task emits check-ins.
    seamIds: [session-a-scheduler]
    riskIds: [session-a-risk-scheduler-drift]
  - id: session-a-contract-scheduler-observation
    statement: A due check-in identifies the task and elapsed time and carries available subagent or shell activity, status, and output-tail evidence.
    seamIds: [session-a-scheduler]
    riskIds: [session-a-risk-scheduler-drift, session-a-risk-background-state]
  - id: session-a-contract-scheduler-lifecycle
    statement: Disabled schedulers and non-running tasks emit no check-ins, and disposal clears the internal timer exactly once.
    seamIds: [session-a-scheduler]
    riskIds: [session-a-risk-scheduler-drift, session-a-risk-resource-leak]
  - id: session-a-contract-background-details
    statement: Background control lists live work before retained terminal work and returns executor-specific details including activity and terminal evidence.
    seamIds: [session-a-background-control]
    riskIds: [session-a-risk-background-state]
  - id: session-a-contract-background-activity
    statement: Active, provider-waiting, approval-waiting, quiet, cancelling, and settled background states remain distinguishable in inspection results.
    seamIds: [session-a-background-control]
    riskIds: [session-a-risk-background-state]
  - id: session-a-contract-background-controls
    statement: Stop and foreground-to-background controls report unavailable, stale, capacity, or success outcomes without emitting false notifications, while successful controls wake observers.
    seamIds: [session-a-background-control]
    riskIds: [session-a-risk-background-state, session-a-risk-foreground-contamination]
  - id: session-a-contract-background-routing
    statement: Background start, tool, and completion events update live background state and logs without adding background lifecycle messages to foreground history, while the launch acknowledgement remains finalized.
    seamIds: [session-a-conversation-runtime, session-a-background-control]
    riskIds: [session-a-risk-foreground-contamination]
  - id: session-a-contract-call-id-resolution
    statement: Continuation call-id resolution deduplicates interrupted and completed calls, excludes outputs already represented in history, and uses fallback ids only when requested or when no cycle ids resolve.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-call-identity]
  - id: session-a-contract-history-call-ids
    statement: Known tool-call collection recognizes function-call and local-shell call shapes while ignoring output-only records.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-call-identity]
  - id: session-a-contract-continuation-plan
    statement: Approval and abort continuation plans require the appropriate pending context, preserve continuation metadata, record rejected calls, and expose the correct continuation source.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-recovery-replay, session-a-risk-call-identity]
  - id: session-a-contract-continuation-setup
    statement: Applying a continuation plan restores tool arguments, emits at most the deduplicated tool-start event, and captures the current journal snapshot.
    seamIds: [session-a-continuation, session-a-tool-ledger]
    riskIds: [session-a-risk-call-identity, session-a-risk-tool-observability]
  - id: session-a-contract-continuation-state
    statement: Continuation state initializes defaults and adopts explicitly supplied token, state, call ids, input mode, cumulative data, journal snapshot, and emitted-id lineage without deriving call ids from interruptions.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-call-identity, session-a-risk-recovery-replay]
  - id: session-a-contract-continuation-advance
    statement: Advancing a continuation plan replaces state and call ids from the supplied values, merges emitted ids and journal data, and preserves the prior input mode when no new mode is supplied.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-call-identity, session-a-risk-recovery-replay]
  - id: session-a-contract-recovery-classification
    statement: Recovery terminates unrecoverable failures, returns stale for an outdated generation, and maps recoverable failures to the classified recovery outcome and delay.
    seamIds: [session-a-continuation, session-a-turn-state]
    riskIds: [session-a-risk-recovery-replay, session-a-risk-turn-ownership]
  - id: session-a-contract-recovery-evidence
    statement: Recovery distinguishes provably unsent or settled-tool failures from ambiguous or post-text failures, using fresh retry, resume, or termination rather than unsafe blind replay.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-recovery-replay]
  - id: session-a-contract-recovery-budget
    statement: A shared recovery budget limits automatic transport replays while allowing separately capped model retries and settles the turn through the recovery executor when a retry plan is refused.
    seamIds: [session-a-continuation]
    riskIds: [session-a-risk-recovery-replay]
  - id: session-a-contract-auto-approval-modes
    statement: Off omits evaluation, advisory evaluates without bypassing prompts, auto bypasses prompts only for model-approved eligible commands, always bypasses eligible command prompts without evaluator calls, and RED commands remain system-rejected.
    seamIds: [session-a-auto-approval]
    riskIds: [session-a-risk-approval-bypass]
  - id: session-a-contract-auto-approval-advisory
    statement: Auto-approval attaches model or system advisories with rationale, preserves ordered batch cache reuse, reevaluates call-id-less interruptions inline, and returns safe defaults for malformed or failed evaluator responses.
    seamIds: [session-a-auto-approval]
    riskIds: [session-a-risk-approval-bypass]
  - id: session-a-contract-auto-approval-boundary
    statement: Tools outside the auto-approval set are not evaluated, and an auto-approval evaluator error falls back to a user approval prompt rather than crashing or approving execution.
    seamIds: [session-a-auto-approval]
    riskIds: [session-a-risk-approval-bypass]
  - id: session-a-contract-input-surge-admission
    statement: Input surge blocks direct or unapproved oversized submissions, while an exact session-issued approval admits the unchanged approved content and rejects forged or modified content.
    seamIds: [session-a-input-surge]
    riskIds: [session-a-risk-input-growth, session-a-risk-approval-bypass]
  - id: session-a-contract-input-surge-rollback
    statement: Initial input preparation adds a user turn once, attaches the planned input and dispatch model, rolls back a newly inserted turn when the surge guard blocks, and does not roll it back after generation becomes stale.
    seamIds: [session-a-input-surge, session-a-turn-state]
    riskIds: [session-a-risk-input-growth, session-a-risk-turn-ownership]
  - id: session-a-contract-followup-after-growth
    statement: After approval or abandonment, including after large tool or replacement results, ordinary replacement and follow-up turns remain admissible; reconciled tool history remains usable after max-turn recovery.
    seamIds: [session-a-input-surge]
    riskIds: [session-a-risk-input-growth, session-a-risk-recovery-replay]
  - id: session-a-contract-provider-projection
    statement: Chaining providers receive the current text and previous response id, while non-chaining and compatible providers receive the appropriate full history, including reconstructed assistant text prefixes.
    seamIds: [session-a-provider-projection]
    riskIds: [session-a-risk-provider-input]
  - id: session-a-contract-undo
    statement: Undo returns the last genuine user turn, returns null when none exists, invalidates stale asynchronous writes, and forces a post-undo chaining turn to use full history without the old response id.
    seamIds: [session-a-turn-state, session-a-provider-projection]
    riskIds: [session-a-risk-turn-ownership, session-a-risk-provider-input]
  - id: session-a-contract-tool-started
    statement: Function-call stream items emit parsed tool_started events, duplicate call ids emit once, approval continuation replay does not persist a duplicate, and malformed arguments produce one structured diagnostic packet.
    seamIds: [session-a-tool-ledger, session-a-conversation-runtime]
    riskIds: [session-a-risk-tool-observability, session-a-risk-call-identity]
  - id: session-a-contract-usage
    statement: Conversation responses expose normalized usage from completion or raw responses, preserve cache usage, keep cumulative terminal totals distinct from per-request usage updates, and emit native usage events.
    seamIds: [session-a-usage]
    riskIds: [session-a-risk-usage-loss]
  - id: session-a-contract-access-lifecycle
    statement: Disposal and transient clearing remove session-only read, Docker, and created-file state while retaining settings-backed project Docker grants and their denial behavior.
    seamIds: [session-a-access]
    riskIds: [session-a-risk-access-leak]
  - id: session-a-contract-client-isolation
    statement: Each owned session gets isolated tool ownership, access, background-shell, continuity, and observer capabilities, while caller-owned compatibility clients are not disposed by the factory.
    seamIds: [session-a-client-factory]
    riskIds: [session-a-risk-resource-leak, session-a-risk-access-leak]
  - id: session-a-contract-client-disposal
    statement: Owned session disposal is idempotent, closes suspended gates and owned registries, clears capabilities, and does not close or alter a replacement session handle.
    seamIds: [session-a-client-factory, session-a-post-execute]
    riskIds: [session-a-risk-resource-leak, session-a-risk-post-execute]
  - id: session-a-contract-hook-status
    statement: Public hook status stays working while foreground or any background task remains active, reports approval waiting distinctly, and becomes idle only after all background work settles.
    seamIds: [session-a-hook-status, session-a-background-control]
    riskIds: [session-a-risk-status-lie]
  - id: session-a-contract-pending-interaction
    statement: Pending ask_user interactions accumulate answers across questions, expose a snapshot, resolve cancellation or decline immediately without recording an answer, and reject late decisions for replaced interactions.
    seamIds: [session-a-pending-interaction]
    riskIds: [session-a-risk-stale-interaction]
  - id: session-a-contract-post-execute-registry
    statement: Post-execute pending entries have session/run/call identity and revisioned snapshots; selective decisions settle once, reject stale or unknown ids atomically, wake observers, and close gates by rejecting.
    seamIds: [session-a-post-execute]
    riskIds: [session-a-risk-post-execute, session-a-risk-stale-interaction]
  - id: session-a-contract-post-execute-pause
    statement: A paused execution reruns only after its selected approval, fails closed on session close or missing call identity, resolves outside owned runs without shared entries, and isolates identical commands by call id.
    seamIds: [session-a-post-execute]
    riskIds: [session-a-risk-post-execute, session-a-risk-call-identity]
  - id: session-a-contract-live-run
    statement: A live run fails closed for stream failure, preserves unselected pending entries, cancels and wakes consumers, settles gates, and suppresses late events.
    seamIds: [session-a-post-execute, session-a-turn-state]
    riskIds: [session-a-risk-post-execute, session-a-risk-turn-ownership]
  - id: session-a-contract-repetition
    statement: Repetition detection recognizes repeated patterns across append calls while not flagging varied prose or whitespace-only output.
    seamIds: [session-a-repetition]
    riskIds: [session-a-risk-runaway-output]
  - id: session-a-contract-runtime-surface
    statement: The public session runtime omits composition internals while retaining callable compact-context and shutdown operations.
    seamIds: [session-a-conversation-runtime]
    riskIds: [session-a-risk-foreground-contamination]
  - id: session-a-contract-reasoning-stream
    statement: Reasoning deltas are projected as ordered conversation events with an accumulated full text, independently of ordinary text deltas.
    seamIds: [session-a-conversation-runtime]
    riskIds: [session-a-risk-foreground-contamination]
