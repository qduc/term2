decisions:
  - id: session-background-check-in-scheduler-test-session-a-m3
    testId: session-background-check-in-scheduler-test
    role: second_opinion
    reviewer: session-a-m3
    sourceArtifact: docs/test-audit/artifacts/session-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file independently exercises scheduler timing, task policy, task observation enrichment, filtering, and idempotent disposal.
    evidence:
      - source/services/session/background-check-in-scheduler.test.ts:57-184 asserts interval boundaries, repeated indexes, mute/enable, custom interval, and one-off due scheduling.
      - source/services/session/background-check-in-scheduler.test.ts:282-438 asserts rich subagent/shell observation and shell output-tail projection.
      - source/services/session/background-check-in-scheduler.test.ts:440-456 asserts disposal clears its timer exactly once.
    replacementTestIds: []
    status: proposed
  - id: session-background-subagent-ui-routing-integration-test-session-a-m3
    testId: session-background-subagent-ui-routing-integration-test
    role: second_opinion
    reviewer: session-a-m3
    sourceArtifact: docs/test-audit/artifacts/session-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the assigned integration proof that background lifecycle is projected separately from foreground history while the launch acknowledgement is retained.
    evidence:
      - source/services/session/background-subagent-ui-routing.integration.test.ts:161-205 asserts started, tool-started, and completed lifecycle state/log events with no subagent message in foreground messages.
      - source/services/session/background-subagent-ui-routing.integration.test.ts:207-238 asserts the finalized command launch and static history contents.
    replacementTestIds: []
    status: proposed
  - id: session-background-task-control-test-session-a-m3
    testId: session-background-task-control-test
    role: second_opinion
    reviewer: session-a-m3
    sourceArtifact: docs/test-audit/artifacts/session-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The broad control-port contract is covered with explicit activity distinctions, ordering, stale/capability failures, transfer success, and observer notifications.
    evidence:
      - source/services/session/background-task-control.test.ts:28-133 asserts active/provider-waiting/quiet/approval/failed states remain distinct.
      - source/services/session/background-task-control.test.ts:135-171 asserts live-before-terminal ordering and shell detail projection.
      - source/services/session/background-task-control.test.ts:173-341 and 343-418 assert stop/transfer success, capacity, stale, and unavailable outcomes.
    replacementTestIds: []
    status: proposed
  - id: session-continuation-call-id-resolver-test-session-a-m3
    testId: session-continuation-call-id-resolver-test
    role: second_opinion
    reviewer: session-a-m3
    sourceArtifact: docs/test-audit/artifacts/session-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Small focused tests protect call-id reconciliation at the provider continuation boundary, including history filtering and fallback policy.
