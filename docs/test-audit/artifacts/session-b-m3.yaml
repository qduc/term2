schemaVersion: 2
domains:
  - id: session
    label: Session composition, lifecycle, runtime, and turn orchestration
suites:
  - id: unit
    label: Default Vitest unit suite
seams:
  - id: session-b-composition-runtime-factory
    label: Session composition factories wiring runtime capabilities and owned event sinks.
  - id: session-b-background-event-projection
    label: Runtime adapters that project background subagent and shell events to observers and notifications.
  - id: session-b-session-context-storage
    label: Async context storage and restoration around session-scoped operations.
  - id: session-b-continuity-reset-coordinator
    label: Coordinated clearing of provider, approval, tool, input, and persisted turn continuity.
  - id: session-b-input-planning-boundary
    label: Boundary deciding chained versus self-contained provider input and large-input advisory metadata.
  - id: session-b-session-lifecycle-coordinator
    label: Lifecycle operations that reset, import, undo, and reconcile session-owned state.
  - id: session-b-session-manager-rewind
    label: Session manager snapshot and rewind delegation boundary.
  - id: session-b-runtime-settings-controller
    label: Runtime-facing provider and generation-setting mutation boundary.
  - id: session-b-public-runtime-boundary
    label: Public session runtime turn, state, approval, and shutdown API boundary.
  - id: session-b-runtime-isolation-boundary
    label: Isolation boundary for concurrently live runtimes, execution roots, contexts, and approval state.
  - id: session-b-stream-history-commit
    label: Stream processing and finalization boundary between provider items, session history, continuity, and journals.
  - id: session-b-tool-ledger-reconciliation
    label: Session tool ledger boundary tracking calls, results, active IDs, and recovery settlement.
  - id: session-b-terminal-event-collection
    label: Collection boundary reducing streamed conversation events to one authoritative terminal result.
  - id: session-b-turn-attempt-state
    label: Per-turn attempt construction, retry snapshots, stream attachment, and abort lifecycle.
  - id: session-b-turn-coordination-state
    label: Foreground turn admission, status transitions, approval continuation, and stale-turn ownership boundary.
  - id: session-b-turn-item-accumulation
    label: Incremental reasoning, assistant text, tool item, and display-usage accumulation boundary.
  - id: session-b-hook-outcome-projection
    label: Turn outcome to hook lifecycle event projection boundary.
  - id: session-b-turn-workflow-execution
    label: Initial and continuation workflow boundary for provider calls, recovery, approvals, and modeled outcomes.
  - id: session-b-undo-recovery-journal
    label: Undo lifecycle and assistant journal boundary feeding retry recovery history.
risks:
  - id: session-b-composition-contract-drift
    label: A composed runtime exposes the wrong capability, sink, adapter, or disposal behavior.
    severity: high
  - id: session-b-background-event-loss
    label: Background work events, controls, or shutdown notifications are lost, duplicated, or delivered after disposal.
    severity: high
  - id: session-b-context-leak
    label: Session context is unavailable across async work or leaks across nested session scopes.
    severity: high
  - id: session-b-stale-continuity
    label: Reset or import leaves provider anchors, approvals, tool state, or persisted turn state that can affect a later turn.
    severity: high
  - id: session-b-invalid-provider-input
    label: Chaining is used when a provider cannot accept the anchor, or full-history input is built incorrectly.
    severity: critical
  - id: session-b-lifecycle-ownership-drift
    label: Lifecycle cleanup bypasses its owning coordinator or leaves undo/import recovery state inconsistent.
    severity: high
  - id: session-b-rewind-side-effect
    label: A stale rewind mutates state or a successful rewind misses required cleanup or logging.
    severity: medium
  - id: session-b-setting-transition-drift
    label: Unsupported settings mutate state, or supported provider-setting changes call in the wrong order.
    severity: medium
  - id: session-b-public-runtime-regression
    label: A public turn, approval, state import/export, steering, or shutdown operation diverges from internal behavior.
    severity: high
  - id: session-b-runtime-cross-talk
    label: Concurrent runtimes share state, execution roots, contexts, sinks, or approval ownership.
    severity: critical
  - id: session-b-history-commit-corruption
    label: Stream processing commits stale, duplicated, reordered, or provider-incompatible history or recovery journal data.
    severity: critical
  - id: session-b-tool-settlement-drift
    label: Tool calls are mis-deduplicated or continuation omits required completed, rejected, or interrupted call IDs.
    severity: high
  - id: session-b-terminal-outcome-loss
    label: A stream without an authoritative terminal is accepted, or terminal payload, usage, cost, or item ordering is lost.
    severity: high
  - id: session-b-attempt-abort-leak
    label: Attempt retry state is overwritten or abort callbacks remain active after an attempt closes.
    severity: medium
  - id: session-b-turn-state-corruption
    label: Concurrent or stale turn operations mutate status, ownership, approval, or event delivery for another turn.
    severity: critical
  - id: session-b-turn-item-loss
    label: Streamed reasoning, text, tools, or display usage is emitted or persisted in the wrong order or omitted.
    severity: medium
  - id: session-b-hook-lifecycle-drift
    label: Modeled turn outcomes produce invalid hook events or split one logical approval turn across hook IDs.
    severity: high
  - id: session-b-workflow-recovery-drift
    label: Initial or continuation recovery loses budget, provider options, approval semantics, live-stream reuse, or modeled outcome settlement.
    severity: critical
  - id: session-b-undo-journal-resurrection
    label: Retry recovery re-injects tool items from turns removed by undo or rewind.
    severity: critical
fixtures: []
contracts:
  - id: session-b-contract-composed-runtime-surface
    statement: The session composition factories return the documented session/runtime capability surface, including owned sinks and conversation adapter boundaries.
    seamIds:
      - session-b-composition-runtime-factory
    riskIds:
      - session-b-composition-contract-drift
  - id: session-b-contract-background-projection-and-shutdown
    statement: Background subagent and shell events are projected to the appropriate task or notification observer, user controls wake observers, and shutdown retains sinks until asynchronous work settles before detaching them.
    seamIds:
      - session-b-background-event-projection
    riskIds:
      - session-b-background-event-loss
  - id: session-b-contract-async-session-context
    statement: Session context is absent outside a scope, visible throughout synchronous and awaited work inside a scope, and restored after nested scopes complete.
    seamIds:
      - session-b-session-context-storage
    riskIds:
      - session-b-context-leak
  - id: session-b-contract-continuity-reset
    statement: A session continuity reset clears provider, approval, tool, cache, input, and persisted-turn state exactly once, while optionally preserving provider conversations.
    seamIds:
      - session-b-continuity-reset-coordinator
    riskIds:
      - session-b-stale-continuity
  - id: session-b-contract-input-chain-selection
    statement: Session input planning selects a provider-valid chained delta or self-contained full-history request based on chaining capability, tool debt, partial batches, and model lineage while preserving authoritative history snapshots.
    seamIds:
      - session-b-input-planning-boundary
    riskIds:
      - session-b-invalid-provider-input
  - id: session-b-contract-large-input-preview
    statement: Large-input previews estimate the same serialized payload as real input, avoid unnecessary history work, reuse finalized-history sizing by identity, and retain canonical profile context without mutating dispatch state.
    seamIds:
      - session-b-input-planning-boundary
    riskIds:
      - session-b-invalid-provider-input
  - id: session-b-contract-lifecycle-reset-import-undo
    statement: Session reset, import, undo, and retry-rewind operations route cleanup through owning coordinators and reconcile continuity, access, journals, tool ledgers, and status for subsequent recovery.
    seamIds:
      - session-b-session-lifecycle-coordinator
      - session-b-continuity-reset-coordinator
    riskIds:
      - session-b-lifecycle-ownership-drift
      - session-b-stale-continuity
  - id: session-b-contract-rewind-delegation
    statement: Session rewind returns the domain result and performs lifecycle cleanup and undo logging exactly once only after a valid rewind, leaving both untouched for stale or unknown targets.
    seamIds:
      - session-b-session-manager-rewind
    riskIds:
      - session-b-rewind-side-effect
  - id: session-b-contract-runtime-setting-mutations
    statement: >-
      Runtime setting mutations are capability-aware: unsupported setters are
      no-ops, while supported provider-affecting changes reset session state
      before forwarding the exact requested value.
    seamIds:
      - session-b-runtime-settings-controller
    riskIds:
      - session-b-setting-transition-drift
  - id: session-b-contract-public-runtime-turns
    statement: The public runtime supports headless turns, approval and ask-user continuation, abort, steering, state transfer, and idempotent shutdown while keeping internal construction details private.
    seamIds:
      - session-b-public-runtime-boundary
    riskIds:
      - session-b-public-runtime-regression
  - id: session-b-contract-runtime-instance-isolation
    statement: Concurrent runtime instances keep histories, providers, execution roots, contexts, logs, sinks, controls, approval ownership, and continuation state separate, and workspace publication fails closed.
    seamIds:
      - session-b-runtime-isolation-boundary
    riskIds:
      - session-b-runtime-cross-talk
  - id: session-b-contract-stream-process-and-commit
    statement: Stream processing publishes and journals live items, tracks tools, honors generation invalidation, and finalization commits authoritative provider history while preserving continuity and avoiding stale or duplicate pairs.
    seamIds:
      - session-b-stream-history-commit
      - session-b-tool-ledger-reconciliation
    riskIds:
      - session-b-history-commit-corruption
      - session-b-tool-settlement-drift
  - id: session-b-contract-terminal-collection
    statement: Terminal collection requires an authoritative final or approval event and preserves terminal text, interruptions, usage, costs, callbacks, and ordered turn items using cumulative rather than double-counted values.
    seamIds:
      - session-b-terminal-event-collection
    riskIds:
      - session-b-terminal-outcome-loss
  - id: session-b-contract-attempt-lifecycle
    statement: A turn attempt captures normalized retry and journal state, accepts planned input and streams, updates only live retry state, and invokes abort exactly once while closed attempts ignore later signals.
    seamIds:
      - session-b-turn-attempt-state
    riskIds:
      - session-b-attempt-abort-leak
  - id: session-b-contract-turn-coordination
    statement: Foreground turns have exclusive admission and owned status leases; approval pauses retain scope, continuations transition correctly, stale work cannot mutate newer turns, and abort returns ownership to idle.
    seamIds:
      - session-b-turn-coordination-state
    riskIds:
      - session-b-turn-state-corruption
  - id: session-b-contract-turn-item-accumulation
    statement: Turn item accumulation combines deltas into ordered reasoning and assistant-text segments, flushes buffers before tool items, resets persisted state, and tracks display usage.
    seamIds:
      - session-b-turn-item-accumulation
    riskIds:
      - session-b-turn-item-loss
  - id: session-b-contract-hook-outcome-projection
    statement: Every modeled turn outcome emits a hook-contract-valid turn.end event, and an approval pause plus continuation retains one logical hook turn ID.
    seamIds:
      - session-b-hook-outcome-projection
    riskIds:
      - session-b-hook-lifecycle-drift
  - id: session-b-contract-workflow-recovery
    statement: Initial and continuation workflow execution preserves modeled outcomes, provider lineage and history snapshots, retry budgets, approval and auto-approval resolution, post-execute stream reuse, and fresh-start recovery semantics.
    seamIds:
      - session-b-turn-workflow-execution
      - session-b-tool-ledger-reconciliation
    riskIds:
      - session-b-workflow-recovery-drift
      - session-b-tool-settlement-drift
  - id: session-b-contract-undo-journal-recovery
    statement: After undo removes turns, assistant journal snapshots supplied to retry recovery contain only surviving/current-turn tool pairs and never resurrect removed calls.
    seamIds:
      - session-b-undo-recovery-journal
      - session-b-session-lifecycle-coordinator
    riskIds:
      - session-b-undo-journal-resurrection
