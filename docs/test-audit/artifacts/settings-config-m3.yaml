schemaVersion: 2
domains:
  - id: settings-config
    label: Settings, environment, input context, and shared model contracts
suites:
  - id: unit
    label: Deterministic unit and seam tests
seams:
  - id: settings-config-input-context
    label: React input provider boundary exposing editor state and actions to Ink consumers
  - id: settings-config-streamed-turn
    label: Type boundary defining the application-owned streamed model turn interface
  - id: settings-config-env-bootstrap
    label: Process bootstrap boundary that establishes environment defaults before imports
  - id: settings-config-settings-schema
    label: Zod settings schema and derived key/default/modifiability catalog
  - id: settings-config-schema-introspection
    label: Boundary resolving a dotted setting key to its underlying Zod schema
  - id: settings-config-env-overrides
    label: Boundary translating process environment variables into settings overrides
  - id: settings-config-settings-merge
    label: Boundary merging defaults, file, environment, and CLI settings with source provenance
  - id: settings-config-settings-path
    label: Platform-specific boundary resolving the durable settings directory
  - id: settings-config-settings-load
    label: Boundary loading, validating, partially accepting, and recovering settings files
  - id: settings-config-settings-save
    label: Boundary validating and atomically committing settings while excluding secrets
  - id: settings-config-settings-lock
    label: Lock ownership boundary coordinating concurrent settings writers
  - id: settings-config-settings-service
    label: Public SettingsService facade coordinating settings state, mutation, and persistence
  - id: settings-config-provider-settings
    label: Boundary normalizing and registering provider records from settings
  - id: settings-config-profile-settings
    label: Boundary projecting legacy mode settings onto canonical profile selection
  - id: settings-config-sandbox-settings
    label: Boundary enforcing sandbox and always-auto-approval exclusivity
  - id: settings-config-retired-model
    label: Repository boundary preventing production consumers from using the retired model contract
risks:
  - id: settings-config-input-state-loss
    label: Input consumers observe stale, missing, or non-shared editor state after updates or remounts.
    severity: high
  - id: settings-config-input-action-instability
    label: Input action identities churn and cause avoidable consumer effects or missed updates.
    severity: medium
  - id: settings-config-contract-drift
    label: Provider adapters and runtime consumers disagree about the streamed-turn API or media shape.
    severity: critical
  - id: settings-config-bootstrap-drift
    label: Startup tracing, logging, or environment defaults are changed before dependent modules load.
    severity: high
  - id: settings-config-invalid-settings-accepted
    label: Invalid settings enter runtime state or valid settings are lost when schemas evolve.
    severity: high
  - id: settings-config-setting-discovery-failure
    label: A valid setting cannot be discovered or edited because its schema/key metadata is incomplete.
    severity: high
  - id: settings-config-wrong-override-precedence
    label: A lower-priority settings source unexpectedly overrides a higher-priority source.
    severity: high
  - id: settings-config-wrong-settings-location
    label: Settings are written to the wrong platform directory or ignore the platform override.
    severity: medium
  - id: settings-config-corrupt-settings-loss
    label: A corrupt settings file destroys recoverable values or silently overwrites original bytes.
    severity: critical
  - id: settings-config-unsafe-settings-write
    label: A settings write leaks secrets, leaves partial JSON, or leaves temporary artifacts behind.
    severity: critical
  - id: settings-config-concurrent-settings-clobber
    label: Concurrent settings writers overwrite each other or an old owner releases a newer lock.
    severity: high
  - id: settings-config-service-state-drift
    label: SettingsService state, source metadata, disk state, and public mutation outcomes disagree.
    severity: high
  - id: settings-config-provider-selection-drift
    label: A configured custom provider cannot be registered, selected, or migrated consistently.
    severity: high
  - id: settings-config-profile-mode-drift
    label: Legacy mode flags and canonical profile identity become inconsistent across writes or reloads.
    severity: high
  - id: settings-config-sandbox-approval-bypass
    label: Always auto-approval coexists with an enabled sandbox or is resurrected by stale persistence.
    severity: critical
  - id: settings-config-retired-model-revival
    label: Production code revives identifiers or imports from the retired model contract.
    severity: critical
contracts:
  - id: settings-config-input-outside-provider
    statement: useInputContext throws the documented error when called without an enclosing InputProvider.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-default-state
    statement: A new InputProvider exposes empty text, text mode, a zero cursor, and no active trigger by default.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-setter-surface
    statement: InputProvider consumers receive callable editor and cursor setter actions.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-editor-updates
    statement: Editor actions publish ordinary, empty, special-character, and zero/positive cursor values to consumers.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-atomic-update
    statement: Consecutive and atomic editor updates settle on the latest text and cursor, including the controller snapshot.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-shared-consumers
    statement: Multiple mounted consumers can read the same InputProvider state.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-image-state
    statement: Image state is initially empty and survives replacing the child that seeded it within one provider.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-state-loss]
  - id: settings-config-input-stable-actions
    statement: useInputActions returns the same action object identity across input-only state updates.
    seamIds: [settings-config-input-context]
    riskIds: [settings-config-input-action-instability]
  - id: settings-config-streamed-turn-api
    statement: StreamedModelTurn exposes stream as its streaming operation and does not expose the retired generate operation.
    seamIds: [settings-config-streamed-turn]
    riskIds: [settings-config-contract-drift]
  - id: settings-config-streamed-turn-media
    statement: User and assistant streamed messages may contain image parts while system messages contain text parts only.
    seamIds: [settings-config-streamed-turn]
    riskIds: [settings-config-contract-drift]
  - id: settings-config-env-tracing-disabled
    statement: Environment bootstrap sets OPENAI_AGENTS_DISABLE_TRACING to true before the application imports dependent modules.
    seamIds: [settings-config-env-bootstrap]
    riskIds: [settings-config-bootstrap-drift]
  - id: settings-config-env-node-default
    statement: Environment bootstrap defaults NODE_ENV to production without replacing an explicitly supplied value.
    seamIds: [settings-config-env-bootstrap]
    riskIds: [settings-config-bootstrap-drift]
  - id: settings-config-schema-catalog
    statement: Every exported setting key has exactly one matching Contract 04 consumer-inventory entry.
    seamIds: [settings-config-settings-schema]
    riskIds: [settings-config-setting-discovery-failure]
  - id: settings-config-schema-defaults-and-bounds
    statement: Settings schemas provide documented defaults and reject out-of-range or invalid values for deadlines, compaction, budgets, memory, sandbox, workflow, and related settings.
    seamIds: [settings-config-settings-schema]
    riskIds: [settings-config-invalid-settings-accepted]
  - id: settings-config-schema-provider-types
    statement: Custom provider schemas default legacy provider type, accept each known type and provider-specific optional base URLs, and reject unknown or malformed types and missing required base URLs.
    seamIds: [settings-config-settings-schema]
    riskIds: [settings-config-provider-selection-drift, settings-config-invalid-settings-accepted]
  - id: settings-config-schema-runtime-flags
    statement: Settings that are runtime-modifiable are represented in the runtime-modifiable key set and retain their documented defaults and accepted values.
    seamIds: [settings-config-settings-schema]
    riskIds: [settings-config-setting-discovery-failure]
  - id: settings-config-schema-wrapper-unwrapping
    statement: Schema introspection unwraps optional, nullable, default, effects, and pipe wrappers while leaving unwrapped schemas and nullish inputs safe.
    seamIds: [settings-config-schema-introspection]
    riskIds: [settings-config-setting-discovery-failure]
  - id: settings-config-schema-path-resolution
    statement: Schema introspection resolves known dotted setting paths, including through optional parent objects, and returns undefined for unknown or empty paths.
    seamIds: [settings-config-schema-introspection]
    riskIds: [settings-config-setting-discovery-failure]
  - id: settings-config-env-boolean-parsing
    statement: Boolean environment values recognize 1, true, and yes case-insensitively and treat other or absent values as false.
    seamIds: [settings-config-env-overrides]
    riskIds: [settings-config-wrong-override-precedence]
  - id: settings-config-env-known-overrides
    statement: Supported web-search environment variables become the corresponding provider and credential settings.
    seamIds: [settings-config-env-overrides]
    riskIds: [settings-config-wrong-override-precedence]
  - id: settings-config-test-environment-detection
    statement: TERM2_TEST_MODE=true identifies a test environment so settings persistence can be disabled safely.
    seamIds: [settings-config-env-overrides]
    riskIds: [settings-config-unsafe-settings-write]
  - id: settings-config-source-precedence
    statement: Settings merge precedence is CLI over environment over config file over defaults, with nested values merged rather than replacing unrelated fields.
    seamIds: [settings-config-settings-merge]
    riskIds: [settings-config-wrong-override-precedence]
  - id: settings-config-source-provenance
    statement: Source tracking identifies the highest-priority source for overridden keys and default for untouched keys.
    seamIds: [settings-config-settings-merge]
    riskIds: [settings-config-service-state-drift]
  - id: settings-config-platform-paths
    statement: Settings directory resolution uses the documented macOS, Linux/XDG, and Windows/LOCALAPPDATA locations.
    seamIds: [settings-config-settings-path]
    riskIds: [settings-config-wrong-settings-location]
  - id: settings-config-sensitive-settings-filter
    statement: Persisted settings omit shellPath and OpenRouter transport secrets while retaining the allowed OpenRouter apiKey.
    seamIds: [settings-config-settings-save, settings-config-settings-service]
    riskIds: [settings-config-unsafe-settings-write]
  - id: settings-config-partial-invalid-sections
    statement: Loading a settings object preserves valid top-level sections while omitting invalid sections for default fallback and reports errors.
    seamIds: [settings-config-settings-load]
    riskIds: [settings-config-invalid-settings-accepted, settings-config-corrupt-settings-loss]
  - id: settings-config-invalid-file-shape
    statement: Loading a non-object or syntactically invalid settings file reports errors without treating it as a valid configuration.
    seamIds: [settings-config-settings-load]
    riskIds: [settings-config-corrupt-settings-loss]
  - id: settings-config-corrupt-file-recovery
    statement: Loading corrupt settings can salvage a complete embedded JSON object, reports recovered sections, and leaves the original raw content available to the service boundary.
    seamIds: [settings-config-settings-load, settings-config-settings-service]
    riskIds: [settings-config-corrupt-settings-loss]
  - id: settings-config-recovery-scan-bound
    statement: Recovery scanning rejects embedded non-object values and gives up on pathological bracket input within its bounded search.
    seamIds: [settings-config-settings-load]
    riskIds: [settings-config-corrupt-settings-loss]
  - id: settings-config-atomic-settings-write
    statement: Saving settings writes a validated, secret-filtered complete document atomically and removes a temporary file when rename fails.
    seamIds: [settings-config-settings-save]
    riskIds: [settings-config-unsafe-settings-write]
  - id: settings-config-lock-ownership
    statement: Settings locks recover stale owners, prevent fresh-lock overwrites within the timeout, and prevent a stale owner from deleting its successor lock.
    seamIds: [settings-config-settings-lock, settings-config-settings-save]
    riskIds: [settings-config-concurrent-settings-clobber]
  - id: settings-config-settings-service-defaults
    statement: SettingsService initializes a complete public settings view from documented defaults and creates its settings directory when needed.
    seamIds: [settings-config-settings-service]
    riskIds: [settings-config-service-state-drift]
  - id: settings-config-settings-service-precedence
    statement: SettingsService exposes CLI, environment, config, and default values and sources using the documented precedence.
    seamIds: [settings-config-settings-service, settings-config-settings-merge]
    riskIds: [settings-config-wrong-override-precedence, settings-config-service-state-drift]
  - id: settings-config-provider-registration-and-migration
    statement: SettingsService registers configured custom providers and migrates legacy provider records and selected names to normalized durable ids.
    seamIds: [settings-config-settings-service, settings-config-provider-settings]
    riskIds: [settings-config-provider-selection-drift]
  - id: settings-config-durable-mutation-settlement
    statement: SettingsService reports saved versus disabled or failed durable mutations truthfully, and a fresh service observes only committed values.
    seamIds: [settings-config-settings-service, settings-config-settings-save]
    riskIds: [settings-config-service-state-drift, settings-config-unsafe-settings-write]
  - id: settings-config-runtime-persistent-mutations
    statement: Runtime-modifiable settings can be set, startup-only settings require persistent mutation, and invalid or sensitive mutations are rejected.
    seamIds: [settings-config-settings-service, settings-config-settings-schema]
    riskIds: [settings-config-invalid-settings-accepted, settings-config-unsafe-settings-write]
  - id: settings-config-service-sources-view
    statement: SettingsService getAll returns nested setting values paired with their individual source metadata, including optional fields.
    seamIds: [settings-config-settings-service]
    riskIds: [settings-config-service-state-drift]
  - id: settings-config-service-corruption-boundary
    statement: SettingsService refuses unrecoverable corrupt files, but quarantines recoverable originals and exposes salvaged values through the public recovery result.
    seamIds: [settings-config-settings-service, settings-config-settings-load, settings-config-settings-save]
    riskIds: [settings-config-corrupt-settings-loss]
  - id: settings-config-startup-migrations
    statement: SettingsService persists applicable missing-key, deadline, ancillary-tier, and provider migrations without rewriting an already complete equivalent file.
    seamIds: [settings-config-settings-service, settings-config-settings-save]
    riskIds: [settings-config-service-state-drift]
  - id: settings-config-concurrent-service-writes
    statement: Independently constructed SettingsService instances reconcile committed settings so distinct updates survive, stale resets do not clobber other keys, and last writes win for one key.
    seamIds: [settings-config-settings-service, settings-config-settings-lock, settings-config-settings-save]
    riskIds: [settings-config-concurrent-settings-clobber, settings-config-service-state-drift]
  - id: settings-config-profile-canonicalization
    statement: Legacy app-mode writes and transaction-order changes project to one canonical active profile and mutually exclusive legacy flags across persistence and reload.
    seamIds: [settings-config-settings-service, settings-config-profile-settings]
    riskIds: [settings-config-profile-mode-drift]
  - id: settings-config-sandbox-exclusivity
    statement: Always auto-approval disables the sandbox, enabling the sandbox demotes always to auto, and persisted conflicts are normalized without disabling explicitly disabled sandboxes.
    seamIds: [settings-config-settings-service, settings-config-sandbox-settings]
    riskIds: [settings-config-sandbox-approval-bypass]
  - id: settings-config-retired-model-absent
    statement: Production TypeScript outside the retired model contract contains neither retired model identifiers nor imports of contracts/model.js.
    seamIds: [settings-config-retired-model]
    riskIds: [settings-config-retired-model-revival]
