# Shell domain Milestone 3 second-opinion exploration.
schemaVersion: 2
domains:
  - id: shell
    label: Shell execution and safety
suites:
  - id: unit
    label: Deterministic unit and seam tests
seams:
  - id: shell-tool
    label: Boundary where shell requests become sandboxed or unsandboxed execution
  - id: shell-command-classifier
    label: Boundary classifying command and path input as GREEN, YELLOW, or RED
  - id: shell-session-history
    label: Boundary between interactive shell submissions and persisted conversation context
  - id: shell-temp-artifacts
    label: Boundary managing bounded shell output artifacts and stale temporary data
risks:
  - id: shell-safety-bypass
    label: A command bypasses sandbox, approval, workspace, or output containment policy.
    severity: critical
  - id: shell-session-state-loss
    label: Shell lifecycle, cancellation, or history state is lost or applied to the wrong command.
    severity: critical
  - id: shell-classifier-misclassification
    label: Safe work prompts unnecessarily or dangerous work is treated as safe.
    severity: high
  - id: shell-output-loss
    label: Shell output, completion status, or cleanup evidence is lost or reported inaccurately.
    severity: high
fixtures:
  - id: shell-runner-fixture
    label: Injected shell runner, registry, scheduler, and temporary workspace
  - id: shell-command-corpus
    label: Representative command and path safety corpus
  - id: shell-real-process
    label: Real child processes and process-group fixtures for containment tests
  - id: shell-fake-approval
    label: Deterministic approval handlers, pause controllers, and child-process doubles
  - id: shell-temp-workspace
    label: Temporary filesystem, process metadata, and output artifact fixtures
contracts:
  - id: shell-background-lifecycle
    statement: A background shell call acknowledges immediately, retains output, exposes status and cancellation, emits terminal lifecycle events, and cleans up after settlement.
    seamIds:
      - shell-tool
    riskIds:
      - shell-safety-bypass
      - shell-session-state-loss
  - id: shell-monitoring
    statement: Monitoring is available only for background jobs, reports retained matches in order, and setup failures do not hide the launched job.
    seamIds:
      - shell-tool
    riskIds:
      - shell-safety-bypass
      - shell-session-state-loss
  - id: shell-timeout-and-output-caps
    statement: Foreground and background commands use their respective timeout and overflow policies, and caller output requests cannot exceed the configured session cap.
    seamIds:
      - shell-tool
      - shell-temp-artifacts
    riskIds:
      - shell-safety-bypass
      - shell-output-loss
  - id: shell-sandbox-and-approval
    statement: Shell execution follows sandbox availability, mode, approval, Docker authorization, SSH, RTK, and plan-mode policy without executing a command when a required guard fails.
    seamIds:
      - shell-tool
    riskIds:
      - shell-safety-bypass
  - id: shell-denied-read-recovery
    statement: Strict sandbox denied reads produce a scoped retry or held-call approval path, preserve raw command identity, and fail closed when required call metadata is absent.
    seamIds:
      - shell-tool
    riskIds:
      - shell-safety-bypass
      - shell-session-state-loss
  - id: shell-command-classification
    statement: Shell command and path forms are classified with the intended GREEN, YELLOW, or RED severity, including nested executors, wrappers, and false-positive boundaries.
    seamIds:
      - shell-command-classifier
    riskIds:
      - shell-classifier-misclassification
      - shell-safety-bypass
  - id: shell-interactive-history
    statement: Accepted interactive shell commands execute with their configured connection context and are flushed into one complete conversation context after all accepted work settles.
    seamIds:
      - shell-session-history
    riskIds:
      - shell-session-state-loss
  - id: shell-command-logging
    statement: Shell command logging honors the configured console-suppression setting without emitting suppressed command output.
    seamIds:
      - shell-tool
    riskIds:
      - shell-output-loss
  - id: shell-temp-cleanup
    statement: Shell output artifacts and stale temporary directories are parsed and pruned according to process liveness, age, and grace-period policy.
    seamIds:
      - shell-temp-artifacts
    riskIds:
      - shell-output-loss
      - shell-safety-bypass
