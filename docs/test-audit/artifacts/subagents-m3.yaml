schemaVersion: 2
domains:
  - id: subagents
    label: Subagent execution, delegation, and policy boundaries
suites:
  - id: unit
    label: Deterministic unit and seam tests
seams:
  - id: subagents-handoff-session
    label: Boundary coordinating captured handoff state, model selection, and dispatch effects
  - id: subagents-queue-controller
    label: Boundary admitting, dispatching, pausing, recovering, and persisting queued turns
  - id: subagents-run-id
    label: Boundary allocating and parsing human-readable delegated-run identities
  - id: subagents-execution-runner
    label: Boundary converting an execution subagent stream into bounded events and a terminal result
  - id: subagents-foreground-lease
    label: Boundary transferring a paused foreground subagent continuation to background ownership
  - id: subagents-mentor-runner
    label: Boundary running persistent, sampled, and pooled mentor consultations
  - id: subagents-nested-runner
    label: Boundary executing nested role tools, approvals, transfers, and budget settlement
  - id: subagents-role-loader
    label: Boundary resolving role definitions, prompts, budgets, and reasoning settings
  - id: subagents-async-registry
    label: Boundary owning asynchronous run identity, lifecycle, status, steering, and retention
  - id: subagents-manager-runtime
    label: Boundary exposing the shared application-owned agent runtime from SubagentManager
  - id: subagents-manager-prompts
    label: Boundary selecting subagent prompt families and excluding top-level prompt policy
  - id: subagents-manager-retry
    label: Boundary classifying and retrying recoverable subagent model and transport failures
  - id: subagents-manager-tools
    label: Boundary registering role tools and guidance from model, search, remote, and skill settings
  - id: subagents-notification-store
    label: Boundary projecting subagent and related background events into ordered notifications and task cards
  - id: subagents-run-control
    label: Boundary controlling one subagent segment, deferred interruption, mailbox, and question waiter
  - id: subagents-session
    label: Boundary retaining provider, agent, history, and continuation state for one subagent
  - id: subagents-tool-policy
    label: Boundary attenuating subagent tool authority and wrapping execution, approval, and evidence policy
  - id: subagents-worker-worktree
    label: Boundary pinning worker execution to a selected local worktree
  - id: subagents-provenance-gate
    label: Boundary requiring interactive-equivalent provenance before non-interactive risky approval executes
risks:
  - id: subagents-state-loss
    label: A delegated turn or handoff loses, replays, or misroutes state across a boundary.
    severity: critical
  - id: subagents-authority-escape
    label: A delegated role gains authority, continuation, or execution scope outside its contract.
    severity: critical
  - id: subagents-approval-confusion
    label: An approval, question answer, or continuation decision applies to the wrong call or generation.
    severity: critical
  - id: subagents-runaway-work
    label: Delegated work exceeds its budget or remains live after cancellation without truthful settlement.
    severity: high
  - id: subagents-policy-drift
    label: Role, prompt, model, search, or approval policy silently changes at a production seam.
    severity: high
  - id: subagents-event-loss
    label: Lifecycle, usage, terminal, or background activity evidence is missing, duplicated, or misleading.
    severity: high
  - id: subagents-persistence-corruption
    label: Queued work or recovery state is persisted, restored, or quarantined incorrectly.
    severity: critical
  - id: subagents-run-id-collision
    label: A delegated-run identity collides, parses incorrectly, or targets a different active run.
    severity: high
  - id: subagents-worktree-escape
    label: Worker execution is pinned to the wrong workspace or mutates the shared active-root selection.
    severity: high
  - id: subagents-provider-failure
    label: A provider failure is retried unsafely or hides useful partial work and usage evidence.
    severity: high
  - id: subagents-result-misreport
    label: Completed, failed, cancelled, interrupted, or partial delegated work is reported with the wrong status.
    severity: high
  - id: subagents-provenance-bypass
    label: A metadata-less advisory authorizes a risky non-interactive command.
    severity: critical
  - id: subagents-notification-retention
    label: A user misses, re-sees, or receives out-of-order background activity after delivery or continuation.
    severity: high
  - id: subagents-mailbox-overflow
    label: Steering grows without bounds or admitted guidance is lost during interruption and continuation.
    severity: high
  - id: subagents-tool-evidence-loss
    label: Tool usage, changed files, validation, or diff evidence is omitted or falsely attributed.
    severity: medium
fixtures:
  - id: subagents-state-driver
    label: Injected queue driver, IDs, snapshots, and deterministic command/event inputs
  - id: subagents-persistence
    label: In-memory queue persistence, invalid-record quarantine, and injected clocks
  - id: subagents-provider
    label: Registered deterministic providers and scripted subagent streams
  - id: subagents-stream
    label: Scripted text, tool, retry, usage, completion, and failure stream events
  - id: subagents-lease
    label: Continuation handles, foreground leases, approval pauses, and abort signals
  - id: subagents-runtime
    label: Application-owned runtime, tool ownership, session context, and role runner fixtures
  - id: subagents-policy
    label: Role definitions, settings, wrapped tools, filesystem scopes, and approval policy fixtures
  - id: subagents-notifications
    label: Lifecycle, shell, watch, check-in, usage, and completion event records
  - id: subagents-session
    label: In-memory provider session, agent, history, and response-chain state
  - id: subagents-worktree
    label: Deterministic local worktree list and active workspace root
contracts:
  - id: subagents-handoff-flow
    statement: A captured handoff advances through message, model, and effort stages, applies selected runtime policy, sends the composed message, and clears state after completion.
    seamIds: [subagents-handoff-session]
    riskIds: [subagents-state-loss, subagents-policy-drift]
  - id: subagents-queue-admission
    statement: Queued submissions dispatch FIFO with one active execution, immutable dispatch snapshots, steer priority, duplicate identity rejection, and completion-barrier serialization.
    seamIds: [subagents-queue-controller]
    riskIds: [subagents-state-loss, subagents-result-misreport]
  - id: subagents-queue-cancel-pause
    statement: Manual cancellation and matching failure await cleanup, suppress stale terminal events, retain queued work when present, and return empty queues to idle.
    seamIds: [subagents-queue-controller]
    riskIds: [subagents-state-loss, subagents-result-misreport]
  - id: subagents-queue-interactions
    statement: Preflight, tool approval, and ask-user actions enter the matching awaiting state and accept only matching answers while rejecting stale or cross-kind resolutions.
    seamIds: [subagents-queue-controller]
    riskIds: [subagents-approval-confusion]
  - id: subagents-queue-recovery
    statement: Persisted queue mutations and awaiting states survive reload, interrupted active work is recovered conservatively, stale action identities are replaced or rejected, and invalid records are quarantined.
    seamIds: [subagents-queue-controller]
    riskIds: [subagents-persistence-corruption, subagents-approval-confusion]
  - id: subagents-run-id-contract
    statement: Generated run identities have the adjective-noun-number shape, remain short and parseable, provide a large identity space, and reject non-codename identifiers.
    seamIds: [subagents-run-id]
    riskIds: [subagents-run-id-collision]
  - id: subagents-execution-observations
    statement: Execution streams emit bounded text turns and tool progress at the correct boundaries, discard partial text on retry or error, and never forward tool argument content.
    seamIds: [subagents-execution-runner]
    riskIds: [subagents-event-loss, subagents-tool-evidence-loss]
  - id: subagents-execution-settlement
    statement: Execution results preserve complete final text in an artifact when display is truncated, classify budget stops as interrupted with partial work, dispose transient clients, and forward usage under the owning run id.
    seamIds: [subagents-execution-runner]
    riskIds: [subagents-result-misreport, subagents-event-loss, subagents-tool-evidence-loss]
  - id: subagents-foreground-capability
    statement: A foreground lease forwards abort before adoption, detaches parent abort after adoption, admits one generation-and-identity-checked continuation, and unblocks safely on cancel or settlement.
    seamIds: [subagents-foreground-lease]
    riskIds: [subagents-approval-confusion, subagents-authority-escape]
  - id: subagents-mentor-settlement
    statement: Direct mentor runs return truthful completed or cancelled results with final text and usage, enforce tool-free wrap-up, and restore the prior session after an injected session run.
    seamIds: [subagents-mentor-runner]
    riskIds: [subagents-result-misreport, subagents-provider-failure]
  - id: subagents-mentor-independence
    statement: Configured mentor samples use independent sessions, successful opinions survive partial failure, all pooled models are consulted and labelled, and a pool overrides the sample count.
    seamIds: [subagents-mentor-runner]
    riskIds: [subagents-state-loss, subagents-provider-failure]
  - id: subagents-nested-transfer
    statement: Nested tools preserve stable call identity, parent approval, foreground adoption, continuation ownership, and exactly one durable terminal event across approval, failure, cancellation, and transfer.
    seamIds: [subagents-nested-runner]
    riskIds: [subagents-approval-confusion, subagents-event-loss, subagents-result-misreport]
  - id: subagents-nested-budget
    statement: Nested execution projects role limits and provider chaining, contains looping or failed work with truthful partial evidence, and performs a tool-free budget settlement without dispatching proposed tools.
    seamIds: [subagents-nested-runner]
    riskIds: [subagents-runaway-work, subagents-result-misreport, subagents-tool-evidence-loss]
  - id: subagents-role-definition
    statement: Role resolution assigns tool-using roles a bounded default budget, keeps mentor single-turn, expresses explorer evidence-only ownership, and resolves legacy and tier reasoning settings correctly.
    seamIds: [subagents-role-loader]
    riskIds: [subagents-policy-drift, subagents-runaway-work]
  - id: subagents-async-lifecycle
    statement: Each asynchronous run has an owned session and identity, emits one matching terminal lifecycle event, retains terminal results until reset or eviction, and makes cancellation settle only after runner evidence.
    seamIds: [subagents-async-registry]
    riskIds: [subagents-event-loss, subagents-result-misreport, subagents-state-loss]
  - id: subagents-async-observation
    statement: Run status synchronously reports bounded activity, usage, tools, text turns, elapsed time, approval and provider waits, ignores foreign events, and returns not-found rather than throwing.
    seamIds: [subagents-async-registry]
    riskIds: [subagents-event-loss, subagents-runaway-work]
  - id: subagents-async-steering
    statement: Asynchronous steering resolves canonical run ids before names, answers only the matching question, bounds and coalesces guidance, defers interruption until tools finish, and prevents cancellation races or unsupported targets.
    seamIds: [subagents-async-registry]
    riskIds: [subagents-approval-confusion, subagents-mailbox-overflow, subagents-state-loss]
  - id: subagents-async-continuity
    statement: A completed continuation reuses the permitted run id, session, provider history key, and role policy, while concurrent or invalid continuations are rejected and nested launches receive distinct scoped keys.
    seamIds: [subagents-async-registry]
    riskIds: [subagents-state-loss, subagents-authority-escape, subagents-run-id-collision]
  - id: subagents-runtime-wiring
    statement: SubagentManager exposes an AgentRuntime backed by its shared subagent infrastructure, creates usable handles, preserves the public handle shape, and returns fresh runtime wrappers over shared executors.
    seamIds: [subagents-manager-runtime]
    riskIds: [subagents-authority-escape, subagents-state-loss]
  - id: subagents-prompt-composition
    statement: Execution subagents receive model-family and role instructions in the required order without top-level-only prompt content, while mentor runs retain their separate mentor prompt contract.
    seamIds: [subagents-manager-prompts]
    riskIds: [subagents-policy-drift, subagents-authority-escape]
  - id: subagents-retry-policy
    statement: Recoverable hallucinated-tool and transport failures retry within policy and emit retry evidence, while non-recoverable model errors and aborts do not retry and partial tool evidence survives cancellation.
    seamIds: [subagents-manager-retry]
    riskIds: [subagents-provider-failure, subagents-result-misreport, subagents-tool-evidence-loss]
  - id: subagents-tool-registration
    statement: Manager tool registration follows model search mode, role capabilities, remote context, and available skills, exposing matching tools and guidance while omitting unavailable tools.
    seamIds: [subagents-manager-tools]
    riskIds: [subagents-policy-drift, subagents-authority-escape]
  - id: subagents-notification-projection
    statement: Async lifecycle, usage, tool, shell, watch, and check-in events produce the correct visible task projection while foreground and non-projecting events remain absent.
    seamIds: [subagents-notification-store]
    riskIds: [subagents-event-loss, subagents-notification-retention]
  - id: subagents-notification-delivery
    statement: Notifications preserve message order, deduplicate exact identities, retain undelivered items ahead of newer items, expose bounded previews, and re-notify only after a genuine continuation.
    seamIds: [subagents-notification-store]
    riskIds: [subagents-event-loss, subagents-notification-retention]
  - id: subagents-run-control
    statement: One segment controller admits interruption only after active tools complete, bounds and preserves steering, owns one trimmed question waiter, and rejects or settles stale answers during cancellation.
    seamIds: [subagents-run-control]
    riskIds: [subagents-mailbox-overflow, subagents-approval-confusion, subagents-runaway-work]
  - id: subagents-session-continuity
    statement: A subagent session initializes and resets provider and agent state, caches agents and streamed models, tracks response identifiers, and chooses string or history input according to chaining capability.
    seamIds: [subagents-session]
    riskIds: [subagents-state-loss, subagents-provider-failure]
  - id: subagents-tool-authority
    statement: Tool construction grants only requested and role-compatible editors, memory, search, shell, and web tools, attenuates configured filesystem and network scopes, and preserves role-specific guidance.
    seamIds: [subagents-tool-policy]
    riskIds: [subagents-authority-escape, subagents-policy-drift]
  - id: subagents-tool-execution-policy
    statement: Wrapped tools report completion on throws, preserve bounded serialized output, apply shell and editor approval modes, reject explicit unsandboxed nested execution, and enforce write boundaries.
    seamIds: [subagents-tool-policy]
    riskIds: [subagents-authority-escape, subagents-approval-confusion]
  - id: subagents-tool-evidence
    statement: Validation capture recognizes validation commands without overwriting prior evidence, bounds excerpts, and write wrapping records changed paths and line deltas while documenting known shell-edit omissions.
    seamIds: [subagents-tool-policy]
    riskIds: [subagents-tool-evidence-loss, subagents-policy-drift]
  - id: subagents-worktree-pinning
    statement: Only local worker roles can pin to an existing named worktree, the returned execution context uses that path, unknown names fail clearly, and active workspace root publication is untouched.
    seamIds: [subagents-worker-worktree]
    riskIds: [subagents-worktree-escape, subagents-authority-escape]
  - id: subagents-provenance
    statement: A non-interactive YELLOW approval without interactive-equivalent provenance is blocked rather than executing the shell command.
    seamIds: [subagents-provenance-gate]
    riskIds: [subagents-provenance-bypass, subagents-authority-escape]
  - id: subagents-result-format
    statement: Formatted worker results include successful status, final text, and the selected worktree, while budget errors are recognized, parsed, and converted into a partial-results stop message.
    seamIds: [subagents-execution-runner]
    riskIds: [subagents-result-misreport, subagents-tool-evidence-loss]
