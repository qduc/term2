decisions:
  - id: subagents-handoff-session-subagents-m3
    testId: subagents-handoff-session
    role: second_opinion
    reviewer: subagents-m3
    sourceArtifact: docs/test-audit/artifacts/subagents-m3.yaml
    recommendation: keep
    confidence: high
    reason: "The session test covers the public handoff coordinator rather than only the reducer: it verifies staged state, trimmed message capture, model/provider persistence, final clearing, and dependency replacement while a handoff is active."
    evidence:
      - source/services/handoff/handoff-session.test.ts:18-32 verifies the entering-message to model-selection transition and composed captured message state.
      - source/services/handoff/handoff-session.test.ts:34-56 verifies model/provider application and state clearing after effort completion.
      - source/services/handoff/handoff-session.test.ts:58-77 verifies updateDeps preserves the active handoff state; source/hooks/handoff-flow-reducer.test.ts covers the reducer separately, not this dependency/effect boundary.
    replacementTestIds: []
    status: proposed
  - id: subagents-queue-controller-subagents-m3
    testId: subagents-queue-controller
    role: second_opinion
    reviewer: subagents-m3
    sourceArtifact: docs/test-audit/artifacts/subagents-m3.yaml
    recommendation: keep
    confidence: high
    reason: "This is the direct state-machine evidence for queue admission, dispatch snapshots, cancellation and failure recovery, typed interactive waits, persistence, and dispatch holding; no sibling exercises the same controller seam at comparable breadth."
    evidence:
      - source/services/queue/queue-controller.test.ts:13-213 verifies FIFO admission, one active execution, immutable snapshots, steer priority, and mutation-order persistence under concurrent submissions.
      - source/services/queue/queue-controller.test.ts:215-414 verifies awaited cancellation cleanup, stale-event suppression, retained paused work, and matching failure recovery.
      - source/services/queue/queue-controller.test.ts:693-1149 and :1154-1685 verify preflight, tool approval, ask-user, cancellation, persistence, recovery, and cross-kind stale-answer rejection.
      - source/services/queue/queue-controller.test.ts:1830-1885 verifies hold/release dispatch policy; source/services/conversation/conversation-adapter.test.ts and source/hooks/conversation-ui-reducer.test.ts cover callers or projections, not this controller transition contract.
    replacementTestIds: []
    status: proposed
  - id: subagents-provenance-boundary-subagents-m3
    testId: subagents-provenance-boundary
    role: second_opinion
    reviewer: subagents-m3
    sourceArtifact: docs/test-audit/artifacts/subagents-m3.yaml
    recommendation: keep
    confidence: medium
    reason: "The intentionally failing regression records a known risky approval gap and the exact desired fail-closed observable; removing it would erase the only assigned evidence for interactive-equivalent provenance on the worker path."
    evidence:
      - source/services/subagents/c11-d10-provenance-boundary.test.ts:24-30 documents that metadata-less positive advisory behavior currently executes and names the required provenance fields.
      - source/services/subagents/c11-d10-provenance-boundary.test.ts:34-78 drives the production worker shell wrapper with sandbox disabled and asserts a blocked-for-safety result; source/services/subagents/subagent-manager.security.test.ts:506-615 covers approved/rejected YELLOW policy but does not assert missing-provenance rejection.
    replacementTestIds: []
    status: proposed
  - id: subagents-codename-run-id-subagents-m3
    testId: subagents-codename-run-id
    role: second_opinion
    reviewer: subagents-m3
    sourceArtifact: docs/test-audit/artifacts/subagents-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: "Run-id format and parsing are meaningful, but repeated random draws make generation/uniqueness assertions probabilistic and the 500-draw shape and length checks should be consolidated into deterministic format cases. The replacement must retain the large-space and parse/reject contracts."
    evidence:
      - source/services/subagents/codename-run-id.test.ts:10-28 performs two separate 500-draw random loops for pattern and length, with the length assertion duplicating a property of the alias contract.
      - source/services/subagents/codename-run-id.test.ts:47-59 uses a probabilistic 2,000-draw uniqueness threshold rather than controlling the generator; this can fail for randomness without identifying a production defect.
      - source/services/subagents/subagent-async-registry.test.ts:1771-1799 independently verifies generated codename shape and deterministic collision retry, so rewrite can remove repeated integration confidence without deleting the parser/space contract.
    replacementTestIds: []
    status: proposed
  - id: subagents-execution-runner-subagents-m3
    testId: subagents-execution-runner
    role: second_opinion
    reviewer: subagents-m3
    sourceArtifact: docs/test-audit/artifacts/subagents-m3.yaml
    recommendation: keep
    confidence: high
    reason: "The runner tests protect bounded display and event-boundary behavior, truthful budget settlement, artifact preservation, client disposal, and usage attribution at the execution seam; the mocked session composition isolates this contract rather than replacing it with a manager happy path."
    evidence:
      - source/services/subagents/execution-runner.test.ts:75-159 verifies text-turn boundaries, retry/error partial-text suppression, and bounded argument progress without argument leakage.
      - source/services/subagents/execution-runner.test.ts:161-227 verifies budget interruption and complete-result artifact behavior including the 4,001-character regression boundary.
      - source/services/subagents/execution-runner.test.ts:229-256 verifies transient-client disposal and both usage-update paths; no sibling asserts this runner's event translation and final-result ownership together.
    replacementTestIds: []
    status: proposed
  - id: subagents-foreground-subagent-lease-subagents-m3
    testId: subagents-foreground-subagent-lease
    role: second_opinion
    reviewer: subagents-m3
    sourceArtifact: docs/test-audit/artifacts/subagents-m3.yaml
    recommendation: keep
    confidence: high
