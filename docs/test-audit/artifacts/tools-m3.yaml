decisions:
  - id: tools-ask-mentor-tools-m3
    testId: tools-ask-mentor
    role: second_opinion
    reviewer: tools-m3
    sourceArtifact: docs/test-audit/artifacts/tools-m3.yaml
    recommendation: keep
    confidence: high
    reason: The six cases cover prompt construction, safe ordinary failure, and abort semantics at a narrow callback seam.
    evidence:
      - source/tools/agent/ask-mentor.test.ts:34-78 asserts both context placement and the distinction between returned failure text and propagated abort.
      - Production seam is source/tools/agent/ask-mentor.ts:51-69; the only same-domain schema overlap is the narrower ask_mentor null check in source/tools/tool-parameter-schema.test.ts:85-90.
    replacementTestIds: []
    status: proposed
  - id: tools-ask-orchestrator-tools-m3
    testId: tools-ask-orchestrator
    role: second_opinion
    reviewer: tools-m3
    sourceArtifact: docs/test-audit/artifacts/tools-m3.yaml
    recommendation: keep
    confidence: high
    reason: This is the only direct test of the bounded, subagent-only waiting bridge.
    evidence:
      - source/tools/agent/ask-orchestrator.test.ts:4-20 resolves a deliberately pending callback and verifies no premature result or user interaction.
      - Production seam is source/tools/agent/ask-orchestrator.ts:10-46; source/services/subagents/tool-policy.test.ts:201-210 is an out-of-assignment registration-policy sibling, not duplicate execution coverage.
    replacementTestIds: []
    status: proposed
  - id: tools-ask-user-tools-m3
    testId: tools-ask-user
    role: second_opinion
    reviewer: tools-m3
    sourceArtifact: docs/test-audit/artifacts/tools-m3.yaml
    recommendation: keep
    confidence: high
    reason: It protects the user-facing schema, call-id answer association, fallback state, and display rendering as separate observable contracts.
    evidence:
      - source/tools/agent/ask-user.test.ts:31-119 and :122-269 cover reserved labels, multi-select, missing answers, malformed arguments, and mismatched answer lengths.
      - Production registration is source/agent.ts:449-453; lifecycle siblings are source/services/queue/queue-controller.test.ts:1006-1118 and source/services/session/pending-interaction-state.test.ts:19-87, both outside this assignment and not replacements for tool-local rendering.
    replacementTestIds: []
    status: proposed
  - id: tools-configure-task-check-in-tools-m3
    testId: tools-configure-task-check-in
    role: second_opinion
    reviewer: tools-m3
    sourceArtifact: docs/test-audit/artifacts/tools-m3.yaml
    recommendation: keep
    confidence: high
    reason: Boundary tests pin the scheduler-facing minimums and JSON error contract without requiring a live scheduler.
    evidence:
      - source/tools/agent/configure-task-check-in.test.ts:14-105 asserts forwarded defaults, formatted output, and both lower-bound failures.
      - Production seam is source/tools/agent/configure-task-check-in.ts:15-86; source/services/session/background-check-in-scheduler.test.ts:186-209 covers downstream alias resolution outside this assignment.
    replacementTestIds: []
    status: proposed
  - id: tools-run-subagent-async-tools-m3
    testId: tools-run-subagent-async
    role: second_opinion
    reviewer: tools-m3
    sourceArtifact: docs/test-audit/artifacts/tools-m3.yaml
    recommendation: keep
    confidence: high
    reason: The file is broad but each lifecycle operation has a distinct nonblocking, status, typed-error, or display contract.
    evidence:
