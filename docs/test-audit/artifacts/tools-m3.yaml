schemaVersion: 2
domains:
  - id: tools
    label: Tool definitions, adapters, and tool-local helpers
suites:
  - id: unit
    label: Default Vitest unit suite
  - id: integration
    label: Opt-in Docker host-control integration suite
seams:
  - id: tools-agent-bridge
    label: Tool boundary that turns agent-facing questions or delegated work into a callback or subagent result.
  - id: tools-user-interaction
    label: Tool boundary that carries a model ask_user request through approval and call-id keyed user answers.
  - id: tools-checkin-scheduler
    label: Tool boundary that validates and forwards proactive background-task check-in configuration.
  - id: tools-subagent-registry
    label: Tool boundary between subagent lifecycle tools and the async subagent registry and runner.
  - id: tools-command-formatting
    label: Boundary that converts tool arguments and outputs into terminal command messages.
  - id: tools-file-write
    label: Tool boundary that resolves paths and applies or creates filesystem mutations.
  - id: tools-file-read
    label: Tool boundary that resolves paths and returns bounded, text or multimodal file content.
  - id: tools-file-search
    label: Tool boundary that runs bounded glob and grep searches with workspace-aware policy.
  - id: tools-code-index
    label: Tool boundary that summarizes source structure and discovers related files or symbols.
  - id: tools-patch-healing
    label: Guarded model-assisted boundary that repairs stale edit context without changing requested edits.
  - id: tools-memory
    label: Tool boundary that exposes scoped memory retrieval and mutation with bounded serialized output.
  - id: tools-workflow
    label: Tool boundary that evaluates disposable JavaScript child-agent workflows under admission limits.
  - id: tools-session-browser
    label: Read-only tool boundary over persisted session listing, search, and progressive reads.
  - id: tools-session-rollover
    label: Tool boundary that requests idle session rotation and reports blockers.
  - id: tools-shell
    label: Shell tool construction and command-message boundary, including sandbox and host-control policy.
  - id: tools-worktree
    label: Tool boundary that changes the execution context root among runtime-issued worktrees.
  - id: tools-schema
    label: Tool parameter-schema boundary between provider arguments and typed tool executors.
  - id: tools-path-policy
    label: Shared path-resolution boundary enforcing workspace, temporary, skill, and hook rules.
  - id: tools-web-fetch
    label: Tool boundary that fetches a URL, converts content to Markdown, and bounds or spools output.
  - id: tools-web-search
    label: Tool boundary that selects a configured search provider and formats its response.
  - id: tools-upstream-parser
    label: Compatibility parser boundary from upstream apply-patch text and grammar to local operations.
  - id: tools-format-helpers
    label: Shared result-normalization boundary from heterogeneous tool output items to display text.
  - id: tools-tool-registry
    label: Process-local registry boundary that indexes explicitly registered tool formatters.
risks:
  - id: tools-risk-agent-boundary
    label: Agent-facing tool calls lose context, block incorrectly, or expose the wrong lifecycle state.
    severity: high
  - id: tools-risk-user-answer-loss
    label: A user answer is misassociated, treated as success when absent, or cannot resume the turn.
    severity: high
  - id: tools-risk-checkin-floor
    label: Invalid check-in timing reaches the scheduler and causes excessive or ineffective wakeups.
    severity: medium
  - id: tools-risk-subagent-state
    label: Delegated work is duplicated, awaited at the wrong time, leaks content, or loses failure state.
    severity: high
  - id: tools-risk-display-drift
    label: Tool history displays misleading command, output, success, or argument information.
    severity: medium
  - id: tools-risk-file-mutation
    label: A file mutation is applied to the wrong content, partially applied, or bypasses approval boundaries.
    severity: critical
  - id: tools-risk-file-read-boundary
    label: Reads expose unintended paths or unbounded, binary, corrupt, or encoded content to the model.
    severity: high
  - id: tools-risk-search-boundary
    label: Search silently uses the wrong dialect, scope, result bound, or workspace policy.
    severity: high
  - id: tools-risk-code-index
    label: Code navigation returns incomplete, misleading, or language-inaccurate structural evidence.
    severity: medium
  - id: tools-risk-healing-corruption
    label: Model-assisted edit healing changes requested lines or applies an ambiguous location.
    severity: critical
  - id: tools-risk-memory-integrity
    label: Memory scope, ranking, cursor, error, or output-budget semantics become unsafe or misleading.
    severity: high
  - id: tools-risk-workflow-escape
    label: A disposable workflow exceeds run, concurrency, byte, or capability limits.
    severity: critical
  - id: tools-risk-session-history
    label: Session browsing violates identifier or pagination contracts or reports incomplete history incorrectly.
    severity: medium
  - id: tools-risk-rollover-loss
    label: Rollover occurs with live work or fails to terminate at the requested idle boundary.
    severity: high
  - id: tools-risk-shell-registration
    label: Shell construction and host-control grants are wired through an ownership seam that can drift.
    severity: high
  - id: tools-risk-worktree-misroot
    label: Tool execution continues under the wrong worktree or changes root while background work is live.
    severity: high
  - id: tools-risk-schema-drift
    label: Provider-shaped arguments accepted by a tool do not match its intended typed contract.
    severity: high
  - id: tools-risk-path-escape
    label: Path normalization allows an unintended outside-workspace read or write.
    severity: critical
  - id: tools-risk-web-output
    label: Web content is fetched from the wrong source, formatted incorrectly, or overflows model context.
    severity: medium
  - id: tools-risk-parser-drift
    label: Upstream patch syntax is accepted incorrectly or converted to the wrong local operation.
    severity: high
  - id: tools-risk-result-normalization
    label: Heterogeneous tool result shapes lose the most useful error or success text.
    severity: medium
  - id: tools-risk-name-drift
    label: A tool name changes and breaks provider calls, routing, or persisted message interpretation.
    severity: high
fixtures: []
contracts:
  - id: tools-contract-ask-mentor
    statement: The mentor tool sends either the question or a labeled context-plus-question prompt, returns ordinary failures as safe text, and propagates abort errors.
    seamIds: [tools-agent-bridge]
    riskIds: [tools-risk-agent-boundary]
  - id: tools-contract-ask-orchestrator
    statement: The orchestrator bridge accepts only a nonblank question of at most 1,200 characters, requires no approval, and waits for the supplied answer without contacting the user.
    seamIds: [tools-agent-bridge]
    riskIds: [tools-risk-agent-boundary]
  - id: tools-contract-ask-user
    statement: ask_user accepts bounded nonblank questions and valid choices, passes the tool call ID to answer lookup, and renders answered, declined, missing, and malformed responses with the correct success state.
    seamIds: [tools-user-interaction, tools-command-formatting]
    riskIds: [tools-risk-user-answer-loss, tools-risk-display-drift]
  - id: tools-contract-checkin
    statement: configure_task_check_in forwards validated task settings as JSON and rejects intervals below 300 seconds or one-shot delays below 30 seconds.
    seamIds: [tools-checkin-scheduler]
    riskIds: [tools-risk-checkin-floor]
  - id: tools-contract-run-subagent
    statement: run_subagent requires an explicit supported execution and role, dispatches only the available mode, preserves interruption and failure as model-visible plain text, and formats bounded result evidence.
    seamIds: [tools-agent-bridge, tools-subagent-registry, tools-command-formatting, tools-schema]
    riskIds: [tools-risk-agent-boundary, tools-risk-subagent-state, tools-risk-display-drift, tools-risk-schema-drift]
  - id: tools-contract-async-subagent
    statement: Async subagent lifecycle tools return handles and compact control acknowledgements, refuse premature result waits, expose bounded status and liveness evidence, and preserve typed registry errors.
    seamIds: [tools-subagent-registry, tools-command-formatting, tools-schema]
    riskIds: [tools-risk-subagent-state, tools-risk-display-drift]
  - id: tools-contract-formatter-registry
    statement: Explicit formatter registration makes a formatter retrievable by tool name while an unregistered registry has no built-in formatter entries.
    seamIds: [tools-tool-registry]
    riskIds: [tools-risk-display-drift]
  - id: tools-contract-apply-patch
    statement: apply_patch applies local and upstream-compatible create, update, move, and delete operations in order, reports malformed or ambiguous patches diagnostically, and enforces path approval, healing, locking, and session-created-file effects.
    seamIds: [tools-file-write, tools-upstream-parser, tools-patch-healing, tools-path-policy]
    riskIds: [tools-risk-file-mutation, tools-risk-path-escape, tools-risk-healing-corruption]
  - id: tools-contract-code-context
    statement: Code-context tools provide body-free outlines and bounded related or symbol results across supported languages, identify meaningful relations, reject unsafe symbols, and degrade explicitly when ripgrep or a language provider is unavailable.
    seamIds: [tools-code-index, tools-file-read, tools-file-search, tools-schema]
    riskIds: [tools-risk-code-index, tools-risk-search-boundary, tools-risk-schema-drift]
  - id: tools-contract-create-file
    statement: create_file creates parent directories and content, protects existing files with the confirmation flow, supports remote execution, and applies workspace, symlink, temporary-path, and session-access policy.
    seamIds: [tools-file-write, tools-path-policy, tools-command-formatting]
    riskIds: [tools-risk-file-mutation, tools-risk-path-escape, tools-risk-display-drift]
  - id: tools-contract-edit-healing
    statement: Search-replace healing may modify only when model output identifies a sufficiently similar unique file span, uses collision-safe prompt delimiters and configured provider selection, and fails closed on ambiguity, invalid output, provider failure, or timeout.
    seamIds: [tools-patch-healing, tools-agent-bridge]
    riskIds: [tools-risk-healing-corruption, tools-risk-agent-boundary]
  - id: tools-contract-glob
    statement: glob finds the requested files with path-segment, absolute-root, fd/find-fallback, SSH, scope, and result-limit semantics while enforcing read approval outside the workspace.
    seamIds: [tools-file-search, tools-path-policy, tools-schema]
    riskIds: [tools-risk-search-boundary, tools-risk-path-escape, tools-risk-schema-drift]
  - id: tools-contract-grep
    statement: grep preserves regex, fixed-string, case, include/exclude, multiline, quoting, and rg/fallback dialect semantics, and applies workspace and session read-approval policy.
    seamIds: [tools-file-search, tools-path-policy, tools-command-formatting, tools-schema]
    riskIds: [tools-risk-search-boundary, tools-risk-path-escape, tools-risk-display-drift]
  - id: tools-contract-patch-healing
    statement: Patch healing parses diff structure and changes context only when a unique model-healed location preserves every added and deleted line; ambiguous, contextless, enveloped, failed, or NO_MATCH output is rejected.
    seamIds: [tools-patch-healing]
    riskIds: [tools-risk-healing-corruption, tools-risk-file-mutation]
  - id: tools-contract-read-file
    statement: read_file returns accurate full or ranged text, handles missing and empty files, bounds and spools oversized output, refuses binary data, returns supported images multimodally, preserves UTF-8, and enforces read path policy.
    seamIds: [tools-file-read, tools-path-policy, tools-command-formatting, tools-schema]
    riskIds: [tools-risk-file-read-boundary, tools-risk-path-escape, tools-risk-display-drift]
  - id: tools-contract-search-replace
    statement: search_replace performs exact, relaxed, normalized, anchor, gap, EOL, escaped-content, batched, and parallel edits with ambiguity and placeholder guards, atomic batch failure, optional healing, and path approval.
    seamIds: [tools-file-write, tools-patch-healing, tools-path-policy, tools-command-formatting]
    riskIds: [tools-risk-file-mutation, tools-risk-healing-corruption, tools-risk-path-escape]
  - id: tools-contract-upstream-parser
    statement: The upstream patch parser converts supported add, update, delete, move, and environment-wrapped syntax into local operations, accepts its documented heredoc wrapper, rejects empty or incomplete patches, and exports matching grammar.
    seamIds: [tools-upstream-parser]
    riskIds: [tools-risk-parser-drift]
  - id: tools-contract-format-helpers
    statement: Patch result normalization prefers nonempty errors over messages and legacy paths, safely ignores unrecognized values, and joins useful item text in original order.
    seamIds: [tools-format-helpers]
    riskIds: [tools-risk-result-normalization]
  - id: tools-contract-memory-tools
    statement: Memory tools expose scoped list/get/search/retrieve/synthesize and mutation operations with correct scope rules, ranking and deduplication, bounded surrogate-safe output, cursor paging and staleness errors, and approval for destructive mutations.
    seamIds: [tools-memory, tools-schema]
    riskIds: [tools-risk-memory-integrity, tools-risk-schema-drift]
  - id: tools-contract-workflow
    statement: run_agent_workflow evaluates only JSON-safe child-agent code with inherited capabilities and bounded concurrency/run limits, returning admission-ordered success or typed failure summaries.
    seamIds: [tools-workflow]
    riskIds: [tools-risk-workflow-escape]
  - id: tools-contract-session-browser
    statement: Session browser tools expose read-only strictly bounded list/search/read operations with documented totals, omissions, live-session ordering, identifier validation, and progressive end reads.
    seamIds: [tools-session-browser, tools-schema]
    riskIds: [tools-risk-session-history, tools-risk-schema-drift]
  - id: tools-contract-session-rollover
    statement: session_rollover accepts only a bounded strict brief and supported reason, forwards it without approval, reports live-background blockers, and marks a successful request as terminating the current turn.
    seamIds: [tools-session-rollover, tools-command-formatting]
    riskIds: [tools-risk-rollover-loss]
  - id: tools-contract-shell-grep-formatters
    statement: Shell and grep formatters emit the correct tool name, command arguments, structured output interpretation, and success state for foreground and background acknowledgements.
    seamIds: [tools-shell, tools-command-formatting]
    riskIds: [tools-risk-display-drift, tools-risk-shell-registration]
  - id: tools-contract-docker-host-control
    statement: With an explicit opt-in Docker prerequisite, the shell tool blocks direct and wrapped host-control commands until a session-scoped grant is issued, then succeeds without the denied-socket failure and re-prompts after an indirect blocked attempt.
    seamIds: [tools-shell]
    riskIds: [tools-risk-shell-registration, tools-risk-file-mutation]
  - id: tools-contract-worktree
    statement: Worktree tools re-root and restore execution context only for an unambiguous runtime-issued worktree, refuse unknown, ambiguous, or busy transitions without changing root, and require no approval.
    seamIds: [tools-worktree]
    riskIds: [tools-risk-worktree-misroot]
  - id: tools-contract-tool-names
    statement: Public constants for core tool names remain equal to the names used by their tool definitions and routing contracts.
    seamIds: [tools-schema]
    riskIds: [tools-risk-name-drift]
  - id: tools-contract-tool-parameter-schema
    statement: Provider-facing tool schemas use omitted optional fields rather than null, reject malformed structures, apply defaults, and derive executor and approval parameter types from the same schema.
    seamIds: [tools-schema]
    riskIds: [tools-risk-schema-drift]
  - id: tools-contract-utils
    statement: Shared path utilities expand home paths, allow only explicitly permitted temporary or discovered-skill locations, and identify protected user or project hook paths without broadening outside-workspace access.
    seamIds: [tools-path-policy]
    riskIds: [tools-risk-path-escape, tools-risk-file-mutation]
  - id: tools-contract-web-fetch
    statement: web_fetch performs read-only URL fetching and Markdown conversion, maps GitHub blobs to raw URLs, handles errors, uses continuation tokens, and spools only oversized initial content while maintaining output bounds.
    seamIds: [tools-web-fetch, tools-command-formatting, tools-schema]
    riskIds: [tools-risk-web-output, tools-risk-schema-drift]
  - id: tools-contract-web-search
    statement: web_search is a read-only configured-provider lookup that returns actionable configuration errors and formats answer boxes, numbered results, empty results, and command success or fallback arguments correctly.
    seamIds: [tools-web-search, tools-command-formatting]
    riskIds: [tools-risk-web-output, tools-risk-display-drift]
