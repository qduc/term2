decisions:
  - id: ui-components-error-boundary-test-ui-components-a-m3
    testId: ui-components-error-boundary-test
    role: second_opinion
    reviewer: ui-components-a-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: The two cases protect both normal rendering and the recovery boundary's visible fallback contract.
    evidence:
      - source/components/ErrorBoundary.test.tsx asserts child output and the fallback title, error message, recovery label, /clear, and /quit.
    replacementTestIds: []
    status: proposed
  - id: ui-components-first-run-setup-prompt-test-ui-components-a-m3
    testId: ui-components-first-run-setup-prompt-test
    role: second_opinion
    reviewer: ui-components-a-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Provider-versus-model phase text and Codex login instructions are user-facing setup guidance with high recovery value.
    evidence:
      - source/components/input/FirstRunSetupPrompt.test.tsx asserts provider setup, Codex login retry guidance, and post-credential model selection text.
    replacementTestIds: []
    status: proposed
  - id: ui-components-model-menu-session-test-ui-components-a-m3
    testId: ui-components-model-menu-session-test
    role: second_opinion
    reviewer: ui-components-a-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Direct and settings-backed model flows protect setup fallback, atomic model/provider persistence, custom IDs, in-place validation errors, and non-submitting Tab behavior.
    evidence:
      - source/components/input/ModelMenuSession.test.tsx asserts unavailable-provider callbacks, apply-settings change arrays, stable error frame identity, and provider-suffix-free Tab insertion.
      - source/components/InputBox.test.tsx exercises the broader command-backed model path, but does not replace this session's direct intent and error assertions.
      - Out-of-assignment sibling source/components/menu/ModelSelectionMenu.test.tsx covers presentation states, not session intent routing.
    replacementTestIds: []
    status: proposed
  - id: ui-components-provider-menu-session-test-ui-components-a-m3
    testId: ui-components-provider-menu-session-test
    role: second_opinion
    reviewer: ui-components-a-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Credential setup and OAuth account selection have session side effects and next-session semantics that generic provider-menu rendering cannot prove.
    evidence:
      - source/components/input/ProviderMenuSession.test.tsx asserts provider frame Escape, missing-provider credential entry, logged-in Codex visibility, selected-account persistence, and CLI-only account guidance.
    replacementTestIds: []
    status: proposed
  - id: ui-components-rewind-menu-session-test-ui-components-a-m3
    testId: ui-components-rewind-menu-session-test
    role: second_opinion
    reviewer: ui-components-a-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-a-m3.yaml
    recommendation: keep
    confidence: high
    reason: Rewind acceptance is a destructive conversation mutation boundary; the test verifies exact item/disposition intent and that cancellation is side-effect free.
    evidence:
      - source/components/input/RewindMenuSession.test.tsx asserts resend intent payload, originating frame ID, stack close, and no intent on Escape.
    replacementTestIds: []
    status: proposed
  - id: ui-components-settings-menu-session-test-ui-components-a-m3
    testId: ui-components-settings-menu-session-test
    role: second_opinion
    reviewer: ui-components-a-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-a-m3.yaml
    recommendation: keep
    confidence: high
