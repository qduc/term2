schemaVersion: 2
domains:
  - id: ui-components
    label: Ink UI components and input/layout behavior
suites:
  - id: ui-components-a-unit
    label: Focused component and pure-function tests
  - id: ui-components-a-integration
    label: Ink input/menu integration tests
seams:
  - id: ui-components-a-error-boundary
    label: React error-boundary capture and fallback rendering
  - id: ui-components-a-menu-trigger-parser
    label: Input text and cursor parsing into the active menu kind
  - id: ui-components-a-input-box
    label: InputBox terminal editing, submission, prompts, and queue interaction
  - id: ui-components-a-markdown-renderer
    label: Markdown token parsing and terminal rendering
  - id: ui-components-a-menu-container
    label: Generic menu item rendering and inactive-item callback contract
  - id: ui-components-a-visible-tabs
    label: Width-bounded tab-window calculation and scroll indicators
  - id: ui-components-a-application-input-surface
    label: Application input/menu surface ownership and session mounting
  - id: ui-components-a-copy-session
    label: Copy menu selection intent and dismissal
  - id: ui-components-a-first-run-prompt
    label: First-run provider/model setup guidance rendering
  - id: ui-components-a-model-session
    label: Model menu selection, setup fallback, and apply-settings intents
  - id: ui-components-a-provider-session
    label: Provider management, credentials, and OAuth-account selection
  - id: ui-components-a-rewind-session
    label: Rewind menu intent dispatch and dismissal
  - id: ui-components-a-settings-session
    label: Settings menu child routing and reset behavior
  - id: ui-components-a-settings-value-session
    label: Settings value parsing, intent dispatch, and completion
  - id: ui-components-a-slash-session
    label: Slash command completion and execution interaction
  - id: ui-components-a-input-width
    label: Terminal-width calculation for the input editor
  - id: ui-components-a-insertions
    label: Completion insertion text and cursor computation
  - id: ui-components-a-menu-controller
    label: Menu stack, editor snapshots, frame effects, and intent routing
  - id: ui-components-a-menu-system
    label: Terminal-boundary integration of input, trigger, and menu sessions
  - id: ui-components-a-trigger-registry
    label: Trigger-rule IDs, successor graphs, and restore-point semantics
  - id: ui-components-a-background-manager
    label: Background-task manager navigation, details, stop, and transfer actions
  - id: ui-components-a-background-panel
    label: Compact background-task row rendering, liveness, and retention
  - id: ui-components-a-bottom-area
    label: Bottom-area routing among prompts, input, status, queue, and task surfaces
  - id: ui-components-a-diff-view
    label: Diff rendering with bounded unchanged-line context
  - id: ui-components-a-status-bar
    label: Status-bar configuration, usage, warnings, and width-budget rendering
  - id: ui-components-a-background-clock
    label: Background-task clock admission while work or retention is live
  - id: ui-components-a-live-task-rows
    label: Foreground/background task-row normalization and ordering
risks:
  - id: ui-components-a-error-fallback-risk
    label: A render-time component error escapes the boundary or gives no actionable fallback.
    severity: high
  - id: ui-components-a-trigger-risk
    label: Input is assigned to the wrong menu, causing incorrect completion or command behavior.
    severity: high
  - id: ui-components-a-editor-risk
    label: Terminal editing loses input, cursor position, submission mode, or queue semantics.
    severity: high
  - id: ui-components-a-markdown-risk
    label: Assistant markdown is rendered with lost content, malformed code, or unusable terminal layout.
    severity: medium
  - id: ui-components-a-menu-render-risk
    label: A shared menu renders the wrong items or inactive-state information.
    severity: medium
  - id: ui-components-a-tab-window-risk
    label: Tabs or scroll indicators omit the active item or exceed the terminal width.
    severity: medium
  - id: ui-components-a-input-ownership-risk
    label: A menu and composer both consume terminal input or fail to restore ownership.
    severity: high
  - id: ui-components-a-copy-risk
    label: Copy selection invokes the wrong callback or remains open after dismissal.
    severity: medium
  - id: ui-components-a-setup-guidance-risk
    label: First-run users receive guidance for the wrong setup phase or provider.
    severity: high
  - id: ui-components-a-model-risk
    label: Model selection applies the wrong provider/model or traps setup and validation errors.
    severity: high
  - id: ui-components-a-provider-risk
    label: Provider credentials or account selection alter the wrong session or mislead the user.
    severity: high
  - id: ui-components-a-rewind-risk
    label: Rewind acceptance dispatches the wrong disposition or dismissal triggers work.
    severity: high
  - id: ui-components-a-settings-risk
    label: Settings navigation or reset mutates the wrong key or loses the parent editor state.
    severity: high
  - id: ui-components-a-setting-value-risk
    label: A typed setting value is parsed or persisted incorrectly, or validation hides the editing frame.
    severity: high
  - id: ui-components-a-slash-risk
    label: Tab completion executes a command unexpectedly or leaves the editor/menu in the wrong state.
    severity: high
  - id: ui-components-a-width-risk
    label: Input width is wrong for a prompt mode, causing clipping or invalid layout.
    severity: medium
  - id: ui-components-a-insertion-risk
    label: Completion replacement corrupts surrounding text, provider flags, or cursor placement.
    severity: high
  - id: ui-components-a-controller-risk
    label: Stale menu effects or back policies corrupt the editor/menu stack or deliver intents to the wrong frame.
    severity: critical
  - id: ui-components-a-menu-system-risk
    label: Terminal keystrokes do not reach the active session or a completed menu leaves command text behind.
    severity: critical
  - id: ui-components-a-registry-risk
    label: Trigger graph changes activate incompatible successor IDs or restore the wrong prefix.
    severity: high
  - id: ui-components-a-background-manager-risk
    label: Task management acts on a different task than the highlighted identity or stops work without confirmation.
    severity: high
  - id: ui-components-a-background-panel-risk
    label: Live, waiting, failed, or retained work is mislabeled, clipped, or hidden at the wrong time.
    severity: high
  - id: ui-components-a-bottom-area-risk
    label: A higher-priority prompt is hidden or the bottom area gives input ownership to the wrong surface.
    severity: critical
  - id: ui-components-a-diff-risk
    label: Large diffs overwhelm the terminal or hide changed lines while collapsing context.
    severity: medium
  - id: ui-components-a-status-risk
    label: Configuration, usage, cost, safety, quota, or warning signals are omitted or assigned to the wrong row.
    severity: high
  - id: ui-components-a-background-clock-risk
    label: The task clock stops before live work/retention is visible or keeps ticking forever when idle.
    severity: high
  - id: ui-components-a-live-rows-risk
    label: Foreground work is confused with adopted background work or rows appear in the wrong order.
    severity: high
fixtures: []
contracts:
  - id: ui-components-a-error-fallback-contract
    statement: ErrorBoundary renders children normally and replaces a throwing subtree with an application-error fallback containing recovery options and the error message.
    seamIds: [ui-components-a-error-boundary]
    riskIds: [ui-components-a-error-fallback-risk]
  - id: ui-components-a-trigger-contract
    statement: Active-menu detection maps cursor-qualified input to the highest-priority applicable model, settings, setting-value, skills, resume, slash, or path menu and returns none otherwise.
    seamIds: [ui-components-a-menu-trigger-parser]
    riskIds: [ui-components-a-trigger-risk]
  - id: ui-components-a-editor-contract
    statement: InputBox preserves terminal editing state while rendering the correct prompt and routes Enter, Alt+Enter, Escape, history, shell mode, and queue interactions to their documented callbacks.
    seamIds: [ui-components-a-input-box]
    riskIds: [ui-components-a-editor-risk]
  - id: ui-components-a-markdown-contract
    statement: MarkdownRenderer preserves supported markdown content and formatting, including lists, code, tables, spacing, pre-parsed tokens, escaping, and terminal-safe table widths.
    seamIds: [ui-components-a-markdown-renderer]
    riskIds: [ui-components-a-markdown-risk]
  - id: ui-components-a-menu-container-contract
    statement: MenuContainer renders every supplied item and passes the correct inactive flag to each renderItem invocation.
    seamIds: [ui-components-a-menu-container]
    riskIds: [ui-components-a-menu-render-risk]
  - id: ui-components-a-visible-tabs-contract
    statement: computeVisibleTabs returns a width-fitting window that includes the active or fallback-first item and accurately reports left/right overflow.
    seamIds: [ui-components-a-visible-tabs]
    riskIds: [ui-components-a-tab-window-risk]
  - id: ui-components-a-input-surface-contract
    statement: ApplicationInputSurface mounts the active menu surface, routes Escape through the active session, and unmounts/restores the composer when a menu opens and closes.
    seamIds: [ui-components-a-application-input-surface]
    riskIds: [ui-components-a-input-ownership-risk]
  - id: ui-components-a-copy-contract
    statement: CopyMenuSession accepts the selected copy item through its callback and closes, while Escape closes without copying and code items display a preview.
    seamIds: [ui-components-a-copy-session]
    riskIds: [ui-components-a-copy-risk]
  - id: ui-components-a-setup-guidance-contract
    statement: FirstRunSetupPrompt distinguishes provider-credential setup from model selection and gives Codex-specific login guidance when appropriate.
    seamIds: [ui-components-a-first-run-prompt]
    riskIds: [ui-components-a-setup-guidance-risk]
  - id: ui-components-a-model-contract
    statement: ModelMenuSession routes unavailable providers to setup, applies fetched or typed model/provider selections through one intent, preserves errors in place, and inserts with Tab without submission.
    seamIds: [ui-components-a-model-session]
    riskIds: [ui-components-a-model-risk]
  - id: ui-components-a-provider-contract
    statement: ProviderMenuSession opens provider management, enters missing-provider credentials, permits logged-in Codex management, and records account selection for the next session.
    seamIds: [ui-components-a-provider-session]
    riskIds: [ui-components-a-provider-risk]
  - id: ui-components-a-rewind-contract
    statement: RewindMenuSession sends the selected rewind item and resend disposition through the intent host, while Escape closes without dispatching rewind work.
    seamIds: [ui-components-a-rewind-session]
    riskIds: [ui-components-a-rewind-risk]
  - id: ui-components-a-settings-contract
    statement: SettingsMenuSession routes plain, model-backed, and mentor-pool keys to the proper child editor, restores the parent state on Back, and performs typed resets.
    seamIds: [ui-components-a-settings-session]
    riskIds: [ui-components-a-settings-risk]
  - id: ui-components-a-setting-value-contract
    statement: SettingsValueMenuSession parses and applies typed values or reset intents, keeps field errors in the same frame, preselects current values, and uses Tab as non-submitting insertion.
    seamIds: [ui-components-a-settings-value-session]
    riskIds: [ui-components-a-setting-value-risk]
  - id: ui-components-a-slash-contract
    statement: SlashMenuSession uses Tab to insert a selected command without executing it, leaves the frame unchanged when nothing is selected, and keeps Enter as command execution.
    seamIds: [ui-components-a-slash-session]
    riskIds: [ui-components-a-slash-risk]
  - id: ui-components-a-width-contract
    statement: calculateInputWidth reserves the correct prompt and horizontal padding for normal, shell, rejection, custom-label, and absent-terminal-width modes.
    seamIds: [ui-components-a-input-width]
    riskIds: [ui-components-a-width-risk]
  - id: ui-components-a-insertion-contract
    statement: Completion insertion replaces only the active query, preserves suffix text and cursor placement, and adds a provider flag only for submit insertion.
    seamIds: [ui-components-a-insertions]
    riskIds: [ui-components-a-insertion-risk]
  - id: ui-components-a-controller-contract
    statement: MenuControllerImpl bounds editor state, reconciles trigger frames, rejects stale effects, routes active events and async results, and applies frame back policies without losing snapshots.
    seamIds: [ui-components-a-menu-controller]
    riskIds: [ui-components-a-controller-risk]
  - id: ui-components-a-menu-system-contract
    statement: The terminal input boundary opens each supported completion/menu flow, gives it exclusive keyboard ownership, and commits or cancels with the expected editor text and callback effects.
    seamIds: [ui-components-a-menu-system]
    riskIds: [ui-components-a-menu-system-risk]
  - id: ui-components-a-registry-contract
    statement: Trigger-rule IDs and successor graphs distinguish graph generations and restore the bare settings prefix for passive child activation.
    seamIds: [ui-components-a-trigger-registry]
    riskIds: [ui-components-a-registry-risk]
  - id: ui-components-a-background-manager-contract
    statement: BackgroundTaskManager opens through Ctrl+G, follows highlighted task identity across refreshes, requires confirmation for stop/transfer, renders executor details, and restores the prior owner on Escape.
    seamIds: [ui-components-a-background-manager]
    riskIds: [ui-components-a-background-manager-risk]
  - id: ui-components-a-background-panel-contract
    statement: BackgroundTasksPanel renders task identity, role, phase/liveness, tool activity, usage, width-budget truncation, terminal status, foreground placement, and linger expiry accurately.
    seamIds: [ui-components-a-background-panel]
    riskIds: [ui-components-a-background-panel-risk]
  - id: ui-components-a-bottom-area-contract
    statement: BottomArea renders the highest-priority prompt or status surface, preserves input/queue guidance, places task rows above input, and transfers manager ownership without leaking lower-priority surfaces.
    seamIds: [ui-components-a-bottom-area]
    riskIds: [ui-components-a-bottom-area-risk]
  - id: ui-components-a-diff-contract
    statement: DiffView renders small diffs fully and collapses only excess consecutive unchanged lines while retaining changed lines and reporting the skipped count.
    seamIds: [ui-components-a-diff-view]
    riskIds: [ui-components-a-diff-risk]
  - id: ui-components-a-status-contract
    statement: StatusBar presents model/configuration, token/context/cache/cost metrics, quota and provider usage, safety and budget warnings, and width-prioritized single-line output according to supplied state.
    seamIds: [ui-components-a-status-bar]
    riskIds: [ui-components-a-status-risk]
  - id: ui-components-a-background-clock-contract
    statement: needsBackgroundTaskClock ticks for live work, foreground candidates, in-flight turns, and retained rows before the grace boundary, but not for idle terminal rows without a settle time.
    seamIds: [ui-components-a-background-clock]
    riskIds: [ui-components-a-background-clock-risk]
  - id: ui-components-a-live-rows-contract
    statement: mergeLiveTaskRows emits stable foreground rows before background rows and tags each row with its placement.
    seamIds: [ui-components-a-live-task-rows]
    riskIds: [ui-components-a-live-rows-risk]
