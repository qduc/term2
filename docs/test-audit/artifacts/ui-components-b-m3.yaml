seams:
  - id: ui-components-b-copy-menu
    label: CopyMenu rendering and preview boundary
  - id: ui-components-b-mentor-menu
    label: MentorPoolSelectionMenu phase rendering boundary
  - id: ui-components-b-model-menu
    label: ModelSelectionMenu state and guidance boundary
  - id: ui-components-b-path-menu
    label: PathSelectionMenu warning boundary
  - id: ui-components-b-provider-menu
    label: ProviderSelectionMenu lifecycle rendering boundary
  - id: ui-components-b-resume-menu
    label: ResumeSelectionMenu context rendering boundary
  - id: ui-components-b-rewind-menu
    label: RewindMenu discard-summary boundary
  - id: ui-components-b-settings-menu
    label: SettingsSelectionMenu navigation and window boundary
  - id: ui-components-b-settings-value-menu
    label: SettingsValueSelectionMenu suggestion and footer boundary
  - id: ui-components-b-skill-menu
    label: SkillSelectionMenu selected-detail and scope boundary
  - id: ui-components-b-slash-menu
    label: SlashCommandMenu wrapped-description boundary
  - id: ui-components-b-chat-message
    label: ChatMessage sender-specific rendering boundary
  - id: ui-components-b-message-list
    label: MessageList static/live partition and ordering boundary
  - id: ui-components-b-subagent-message
    label: SubagentActivityMessage lifecycle rendering boundary
  - id: ui-components-b-command-grouping
    label: command-grouping aggregation boundary
  - id: ui-components-b-command-helpers
    label: command-message-helpers parsing and formatting boundary
  - id: ui-components-b-approval-prompt
    label: ApprovalPrompt approval-kind and keyboard-routing boundary
  - id: ui-components-b-handoff-prompt
    label: HandoffConfirmationPrompt choice boundary
  - id: ui-components-b-input-surge-prompt
    label: InputSurgeConfirmationPrompt warning boundary
  - id: ui-components-b-large-uncached-prompt
    label: LargeUncachedConfirmationPrompt warning boundary
  - id: ui-components-b-mode-switch-prompt
    label: ModeSwitchConfirmationPrompt safe-default boundary
  - id: ui-components-b-queue-paused-prompt
    label: QueuePausedPrompt recovery boundary
risks:
  - id: ui-components-b-copy-preview-loss
    label: Copy choices show misleading, missing, or overlong previews.
    severity: medium
  - id: ui-components-b-menu-guidance-regression
    label: A menu omits or misstates actionable setup, empty-state, or navigation guidance.
    severity: high
  - id: ui-components-b-menu-window-regression
    label: A long menu exposes the wrong visible entries or scroll position.
    severity: medium
  - id: ui-components-b-provider-safety-guidance
    label: Provider availability, destructive confirmation, validation, or discard state is presented incorrectly.
    severity: high
  - id: ui-components-b-conversation-context-loss
    label: Resume or rewind UI shows wrong context or misstates data to be discarded.
    severity: high
  - id: ui-components-b-settings-navigation-regression
    label: Settings navigation hides matches, loses selection, or collapses incorrectly during search/category changes.
    severity: high
  - id: ui-components-b-settings-value-regression
    label: A value picker hides suggestions, descriptions, numeric guidance, or controls.
    severity: medium
  - id: ui-components-b-skill-context-loss
    label: Skill selection shows details or scope for the wrong skill.
    severity: medium
  - id: ui-components-b-message-rendering-regression
    label: Chat, command, or subagent output has the wrong marker, formatting, status, or summary.
    severity: high
  - id: ui-components-b-message-order-loss
    label: Live/static partitioning duplicates, reorders, or hides conversation output.
    severity: critical
  - id: ui-components-b-tool-summary-regression
    label: Tool grouping or parsing reports wrong counts, status, arguments, or content.
    severity: high
  - id: ui-components-b-approval-choice-regression
    label: Approval prompts expose unsafe choices, omit scope, submit wrong answers, or steal shortcuts.
    severity: critical
  - id: ui-components-b-confirmation-default-regression
    label: A confirmation defaults to or interprets an unsafe consequential choice.
    severity: high
  - id: ui-components-b-queue-recovery-regression
    label: A paused queue omits failure context or routes recovery input incorrectly.
    severity: high
contracts:
  - id: ui-components-b-copy-preview-contract
    statement: CopyMenu renders each copyable item with a normalized bounded preview, while the full-response item has no code-preview suffix.
    seamIds:
      - ui-components-b-copy-menu
    riskIds:
      - ui-components-b-copy-preview-loss
  - id: ui-components-b-mentor-phase-contract
    statement: MentorPoolSelectionMenu explains pool cardinality and entry metadata, offers reorder only when applicable, and labels new-entry editing as an add flow.
    seamIds:
      - ui-components-b-mentor-menu
    riskIds:
      - ui-components-b-menu-guidance-regression
  - id: ui-components-b-model-state-contract
    statement: ModelSelectionMenu renders loading, error, empty-search, model-list, provider guidance, refresh, custom-provider, and scroll-position states with corresponding user-facing text.
    seamIds:
      - ui-components-b-model-menu
    riskIds:
      - ui-components-b-menu-guidance-regression
      - ui-components-b-menu-window-regression
  - id: ui-components-b-path-warning-contract
    statement: PathSelectionMenu displays a workspace-truncation warning together with the available completion item.
    seamIds:
      - ui-components-b-path-menu
    riskIds:
      - ui-components-b-menu-guidance-regression
  - id: ui-components-b-provider-state-contract
    statement: ProviderSelectionMenu presents wizard steps, provider items, unavailable-provider routes, destructive confirmation, inline errors, discard warnings, and reorder contents according to phase and metadata.
    seamIds:
      - ui-components-b-provider-menu
    riskIds:
      - ui-components-b-provider-safety-guidance
      - ui-components-b-menu-guidance-regression
  - id: ui-components-b-resume-context-contract
    statement: ResumeSelectionMenu lists saved conversations, shows details only for the selected conversation, gives accurate empty/search-empty feedback, and prefers canonical profile identity over legacy flags.
    seamIds:
      - ui-components-b-resume-menu
    riskIds:
      - ui-components-b-conversation-context-loss
  - id: ui-components-b-rewind-summary-contract
    statement: RewindMenu renders visible ordinals and turn text, accurately summarizes discarded replies/files/turns/images and unanswered turns, truncates long text, and labels edit/resend disposition.
    seamIds:
      - ui-components-b-rewind-menu
    riskIds:
      - ui-components-b-conversation-context-loss
  - id: ui-components-b-settings-navigation-contract
    statement: SettingsSelectionMenu renders matching settings and values, category tabs and switch guidance, selected descriptions, and a visible window that updates across search scope or category changes.
    seamIds:
      - ui-components-b-settings-menu
    riskIds:
      - ui-components-b-settings-navigation-regression
      - ui-components-b-menu-window-regression
  - id: ui-components-b-settings-value-contract
    statement: SettingsValueSelectionMenu renders empty feedback, values, only the selected description, numeric guidance, and confirm/cancel controls.
    seamIds:
      - ui-components-b-settings-value-menu
    riskIds:
      - ui-components-b-settings-value-regression
  - id: ui-components-b-skill-selection-contract
    statement: SkillSelectionMenu lists skills, shows details only for the selected skill, identifies project scope, and truncates long names without losing the prefix.
    seamIds:
      - ui-components-b-skill-menu
    riskIds:
      - ui-components-b-skill-context-loss
  - id: ui-components-b-slash-description-contract
    statement: SlashCommandMenu keeps wrapped command descriptions aligned with their description column.
    seamIds:
      - ui-components-b-slash-menu
    riskIds:
      - ui-components-b-menu-guidance-regression
  - id: ui-components-b-chat-rendering-contract
    statement: ChatMessage applies Markdown formatting to reasoning and uses a prompt marker for user messages.
    seamIds:
      - ui-components-b-chat-message
    riskIds:
      - ui-components-b-message-rendering-regression
  - id: ui-components-b-message-list-lifecycle-contract
    statement: MessageList preserves order and identity while partitioning static/live history, keeps Markdown layout stable on finalization, and renders special entries without duplication or leakage.
    seamIds:
      - ui-components-b-message-list
    riskIds:
      - ui-components-b-message-order-loss
      - ui-components-b-message-rendering-regression
  - id: ui-components-b-subagent-activity-contract
    statement: SubagentActivityMessage renders lifecycle labels and tool statuses, hides running tools, freezes transferred cards, and shows final or failure text correctly.
    seamIds:
      - ui-components-b-subagent-message
    riskIds:
      - ui-components-b-message-rendering-regression
  - id: ui-components-b-command-grouping-contract
    statement: command-grouping folds only eligible settled runs, preserves in-flight/trailing calls, maintains group identity, and summarizes mixed outcomes correctly.
    seamIds:
      - ui-components-b-command-grouping
    riskIds:
      - ui-components-b-tool-summary-regression
      - ui-components-b-message-order-loss
  - id: ui-components-b-command-helper-contract
    statement: command-message-helpers safely parses tool output and formats every registered tool's arguments without generic leakage.
    seamIds:
      - ui-components-b-command-helpers
    riskIds:
      - ui-components-b-tool-summary-regression
  - id: ui-components-b-approval-kind-contract
    statement: ApprovalPrompt renders correct safety advisories and scope choices for ask-user, Docker, network, outside-workspace, denied-read, unsandboxed, and ordinary approvals.
    seamIds:
      - ui-components-b-approval-prompt
    riskIds:
      - ui-components-b-approval-choice-regression
  - id: ui-components-b-approval-input-contract
    statement: ApprovalPrompt maps navigation, direct selection, Enter, Escape, and stable y/n ownership to correct callbacks and answers, including multi-select/custom answers.
    seamIds:
      - ui-components-b-approval-prompt
    riskIds:
      - ui-components-b-approval-choice-regression
  - id: ui-components-b-handoff-contract
    statement: HandoffConfirmationPrompt renders the handoff question and confirmation choices.
    seamIds:
      - ui-components-b-handoff-prompt
    riskIds:
      - ui-components-b-confirmation-default-regression
  - id: ui-components-b-input-surge-contract
    statement: InputSurgeConfirmationPrompt presents the reason-bearing warning and routes decline to rejection.
    seamIds:
      - ui-components-b-input-surge-prompt
    riskIds:
      - ui-components-b-confirmation-default-regression
  - id: ui-components-b-large-uncached-contract
    statement: LargeUncachedConfirmationPrompt presents token/cache warning and routes decline to rejection.
    seamIds:
      - ui-components-b-large-uncached-prompt
    riskIds:
      - ui-components-b-confirmation-default-regression
  - id: ui-components-b-mode-switch-contract
    statement: ModeSwitchConfirmationPrompt describes enabling/disabling, defaults to safe No, and routes y/n, Enter, arrows, and Escape consistently.
    seamIds:
      - ui-components-b-mode-switch-prompt
    riskIds:
      - ui-components-b-confirmation-default-regression
  - id: ui-components-b-queue-paused-contract
    statement: QueuePausedPrompt shows count and conditional failure context and maps resume/discard keys to callbacks.
    seamIds:
      - ui-components-b-queue-paused-prompt
    riskIds:
      - ui-components-b-queue-recovery-regression
decisions:
  - id: ui-components-copy-menu-ui-components-b-m3
    testId: ui-components-copy-menu
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: It protects formatting edge cases and the user-visible distinction between full-response and code-block copy choices.
    evidence:
      - getCodePreview covers empty whitespace, newline normalization, exact truncation, and CopyMenu labels/previews at source/components/menu/CopyMenu.test.tsx:9-50.
      - The seam is getCodePreview and CopyMenu in source/components/menu/CopyMenu.tsx; no assigned sibling asserts this full-response/code-block distinction.
    replacementTestIds: []
    status: proposed
  - id: ui-components-approval-prompt-folder-read-ui-components-b-m3
    testId: ui-components-approval-prompt-folder-read
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: This file distinguishes folder-capable read tools from shell and verifies absolute-glob directory naming and grant routing.
    evidence:
      - Grep folder wording/answer, absolute glob directory, and generic shell exclusion are asserted at source/components/prompt/ApprovalPrompt.folder-read.test.tsx:25-78.
      - The seam is ApprovalPrompt outside-workspace folder handling in source/components/prompt/ApprovalPrompt.tsx; read-file sibling covers read/edit scopes, not grep/glob discrimination.
    replacementTestIds: []
    status: proposed
  - id: ui-components-approval-prompt-read-file-ui-components-b-m3
    testId: ui-components-approval-prompt-read-file
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: It covers read-folder access, Escape cancellation, and distinct outside-workspace edit file/folder scopes.
    evidence:
      - Read-folder answer, regular approval Escape, and edit permission labels/answer are asserted at source/components/prompt/ApprovalPrompt.read-file.test.tsx:23-95.
      - The seam is ApprovalPrompt outsideWorkspaceEdit/read-file handling in source/components/prompt/ApprovalPrompt.tsx; folder-read sibling covers grep/glob classification, not edit scopes or cancellation.
    replacementTestIds: []
    status: proposed
  - id: ui-components-handoff-confirmation-prompt-ui-components-b-m3
    testId: ui-components-handoff-confirmation-prompt
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: rewrite_candidate
    confidence: medium
    reason: The render contract matters, but the test does not exercise any choice callback or keyboard route for this interactive prompt.
    evidence:
      - It only checks question and Yes/No labels and passes no-op callbacks at source/components/prompt/HandoffConfirmationPrompt.test.tsx:8-21.
      - The seam is HandoffConfirmationPrompt in source/components/prompt/HandoffConfirmationPrompt.tsx; comparable callback/keyboard coverage exists in source/components/prompt/ModeSwitchConfirmationPrompt.test.tsx.
    replacementTestIds: []
    status: proposed
  - id: ui-components-input-surge-confirmation-prompt-ui-components-b-m3
    testId: ui-components-input-surge-confirmation-prompt
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: It pins the reason-bearing warning and verifies the decline keyboard route.
    evidence:
      - Reason, wording, choices, and n-to-decline behavior are asserted at source/components/prompt/InputSurgeConfirmationPrompt.test.tsx:8-45.
      - The seam is InputSurgeConfirmationPrompt in source/components/prompt/InputSurgeConfirmationPrompt.tsx; no assigned sibling covers this warning.
    replacementTestIds: []
    status: proposed
  - id: ui-components-large-uncached-confirmation-prompt-ui-components-b-m3
    testId: ui-components-large-uncached-confirmation-prompt
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: It protects token-count formatting and prompt-cache warning disclosure plus asynchronous decline behavior.
    evidence:
      - It asserts 72,100 formatting, cache warning, choices, and n-to-decline after updates at source/components/prompt/LargeUncachedConfirmationPrompt.test.tsx:24-58.
      - The seam is LargeUncachedConfirmationPrompt in source/components/prompt/LargeUncachedConfirmationPrompt.tsx; no assigned sibling covers this disclosure.
    replacementTestIds: []
    status: proposed
  - id: ui-components-mode-switch-confirmation-prompt-ui-components-b-m3
    testId: ui-components-mode-switch-confirmation-prompt
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: Safety-sensitive coverage verifies target-state wording, safe default, all keyboard routes, and navigation confirmation.
    evidence:
      - TargetValue wording, No default, Enter/y/n/Escape, and arrow navigation are asserted at source/components/prompt/ModeSwitchConfirmationPrompt.test.tsx:16-176.
      - The seam is ModeSwitchConfirmationPrompt in source/components/prompt/ModeSwitchConfirmationPrompt.tsx; no assigned sibling covers mode-switch session-clearing confirmation.
    replacementTestIds: []
    status: proposed
  - id: ui-components-queue-paused-prompt-ui-components-b-m3
    testId: ui-components-queue-paused-prompt
    role: second_opinion
    reviewer: ui-components-b-m3
    sourceArtifact: docs/test-audit/artifacts/ui-components-b-m3.yaml
    recommendation: keep
    confidence: high
    reason: It protects recovery affordances, failure/manual distinction, and both callback shortcuts.
    evidence:
      - Queue count, resume/discard labels, conditional failure reason, and r/d routing are asserted at source/components/prompt/QueuePausedPrompt.test.tsx:8-91.
      - The seam is QueuePausedPrompt in source/components/prompt/QueuePausedPrompt.tsx; no assigned sibling covers queue-pause recovery presentation.
    replacementTestIds: []
    status: proposed
  - id: ui-components-skill-selection-menu-ui-components-b-m3
