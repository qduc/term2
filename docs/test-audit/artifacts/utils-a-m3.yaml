schemaVersion: 2
domains:
  - id: utils
    label: Utility functions across app surfaces
suites:
  - id: unit
    label: Default Vitest unit suite
seams:
  - id: utils-a-seam-input-normalization
    label: Raw provider, model, text, and error inputs become stable utility values.
  - id: utils-a-seam-credential-readiness
    label: Settings, environment, and local auth state become provider readiness decisions.
  - id: utils-a-seam-output-boundary
    label: Tool and log output is transformed at byte, character, or structural safety boundaries.
  - id: utils-a-seam-terminal-integration
    label: Clipboard and renderer utilities select platform or terminal behavior.
  - id: utils-a-seam-command-lifecycle
    label: Commands are gated or warnings are injected based on active turn state.
risks:
  - id: utils-a-risk-input-misnormalization
    label: Provider or utility inputs are parsed into incorrect values or lose compatibility data.
    severity: high
  - id: utils-a-risk-credential-misclassification
    label: A provider is treated as runnable when credentials are absent, or rejected when available.
    severity: critical
  - id: utils-a-risk-output-leakage
    label: Sensitive, oversized, malformed, or binary output crosses a logging or tool boundary unsafely.
    severity: high
  - id: utils-a-risk-terminal-failure
    label: Platform and terminal capability differences cause copy or rendering behavior to fail unexpectedly.
    severity: medium
  - id: utils-a-risk-command-bypass
    label: A busy command runs or a budget warning is omitted at a lifecycle boundary.
    severity: high
  - id: utils-a-risk-misleading-error
    label: Abort, connection, or reauthentication failures are classified or reported misleadingly.
    severity: high
fixtures:
  - id: utils-a-fixture-provider-environments
    label: Stubbed provider environment variables and dynamic settings.
  - id: utils-a-fixture-provider-traffic
    label: JSON log records and temporary per-trace output directory.
  - id: utils-a-fixture-terminal-capabilities
    label: Platform, SSH, tmux, screen, and injected terminal writers or commands.
  - id: utils-a-fixture-output-boundaries
    label: Oversized Unicode, JSON, image, tool, and log payloads.
  - id: utils-a-fixture-turn-state
    label: Busy-turn, turn-limit, run-budget, and stall evidence contexts.
  - id: utils-a-fixture-error-shapes
    label: Abort-like, nested-cause, and undici socket error objects.
contracts:
  - id: utils-a-contract-model-provider-arg
    statement: Model/provider command arguments return the trimmed model and optional provider, including provider values containing spaces.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-input-misnormalization]
  - id: utils-a-contract-model-setting-resolution
    statement: Model setting configuration preserves the prioritized model keys and resolves legacy setting commands to provider keys and fallbacks.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-input-misnormalization]
  - id: utils-a-contract-provider-readiness
    statement: Provider credential resolution distinguishes stored, environment, token-file, local no-auth, and missing credentials and filters unavailable providers.
    seamIds: [utils-a-seam-credential-readiness]
    riskIds: [utils-a-risk-credential-misclassification]
  - id: utils-a-contract-provider-traffic-files
    statement: Provider traffic extraction keeps sent and received payload metadata, and writing groups records into indexed per-trace files in stable order.
    seamIds: [utils-a-seam-output-boundary]
    riskIds: [utils-a-risk-output-leakage]
  - id: utils-a-contract-token-usage
    statement: Token usage normalizes provider and SDK shapes, preserves cache/reasoning metadata, extracts nested usage, and accumulates formatted session totals.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-input-misnormalization]
  - id: utils-a-contract-single-file-diff-envelope
    statement: A single-file diff rejects embedded multi-file envelopes while accepting supported end markers.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-input-misnormalization]
  - id: utils-a-contract-busy-command-guard
    statement: Wrapped slash commands execute only when no turn is in flight, otherwise notify without invoking the action while preserving command metadata and arguments.
    seamIds: [utils-a-seam-command-lifecycle]
    riskIds: [utils-a-risk-command-bypass]
  - id: utils-a-contract-clipboard-routing
    statement: Clipboard routing selects platform commands, ordered fallbacks, OSC 52 terminal wrappers, size limits, and explicit no-capability failures.
    seamIds: [utils-a-seam-terminal-integration]
    riskIds: [utils-a-risk-terminal-failure]
  - id: utils-a-contract-copy-selections
    statement: Fenced code extraction excludes markers and inline code, ignores unclosed fences, and puts the complete response before extracted blocks.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-input-misnormalization]
  - id: utils-a-contract-error-description
    statement: Abort-like detection recognizes supported error shapes without ordinary-error false positives, while description surfaces useful nested connection and reauthentication causes.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-misleading-error]
  - id: utils-a-contract-header-sanitization
    statement: Header sanitization normalizes input forms and casing while redacting credential-bearing headers and preserving safe metadata.
    seamIds: [utils-a-seam-output-boundary]
    riskIds: [utils-a-risk-output-leakage]
  - id: utils-a-contract-home-start-guard
    statement: Home-directory start warnings apply only at exact home or root for non-lite starts, and confirmation accepts affirmative answers only.
    seamIds: [utils-a-seam-command-lifecycle]
    riskIds: [utils-a-risk-command-bypass]
  - id: utils-a-contract-tool-warning-injection
    statement: Tool output warnings preserve valid text/JSON shapes and inject turn-limit, run-budget, and stall evidence only when pending context requires it.
    seamIds: [utils-a-seam-command-lifecycle, utils-a-seam-output-boundary]
    riskIds: [utils-a-risk-command-bypass, utils-a-risk-output-leakage]
  - id: utils-a-contract-ink-render-options
    statement: Ink render options disable incremental rendering.
    seamIds: [utils-a-seam-terminal-integration]
    riskIds: [utils-a-risk-terminal-failure]
  - id: utils-a-contract-tool-result-bounds
    statement: Tool result text remains unchanged below the UTF-8 cap and oversize text is safely truncated and spooled as a recoverable artifact, without binary corruption.
    seamIds: [utils-a-seam-output-boundary]
    riskIds: [utils-a-risk-output-leakage]
  - id: utils-a-contract-bounded-json
    statement: Serialized envelopes obey character and UTF-8 byte caps, preserve surrogate pairs, and return the smallest valid bounded failure representation.
    seamIds: [utils-a-seam-output-boundary]
    riskIds: [utils-a-risk-output-leakage]
  - id: utils-a-contract-text-diff
    statement: Text diff generation reports unchanged, added, deleted, and coerced nullish or primitive lines using stable +/-/space prefixes.
    seamIds: [utils-a-seam-input-normalization]
    riskIds: [utils-a-risk-input-misnormalization]
  - id: utils-a-contract-log-truncation
    statement: Log metadata truncation limits images, prompts, tool calls, tool output, and descriptions without mutating unchanged input, and text truncation preserves head and tail.
    seamIds: [utils-a-seam-output-boundary]
    riskIds: [utils-a-risk-output-leakage]
