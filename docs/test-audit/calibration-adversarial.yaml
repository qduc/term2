decisions:
  - id: runtime-application-run-loop-calibration-adversarial
    testId: runtime-application-run-loop
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: keep
    confidence: high
    reason: The file is broad but its cases exercise the ApplicationRunLoop public streamed-turn contract across opaque input, compaction, event settlement, guards, tools, steering, usage, and retry; no assigned sibling carries these same run-loop observables more strongly or cheaply.
    evidence:
      - normalizeApplicationInput cases at source/services/agent-runtime/application-run-loop.test.ts:30-60 assert provider_opaque conversion, marker removal, and rejection of an unmarked unsupported item.
      - Source production boundary is ApplicationRunLoop.startStream in source/services/agent-runtime/application-run-loop.ts; tests observe stream.history, completed, events, and tool results rather than private implementation fields.
      - The guard cases at source/services/agent-runtime/application-run-loop.test.ts:501-1035 distinguish legitimate repeated output, text/reasoning caps, total deadlines, and idle deadlines, so collapsing them would allow a regression in one guard class to escape.
      - If this evidence disappeared, a model could be retried after a crossed stream boundary, a tool loop could run past its turn budget, or cumulative usage and tool history could be committed twice without this boundary suite detecting it.
      - >-
        I ruled out consolidation, deletion, and rewrite: the assigned sample has no
        second ApplicationRunLoop test file, and the assertions cover independently
        changeable recovery, approval, steering, usage, and guard outcomes.
    replacementTestIds: []
    status: proposed
  - id: providers-codex-responses-model-calibration-adversarial
    testId: providers-codex-responses-model
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: keep
    confidence: high
    reason: This is the sole assigned boundary test for Codex Responses HTTP/WebSocket reconstruction, chained state, compaction, retry, and transport evidence; its wire-level assertions are the contract rather than incidental implementation detail.
    evidence:
      - source/providers/codex-responses-model.test.ts:89-303 asserts reconstruction of streamed output items, missing terminal output, call_id backfill, frozen responses, and suspicious-output diagnostics.
      - source/providers/codex-responses-model.test.ts:925-1097 and 1515-1812 assert distinct Responses-Lite versus standard chaining and server-managed history behavior.
      - source/providers/codex-responses-model.test.ts:2594-2671 and 4398-4676 distinguish ambiguous close/send outcomes from provably unsent requests and idle/first-frame watchdog outcomes.
      - If this evidence disappeared, a missing function-call identifier, stale previous response id, or ambiguous WebSocket send could silently produce malformed provider requests or unsafe recovery.
      - >-
        I ruled out consolidation, deletion, and rewrite: no other assigned provider
        file asserts these exact normalized wire outcomes, and exact request/response
        shapes are observable provider interoperability requirements.
    replacementTestIds: []
    status: proposed
  - id: ui-components-command-message-calibration-adversarial
    testId: ui-components-command-message
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: keep
    confidence: high
    reason: The large renderer suite protects user-visible terminal semantics across tool families and display modes; its text assertions are outside-in and no assigned sibling renders the same component contract.
    evidence:
      - source/components/message/CommandMessage.test.tsx:54-352 asserts background activity, orchestration verbs, arguments, and worktree transitions as visible text rather than component internals.
      - source/components/message/CommandMessage.test.tsx:445-697 and 829-973 assert diffs, approval denial, concise statuses, failure reasons, and shell output presentation.
      - source/components/message/CommandMessage.test.tsx:992-1815 covers search counts, specialized renderers, ask-user/mentor, subagent status glyphs, runtime display, and parse-failure fallback.
      - If this evidence disappeared, a denied command could render as successful, a running command could appear completed, or a tool result could lose the action and output the user needs to interpret execution.
      - >-
        I ruled out rewrite and consolidation: no assigned sibling targets CommandMessage,
        and the apparently repetitive concise/standard cases cover independently
        changeable visible branches.
    replacementTestIds: []
    status: proposed
  - id: shell-tools-system-shell-calibration-adversarial
    testId: shell-tools-system-shell
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: architecture_signal
    confidence: high
    reason: The tests are meaningful boundary evidence, but the production shell tool owns background jobs, output watches, sandbox routing, Docker host grants, denied-read recovery, RTK, SSH, correlation, and plan-mode policy in one construction seam; the test setup has to inject and reset all of those owners.
    evidence:
      - source/tools/system/shell.test.ts:5-32 imports and resets background registry/output/watch state, denied-read stores, Docker grant state, execution context, nested compatibility, sandbox, and logging seams before exercising one shell definition.
      - source/tools/system/shell.test.ts:142-344 asserts background monitor registration, retained tails, setup failure, and settlement; source/tools/system/shell.ts exports createBackgroundShellJobToolDefinitions and createShellToolDefinition as one tool boundary.
      - source/tools/system/shell.test.ts:1129-1613 and 1765-2187 separately exercise Docker, sandbox availability, RTK, plan mode, denied reads, and held-call overrides, showing policy ownership is concentrated rather than a single shell execution rule.
      - If this evidence disappeared, a denied read could loop without a bounded retry, an approved Docker grant could leak to another session, or a command could execute unsandboxed after availability degraded.
      - >-
        I ruled out deletion, consolidation, and retiering: background lifecycle, sandbox
        safety, Docker grants, and denied-read recovery have distinct externally observable
        failure risks and no sibling in the assigned sample carries them.
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-characterization-calibration-adversarial
    testId: session-conversation-session-characterization
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: architecture_signal
    confidence: high
    reason: The cases preserve important session behavior, but several are explicitly characterization tests that reach through the production composition to approvalState, appState.statusMachine, toolTracker, and TurnItemAccumulator; that coupling exposes an ownership/API boundary problem and should guide a public-boundary rewrite rather than deletion.
    evidence:
      - source/services/session/conversation-session.characterization.test.ts:11-13 constructs createProductionSessionRuntimeInternals and injects a TurnItemAccumulator instead of using only the public adapter.
      - source/services/session/conversation-session.characterization.test.ts:1238-1320 and 1524-1568 directly assert composition.approvalState, composition.appState.statusMachine, and composition.toolTracker.ledger, which are implementation-owned state surfaces.
      - The same file also asserts meaningful public outcomes at source/services/session/conversation-session.characterization.test.ts:1013-1180 and 1326-1522, so a deletion recommendation would orphan approval ordering and recovery contracts.
      - If this evidence disappeared while the composition remained unchanged, abort, reset, or undo could leave a pending approval or stale tool ledger that is resumed on a later turn.
      - >-
        I ruled out deletion and blanket consolidation: source/services/session/conversation-session.stream.test.ts
        and lifecycle.test.ts do not assert the same undo/reset internal-state outcomes;
        the remedy is to move these cases behind a stable public session contract.
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-isolation-calibration-adversarial
    testId: session-conversation-session-isolation
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: keep
    confidence: high
    reason: The file uniquely tests cross-session isolation and queued mode-notice persistence, which cannot be inferred from the same-session lifecycle and stream tests.
    evidence:
      - source/services/session/conversation-session.isolation.test.ts:21-105 proves session A and B do not share previousResponseId, recovery envelopes, or frozen history snapshots.
      - source/services/session/conversation-session.isolation.test.ts:107-172 proves pending approval in session A does not become actionable in session B while A can still continue.
      - source/services/session/conversation-session.isolation.test.ts:174-299 asserts chaining/non-chaining notice insertion and prefix stability, including persistence as one user turn.
      - If this evidence disappeared, one session could reuse another session's response chain or pending approval, or a queued mode notice could be attached to the wrong later user turn.
      - >-
        I ruled out consolidation and deletion: source/services/session/conversation-session.lifecycle.test.ts
        and stream.test.ts exercise continuity within one session, not the cross-session
        inputs and approval state asserted here.
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-lifecycle-calibration-adversarial
    testId: session-conversation-session-lifecycle
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: keep
    confidence: high
    reason: Lifecycle tests cover resume, generation invalidation, image input, initial failure rollback, provider/model changes, undo ledger retention, and abort continuity at the public session coordinator boundary; the cases are not interchangeable with stream-only tests.
    evidence:
      - source/services/session/conversation-session.lifecycle.test.ts:13-188 asserts stale imported generations are ignored and a resumed session uses full history once before returning to chaining.
      - source/services/session/conversation-session.lifecycle.test.ts:335-406 asserts droppedUserMessage only when a user turn was actually added after a pre-stream failure.
      - source/services/session/conversation-session.lifecycle.test.ts:448-561 and 816-940 assert provider/model changes and abort/invalid previous_response_id force correct full-history replay while preserving transcript turns.
      - If this evidence disappeared, a resumed or aborted conversation could resend an expired provider token and lose the transcript, or a pre-stream failure could leave a phantom user turn.
      - >-
        I ruled out consolidation and deletion: the similarly named stream tests at
        source/services/session/conversation-session.stream.test.ts:426-518 cover long
        non-chaining follow-ups, but not resume generation, provider/model mutation, or
        abort continuity.
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-stream-calibration-adversarial
    testId: session-conversation-session-stream
    role: second_opinion
    reviewer: calibration-adversarial
    sourceArtifact: docs/test-audit/calibration-adversarial.yaml
    recommendation: keep
    confidence: high
    reason: Public event ordering, stream-boundary retry suppression, tool-pair settlement, recovery event ordering, approval continuation, and call-id preservation are meaningful contracts with no single stronger sibling replacement.
    evidence:
