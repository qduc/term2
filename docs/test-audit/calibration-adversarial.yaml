schemaVersion: 2
domains:
  - id: runtime
    label: Application run-loop behavior
  - id: providers
    label: Codex Responses provider behavior
  - id: ui-components
    label: Ink command-message rendering
  - id: shell
    label: Shell execution and safety behavior
  - id: session
    label: Conversation session behavior
  - id: subagents
    label: Subagent manager behavior
suites:
  - id: unit
    label: Vitest unit and boundary tests
seams:
  - id: runtime-run-loop
    label: ApplicationRunLoop input, streaming, tool, retry, and guard boundary
  - id: providers-codex-responses
    label: Codex Responses HTTP and WebSocket transport boundary
  - id: ui-command-message
    label: CommandMessage props to visible terminal text boundary
  - id: shell-tool-definition
    label: Shell tool execution, sandbox, background, and approval boundary
  - id: session-composition
    label: Conversation session composition and public adapters
  - id: subagent-manager
    label: Subagent role dispatch and nested tool-policy boundary
  - id: command-safety-classifier
    label: Shell command to safety classification boundary
  - id: path-risk-classifier
    label: Path input to safety status boundary
risks:
  - id: runtime-lost-turn-state
    label: A streamed turn loses, duplicates, or commits the wrong history, tool, or usage state.
    severity: high
  - id: runtime-runaway-or-stalled-work
    label: A legitimate or runaway model/tool stream is stopped at the wrong boundary.
    severity: high
  - id: provider-wire-corruption
    label: Provider wire state, replay input, or transport outcomes are normalized incorrectly.
    severity: high
  - id: ui-misleading-tool-status
    label: The terminal displays the wrong tool action, status, output, or approval result.
    severity: medium
  - id: shell-unsafe-execution
    label: A command bypasses an intended sandbox, approval, write boundary, or safety recovery.
    severity: critical
  - id: session-continuity-corruption
    label: Resume, abort, approval, provider changes, or retries corrupt conversation continuity.
    severity: high
  - id: subagent-policy-bypass
    label: A subagent obtains an unsafe tool, scope, write, network, or lifecycle behavior.
    severity: critical
  - id: safety-misclassification
    label: A command or path is classified with the wrong approval or hard-block outcome.
    severity: critical
fixtures:
  - id: runtime-fake-streamed-model
    label: Deterministic StreamedModelTurn and tool definitions
  - id: providers-fake-transport
    label: Injected HTTP/WebSocket transport frames and request capture
  - id: ui-ink-renderer
    label: Act-wrapped Ink renderer and visible-text projection
  - id: shell-fake-execution-seams
    label: Injected shell, sandbox, registry, scheduler, and logger seams
  - id: shell-temporary-workspace
    label: Temporary files and leased execution workspace
  - id: session-mock-stream
    label: MockStream with terminal output, history, interruptions, and continuation state
  - id: session-mock-client
    label: Mock ConversationAgentClient and session context/settings services
  - id: subagent-test-provider
    label: Registered deterministic provider and streamed subagent fixture
  - id: subagent-temporary-workspace
    label: Temporary execution context used for write and shell policy checks
  - id: safety-static-cases
    label: Deterministic command and path classification inputs
contracts:
  - id: runtime-opaque-input-preservation
    statement: Restored provider-opaque items are carried as provider_opaque input with their internal marker removed, while unsupported unmarked items are rejected.
    seamIds: [runtime-run-loop]
    riskIds: [runtime-lost-turn-state, provider-wire-corruption]
  - id: runtime-turn-boundary-settlement
    statement: A model turn emits and commits text, reasoning, tool, approval, steer, and terminal outcomes in the externally observable order required for the next request.
    seamIds: [runtime-run-loop]
    riskIds: [runtime-lost-turn-state]
  - id: runtime-compaction-and-recovery
    statement: Request-boundary compaction, provider retry, and chain recovery either dispatch the correct replacement/full-history request or emit one local failure without corrupting prior state.
    seamIds: [runtime-run-loop]
    riskIds: [runtime-lost-turn-state, provider-wire-corruption]
  - id: runtime-run-guards
    statement: Run-loop repetition, output, inactivity, and total-turn guards stop unsafe runaway work while allowing legitimate activity and preserving later observable output where specified.
    seamIds: [runtime-run-loop]
    riskIds: [runtime-runaway-or-stalled-work]
  - id: runtime-usage-and-failure-projection
    statement: Usage updates, tool failures, invariant failures, cancellation, and final errors are projected once with the authoritative cumulative result exposed to callers.
    seamIds: [runtime-run-loop]
    riskIds: [runtime-lost-turn-state]
  - id: providers-response-reconstruction
    statement: Codex Responses terminal and streamed frames are exposed as complete model output, including reconstructed output items and call identifiers when the wire omitted them.
    seamIds: [providers-codex-responses]
    riskIds: [provider-wire-corruption]
  - id: providers-request-normalization
    statement: Codex requests preserve supported settings and provider metadata while removing unsupported, replay-only, or incompatible fields before transport.
    seamIds: [providers-codex-responses]
    riskIds: [provider-wire-corruption]
  - id: providers-compaction-and-opaque-history
    statement: Responses compaction is requested only when the provider capability and session state permit it, and native opaque history is retained without being sent through an incompatible path.
    seamIds: [providers-codex-responses]
    riskIds: [provider-wire-corruption]
  - id: providers-chained-wire-state
    statement: Chained and Responses-Lite requests send only valid new input, correlate the correct response identity, and invalidate or recover stale server state without replaying orphaned tool output.
    seamIds: [providers-codex-responses]
    riskIds: [provider-wire-corruption, session-continuity-corruption]
  - id: providers-transport-outcome-evidence
    statement: HTTP and WebSocket completion, abort, close, retry, and ambiguous-send outcomes retain the transcript and bounded transport evidence needed by the caller's recovery policy.
    seamIds: [providers-codex-responses]
    riskIds: [provider-wire-corruption]
  - id: ui-command-activity-status
    statement: CommandMessage renders each command or orchestration action with the correct user-facing verb, status glyph, waiting/queued/running state, and elapsed or approval label.
    seamIds: [ui-command-message]
    riskIds: [ui-misleading-tool-status]
  - id: ui-command-output-and-diff
    statement: CommandMessage presents shell output, errors, approval denial, truncation, match counts, and create/edit diffs with the promised concise or standard-mode visibility.
    seamIds: [ui-command-message]
    riskIds: [ui-misleading-tool-status]
  - id: ui-special-tool-renderers
    statement: CommandMessage selects the appropriate visible renderer for search, file, web, memory, ask-user, ask-mentor, subagent, and background-task results and falls back safely for unparseable output.
    seamIds: [ui-command-message]
    riskIds: [ui-misleading-tool-status]
  - id: shell-background-job-lifecycle
    statement: Background shell execution acknowledges with a job identity, retains output, reports terminal status, supports cancellation/monitoring, and settles output watches at completion.
    seamIds: [shell-tool-definition]
    riskIds: [shell-unsafe-execution]
  - id: shell-sandbox-and-approval-routing
    statement: Shell execution routes commands through the configured sandbox and approval policy, including failed-closed behavior when availability or wrapping changes after tool creation.
    seamIds: [shell-tool-definition]
    riskIds: [shell-unsafe-execution]
  - id: shell-docker-grant-scope
    statement: Docker host-control grants are session-scoped, one-shot and command-scoped, and never bypass the unavailable-sandbox or denied-command safeguards.
    seamIds: [shell-tool-definition]
    riskIds: [shell-unsafe-execution]
  - id: shell-rtk-and-remote-routing
    statement: Eligible local commands are wrapped by RTK and sandbox seams while SSH, allowlisted, unsupported, and redirected cases take their distinct non-wrapper execution paths.
    seamIds: [shell-tool-definition]
    riskIds: [shell-unsafe-execution]
  - id: shell-denied-read-recovery
    statement: Strict denied reads are recorded against the original invocation and produce a bounded retry instruction or held-call override without leaking approval state across sessions.
    seamIds: [shell-tool-definition]
    riskIds: [shell-unsafe-execution, session-continuity-corruption]
  - id: session-provider-continuity
    statement: Resume, provider/model changes, abort, and invalid chained responses clear or restore continuity so the next turn uses the right delta or full history while retaining transcript turns.
    seamIds: [session-composition]
    riskIds: [session-continuity-corruption]
  - id: session-stream-and-approval-events
    statement: Public session APIs emit text, tool, approval, recovery, retry, final, and error events in order and preserve call identity across approval continuation or abandonment.
    seamIds: [session-composition]
    riskIds: [session-continuity-corruption, runtime-lost-turn-state]
  - id: session-history-ledger-reconciliation
    statement: Import, undo, reset, abort, and failed-stream settlement reconcile completed and aborted tool pairs into canonical history without replaying stale calls.
    seamIds: [session-composition]
    riskIds: [session-continuity-corruption]
  - id: session-input-and-guard-preview
    statement: Image turns, queued notices, large-input preview, and failed initial starts preserve the caller-visible input and state without consuming or persisting data prematurely.
    seamIds: [session-composition]
    riskIds: [session-continuity-corruption]
  - id: subagents-lifecycle-and-result
    statement: Each subagent run has isolated identity and lifecycle events, returns the correct final post-tool text/result, and reports cancellation or setup failure through the public result.
    seamIds: [subagent-manager]
    riskIds: [subagent-policy-bypass]
  - id: subagents-role-selection
    statement: Mentor, explorer, and worker roles select the configured model and expose exactly the role-appropriate tool capabilities, including explorer web access and model-specific worker editors.
    seamIds: [subagent-manager]
    riskIds: [subagent-policy-bypass]
  - id: subagents-write-boundary
    statement: Worker writes inside the leased workspace execute or auto-approve as intended, while outside paths fail deterministically and filesChanged contains only successful writes.
    seamIds: [subagent-manager]
    riskIds: [subagent-policy-bypass, shell-unsafe-execution]
  - id: subagents-shell-and-network-policy
    statement: Nested subagent shell and network tools enforce unsandboxed, safety, host-scope, and approval behavior without exposing an interactive bypass.
    seamIds: [subagent-manager]
    riskIds: [subagent-policy-bypass, shell-unsafe-execution]
  - id: shell-command-safety-status
    statement: Command families are classified as GREEN, YELLOW approval-required, or RED hard-blocked according to their actual execution risk, including nested commands and malformed syntax.
    seamIds: [command-safety-classifier]
    riskIds: [safety-misclassification]
  - id: shell-path-safety-status
    statement: Paths are classified according to home/system/traversal/hidden/sensitive-extension and safe-project or temporary-directory rules without false positives for ordinary filenames.
    seamIds: [path-risk-classifier]
    riskIds: [safety-misclassification]
  - id: shell-red-yellow-policy
    statement: Ambiguous or read-only risky operations require model/user review rather than being hard-blocked, while inherently dangerous commands remain RED.
    seamIds: [command-safety-classifier, path-risk-classifier]
    riskIds: [safety-misclassification]
