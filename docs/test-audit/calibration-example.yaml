# Schema-valid example artifact for the 2026-09-02 calibration wave.
# SHARED INPUT for both reviewers — copy this SHAPE, not these facts.
# The test path below is fabricated; it is not part of the assigned sample.
schemaVersion: 2
domains:
  - id: example
    label: Example domain illustrating artifact shape
suites:
  - id: unit
    label: Default Vitest unit suite
seams:
  - id: example-seam-classifier
    label: >-
      Boundary where a raw command string becomes a safety classification the
      approval flow acts on.
risks:
  - id: example-risk-misclassification
    label: >-
      A command that should prompt is auto-approved, or a safe command prompts,
      degrading either safety or flow.
    severity: high
fixtures: []
contracts:
  - id: example-contract-yellow-ambiguous
    statement: >-
      An ambiguous write-capable command family is classified as approval
      required (YELLOW) rather than hard blocked (RED), so the model can still
      decide with human oversight.
    seamIds:
      - example-seam-classifier
    riskIds:
      - example-risk-misclassification
tests:
