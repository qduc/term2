    id: example-example-classifier-test
    file: source/__example__/example-classifier.test.ts
    domainId: example
    suiteId: unit
    contractIds:
      - example-contract-yellow-ambiguous
    fixtureIds: []
decisions:
  - id: example-example-classifier-test-r1
    testId: example-example-classifier-test
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: medium
    reason: >-
      Illustrative decision: two second opinions on one test coexist; neither
      is the decision of record.
    evidence:
      - >-
        Illustrative evidence statement naming an observable outcome and an
        exact sibling path when a duplication claim is made.
    replacementTestIds: []
