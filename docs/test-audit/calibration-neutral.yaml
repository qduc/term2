decisions:
  - id: runtime-application-run-loop-calibration-neutral
    testId: runtime-application-run-loop
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: high
    reason: The file protects the run-loop's highest-risk public contracts across normal turns, approvals, retries, provider continuity, and containment; removing it could allow duplicated history or unsafe replay to ship.
    evidence:
      - "source/services/agent-runtime/application-run-loop.test.ts asserts provider-opaque normalization, response-aware rollover, and compaction failure preservation through startStream() history and events."
      - "The same file asserts visible text/reasoning beyond prior repetition thresholds, deadline and idle abort codes, and output/tool-argument caps before excess output is forwarded."
      - "The tests assert assistant text precedes tool calls, approval continuations feed results to the next model request, steers are admitted/retracted/edited, and retry rollback avoids duplicated deltas."
    replacementTestIds: []
    status: proposed
  - id: providers-codex-responses-model-calibration-neutral
    testId: providers-codex-responses-model
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: high
    reason: This is the only assigned provider boundary exercising HTTP, WebSocket, Responses Lite, terminal reconstruction, continuation filtering, and ambiguous-outcome classification together; deleting it could silently corrupt provider wire traffic or replay an uncertain request.
    evidence:
      - "source/providers/codex-responses-model.test.ts asserts empty and missing response.output reconstruction, per-response item isolation, call-id backfill, and public CodexResponsesModel.stream completion output."
      - "The file captures request bodies and asserts Codex option projection, forbidden temperature/max-output fields, replay-id removal, Luna developer prefixes, and tool-continuation input."
      - "The file asserts close-before-terminal and first-frame/idle timeout outcomes distinguish UnsentWebSocketRequestError from AmbiguousModelOutcomeError, while watchdog timing reaches provider traffic."
    replacementTestIds: []
    status: proposed
  - id: ui-components-command-message-calibration-neutral
    testId: ui-components-command-message
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: high
    reason: These are user-visible terminal rendering contracts rather than implementation snapshots; removing them could show a successful command as failed, hide an approval denial, or misreport background work and output.
    evidence:
      - "source/components/message/CommandMessage.test.tsx asserts distinct visible headers for background subagents, background shells, check-ins, stop/move actions, and legacy or unified launches."
      - "The file asserts concise success/running/failure/denial glyphs, no duplicate command arguments, elapsed-time behavior, and shell runtime extraction in both standard and concise modes."
      - "The file asserts four-line output boundaries, search match counts, source line numbering, subagent summaries, and generic fallback for an unparseable standard renderer."
    replacementTestIds: []
    status: proposed
  - id: shell-system-shell-calibration-neutral
    testId: shell-system-shell
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: high
    reason: The shell tool is the effectful safety boundary and the file tests its asynchronous lifecycle and policy matrix through injected runners; removing it could execute commands outside sandbox, lose background output, or leave approval state dangling.
    evidence:
      - "source/tools/system/shell.test.ts asserts immediate background acknowledgement, retained tail, cancellation signal, lifecycle events, deferred cleanup, timeout status, and output caps using BackgroundShellRegistry and BackgroundShellWatches."
      - "The file asserts Docker host authorization isolation, sandbox availability failures, SSH/RTK routing, plan-mode mutation blocking, correlation restoration, and foreground-to-background adoption without a second execution."
      - "The file asserts strict denied-read retry metadata and one-shot overrides, while a missing SDK call ID fails closed; it also asserts foreground monitoring is rejected before execution."
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-characterization-calibration-neutral
    testId: session-conversation-session-characterization
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: needs_review
    confidence: medium
    reason: The file contains valuable public approval, event, continuity, and setting behavior, but its characterization cases overlap adjacent session stream/lifecycle coverage and the intended retained boundary is not clear enough for consolidation or rewrite from this file alone; deleting it could lose a sequence not named by a sibling.
    evidence:
      - "source/services/session/conversation-session.characterization.test.ts asserts setSubagentEventSink cleanup, traffic context, runtime setting delegation, and auto-approval usage/final text behavior not all represented by the assigned sibling files."
      - "Its approval then approval, approval then rejection, and abort/reset/undo sequences assert terminal event order and pending-state invalidation; source/services/session/conversation-session.stream.test.ts also asserts approval continuation event order."
      - "The file uses createConversationSession with MockStream and hand-built approval state, so the setup crosses session composition, approval state, and client seams; ownership of the characterization cases needs cross-domain review."
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-isolation-calibration-neutral
    testId: session-conversation-session-isolation
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: high
    reason: Isolation is a meaningful cross-session contract with critical security and state-loss consequences; removing this file could let one session reuse another's response ID or approval continuation.
    evidence:
      - "source/services/session/conversation-session.isolation.test.ts runs sessions A and B through one mock client and asserts A2 uses resp-A1 while B1 uses no A state, with distinct frozen history snapshots and recovery budgets."
      - "The file asserts pending approval in session A cannot be answered through session B, while A still resumes its own continuation."
      - "The file asserts queueModeNotice is attached only to the next user turn for both chaining and non-chaining providers and that an abandoned approval does not replay cached tool arguments."
    replacementTestIds: []
    status: proposed
  - id: session-conversation-session-lifecycle-calibration-neutral
    testId: session-conversation-session-lifecycle
    role: second_opinion
    reviewer: calibration-neutral
    sourceArtifact: docs/test-audit/calibration-neutral.yaml
    recommendation: keep
    confidence: high
