# Independent calibration artifact for the assigned 16-file sample.
schemaVersion: 2
domains:
  - id: runtime
    label: Application run-loop behavior
  - id: providers
    label: Codex Responses provider adapter
  - id: ui-components
    label: Ink UI components
  - id: shell
    label: Shell execution and safety
  - id: session
    label: Conversation session lifecycle
  - id: subagents
    label: Subagent execution and policy
suites:
  - id: unit
    label: Deterministic unit and seam tests
  - id: provider-adapter
    label: Provider adapter contract tests
  - id: ui-rendering
    label: Ink rendering tests
seams:
  - id: application-run-loop
    label: Boundary between streamed model turns, tools, history, and application events
  - id: codex-responses-adapter
    label: Boundary translating Codex HTTP/WebSocket frames into provider-neutral turns
  - id: command-message-renderer
    label: Boundary translating tool outcomes into visible terminal activity
  - id: shell-tool
    label: Boundary where shell requests become sandboxed or unsandboxed execution
  - id: conversation-session
    label: Public session facade coordinating turns, approvals, history, and continuity
  - id: subagent-manager
    label: Boundary creating delegated runs and applying role-specific tool policy
  - id: command-classifier
    label: Boundary classifying command and path input as GREEN, YELLOW, or RED
risks:
  - id: runtime-replay-corruption
    label: A streamed turn is duplicated, persisted in the wrong order, or resumed with unsafe state.
    severity: critical
  - id: runtime-runaway-or-stall
    label: A provider or tool runs without containment, or legitimate output is aborted as runaway work.
    severity: high
  - id: provider-wire-corruption
    label: Provider output or continuation input is malformed, incomplete, or associated with the wrong response.
    severity: critical
  - id: provider-unsafe-replay
    label: A request with unknown outcome is replayed, duplicating a tool action or user turn.
    severity: critical
  - id: ui-misleading-status
    label: The terminal shows the wrong action, status, result, or approval outcome.
    severity: high
  - id: shell-safety-bypass
    label: A command bypasses sandbox, approval, workspace, or output containment policy.
    severity: critical
  - id: session-state-loss
    label: A resume, abort, undo, provider switch, or failed turn loses or replays conversation state.
    severity: critical
  - id: session-approval-confusion
    label: Approval state leaks between sessions or a decision is applied to the wrong call.
    severity: critical
  - id: subagent-authority-escape
    label: A delegated role gains tools, filesystem, network, or shell authority outside its contract.
    severity: critical
  - id: classifier-misclassification
    label: Safe work prompts unnecessarily or dangerous work is treated as safe.
    severity: high
fixtures:
  - id: fake-streams
    label: Deterministic async model streams and terminal completion fixtures
  - id: injected-transport
    label: Injected Codex transport and provider traffic recorder
  - id: mock-session-client
    label: Mock conversation client, session composition, and continuation state
  - id: ink-renderer
    label: Ink renderInAct output frames with fake timers
  - id: shell-runner
    label: Injected shell runner, registry, scheduler, and temporary workspace
  - id: subagent-provider
    label: Registered deterministic test providers and delegated run fixtures
  - id: command-corpus
    label: Representative command and path safety corpus
contracts:
  - id: runtime-opaque-input
    statement: Restored provider-owned items are carried as opaque items without leaking the internal marker, while unsupported unmarked items are rejected.
    seamIds: [application-run-loop]
    riskIds: [runtime-replay-corruption, provider-wire-corruption]
  - id: runtime-boundary-compaction
    statement: A request boundary may defer or apply compaction, preserve the resulting history, and continue only when the compaction or rollover outcome permits it.
    seamIds: [application-run-loop]
    riskIds: [runtime-replay-corruption, session-state-loss]
  - id: runtime-stream-containment
    statement: Legitimate streamed text and reasoning survive configured repetition and idle thresholds, while output, argument, runaway, and deadline violations stop the request with replay-safety evidence.
    seamIds: [application-run-loop]
    riskIds: [runtime-runaway-or-stall, runtime-replay-corruption]
  - id: runtime-event-and-history-order
    statement: Model deltas, provider items, assistant text, tool calls, and tool results are emitted and persisted in an order that a following request can replay.
    seamIds: [application-run-loop]
    riskIds: [runtime-replay-corruption]
  - id: runtime-chain-provenance
    statement: A response identifier is forwarded only for a supported same-provider continuation, and provider switches or failed chain recovery fall back to full history.
    seamIds: [application-run-loop]
    riskIds: [runtime-replay-corruption, provider-unsafe-replay]
  - id: runtime-approval-continuation
    statement: Tool approval pauses expose the requested call, resume or reject the matching call, and return its result to the model without losing later calls.
    seamIds: [application-run-loop]
    riskIds: [session-approval-confusion, runtime-replay-corruption]
  - id: runtime-steer-settlement
    statement: User steering is admitted at the next request boundary, can be edited or retracted while pending, and is released when no boundary remains.
    seamIds: [application-run-loop]
    riskIds: [runtime-replay-corruption, session-state-loss]
  - id: runtime-budget-and-tool-errors
    statement: Run budgets contain repeated tool work, ordinary tool exceptions become model-visible results, and cancellation or invariant failures still terminate the run.
    seamIds: [application-run-loop]
    riskIds: [runtime-runaway-or-stall]
  - id: runtime-retry-rollback
    statement: Retryable provider failures retry within policy without duplicate visible deltas, while ambiguous or non-replayable failures are surfaced and provisional state is rolled back.
    seamIds: [application-run-loop]
    riskIds: [runtime-replay-corruption, provider-unsafe-replay]
  - id: provider-terminal-reconstruction
    statement: A Codex terminal response with empty or missing output is completed from its own streamed output items, while non-empty or item-less output remains unchanged.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-wire-corruption]
  - id: provider-frame-conversion
    statement: Codex text, reasoning, tool calls, custom tools, usage, and provider errors become the corresponding provider-neutral stream events and errors.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-wire-corruption]
  - id: provider-request-shape
    statement: Requests sent to Codex contain supported settings and normalized input while omitting forbidden fields and preserving prompt-cache and include options.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-wire-corruption]
  - id: provider-lite-continuity
    statement: Luna requests use Responses Lite prefixes and metadata, send only the appropriate delta after chaining, and recover to full history when the chain is invalid.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-wire-corruption, provider-unsafe-replay]
  - id: provider-tool-history-filter
    statement: Codex continuation requests retain paired and interleaved tool results, remove consumed or orphaned items only when justified, and never silently replay an invalid orphan.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-wire-corruption, provider-unsafe-replay]
  - id: provider-websocket-outcome
    statement: WebSocket completion, close, abort, and transport failures are recorded with enough evidence to distinguish safe retry from ambiguous outcome.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-unsafe-replay]
  - id: provider-watchdog-and-close
    statement: WebSocket receive deadlines abort stalled requests and record timing, while completed streams detach without hanging and close is safe to call.
    seamIds: [codex-responses-adapter]
    riskIds: [provider-wire-corruption, provider-unsafe-replay]
  - id: ui-tool-status
    statement: CommandMessage renders the tool-specific action, arguments, success/failure/approval status, and background or subagent activity as the corresponding visible terminal text.
    seamIds: [command-message-renderer]
    riskIds: [ui-misleading-status]
  - id: ui-concise-and-standard-output
    statement: Concise mode reduces each tool outcome to its status line and relevant summary, while standard mode preserves the structured result appropriate to that tool.
    seamIds: [command-message-renderer]
    riskIds: [ui-misleading-status]
  - id: ui-output-boundaries
    statement: Long command, search, error, and source output is truncated at the documented boundary with the retained tail or count, and unparseable output falls through visibly.
    seamIds: [command-message-renderer]
    riskIds: [ui-misleading-status]
  - id: shell-background-lifecycle
    statement: A background shell call acknowledges immediately, retains output, exposes status and cancellation, emits terminal lifecycle events, and cleans up after settlement.
    seamIds: [shell-tool]
    riskIds: [shell-safety-bypass, session-state-loss]
  - id: shell-monitoring
    statement: Monitoring is available only for background jobs, reports retained matches in order, and setup failures do not hide the launched job.
    seamIds: [shell-tool]
    riskIds: [shell-safety-bypass, session-state-loss]
  - id: shell-timeout-and-output-caps
    statement: Foreground and background commands use their respective timeout and overflow policies, and caller output requests cannot exceed the configured session cap.
    seamIds: [shell-tool]
    riskIds: [shell-safety-bypass]
  - id: shell-sandbox-and-approval
    statement: Shell execution follows sandbox availability, mode, approval, Docker authorization, SSH, RTK, and plan-mode policy without executing a command when a required guard fails.
    seamIds: [shell-tool]
    riskIds: [shell-safety-bypass]
  - id: shell-denied-read-recovery
    statement: Strict sandbox denied reads produce a scoped retry or held-call approval path, preserve raw command identity, and fail closed when required call metadata is absent.
    seamIds: [shell-tool]
    riskIds: [shell-safety-bypass, session-approval-confusion]
  - id: shell-schema-and-description
    statement: Shell schemas apply safe defaults and expose descriptions that match search, orchestrator, sandbox, and saved-output policy.
    seamIds: [shell-tool]
    riskIds: [shell-safety-bypass]
  - id: session-public-events
    statement: A session emits ordered text, tool, approval, retry, recovery, final, and error events that accurately describe one turn.
    seamIds: [conversation-session]
    riskIds: [session-state-loss, runtime-replay-corruption]
  - id: session-approval-state
    statement: Approval decisions target the pending call, answer sinks are used only for accepted answers, and abort, reset, undo, or rejection cannot resume stale approval state.
    seamIds: [conversation-session]
    riskIds: [session-approval-confusion, session-state-loss]
  - id: session-continuity
    statement: Resume, provider/model changes, abort, and invalid response identifiers select the correct delta or full-history request while preserving the transcript that remains valid.
    seamIds: [conversation-session]
    riskIds: [session-state-loss, provider-unsafe-replay]
  - id: session-isolation
    statement: Independent sessions do not share response identifiers, approval context, recovery envelopes, or provider history snapshots.
    seamIds: [conversation-session]
    riskIds: [session-approval-confusion, session-state-loss]
  - id: session-history-ledger
    statement: Completed tool pairs are reconciled into canonical history, aborted or undone calls are not replayed, and retained earlier turns remain available after undo.
    seamIds: [conversation-session]
    riskIds: [runtime-replay-corruption, session-state-loss]
  - id: session-large-input
    statement: Large-input preview is non-mutating, avoids unnecessary estimation, and records the guard state only after a successful provider request.
    seamIds: [conversation-session]
    riskIds: [session-state-loss, runtime-runaway-or-stall]
  - id: subagent-run-lifecycle
    statement: Each delegated run has an isolated identity, returns a completed/failed/cancelled result, and emits matching start, tool, and completion events.
    seamIds: [subagent-manager]
    riskIds: [subagent-authority-escape, session-state-loss]
  - id: subagent-role-capabilities
    statement: Mentor, explorer, and worker roles receive the configured model, prompt, and role-appropriate tool surface, with mentor history reset and continuation behavior preserved.
    seamIds: [subagent-manager]
    riskIds: [subagent-authority-escape]
  - id: subagent-shell-policy
    statement: Explorer shell is read-only, worker shell never requires an interactive approval channel, and dangerous or unsandboxed worker requests are blocked or evaluator-approved according to policy.
    seamIds: [subagent-manager]
    riskIds: [subagent-authority-escape, shell-safety-bypass]
  - id: subagent-write-boundary
    statement: Worker writes and shell redirections stay inside the workspace, successful writes are reported, and concurrent writes to one path are rejected without waiting.
    seamIds: [subagent-manager]
    riskIds: [subagent-authority-escape, shell-safety-bypass]
  - id: subagent-network-scope
    statement: Network scopes deny empty authority, require wildcard authority for hostless search, validate finite URL hosts, and reject redirect-unsafe finite fetch scopes.
    seamIds: [subagent-manager]
    riskIds: [subagent-authority-escape]
  - id: subagent-tool-cache
    statement: Role agent tools are cached per role and rebuilt by clearCache without losing nested tool approval and boundary behavior.
    seamIds: [subagent-manager]
    riskIds: [subagent-authority-escape]
  - id: subagent-failure-usage
    statement: Missing client configuration and provider failures return a failed result while preserving available usage evidence.
    seamIds: [subagent-manager]
    riskIds: [runtime-runaway-or-stall]
  - id: safety-approval-classification
    statement: Empty input is rejected and commands requiring review, including malformed, unknown, sensitive, destructive, and nested destructive commands, return an approval-required result.
    seamIds: [command-classifier]
    riskIds: [classifier-misclassification]
  - id: safety-git-policy
    statement: Read-only git inspection is GREEN, mutating or destructive git operations and unknown git forms are YELLOW, and dangerous flags cannot hide that review requirement.
    seamIds: [command-classifier]
    riskIds: [classifier-misclassification, shell-safety-bypass]
  - id: safety-path-policy
    statement: Safe project and temporary paths are GREEN, secrets and hidden paths are YELLOW, and sensitive home credential paths are RED according to path context.
    seamIds: [command-classifier]
    riskIds: [classifier-misclassification, shell-safety-bypass]
  - id: safety-red-yellow-boundary
    statement: Ambiguous or workspace-scale operations remain YELLOW for model or user review, while inherently dangerous direct operations remain RED.
    seamIds: [command-classifier]
    riskIds: [classifier-misclassification, shell-safety-bypass]
