- id: settings-config-image-ref
  label: In-memory image reference seeded through InputProvider
- id: settings-config-env-snapshot
  label: Isolated process.env snapshot and module reset
- id: settings-config-schema-values
  label: Representative valid and invalid settings objects
- id: settings-config-contract-inventory
  label: Contract 04 consumer inventory and exported setting-key catalog
- id: settings-config-settings-directory
  label: Isolated settings directory and settings.json fixture
- id: settings-config-corrupt-settings-file
  label: Valid, invalid, or garbage settings.json byte fixture
- id: settings-config-lock-fixture
  label: settings.json.lock and temporary-file filesystem fixture
- id: settings-config-provider-records
  label: Legacy and modern custom provider records
- id: settings-config-model-source-tree
  label: Production TypeScript source tree scanned for retired identifiers
- id: approval-continuation-handles
  label: Injected approval continuation callbacks retaining the exact interruption
- id: approval-access-state
  label: Injected session and nested compatibility state for scoped approval grants
- id: approval-advisories
  label: Structured low-risk, high-risk, and missing evaluator advisories
- id: approval-command-messages
  label: Pending and approved command-message records with call and capability metadata
- id: approval-ledger-records
  label: Approval records and ledger instances used to verify replay authority
- id: approval-pending-context
  label: Pending approval context with batch decisions, prompted call, and owner metadata
- id: approval-background-entries
  label: Revisioned FIFO background approval entries and callback leases
- id: approval-policy-registry
  label: Tool approval registry and injected batch-policy callbacks
- id: approval-command-corpus
  label: Representative RED, YELLOW, safe, and evaluator-error command inputs
- id: approval-evaluator-transcript
  label: Bounded conversation history and structured evaluator chat responses
- id: approval-settings
  label: Injected approval mode, sandbox, provider, and model settings
- id: approval-owner-records
  label: Tool-call ownership claims for parent and delegated runs
- id: subagents-state-driver
  label: Injected queue driver, IDs, snapshots, and deterministic command/event inputs
- id: subagents-persistence
  label: In-memory queue persistence, invalid-record quarantine, and injected clocks
- id: subagents-provider
  label: Registered deterministic providers and scripted subagent streams
- id: subagents-stream
  label: Scripted text, tool, retry, usage, completion, and failure stream events
- id: subagents-lease
  label: Continuation handles, foreground leases, approval pauses, and abort signals
- id: subagents-runtime
  label: Application-owned runtime, tool ownership, session context, and role runner fixtures
- id: subagents-policy
  label: Role definitions, settings, wrapped tools, filesystem scopes, and approval policy fixtures
- id: subagents-notifications
  label: Lifecycle, shell, watch, check-in, usage, and completion event records
- id: subagents-session
  label: In-memory provider session, agent, history, and response-chain state
- id: subagents-worktree
  label: Deterministic local worktree list and active workspace root
contracts:
- id: runtime-opaque-input
  statement: Restored provider-owned items are carried as opaque items without leaking the internal marker,
    while unsupported unmarked items are rejected.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-replay-corruption
  - provider-wire-corruption
- id: runtime-boundary-compaction
  statement: A request boundary may defer or apply compaction, preserve the resulting history, and continue
    only when the compaction or rollover outcome permits it.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-replay-corruption
  - session-state-loss
- id: runtime-stream-containment
  statement: Legitimate streamed text and reasoning survive configured repetition and idle thresholds,
    while output, argument, runaway, and deadline violations stop the request with replay-safety evidence.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-runaway-or-stall
  - runtime-replay-corruption
- id: runtime-event-and-history-order
  statement: Model deltas, provider items, assistant text, tool calls, and tool results are emitted and
    persisted in an order that a following request can replay.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-replay-corruption
- id: runtime-chain-provenance
  statement: A response identifier is forwarded only for a supported same-provider continuation, and provider
    switches or failed chain recovery fall back to full history.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-replay-corruption
  - provider-unsafe-replay
- id: runtime-approval-continuation
  statement: Tool approval pauses expose the requested call, resume or reject the matching call, and return
    its result to the model without losing later calls.
  seamIds:
  - application-run-loop
  riskIds:
  - session-approval-confusion
  - runtime-replay-corruption
- id: runtime-steer-settlement
  statement: User steering is admitted at the next request boundary, can be edited or retracted while
    pending, and is released when no boundary remains.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-replay-corruption
  - session-state-loss
- id: runtime-budget-and-tool-errors
  statement: Run budgets contain repeated tool work, ordinary tool exceptions become model-visible results,
    and cancellation or invariant failures still terminate the run.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-runaway-or-stall
- id: runtime-retry-rollback
  statement: Retryable provider failures retry within policy without duplicate visible deltas, while ambiguous
    or non-replayable failures are surfaced and provisional state is rolled back.
  seamIds:
  - application-run-loop
  riskIds:
  - runtime-replay-corruption
  - provider-unsafe-replay
- id: provider-terminal-reconstruction
  statement: A Codex terminal response with empty or missing output is completed from its own streamed
    output items, while non-empty or item-less output remains unchanged.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-wire-corruption
- id: provider-frame-conversion
  statement: Codex text, reasoning, tool calls, custom tools, usage, and provider errors become the corresponding
    provider-neutral stream events and errors.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-wire-corruption
- id: provider-request-shape
  statement: Requests sent to Codex contain supported settings and normalized input while omitting forbidden
    fields and preserving prompt-cache and include options.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-wire-corruption
- id: provider-lite-continuity
  statement: Luna requests use Responses Lite prefixes and metadata, send only the appropriate delta after
    chaining, and recover to full history when the chain is invalid.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-wire-corruption
  - provider-unsafe-replay
- id: provider-tool-history-filter
  statement: Codex continuation requests retain paired and interleaved tool results, remove consumed or
    orphaned items only when justified, and never silently replay an invalid orphan.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-wire-corruption
  - provider-unsafe-replay
- id: provider-websocket-outcome
  statement: WebSocket completion, close, abort, and transport failures are recorded with enough evidence
    to distinguish safe retry from ambiguous outcome.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-unsafe-replay
- id: provider-watchdog-and-close
  statement: WebSocket receive deadlines abort stalled requests and record timing, while completed streams
    detach without hanging and close is safe to call.
  seamIds:
  - codex-responses-adapter
  riskIds:
  - provider-wire-corruption
  - provider-unsafe-replay
- id: ui-tool-status
  statement: CommandMessage renders the tool-specific action, arguments, success/failure/approval status,
    and background or subagent activity as the corresponding visible terminal text.
  seamIds:
  - command-message-renderer
  riskIds:
  - ui-misleading-status
- id: ui-concise-and-standard-output
  statement: Concise mode reduces each tool outcome to its status line and relevant summary, while standard
    mode preserves the structured result appropriate to that tool.
  seamIds:
  - command-message-renderer
  riskIds:
  - ui-misleading-status
- id: ui-output-boundaries
  statement: Long command, search, error, and source output is truncated at the documented boundary with
    the retained tail or count, and unparseable output falls through visibly.
  seamIds:
  - command-message-renderer
  riskIds:
  - ui-misleading-status
- id: shell-background-lifecycle
  statement: A background shell call acknowledges immediately, retains output, exposes status and cancellation,
    emits terminal lifecycle events, and cleans up after settlement.
  seamIds:
  - shell-tool
  riskIds:
  - shell-safety-bypass
  - session-state-loss
- id: shell-monitoring
  statement: Monitoring is available only for background jobs, reports retained matches in order, and
    setup failures do not hide the launched job.
  seamIds:
  - shell-tool
  riskIds:
  - shell-safety-bypass
  - session-state-loss
- id: shell-timeout-and-output-caps
  statement: Foreground and background commands use their respective timeout and overflow policies, and
    caller output requests cannot exceed the configured session cap.
  seamIds:
  - shell-tool
  riskIds:
  - shell-safety-bypass
- id: shell-sandbox-and-approval
  statement: Shell execution follows sandbox availability, mode, approval, Docker authorization, SSH,
    RTK, and plan-mode policy without executing a command when a required guard fails.
  seamIds:
  - shell-tool
  riskIds:
  - shell-safety-bypass
- id: shell-denied-read-recovery
  statement: Strict sandbox denied reads produce a scoped retry or held-call approval path, preserve raw
    command identity, and fail closed when required call metadata is absent.
  seamIds:
  - shell-tool
  riskIds:
  - shell-safety-bypass
  - session-approval-confusion
- id: shell-schema-and-description
  statement: Shell schemas apply safe defaults and expose descriptions that match search, orchestrator,
    sandbox, and saved-output policy.
  seamIds:
  - shell-tool
  riskIds:
  - shell-safety-bypass
- id: session-public-events
  statement: A session emits ordered text, tool, approval, retry, recovery, final, and error events that
    accurately describe one turn.
  seamIds:
  - conversation-session
  riskIds:
  - session-state-loss
  - runtime-replay-corruption
- id: session-approval-state
  statement: Approval decisions target the pending call, answer sinks are used only for accepted answers,
    and abort, reset, undo, or rejection cannot resume stale approval state.
  seamIds:
  - conversation-session
  riskIds:
  - session-approval-confusion
  - session-state-loss
- id: session-continuity
  statement: Resume, provider/model changes, abort, and invalid response identifiers select the correct
    delta or full-history request while preserving the transcript that remains valid.
  seamIds:
  - conversation-session
  riskIds:
  - session-state-loss
  - provider-unsafe-replay
- id: session-isolation
  statement: Independent sessions do not share response identifiers, approval context, recovery envelopes,
    or provider history snapshots.
  seamIds:
  - conversation-session
  riskIds:
  - session-approval-confusion
  - session-state-loss
- id: session-history-ledger
  statement: Completed tool pairs are reconciled into canonical history, aborted or undone calls are not
    replayed, and retained earlier turns remain available after undo.
  seamIds:
  - conversation-session
  riskIds:
  - runtime-replay-corruption
  - session-state-loss
- id: session-large-input
  statement: Large-input preview is non-mutating, avoids unnecessary estimation, and records the guard
    state only after a successful provider request.
  seamIds:
  - conversation-session
  riskIds:
  - session-state-loss
  - runtime-runaway-or-stall
- id: subagent-run-lifecycle
  statement: Each delegated run has an isolated identity, returns a completed/failed/cancelled result,
    and emits matching start, tool, and completion events.
  seamIds:
  - subagent-manager
  riskIds:
  - subagent-authority-escape
  - session-state-loss
- id: subagent-role-capabilities
  statement: Mentor, explorer, and worker roles receive the configured model, prompt, and role-appropriate
    tool surface, with mentor history reset and continuation behavior preserved.
  seamIds:
  - subagent-manager
  riskIds:
  - subagent-authority-escape
- id: subagent-shell-policy
  statement: Explorer shell is read-only, worker shell never requires an interactive approval channel,
    and dangerous or unsandboxed worker requests are blocked or evaluator-approved according to policy.
  seamIds:
  - subagent-manager
  riskIds:
  - subagent-authority-escape
  - shell-safety-bypass
- id: subagent-write-boundary
  statement: Worker writes and shell redirections stay inside the workspace, successful writes are reported,
    and concurrent writes to one path are rejected without waiting.
  seamIds:
  - subagent-manager
  riskIds:
  - subagent-authority-escape
  - shell-safety-bypass
- id: subagent-network-scope
  statement: Network scopes deny empty authority, require wildcard authority for hostless search, validate
    finite URL hosts, and reject redirect-unsafe finite fetch scopes.
  seamIds:
  - subagent-manager
  riskIds:
  - subagent-authority-escape
- id: subagent-tool-cache
  statement: Role agent tools are cached per role and rebuilt by clearCache without losing nested tool
    approval and boundary behavior.
  seamIds:
  - subagent-manager
  riskIds:
  - subagent-authority-escape
- id: subagent-failure-usage
  statement: Missing client configuration and provider failures return a failed result while preserving
    available usage evidence.
  seamIds:
  - subagent-manager
  riskIds:
  - runtime-runaway-or-stall
- id: safety-approval-classification
  statement: Empty input is rejected and commands requiring review, including malformed, unknown, sensitive,
    destructive, and nested destructive commands, return an approval-required result.
  seamIds:
  - command-classifier
  riskIds:
  - classifier-misclassification
- id: safety-git-policy
  statement: Read-only git inspection is GREEN, mutating or destructive git operations and unknown git
    forms are YELLOW, and dangerous flags cannot hide that review requirement.
  seamIds:
  - command-classifier
  riskIds:
  - classifier-misclassification
  - shell-safety-bypass
- id: safety-path-policy
  statement: Safe project and temporary paths are GREEN, secrets and hidden paths are YELLOW, and sensitive
    home credential paths are RED according to path context.
  seamIds:
  - command-classifier
  riskIds:
  - classifier-misclassification
  - shell-safety-bypass
- id: safety-red-yellow-boundary
  statement: Ambiguous or workspace-scale operations remain YELLOW for model or user review, while inherently
    dangerous direct operations remain RED.
  seamIds:
  - command-classifier
  riskIds:
  - classifier-misclassification
  - shell-safety-bypass
- id: prompts-commands-command-metadata
  statement: Each command factory exposes its documented name, description, argument expectation, and
    completion metadata, and command actions return the handler result expected by the dispatcher.
  seamIds:
  - prompts-commands-command-factory
  riskIds:
  - prompts-commands-command-routing
- id: prompts-commands-auto-approval-transition
  statement: Auto-approval accepts the four supported modes after normalization, persists and applies
    valid changes, announces the active mode, opens value selection for empty input, and leaves state
    unchanged for invalid input; always mode explicitly warns that the sandbox is disabled.
  seamIds:
  - prompts-commands-settings-command
  riskIds:
  - prompts-commands-setting-drift
  - prompts-commands-command-routing
- id: prompts-commands-compaction-lifecycle
  statement: Manual compaction immediately announces that work started, later reports the successful summary,
    and reports asynchronous failures without submitting a chat turn.
  seamIds:
  - prompts-commands-conversation-command
  riskIds:
  - prompts-commands-conversation-state-loss
- id: prompts-commands-resume-grammar
  statement: Resume treats empty, list, and ls input as browse requests, accepts one safe conversation
    id for resumption, and reports malformed or multi-token input without resuming a target.
  seamIds:
  - prompts-commands-conversation-command
  - prompts-commands-command-factory
  riskIds:
  - prompts-commands-conversation-state-loss
  - prompts-commands-command-routing
- id: prompts-commands-retry-outcomes
  statement: Retry-turn and retry-tool start their respective asynchronous retry operation and stay silent
    on success while reporting the documented message when no new response or tool call can be retried.
  seamIds:
  - prompts-commands-conversation-command
  riskIds:
  - prompts-commands-conversation-state-loss
- id: prompts-commands-rewind-resolution
  statement: Rewind resolves last and explicit visible picker positions, handles offset store turn numbers,
    rejects invalid or conflicting targets, and reports when there is no available turn without mutating
    the conversation.
  seamIds:
  - prompts-commands-rewind-command
  riskIds:
  - prompts-commands-rewind-misaddress
  - prompts-commands-conversation-state-loss
- id: prompts-commands-rewind-disposition
  statement: A rewound turn is either restored to input for editing or resent with its text and images,
    explicit disposition arguments override defaults, aliases explain the canonical command, and redraw
    occurs only after a successful rewind.
  seamIds:
  - prompts-commands-rewind-command
  riskIds:
  - prompts-commands-rewind-misaddress
  - prompts-commands-command-routing
- id: prompts-commands-sandbox-toggle
  statement: The sandbox command toggles sandbox.enabled, applies the same value to runtime settings,
    and announces whether shell access is restricted or unrestricted.
  seamIds:
  - prompts-commands-settings-command
  riskIds:
  - prompts-commands-setting-drift
- id: prompts-commands-skill-activation
  statement: Skills command selection is case-insensitive and whitespace-tolerant, activates the matching
    available skill and announces the next-request flow, while empty or unknown names route to browsing
    or an error without selecting a skill.
  seamIds:
  - prompts-commands-skill-command
  - prompts-commands-command-factory
  riskIds:
  - prompts-commands-command-routing
- id: prompts-commands-slash-resolution
  statement: Slash-command resolution prefers an exact case-insensitive name, accepts a unique case-insensitive
    prefix, and returns no command for an ambiguous prefix.
  seamIds:
  - prompts-commands-slash-resolver
  riskIds:
  - prompts-commands-command-routing
- id: prompts-commands-model-profile-routing
  statement: Prompt profile selection maps lite mode and model-family strings to existing base prompt
    files, preserves the gpt-5.6 and codex boundaries, and falls back to a valid base for unknown models.
  seamIds:
  - prompts-commands-profile-selection
  riskIds:
  - prompts-commands-prompt-contract-drift
- id: prompts-commands-prompt-spec-composition
  statement: Prompt construction composes the selected base, stable fragment order, and conditional inline
    or fragment guidance from profile and feature options, including sandbox, search, memory, session
    browser, and subagent capabilities.
  seamIds:
  - prompts-commands-prompt-constructor
  - prompts-commands-prompt-addendum
  riskIds:
  - prompts-commands-prompt-contract-drift
  - prompts-commands-authority-drift
- id: prompts-commands-cache-stable-mode-prefix
  statement: Non-lite built-in modes receive equivalent cache-stable instruction prefixes with mode stubs,
    while full Plan workflow content is delivered through the Plan enter notice and lite mode remains
    minimal.
  seamIds:
  - prompts-commands-prompt-constructor
  - prompts-commands-prompt-files
  riskIds:
  - prompts-commands-prompt-contract-drift
- id: prompts-commands-search-guidance
  statement: Search-via-shell guidance selects rg and fd when locally available, falls back independently
    to grep and find when unavailable or remote, and includes explicit-path, stdin, regex-ordering, and
    shell-hygiene safeguards.
  seamIds:
  - prompts-commands-prompt-addendum
  riskIds:
  - prompts-commands-environment-fallback
  - prompts-commands-guidance-regression
- id: prompts-commands-reasoning-guidance
  statement: The reasoning-efficiency addendum is non-empty and instructs the model to match effort to
    difficulty, settle confirmed context, revise at most once, and end once the answer is complete.
  seamIds:
  - prompts-commands-prompt-addendum
  riskIds:
  - prompts-commands-guidance-regression
- id: prompts-commands-delegation-guidance
  statement: Delegation guidance names the available execution mode, keeps diagnosis and outcome ownership
    with the parent, and frames bounded autonomous tasks without encouraging redundant direct work or
    librarian advertising.
  seamIds:
  - prompts-commands-prompt-addendum
  riskIds:
  - prompts-commands-authority-drift
  - prompts-commands-guidance-regression
- id: prompts-commands-explorer-delegation-contract
  statement: Explorer-facing and plan-facing prompt files bound evidence collection to a scoped question,
    keep analysis and synthesis with the parent, and require bounded task framing for delegated roles.
  seamIds:
  - prompts-commands-prompt-files
  riskIds:
  - prompts-commands-authority-drift
- id: prompts-commands-orchestrator-contract
  statement: Orchestrator prompt text keeps the orchestrator as the user-facing outcome owner, permits
    bounded delegation and integration judgment, and documents honest completion, validation, steering,
    and cancellation boundaries.
  seamIds:
  - prompts-commands-prompt-files
  riskIds:
  - prompts-commands-authority-drift
  - prompts-commands-guidance-regression
- id: prompts-commands-role-prompt-boundaries
  statement: Worker and explorer role prompts require the available execution and escalation discipline,
    including validation evidence for workers and no direct user contact for execution roles.
  seamIds:
  - prompts-commands-prompt-files
  riskIds:
  - prompts-commands-authority-drift
  - prompts-commands-guidance-regression
- id: observability-cost-micros
  statement: Decimal and numeric USD charges are converted to whole microdollars deterministically, with
    malformed values rejected rather than coerced.
  seamIds:
  - observability-cost-accounting
  riskIds:
  - observability-cost-overcharge
- id: observability-cost-dimensions
  statement: Prompt, cached-input, cache-write, and output usage are separated without billing reasoning
    twice, and missing dimensions remain ambiguous rather than invented.
  seamIds:
  - observability-cost-accounting
  riskIds:
  - observability-cost-overcharge
  - observability-cost-unpriced
- id: observability-cost-provenance
  statement: A provider-reported charge takes precedence over a catalog estimate, while catalog, borrowed-provider,
    unknown-model, unknown-provider, and unknown-tier provenance remains explicit.
  seamIds:
  - observability-cost-accounting
  - observability-pricing-resolution
  riskIds:
  - observability-cost-overcharge
  - observability-cost-unpriced
- id: observability-cost-summary
  statement: Cost summaries distinguish exact, estimated, partial, and unavailable evidence, deduplicate
    request records, group usage by provider/model, and render positive sub-cent values visibly.
  seamIds:
  - observability-cost-accounting
  riskIds:
  - observability-cost-overcharge
  - observability-cost-unpriced
- id: observability-pricing-match
  statement: Pricing resolution matches provider/model aliases and case variants within the intended provider
    rules, borrows known model rates only with provenance, and fails closed for unknown tiers or models.
  seamIds:
  - observability-pricing-resolution
  riskIds:
  - observability-cost-unpriced
- id: observability-pricing-version
  statement: Catalog and overlay pricing version identifiers are exposed so a recorded estimate can be
    traced to its pricing inputs.
  seamIds:
  - observability-pricing-resolution
  riskIds:
  - observability-cost-unpriced
- id: observability-journal-order
  statement: Assistant text and reasoning deltas receive monotonic per-turn sequence numbers, ignore empty
    deltas, preserve approval continuations on one turn, and reset only for a new turn.
  seamIds:
  - observability-assistant-journal
  riskIds:
  - observability-journal-loss
- id: observability-journal-items
  statement: Provider run items are normalized into persisted tool and assistant items, duplicate raw
    or canonical identities are suppressed as a group, and undo or clear removes only invalidated buffered
    evidence.
  seamIds:
  - observability-assistant-journal
  riskIds:
  - observability-journal-loss
  - observability-replay-corruption
- id: observability-journal-ledger-equivalence
  statement: Journal-derived tool ledger state agrees with the live tool ledger for completed, incomplete,
    pending-approval, and rejected-tool turns, excluding separately recorded settlement metadata.
  seamIds:
  - observability-assistant-journal
  - observability-conversation-log
  riskIds:
  - observability-journal-loss
  - observability-replay-corruption
- id: observability-log-replay
  statement: Conversation log writes keep streaming deltas in a recoverable sidecar policy, preserve sequence
    continuity across resume and rotation, and replay persisted tool output without losing retrieval references.
  seamIds:
  - observability-conversation-log
  riskIds:
  - observability-log-corruption
  - observability-journal-loss
- id: observability-log-durability
  statement: Critical conversation events trigger the durability callback, while failures latch, preserve
    the original error, release locks and descriptors, and prevent an unsafe new session from starting.
  seamIds:
  - observability-conversation-log
  riskIds:
  - observability-log-corruption
- id: observability-log-lifecycle
  statement: Stale dead-process locks are reclaimed, live locks conflict, post-close writes are inert,
    close is idempotent, and session clearing settles delta sidecars.
  seamIds:
  - observability-conversation-log
  riskIds:
  - observability-log-corruption
- id: observability-conversation-routing
  statement: Conversation event dispatch routes operational and background events to the sink, accumulates
    assistant turn items, checkpoints them before errors, and forwards text/reasoning deltas to the required
    journal.
  seamIds:
  - observability-conversation-dispatch
  - observability-assistant-journal
  riskIds:
  - observability-journal-loss
  - observability-replay-corruption
- id: observability-log-schema
  statement: Runtime log records contain schema-valid canonical fields, omit sentinel or null context,
    infer categories, and produce complete invalid-tool-call diagnostics.
  seamIds:
  - observability-runtime-log
  riskIds:
  - observability-log-contract-drift
- id: observability-log-policy
  statement: Warning and error records survive category filtering and sampling, verbose payload policy
    is applied by level, and event categories are derived consistently from event prefixes.
  seamIds:
  - observability-runtime-log
  riskIds:
  - observability-log-contract-drift
  - observability-log-redaction
- id: observability-traffic-sanitization
  statement: Provider traffic sanitization truncates instruction-like content and summarizes tool definitions
    while preserving user, tool, and readable content and replacing encrypted payloads with a visible
    marker.
  seamIds:
  - observability-provider-traffic
  riskIds:
  - observability-log-redaction
  - observability-traffic-fidelity
- id: observability-traffic-summary
  statement: Received SSE and JSON traffic is recognized without a content-type when possible, merged
    into provider-shaped summaries, preserves malformed/error/unknown frame evidence, and avoids duplicating
    completed text.
  seamIds:
  - observability-provider-traffic
  riskIds:
  - observability-traffic-fidelity
- id: observability-traffic-artifact
  statement: Provider request artifacts are stored under stable per-day and per-session paths with indexed
