decisions:
- id: runtime-application-run-loop-primary
  testId: runtime-application-run-loop
  role: primary
  reviewer: test-audit-coordinator
  sourceArtifact: docs/test-audit/calibration-report.md
  recommendation: keep
  confidence: high
  reason: 'Unanimous across both calibration reviewers and the coordinator: canonical Run Loop seam (compaction/rollover,
    generation guard, terminal events, turn budget, in-loop retry); no sibling in the sample or its family
    carries the same evidence.'
  evidence:
  - Both second opinions are keep/high with verified observable-outcome evidence.
  - Retention removes no evidence and the area is high-scrutiny per plan guardrails.
  replacementTestIds: &id001 []
  status: reviewed
- id: runtime-application-run-loop-second-neutral
  testId: runtime-application-run-loop
  role: second_opinion
  reviewer: calibration-neutral
  sourceArtifact: docs/test-audit/calibration-neutral.yaml
  recommendation: keep
  confidence: high
  reason: The file protects the run-loop's highest-risk public contracts across normal turns, approvals,
    retries, provider continuity, and containment; removing it could allow duplicated history or unsafe
    replay to ship.
  evidence:
  - source/services/agent-runtime/application-run-loop.test.ts asserts provider-opaque normalization,
    response-aware rollover, and compaction failure preservation through startStream() history and events.
  - The same file asserts visible text/reasoning beyond prior repetition thresholds, deadline and idle
    abort codes, and output/tool-argument caps before excess output is forwarded.
  - The tests assert assistant text precedes tool calls, approval continuations feed results to the next
    model request, steers are admitted/retracted/edited, and retry rollback avoids duplicated deltas.
  replacementTestIds: []
  status: proposed
- id: runtime-application-run-loop-second-adversarial
  testId: runtime-application-run-loop
  role: second_opinion
  reviewer: calibration-adversarial
  sourceArtifact: docs/test-audit/calibration-adversarial.yaml
  recommendation: keep
  confidence: high
  reason: The file is broad but its cases exercise the ApplicationRunLoop public streamed-turn contract
    across opaque input, compaction, event settlement, guards, tools, steering, usage, and retry; no assigned
    sibling carries these same run-loop observables more strongly or cheaply.
  evidence:
  - normalizeApplicationInput cases at source/services/agent-runtime/application-run-loop.test.ts:30-60
    assert provider_opaque conversion, marker removal, and rejection of an unmarked unsupported item.
  - Source production boundary is ApplicationRunLoop.startStream in source/services/agent-runtime/application-run-loop.ts;
    tests observe stream.history, completed, events, and tool results rather than private implementation
    fields.
  - The guard cases at source/services/agent-runtime/application-run-loop.test.ts:501-1035 distinguish
    legitimate repeated output, text/reasoning caps, total deadlines, and idle deadlines, so collapsing
    them would allow a regression in one guard class to escape.
  - If this evidence disappeared, a model could be retried after a crossed stream boundary, a tool loop
    could run past its turn budget, or cumulative usage and tool history could be committed twice without
    this boundary suite detecting it.
  - 'I ruled out consolidation, deletion, and rewrite: the assigned sample has no second ApplicationRunLoop
    test file, and the assertions cover independently changeable recovery, approval, steering, usage,
    and guard outcomes.'
  replacementTestIds: []
  status: proposed
