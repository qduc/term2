    preserves every added and deleted line; ambiguous, contextless, enveloped, failed, or NO_MATCH output
    is rejected.
  seamIds:
  - tools-patch-healing
  riskIds:
  - tools-risk-healing-corruption
  - tools-risk-file-mutation
- id: tools-contract-read-file
  statement: read_file returns accurate full or ranged text, handles missing and empty files, bounds and
    spools oversized output, refuses binary data, returns supported images multimodally, preserves UTF-8,
    and enforces read path policy.
  seamIds:
  - tools-file-read
  - tools-path-policy
  - tools-command-formatting
  - tools-schema
  riskIds:
  - tools-risk-file-read-boundary
  - tools-risk-path-escape
  - tools-risk-display-drift
- id: tools-contract-search-replace
  statement: search_replace performs exact, relaxed, normalized, anchor, gap, EOL, escaped-content, batched,
    and parallel edits with ambiguity and placeholder guards, atomic batch failure, optional healing,
    and path approval.
  seamIds:
  - tools-file-write
  - tools-patch-healing
  - tools-path-policy
  - tools-command-formatting
  riskIds:
  - tools-risk-file-mutation
  - tools-risk-healing-corruption
  - tools-risk-path-escape
- id: tools-contract-upstream-parser
  statement: The upstream patch parser converts supported add, update, delete, move, and environment-wrapped
    syntax into local operations, accepts its documented heredoc wrapper, rejects empty or incomplete
    patches, and exports matching grammar.
  seamIds:
  - tools-upstream-parser
  riskIds:
  - tools-risk-parser-drift
- id: tools-contract-format-helpers
  statement: Patch result normalization prefers nonempty errors over messages and legacy paths, safely
    ignores unrecognized values, and joins useful item text in original order.
  seamIds:
  - tools-format-helpers
  riskIds:
  - tools-risk-result-normalization
- id: tools-contract-memory-tools
  statement: Memory tools expose scoped list/get/search/retrieve/synthesize and mutation operations with
    correct scope rules, ranking and deduplication, bounded surrogate-safe output, cursor paging and staleness
    errors, and approval for destructive mutations.
  seamIds:
  - tools-memory
  - tools-schema
  riskIds:
  - tools-risk-memory-integrity
  - tools-risk-schema-drift
- id: tools-contract-workflow
  statement: run_agent_workflow evaluates only JSON-safe child-agent code with inherited capabilities
    and bounded concurrency/run limits, returning admission-ordered success or typed failure summaries.
  seamIds:
  - tools-workflow
  riskIds:
  - tools-risk-workflow-escape
- id: tools-contract-session-browser
  statement: Session browser tools expose read-only strictly bounded list/search/read operations with
    documented totals, omissions, live-session ordering, identifier validation, and progressive end reads.
  seamIds:
  - tools-session-browser
  - tools-schema
  riskIds:
  - tools-risk-session-history
  - tools-risk-schema-drift
- id: tools-contract-session-rollover
  statement: session_rollover accepts only a bounded strict brief and supported reason, forwards it without
    approval, reports live-background blockers, and marks a successful request as terminating the current
    turn.
  seamIds:
  - tools-session-rollover
  - tools-command-formatting
  riskIds:
  - tools-risk-rollover-loss
- id: tools-contract-shell-grep-formatters
  statement: Shell and grep formatters emit the correct tool name, command arguments, structured output
    interpretation, and success state for foreground and background acknowledgements.
  seamIds:
  - tools-shell
  - tools-command-formatting
  riskIds:
  - tools-risk-display-drift
  - tools-risk-shell-registration
- id: tools-contract-docker-host-control
  statement: With an explicit opt-in Docker prerequisite, the shell tool blocks direct and wrapped host-control
    commands until a session-scoped grant is issued, then succeeds without the denied-socket failure and
    re-prompts after an indirect blocked attempt.
  seamIds:
  - tools-shell
  riskIds:
  - tools-risk-shell-registration
  - tools-risk-file-mutation
- id: tools-contract-worktree
  statement: Worktree tools re-root and restore execution context only for an unambiguous runtime-issued
    worktree, refuse unknown, ambiguous, or busy transitions without changing root, and require no approval.
  seamIds:
  - tools-worktree
  riskIds:
  - tools-risk-worktree-misroot
- id: tools-contract-tool-names
  statement: Public constants for core tool names remain equal to the names used by their tool definitions
    and routing contracts.
  seamIds:
  - tools-schema
  riskIds:
  - tools-risk-name-drift
- id: tools-contract-tool-parameter-schema
  statement: Provider-facing tool schemas use omitted optional fields rather than null, reject malformed
    structures, apply defaults, and derive executor and approval parameter types from the same schema.
  seamIds:
  - tools-schema
  riskIds:
  - tools-risk-schema-drift
- id: tools-contract-utils
  statement: Shared path utilities expand home paths, allow only explicitly permitted temporary or discovered-skill
    locations, and identify protected user or project hook paths without broadening outside-workspace
    access.
  seamIds:
  - tools-path-policy
  riskIds:
  - tools-risk-path-escape
  - tools-risk-file-mutation
- id: tools-contract-web-fetch
  statement: web_fetch performs read-only URL fetching and Markdown conversion, maps GitHub blobs to raw
    URLs, handles errors, uses continuation tokens, and spools only oversized initial content while maintaining
    output bounds.
  seamIds:
  - tools-web-fetch
  - tools-command-formatting
  - tools-schema
  riskIds:
  - tools-risk-web-output
  - tools-risk-schema-drift
- id: tools-contract-web-search
  statement: web_search is a read-only configured-provider lookup that returns actionable configuration
    errors and formats answer boxes, numbered results, empty results, and command success or fallback
    arguments correctly.
  seamIds:
  - tools-web-search
  - tools-command-formatting
  riskIds:
  - tools-risk-web-output
  - tools-risk-display-drift
- id: subagents-handoff-flow
  statement: A captured handoff advances through message, model, and effort stages, applies selected runtime
    policy, sends the composed message, and clears state after completion.
  seamIds:
  - subagents-handoff-session
  riskIds:
  - subagents-state-loss
  - subagents-policy-drift
- id: subagents-queue-admission
  statement: Queued submissions dispatch FIFO with one active execution, immutable dispatch snapshots,
    steer priority, duplicate identity rejection, and completion-barrier serialization.
  seamIds:
  - subagents-queue-controller
  riskIds:
  - subagents-state-loss
  - subagents-result-misreport
- id: subagents-queue-cancel-pause
  statement: Manual cancellation and matching failure await cleanup, suppress stale terminal events, retain
    queued work when present, and return empty queues to idle.
  seamIds:
  - subagents-queue-controller
  riskIds:
  - subagents-state-loss
  - subagents-result-misreport
- id: subagents-queue-interactions
  statement: Preflight, tool approval, and ask-user actions enter the matching awaiting state and accept
    only matching answers while rejecting stale or cross-kind resolutions.
  seamIds:
  - subagents-queue-controller
  riskIds:
  - subagents-approval-confusion
- id: subagents-queue-recovery
  statement: Persisted queue mutations and awaiting states survive reload, interrupted active work is
    recovered conservatively, stale action identities are replaced or rejected, and invalid records are
    quarantined.
  seamIds:
  - subagents-queue-controller
  riskIds:
  - subagents-persistence-corruption
  - subagents-approval-confusion
- id: subagents-run-id-contract
  statement: Generated run identities have the adjective-noun-number shape, remain short and parseable,
    provide a large identity space, and reject non-codename identifiers.
  seamIds:
  - subagents-run-id
  riskIds:
  - subagents-run-id-collision
- id: subagents-execution-observations
  statement: Execution streams emit bounded text turns and tool progress at the correct boundaries, discard
    partial text on retry or error, and never forward tool argument content.
  seamIds:
  - subagents-execution-runner
  riskIds:
  - subagents-event-loss
  - subagents-tool-evidence-loss
- id: subagents-execution-settlement
  statement: Execution results preserve complete final text in an artifact when display is truncated,
    classify budget stops as interrupted with partial work, dispose transient clients, and forward usage
    under the owning run id.
  seamIds:
  - subagents-execution-runner
  riskIds:
  - subagents-result-misreport
  - subagents-event-loss
  - subagents-tool-evidence-loss
- id: subagents-foreground-capability
  statement: A foreground lease forwards abort before adoption, detaches parent abort after adoption,
    admits one generation-and-identity-checked continuation, and unblocks safely on cancel or settlement.
  seamIds:
  - subagents-foreground-lease
  riskIds:
  - subagents-approval-confusion
  - subagents-authority-escape
- id: subagents-mentor-settlement
  statement: Direct mentor runs return truthful completed or cancelled results with final text and usage,
    enforce tool-free wrap-up, and restore the prior session after an injected session run.
  seamIds:
  - subagents-mentor-runner
  riskIds:
  - subagents-result-misreport
  - subagents-provider-failure
- id: subagents-mentor-independence
  statement: Configured mentor samples use independent sessions, successful opinions survive partial failure,
    all pooled models are consulted and labelled, and a pool overrides the sample count.
  seamIds:
  - subagents-mentor-runner
  riskIds:
  - subagents-state-loss
  - subagents-provider-failure
- id: subagents-nested-transfer
  statement: Nested tools preserve stable call identity, parent approval, foreground adoption, continuation
    ownership, and exactly one durable terminal event across approval, failure, cancellation, and transfer.
  seamIds:
  - subagents-nested-runner
  riskIds:
  - subagents-approval-confusion
  - subagents-event-loss
  - subagents-result-misreport
- id: subagents-nested-budget
  statement: Nested execution projects role limits and provider chaining, contains looping or failed work
    with truthful partial evidence, and performs a tool-free budget settlement without dispatching proposed
    tools.
  seamIds:
  - subagents-nested-runner
  riskIds:
  - subagents-runaway-work
  - subagents-result-misreport
  - subagents-tool-evidence-loss
- id: subagents-role-definition
  statement: Role resolution assigns tool-using roles a bounded default budget, keeps mentor single-turn,
    expresses explorer evidence-only ownership, and resolves legacy and tier reasoning settings correctly.
  seamIds:
  - subagents-role-loader
  riskIds:
  - subagents-policy-drift
  - subagents-runaway-work
- id: subagents-async-lifecycle
  statement: Each asynchronous run has an owned session and identity, emits one matching terminal lifecycle
    event, retains terminal results until reset or eviction, and makes cancellation settle only after
    runner evidence.
  seamIds:
  - subagents-async-registry
  riskIds:
  - subagents-event-loss
  - subagents-result-misreport
  - subagents-state-loss
- id: subagents-async-observation
  statement: Run status synchronously reports bounded activity, usage, tools, text turns, elapsed time,
    approval and provider waits, ignores foreign events, and returns not-found rather than throwing.
  seamIds:
  - subagents-async-registry
  riskIds:
  - subagents-event-loss
  - subagents-runaway-work
- id: subagents-async-steering
  statement: Asynchronous steering resolves canonical run ids before names, answers only the matching
    question, bounds and coalesces guidance, defers interruption until tools finish, and prevents cancellation
    races or unsupported targets.
  seamIds:
  - subagents-async-registry
  riskIds:
  - subagents-approval-confusion
  - subagents-mailbox-overflow
  - subagents-state-loss
- id: subagents-async-continuity
  statement: A completed continuation reuses the permitted run id, session, provider history key, and
    role policy, while concurrent or invalid continuations are rejected and nested launches receive distinct
    scoped keys.
  seamIds:
  - subagents-async-registry
  riskIds:
  - subagents-state-loss
  - subagents-authority-escape
  - subagents-run-id-collision
- id: subagents-runtime-wiring
  statement: SubagentManager exposes an AgentRuntime backed by its shared subagent infrastructure, creates
    usable handles, preserves the public handle shape, and returns fresh runtime wrappers over shared
    executors.
  seamIds:
  - subagents-manager-runtime
  riskIds:
  - subagents-authority-escape
  - subagents-state-loss
- id: subagents-prompt-composition
  statement: Execution subagents receive model-family and role instructions in the required order without
    top-level-only prompt content, while mentor runs retain their separate mentor prompt contract.
  seamIds:
  - subagents-manager-prompts
  riskIds:
  - subagents-policy-drift
  - subagents-authority-escape
- id: subagents-retry-policy
  statement: Recoverable hallucinated-tool and transport failures retry within policy and emit retry evidence,
    while non-recoverable model errors and aborts do not retry and partial tool evidence survives cancellation.
  seamIds:
  - subagents-manager-retry
  riskIds:
  - subagents-provider-failure
  - subagents-result-misreport
  - subagents-tool-evidence-loss
- id: subagents-tool-registration
  statement: Manager tool registration follows model search mode, role capabilities, remote context, and
    available skills, exposing matching tools and guidance while omitting unavailable tools.
  seamIds:
  - subagents-manager-tools
  riskIds:
  - subagents-policy-drift
  - subagents-authority-escape
- id: subagents-notification-projection
  statement: Async lifecycle, usage, tool, shell, watch, and check-in events produce the correct visible
    task projection while foreground and non-projecting events remain absent.
  seamIds:
  - subagents-notification-store
  riskIds:
  - subagents-event-loss
  - subagents-notification-retention
- id: subagents-notification-delivery
  statement: Notifications preserve message order, deduplicate exact identities, retain undelivered items
    ahead of newer items, expose bounded previews, and re-notify only after a genuine continuation.
  seamIds:
  - subagents-notification-store
  riskIds:
  - subagents-event-loss
  - subagents-notification-retention
- id: subagents-run-control
  statement: One segment controller admits interruption only after active tools complete, bounds and preserves
    steering, owns one trimmed question waiter, and rejects or settles stale answers during cancellation.
  seamIds:
  - subagents-run-control
  riskIds:
  - subagents-mailbox-overflow
  - subagents-approval-confusion
  - subagents-runaway-work
- id: subagents-session-continuity
  statement: A subagent session initializes and resets provider and agent state, caches agents and streamed
    models, tracks response identifiers, and chooses string or history input according to chaining capability.
  seamIds:
  - subagents-session
  riskIds:
  - subagents-state-loss
  - subagents-provider-failure
- id: subagents-tool-authority
  statement: Tool construction grants only requested and role-compatible editors, memory, search, shell,
    and web tools, attenuates configured filesystem and network scopes, and preserves role-specific guidance.
  seamIds:
  - subagents-tool-policy
  riskIds:
  - subagents-authority-escape
  - subagents-policy-drift
- id: subagents-tool-execution-policy
  statement: Wrapped tools report completion on throws, preserve bounded serialized output, apply shell
    and editor approval modes, reject explicit unsandboxed nested execution, and enforce write boundaries.
  seamIds:
  - subagents-tool-policy
  riskIds:
  - subagents-authority-escape
  - subagents-approval-confusion
- id: subagents-tool-evidence
  statement: Validation capture recognizes validation commands without overwriting prior evidence, bounds
    excerpts, and write wrapping records changed paths and line deltas while documenting known shell-edit
    omissions.
  seamIds:
  - subagents-tool-policy
  riskIds:
  - subagents-tool-evidence-loss
  - subagents-policy-drift
- id: subagents-worktree-pinning
  statement: Only local worker roles can pin to an existing named worktree, the returned execution context
    uses that path, unknown names fail clearly, and active workspace root publication is untouched.
  seamIds:
  - subagents-worker-worktree
  riskIds:
  - subagents-worktree-escape
  - subagents-authority-escape
- id: subagents-provenance
  statement: A non-interactive YELLOW approval without interactive-equivalent provenance is blocked rather
    than executing the shell command.
  seamIds:
  - subagents-provenance-gate
  riskIds:
  - subagents-provenance-bypass
  - subagents-authority-escape
- id: subagents-result-format
  statement: Formatted worker results include successful status, final text, and the selected worktree,
    while budget errors are recognized, parsed, and converted into a partial-results stop message.
  seamIds:
  - subagents-execution-runner
  riskIds:
  - subagents-result-misreport
  - subagents-tool-evidence-loss
