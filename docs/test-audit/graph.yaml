schemaVersion: 2
domains:
- id: runtime
  label: Application run-loop behavior
- id: providers
  label: Codex Responses provider adapter
- id: ui-components
  label: Ink UI components
- id: shell
  label: Shell execution and safety
- id: session
  label: Conversation session lifecycle
- id: subagents
  label: Subagent execution and policy
- id: prompts-commands
  label: Prompt construction and slash-command behavior
- id: observability
  label: Cost, logging, traffic evidence, and retry recovery
- id: settings-config
  label: Settings, environment, input context, and shared model contracts
- id: approval
  label: Approval decisions, safety policy, and delegated-call ownership
- id: tools
  label: Tool definitions, adapters, and tool-local helpers
suites:
- id: unit
  label: Deterministic unit and seam tests
- id: provider-adapter
  label: Provider adapter contract tests
- id: ui-rendering
  label: Ink rendering tests
- id: integration
  label: Opt-in Docker host-control integration suite
seams:
- id: application-run-loop
  label: Boundary between streamed model turns, tools, history, and application events
- id: codex-responses-adapter
  label: Boundary translating Codex HTTP/WebSocket frames into provider-neutral turns
- id: command-message-renderer
  label: Boundary translating tool outcomes into visible terminal activity
- id: shell-tool
  label: Boundary where shell requests become sandboxed or unsandboxed execution
- id: conversation-session
  label: Public session facade coordinating turns, approvals, history, and continuity
- id: subagent-manager
  label: Boundary creating delegated runs and applying role-specific tool policy
- id: command-classifier
  label: Boundary classifying command and path input as GREEN, YELLOW, or RED
- id: prompts-commands-command-factory
  label: Boundary where a slash-command factory turns injected callbacks into a command contract
- id: prompts-commands-settings-command
  label: Boundary where slash commands persist settings, apply runtime values, and announce state
- id: prompts-commands-conversation-command
  label: Boundary where slash commands request compaction, resume, or retry work
- id: prompts-commands-rewind-command
  label: Boundary where rewind command text resolves a visible turn and chooses edit or resend behavior
- id: prompts-commands-skill-command
  label: Boundary where a named skill is selected for the next request
- id: prompts-commands-slash-resolver
  label: Boundary where typed command names resolve by exact or unique-prefix matching
- id: prompts-commands-profile-selection
  label: Boundary where a model and profile select prompt base content
- id: prompts-commands-prompt-constructor
  label: Boundary where profile, mode, and feature settings become a prompt specification
- id: prompts-commands-prompt-addendum
  label: Boundary where runtime capability checks produce model-facing prompt guidance
- id: prompts-commands-prompt-files
  label: Boundary where checked-in role and mode prompt files define agent behavior
- id: observability-cost-accounting
  label: Boundary converting provider usage and pricing evidence into session cost records
- id: observability-pricing-resolution
  label: Boundary resolving provider/model/tier identifiers to catalog or overlay prices
- id: observability-assistant-journal
  label: Boundary capturing streamed assistant output and provider-backed items before turn settlement
- id: observability-conversation-log
  label: Boundary persisting conversation events, replay records, sidecars, and durability state
- id: observability-conversation-dispatch
  label: Boundary routing runtime events into turn accumulation, journal capture, and conversation persistence
- id: observability-runtime-log
  label: Boundary normalizing runtime metadata and applying logging category, payload, and sampling policy
- id: observability-provider-traffic
  label: Boundary sanitizing, summarizing, and storing provider request/response traffic
- id: observability-retry-classification
  label: Boundary translating provider and model failures into retry, fallback, or terminal classifications
- id: observability-recovery-policy
  label: Boundary translating classified failures into state-safe recovery instructions
- id: observability-recovery-execution
  label: Boundary applying recovery instructions to history, continuity, tools, and subsequent run state
- id: observability-retry-budget
  label: Boundary containing physical attempts, automatic replays, and elapsed recovery time
- id: observability-retry-presentation
  label: Boundary translating retry classifications into user events and structured log fields
- id: settings-config-input-context
  label: React input provider boundary exposing editor state and actions to Ink consumers
- id: settings-config-streamed-turn
  label: Type boundary defining the application-owned streamed model turn interface
- id: settings-config-env-bootstrap
  label: Process bootstrap boundary that establishes environment defaults before imports
- id: settings-config-settings-schema
  label: Zod settings schema and derived key/default/modifiability catalog
- id: settings-config-schema-introspection
  label: Boundary resolving a dotted setting key to its underlying Zod schema
- id: settings-config-env-overrides
  label: Boundary translating process environment variables into settings overrides
- id: settings-config-settings-merge
  label: Boundary merging defaults, file, environment, and CLI settings with source provenance
- id: settings-config-settings-path
  label: Platform-specific boundary resolving the durable settings directory
- id: settings-config-settings-load
  label: Boundary loading, validating, partially accepting, and recovering settings files
- id: settings-config-settings-save
  label: Boundary validating and atomically committing settings while excluding secrets
- id: settings-config-settings-lock
  label: Lock ownership boundary coordinating concurrent settings writers
- id: settings-config-settings-service
  label: Public SettingsService facade coordinating settings state, mutation, and persistence
- id: settings-config-provider-settings
  label: Boundary normalizing and registering provider records from settings
- id: settings-config-profile-settings
  label: Boundary projecting legacy mode settings onto canonical profile selection
- id: settings-config-sandbox-settings
  label: Boundary enforcing sandbox and always-auto-approval exclusivity
- id: settings-config-retired-model
  label: Repository boundary preventing production consumers from using the retired model contract
- id: approval-decision-execution
  label: Boundary applying an approval answer to a retained continuation and scoped access state
- id: approval-decision-policy
  label: Boundary deciding whether a tool interruption is approved, prompted, or rejected
- id: approval-flow-coordination
  label: Boundary coordinating pending approval lifecycle, continuation, abort, and owner routing
- id: approval-presentation
  label: Boundary mapping pending and approved tool calls to visible command messages
- id: approval-replay-ledger
  label: Boundary replaying persisted approval records into the runtime approval ledger
- id: approval-state-store
  label: Boundary storing pending and aborted approval contexts
- id: approval-background-queue
  label: Boundary exposing background approval pauses as an ordered revisioned queue
- id: approval-batch-coordination
  label: Boundary resolving multiple tool interruptions while preserving per-call decisions
- id: approval-noninteractive-policy
  label: Boundary applying fail-closed approval policy without an interactive user
- id: approval-auto-evaluation
  label: Boundary asking an evaluator model for structured shell/file approval advisories
- id: approval-auto-resolution
  label: Boundary resolving cached advisories and settings into auto-approval outcomes
- id: approval-shell-safety
  label: Boundary identifying unsandboxed shell and Docker host-control approval requirements
- id: approval-ownership
  label: Boundary attributing tool call ids to parent or delegated owners
- id: tools-agent-bridge
  label: Tool boundary that turns agent-facing questions or delegated work into a callback or subagent
    result.
- id: tools-user-interaction
  label: Tool boundary that carries a model ask_user request through approval and call-id keyed user answers.
- id: tools-checkin-scheduler
  label: Tool boundary that validates and forwards proactive background-task check-in configuration.
- id: tools-subagent-registry
  label: Tool boundary between subagent lifecycle tools and the async subagent registry and runner.
- id: tools-command-formatting
  label: Boundary that converts tool arguments and outputs into terminal command messages.
- id: tools-file-write
  label: Tool boundary that resolves paths and applies or creates filesystem mutations.
- id: tools-file-read
  label: Tool boundary that resolves paths and returns bounded, text or multimodal file content.
- id: tools-file-search
  label: Tool boundary that runs bounded glob and grep searches with workspace-aware policy.
- id: tools-code-index
  label: Tool boundary that summarizes source structure and discovers related files or symbols.
- id: tools-patch-healing
  label: Guarded model-assisted boundary that repairs stale edit context without changing requested edits.
- id: tools-memory
  label: Tool boundary that exposes scoped memory retrieval and mutation with bounded serialized output.
- id: tools-workflow
  label: Tool boundary that evaluates disposable JavaScript child-agent workflows under admission limits.
- id: tools-session-browser
  label: Read-only tool boundary over persisted session listing, search, and progressive reads.
- id: tools-session-rollover
  label: Tool boundary that requests idle session rotation and reports blockers.
- id: tools-shell
  label: Shell tool construction and command-message boundary, including sandbox and host-control policy.
- id: tools-worktree
  label: Tool boundary that changes the execution context root among runtime-issued worktrees.
- id: tools-schema
  label: Tool parameter-schema boundary between provider arguments and typed tool executors.
- id: tools-path-policy
  label: Shared path-resolution boundary enforcing workspace, temporary, skill, and hook rules.
- id: tools-web-fetch
  label: Tool boundary that fetches a URL, converts content to Markdown, and bounds or spools output.
- id: tools-web-search
  label: Tool boundary that selects a configured search provider and formats its response.
- id: tools-upstream-parser
  label: Compatibility parser boundary from upstream apply-patch text and grammar to local operations.
- id: tools-format-helpers
  label: Shared result-normalization boundary from heterogeneous tool output items to display text.
- id: tools-tool-registry
  label: Process-local registry boundary that indexes explicitly registered tool formatters.
- id: subagents-handoff-session
  label: Boundary coordinating captured handoff state, model selection, and dispatch effects
- id: subagents-queue-controller
  label: Boundary admitting, dispatching, pausing, recovering, and persisting queued turns
- id: subagents-run-id
  label: Boundary allocating and parsing human-readable delegated-run identities
- id: subagents-execution-runner
  label: Boundary converting an execution subagent stream into bounded events and a terminal result
- id: subagents-foreground-lease
  label: Boundary transferring a paused foreground subagent continuation to background ownership
- id: subagents-mentor-runner
  label: Boundary running persistent, sampled, and pooled mentor consultations
- id: subagents-nested-runner
  label: Boundary executing nested role tools, approvals, transfers, and budget settlement
- id: subagents-role-loader
  label: Boundary resolving role definitions, prompts, budgets, and reasoning settings
- id: subagents-async-registry
  label: Boundary owning asynchronous run identity, lifecycle, status, steering, and retention
- id: subagents-manager-runtime
  label: Boundary exposing the shared application-owned agent runtime from SubagentManager
- id: subagents-manager-prompts
  label: Boundary selecting subagent prompt families and excluding top-level prompt policy
- id: subagents-manager-retry
  label: Boundary classifying and retrying recoverable subagent model and transport failures
- id: subagents-manager-tools
  label: Boundary registering role tools and guidance from model, search, remote, and skill settings
- id: subagents-notification-store
  label: Boundary projecting subagent and related background events into ordered notifications and task
    cards
- id: subagents-run-control
  label: Boundary controlling one subagent segment, deferred interruption, mailbox, and question waiter
- id: subagents-session
  label: Boundary retaining provider, agent, history, and continuation state for one subagent
- id: subagents-tool-policy
  label: Boundary attenuating subagent tool authority and wrapping execution, approval, and evidence policy
- id: subagents-worker-worktree
  label: Boundary pinning worker execution to a selected local worktree
- id: subagents-provenance-gate
  label: Boundary requiring interactive-equivalent provenance before non-interactive risky approval executes
risks:
- id: runtime-replay-corruption
  label: A streamed turn is duplicated, persisted in the wrong order, or resumed with unsafe state.
  severity: critical
- id: runtime-runaway-or-stall
  label: A provider or tool runs without containment, or legitimate output is aborted as runaway work.
  severity: high
- id: provider-wire-corruption
  label: Provider output or continuation input is malformed, incomplete, or associated with the wrong
    response.
  severity: critical
- id: provider-unsafe-replay
  label: A request with unknown outcome is replayed, duplicating a tool action or user turn.
  severity: critical
- id: ui-misleading-status
  label: The terminal shows the wrong action, status, result, or approval outcome.
  severity: high
- id: shell-safety-bypass
  label: A command bypasses sandbox, approval, workspace, or output containment policy.
  severity: critical
- id: session-state-loss
  label: A resume, abort, undo, provider switch, or failed turn loses or replays conversation state.
  severity: critical
- id: session-approval-confusion
  label: Approval state leaks between sessions or a decision is applied to the wrong call.
  severity: critical
- id: subagent-authority-escape
  label: A delegated role gains tools, filesystem, network, or shell authority outside its contract.
  severity: critical
- id: classifier-misclassification
  label: Safe work prompts unnecessarily or dangerous work is treated as safe.
  severity: high
- id: prompts-commands-command-routing
  label: A user command invokes the wrong action, clears input unexpectedly, or reports the wrong command
    state.
  severity: high
- id: prompts-commands-setting-drift
  label: A setting command persists a value without applying it at runtime, or announces a state that
    is not active.
  severity: high
- id: prompts-commands-conversation-state-loss
  label: Manual resume, compaction, or retry loses work, hides failure, or starts work without the expected
    user-visible state.
  severity: critical
- id: prompts-commands-rewind-misaddress
  label: Rewind targets the wrong visible turn or silently performs a different disposition than the user
    requested.
  severity: critical
- id: prompts-commands-prompt-contract-drift
  label: A model receives the wrong base prompt, mode workflow, or feature guidance after a prompt-construction
    change.
  severity: high
- id: prompts-commands-authority-drift
  label: Prompt guidance grants a role authority, delegation responsibility, or execution capability outside
    its intended contract.
  severity: critical
- id: prompts-commands-environment-fallback
  label: Prompt guidance assumes unavailable search binaries or fails to warn about unsafe shell invocation
    patterns.
  severity: medium
- id: prompts-commands-guidance-regression
  label: Reasoning or delegation guidance disappears or encourages wasteful, looping, or unowned work.
  severity: high
- id: observability-cost-overcharge
  label: Usage or provider charges are double-counted, billed in the wrong dimension, or silently reported
    as zero.
  severity: high
- id: observability-cost-unpriced
  label: Unknown or incomplete pricing evidence is presented as an exact cost instead of an explicit coverage
    state.
  severity: medium
- id: observability-journal-loss
  label: Streamed assistant items are lost, duplicated, misordered, or attributed to the wrong turn during
    recovery.
  severity: critical
- id: observability-log-corruption
  label: Conversation persistence cannot resume safely after malformed tails, rotation, lock contention,
    or write failure.
  severity: critical
- id: observability-log-redaction
  label: Opaque provider payloads or sensitive instruction data leak into an inappropriate application
    log.
  severity: critical
- id: observability-log-contract-drift
  label: Runtime logs omit canonical context or filtering and sampling suppress required diagnostic events.
  severity: high
- id: observability-traffic-fidelity
  label: Provider traffic artifacts lose meaningful frames, shape, timing, or failure evidence needed
    for diagnosis.
  severity: high
- id: observability-retry-misclassification
  label: A retryable failure is abandoned or an unsafe/intentional failure is replayed.
  severity: critical
- id: observability-replay-corruption
  label: Recovery replays a user turn or tool effect incorrectly, loses history, or carries unpaid provider
    state forward.
  severity: critical
- id: observability-retry-runaway
  label: Retry attempts or recovery time exceed their containment envelope, or a recovery is bounced between
    layers.
  severity: high
- id: observability-retry-status-confusion
  label: Retry status shown to the user or recorded in logs names the wrong cause, attempt, or retry type.
  severity: medium
- id: settings-config-input-state-loss
  label: Input consumers observe stale, missing, or non-shared editor state after updates or remounts.
  severity: high
- id: settings-config-input-action-instability
  label: Input action identities churn and cause avoidable consumer effects or missed updates.
  severity: medium
- id: settings-config-contract-drift
  label: Provider adapters and runtime consumers disagree about the streamed-turn API or media shape.
  severity: critical
- id: settings-config-bootstrap-drift
  label: Startup tracing, logging, or environment defaults are changed before dependent modules load.
  severity: high
- id: settings-config-invalid-settings-accepted
  label: Invalid settings enter runtime state or valid settings are lost when schemas evolve.
  severity: high
- id: settings-config-setting-discovery-failure
  label: A valid setting cannot be discovered or edited because its schema/key metadata is incomplete.
  severity: high
- id: settings-config-wrong-override-precedence
  label: A lower-priority settings source unexpectedly overrides a higher-priority source.
  severity: high
- id: settings-config-wrong-settings-location
  label: Settings are written to the wrong platform directory or ignore the platform override.
  severity: medium
- id: settings-config-corrupt-settings-loss
  label: A corrupt settings file destroys recoverable values or silently overwrites original bytes.
  severity: critical
- id: settings-config-unsafe-settings-write
  label: A settings write leaks secrets, leaves partial JSON, or leaves temporary artifacts behind.
  severity: critical
- id: settings-config-concurrent-settings-clobber
  label: Concurrent settings writers overwrite each other or an old owner releases a newer lock.
  severity: high
- id: settings-config-service-state-drift
  label: SettingsService state, source metadata, disk state, and public mutation outcomes disagree.
  severity: high
- id: settings-config-provider-selection-drift
  label: A configured custom provider cannot be registered, selected, or migrated consistently.
  severity: high
- id: settings-config-profile-mode-drift
  label: Legacy mode flags and canonical profile identity become inconsistent across writes or reloads.
  severity: high
- id: settings-config-sandbox-approval-bypass
  label: Always auto-approval coexists with an enabled sandbox or is resurrected by stale persistence.
  severity: critical
- id: settings-config-retired-model-revival
  label: Production code revives identifiers or imports from the retired model contract.
  severity: critical
- id: approval-unauthorized-execution
  label: A denied or unsafe tool call executes because approval policy or settlement grants access incorrectly.
  severity: critical
- id: approval-wrong-continuation
  label: An approval answer resumes, rejects, or annotates a different tool call than the one requested.
  severity: critical
- id: approval-stale-state
  label: Aborted, consumed, or cross-session approval state remains usable and affects a later call.
  severity: critical
- id: approval-scope-escape
  label: A one-shot, session, project, or delegated approval grants more access than intended.
  severity: critical
- id: approval-misleading-presentation
  label: The terminal hides or labels the wrong pending or approved tool call.
  severity: high
- id: approval-replay-grant
  label: Persisted approval records are keyed or replayed incorrectly and grant the wrong tool authority.
  severity: critical
- id: approval-queue-loss
  label: Background approval entries reorder, disappear, or expose the wrong retained continuation.
  severity: high
- id: approval-policy-fail-open
  label: Missing, malformed, or low-confidence policy evidence silently auto-approves a tool call.
  severity: critical
- id: approval-batch-accounting
  label: A multi-call approval batch records an incorrect per-call outcome or bypasses a required prompt.
  severity: critical
- id: approval-owner-confusion
  label: A tool result or approval is attributed to the wrong parent or delegated run.
  severity: critical
- id: tools-risk-agent-boundary
  label: Agent-facing tool calls lose context, block incorrectly, or expose the wrong lifecycle state.
  severity: high
- id: tools-risk-user-answer-loss
  label: A user answer is misassociated, treated as success when absent, or cannot resume the turn.
  severity: high
- id: tools-risk-checkin-floor
  label: Invalid check-in timing reaches the scheduler and causes excessive or ineffective wakeups.
  severity: medium
- id: tools-risk-subagent-state
  label: Delegated work is duplicated, awaited at the wrong time, leaks content, or loses failure state.
  severity: high
- id: tools-risk-display-drift
  label: Tool history displays misleading command, output, success, or argument information.
  severity: medium
- id: tools-risk-file-mutation
  label: A file mutation is applied to the wrong content, partially applied, or bypasses approval boundaries.
  severity: critical
- id: tools-risk-file-read-boundary
  label: Reads expose unintended paths or unbounded, binary, corrupt, or encoded content to the model.
  severity: high
- id: tools-risk-search-boundary
  label: Search silently uses the wrong dialect, scope, result bound, or workspace policy.
  severity: high
- id: tools-risk-code-index
  label: Code navigation returns incomplete, misleading, or language-inaccurate structural evidence.
  severity: medium
- id: tools-risk-healing-corruption
  label: Model-assisted edit healing changes requested lines or applies an ambiguous location.
  severity: critical
- id: tools-risk-memory-integrity
  label: Memory scope, ranking, cursor, error, or output-budget semantics become unsafe or misleading.
  severity: high
- id: tools-risk-workflow-escape
  label: A disposable workflow exceeds run, concurrency, byte, or capability limits.
  severity: critical
- id: tools-risk-session-history
  label: Session browsing violates identifier or pagination contracts or reports incomplete history incorrectly.
  severity: medium
- id: tools-risk-rollover-loss
  label: Rollover occurs with live work or fails to terminate at the requested idle boundary.
  severity: high
- id: tools-risk-shell-registration
  label: Shell construction and host-control grants are wired through an ownership seam that can drift.
  severity: high
- id: tools-risk-worktree-misroot
  label: Tool execution continues under the wrong worktree or changes root while background work is live.
  severity: high
- id: tools-risk-schema-drift
  label: Provider-shaped arguments accepted by a tool do not match its intended typed contract.
  severity: high
- id: tools-risk-path-escape
  label: Path normalization allows an unintended outside-workspace read or write.
  severity: critical
- id: tools-risk-web-output
  label: Web content is fetched from the wrong source, formatted incorrectly, or overflows model context.
  severity: medium
- id: tools-risk-parser-drift
  label: Upstream patch syntax is accepted incorrectly or converted to the wrong local operation.
  severity: high
- id: tools-risk-result-normalization
  label: Heterogeneous tool result shapes lose the most useful error or success text.
  severity: medium
- id: tools-risk-name-drift
  label: A tool name changes and breaks provider calls, routing, or persisted message interpretation.
  severity: high
- id: subagents-state-loss
  label: A delegated turn or handoff loses, replays, or misroutes state across a boundary.
  severity: critical
- id: subagents-authority-escape
  label: A delegated role gains authority, continuation, or execution scope outside its contract.
  severity: critical
- id: subagents-approval-confusion
  label: An approval, question answer, or continuation decision applies to the wrong call or generation.
  severity: critical
- id: subagents-runaway-work
  label: Delegated work exceeds its budget or remains live after cancellation without truthful settlement.
  severity: high
- id: subagents-policy-drift
  label: Role, prompt, model, search, or approval policy silently changes at a production seam.
  severity: high
- id: subagents-event-loss
  label: Lifecycle, usage, terminal, or background activity evidence is missing, duplicated, or misleading.
  severity: high
- id: subagents-persistence-corruption
  label: Queued work or recovery state is persisted, restored, or quarantined incorrectly.
  severity: critical
- id: subagents-run-id-collision
  label: A delegated-run identity collides, parses incorrectly, or targets a different active run.
  severity: high
- id: subagents-worktree-escape
  label: Worker execution is pinned to the wrong workspace or mutates the shared active-root selection.
  severity: high
- id: subagents-provider-failure
  label: A provider failure is retried unsafely or hides useful partial work and usage evidence.
  severity: high
- id: subagents-result-misreport
  label: Completed, failed, cancelled, interrupted, or partial delegated work is reported with the wrong
    status.
  severity: high
- id: subagents-provenance-bypass
  label: A metadata-less advisory authorizes a risky non-interactive command.
  severity: critical
- id: subagents-notification-retention
  label: A user misses, re-sees, or receives out-of-order background activity after delivery or continuation.
  severity: high
- id: subagents-mailbox-overflow
  label: Steering grows without bounds or admitted guidance is lost during interruption and continuation.
  severity: high
- id: subagents-tool-evidence-loss
  label: Tool usage, changed files, validation, or diff evidence is omitted or falsely attributed.
  severity: medium
