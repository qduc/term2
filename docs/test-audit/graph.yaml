- id: shell-system-shell-second-neutral
  testId: shell-system-shell
  role: second_opinion
  reviewer: calibration-neutral
  sourceArtifact: docs/test-audit/calibration-neutral.yaml
  recommendation: keep
  confidence: high
  reason: The shell tool is the effectful safety boundary and the file tests its asynchronous lifecycle
    and policy matrix through injected runners; removing it could execute commands outside sandbox, lose
    background output, or leave approval state dangling.
  evidence:
  - source/tools/system/shell.test.ts asserts immediate background acknowledgement, retained tail, cancellation
    signal, lifecycle events, deferred cleanup, timeout status, and output caps using BackgroundShellRegistry
    and BackgroundShellWatches.
  - The file asserts Docker host authorization isolation, sandbox availability failures, SSH/RTK routing,
    plan-mode mutation blocking, correlation restoration, and foreground-to-background adoption without
    a second execution.
  - The file asserts strict denied-read retry metadata and one-shot overrides, while a missing SDK call
    ID fails closed; it also asserts foreground monitoring is rejected before execution.
  replacementTestIds: []
  status: proposed
- id: shell-system-shell-second-adversarial
  testId: shell-system-shell
  role: second_opinion
  reviewer: calibration-adversarial
  sourceArtifact: docs/test-audit/calibration-adversarial.yaml
  recommendation: architecture_signal
  confidence: high
  reason: The tests are meaningful boundary evidence, but the production shell tool owns background jobs,
    output watches, sandbox routing, Docker host grants, denied-read recovery, RTK, SSH, correlation,
    and plan-mode policy in one construction seam; the test setup has to inject and reset all of those
    owners.
  evidence:
  - source/tools/system/shell.test.ts:5-32 imports and resets background registry/output/watch state,
    denied-read stores, Docker grant state, execution context, nested compatibility, sandbox, and logging
    seams before exercising one shell definition.
  - source/tools/system/shell.test.ts:142-344 asserts background monitor registration, retained tails,
    setup failure, and settlement; source/tools/system/shell.ts exports createBackgroundShellJobToolDefinitions
    and createShellToolDefinition as one tool boundary.
  - source/tools/system/shell.test.ts:1129-1613 and 1765-2187 separately exercise Docker, sandbox availability,
    RTK, plan mode, denied reads, and held-call overrides, showing policy ownership is concentrated rather
    than a single shell execution rule.
  - If this evidence disappeared, a denied read could loop without a bounded retry, an approved Docker
    grant could leak to another session, or a command could execute unsandboxed after availability degraded.
  - 'I ruled out deletion, consolidation, and retiering: background lifecycle, sandbox safety, Docker
    grants, and denied-read recovery have distinct externally observable failure risks and no sibling
    in the assigned sample carries them.'
  replacementTestIds: []
  status: proposed
