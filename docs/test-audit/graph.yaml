  testId: providers-codex-responses-model
  role: second_opinion
  reviewer: calibration-adversarial
  sourceArtifact: docs/test-audit/calibration-adversarial.yaml
  recommendation: keep
  confidence: high
  reason: This is the sole assigned boundary test for Codex Responses HTTP/WebSocket reconstruction, chained
    state, compaction, retry, and transport evidence; its wire-level assertions are the contract rather
    than incidental implementation detail.
  evidence:
  - source/providers/codex-responses-model.test.ts:89-303 asserts reconstruction of streamed output items,
