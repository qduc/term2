packages:
  - web-client
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  koffi: false
  sharp: true
  ssh2: true
minimumReleaseAgeExclude:
  - ink-prompt
  - '@qduc/web-fetch@0.1.4'
  # First registry release containing Term2's already-verified compaction fix; published by this project.
  - '@qduc/agent-core@0.2.0-alpha.2'

patchedDependencies:
  '@qduc/agent-core@0.2.0-alpha.2': patches/@qduc__agent-core@0.2.0-alpha.2.patch
  ink-prompt@0.4.3: patches/ink-prompt@0.4.3.patch
  ink@7.0.1: patches/ink@7.0.1.patch
